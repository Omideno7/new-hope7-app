<!doctype html>
<html lang="en" dir="ltr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="referrer" content="no-referrer">
<title>New Hope 7 · Print</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#fff;color:#102033;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif}.nh7-print-toolbar121{position:sticky;top:0;z-index:10;padding:12px;padding-top:max(12px,env(safe-area-inset-top));background:#fff;border-bottom:1px solid #98a2b3}.nh7-print-toolbar121 nav{display:flex;flex-wrap:wrap;gap:8px}.nh7-print-toolbar121 button{font:inherit;padding:10px 14px;border:1px solid #98a2b3;border-radius:8px;background:#f2f8f7;color:#102033}.nh7-print-toolbar121 button:disabled{opacity:.5}.nh7-print-toolbar121 p{margin:8px 0;white-space:normal}#report121{padding:16px;overflow-wrap:anywhere}#report121 table{width:100%;min-width:0!important;table-layout:fixed}#report121 th,#report121 td{overflow-wrap:anywhere;text-align:start}#report121 thead{display:table-header-group}@media print{@page{size:A4 landscape;margin:12mm}.nh7-print-toolbar121{display:none!important}html,body{height:auto!important;overflow:visible!important}body,#report121{padding:0!important}#report121 tr{break-inside:avoid}}
</style>
<style>@media screen and (max-width:600px){#report121 .nh7r490-summary{grid-template-columns:repeat(2,minmax(0,1fr))}}</style>
<script defer src="js/nh7-school-report-print-page-v121.js?v=1.2.1"></script>
</head>
<body>
<header class="nh7-print-toolbar121">
<nav aria-label="Print controls" id="controls121">
<button type="button" id="back121">Close / Back to report</button>
<button type="button" id="print121" disabled>Print</button>
</nav>
<p id="status121" role="status" aria-live="polite">Waiting for report…</p>
<p id="help121">If no print sheet opens, return to the report and download PDF. Open the file in Files, then Share → Print. In an in-app browser, use Open in Safari.</p>
</header>
<main id="report121"></main>
</body>
</html>
