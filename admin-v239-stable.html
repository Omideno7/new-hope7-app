<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0f766e">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>New Hope 7 Admin — Stable 2.3.9.40</title>
  <style>
    body{margin:0;min-height:100dvh;display:grid;place-items:center;background:linear-gradient(180deg,#e9f8f6,#f7fbff);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;color:#102033;padding:24px;box-sizing:border-box}
    main{width:min(620px,100%);background:#fff;border:1px solid #d8ecea;border-radius:24px;padding:24px;text-align:center;box-shadow:0 18px 55px rgba(15,118,110,.16)}
    .spinner{width:46px;height:46px;margin:0 auto 16px;border:5px solid #dff4f0;border-top-color:#0f766e;border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
    h1{font-size:1.25rem;margin:0 0 8px}p{color:#667085;line-height:1.8;margin:0}.error{color:#b42318;margin-top:12px;white-space:pre-wrap}
  </style>
</head>
<body>
<main><div class="spinner"></div><h1>New Hope 7 — نسخهٔ پایدار ۲.۳.۹.۴۰</h1><p>پنل مدیریت در حال بارگذاری است.</p><div id="error" class="error"></div></main>
<script>
(async()=>{
  const RELEASE='2.3.9.40';
  const BUILD='2.3.9.40-recovery-admin-rbac';
  async function latestVersion(){try{const r=await fetch('./version.json?t='+Date.now(),{cache:'no-store',headers:{'Cache-Control':'no-cache, no-store, must-revalidate','Pragma':'no-cache'}});return r.ok?await r.json():null}catch(_){return null}}
  async function checkForUpdate(){const remote=await latestVersion(),latest=String(remote?.admin||'');if(!latest||latest===RELEASE)return;const guard='nh7_admin_redirect_'+latest;if(sessionStorage.getItem(guard)==='1')return;sessionStorage.setItem(guard,'1');const target=new URL('./admin-v239-stable.html',location.href);target.searchParams.set('release','stable-'+latest);target.searchParams.set('update',Date.now().toString());location.replace(target.href)}
  try{
    await checkForUpdate();
    const response=await fetch('./admin.html?stable='+encodeURIComponent(BUILD)+'-'+Date.now(),{cache:'no-store',headers:{'Cache-Control':'no-cache, no-store, must-revalidate','Pragma':'no-cache'}});
    if(!response.ok)throw new Error('Admin HTML '+response.status);
    let html=await response.text();
    html=html.replace(/\s*<script id="nh7AdminRbacRuntime"[^>]*><\/script>/i,'');
    html=html.replace('admin-manifest.json?v=2.3.6','admin-manifest.json?v='+BUILD);
    html=html.replace('</head>',`<link rel="stylesheet" href="css/admin-v2.3.9-clean-scroll-v300.css?v=${BUILD}"><link rel="stylesheet" href="css/admin-v2.3.9-clean-features-v311.css?v=${BUILD}"><link rel="stylesheet" href="css/admin-v2.3.9-final-stable-v316.css?v=${BUILD}"><link rel="stylesheet" href="css/admin-v2.3.9-library-mobile-v320.css?v=${BUILD}"><link rel="stylesheet" href="css/nh7-library-collections-v322.css?v=${BUILD}"><style>.nh7-admin-version-v235{display:none!important}</style></head>`);
    html=html.replace('</body>',`<script src="js/admin-v2.3.9-clean-scroll-v300.js?v=${BUILD}"><\/script><script src="js/admin-v2.3.9-library-clean-v311.js?v=${BUILD}"><\/script><script src="js/admin-v2.3.9-apocrypha-catalog-v274.js?v=${BUILD}"><\/script><script src="js/admin-v2.3.9-apocrypha-text-only-v320.js?v=${BUILD}"><\/script><script src="js/admin-v2.3.9-library-collections-v322.js?v=${BUILD}"><\/script><script src="js/admin-v2.3.9-student-clean-v311.js?v=${BUILD}"><\/script><script src="js/admin-v2.3.9-audio-clean-v312.js?v=${BUILD}"><\/script><script src="js/admin-v2.3.9-video-final-v316.js?v=${BUILD}"><\/script><script src="js/admin-v2.3.9-video-save-sync-v316.js?v=${BUILD}"><\/script><script src="js/admin-v2.3.9-video-person-access-v317.js?v=${BUILD}"><\/script><script src="js/admin-v2.3.9-student-state-fix-v316.js?v=${BUILD}"><\/script><script src="js/admin-v2.3.9-ui-documents-final-v316.js?v=${BUILD}"><\/script><script src="js/admin-v2.3.9-fix12-bootstrap.js?v=${BUILD}"><\/script><script src="js/admin-v2.3.9-registration-requests-v331.js?v=${BUILD}"><\/script><script src="js/admin-v2.3.9-registration-approval-email-v344.js?v=${BUILD}"><\/script><script src="js/admin-v2.3.9-approval-email-ui-v345.js?v=${BUILD}"><\/script><script src="js/admin-v2.3.9-registration-email-actions-v346.js?v=${BUILD}"><\/script><script src="js/admin-v2.3.9-request-search-focus-v336.js?v=request-search-fix2"><\/script><script src="js/admin-v2.3.9-notifications-zagreb-v333.js?v=${BUILD}"><\/script><script src="js/admin-qna-i18n-v341.js?v=${BUILD}"><\/script><script>(()=>{document.querySelectorAll('.nh7-admin-version-v235,.nh7-clean-scroll-badge,.nh7-stable-final-badge,.nh7-fix12-badge,.nh7-stable-badge').forEach(x=>x.remove());document.documentElement.dataset.nh7AdminBuild='2.3.9.39';const check=async()=>{if(document.hidden||!navigator.onLine)return;try{const r=await fetch('./version.json?t='+Date.now(),{cache:'no-store'}),v=r.ok?await r.json():null;if(v?.admin&&v.admin!=='2.3.9.39')location.replace('./admin-v239-stable.html?release=stable-'+encodeURIComponent(v.admin)+'&update='+Date.now())}catch(_){}};window.addEventListener('pageshow',()=>setTimeout(check,300));document.addEventListener('visibilitychange',()=>{if(!document.hidden)setTimeout(check,200)});setTimeout(()=>{const ok=window.NH7_ADMIN_CLEAN_SCROLL_VERSION&&window.NH7_ADMIN_VIDEO_FINAL_VERSION&&window.NH7_ADMIN_VIDEO_SAVE_SYNC_VERSION&&window.NH7_ADMIN_VIDEO_PERSON_ACCESS_VERSION&&window.NH7_ADMIN_LIBRARY_CLEAN_VERSION&&window.NH7_ADMIN_APOCRYPHA_CATALOG_VERSION&&window.NH7_ADMIN_APOCRYPHA_TEXT_ONLY_VERSION&&window.NH7_ADMIN_LIBRARY_COLLECTIONS_VERSION&&window.NH7_ADMIN_STUDENT_CLEAN_VERSION&&window.NH7_ADMIN_STUDENT_STATE_VERSION&&window.NH7_ADMIN_AUDIO_CLEAN_VERSION&&window.NH7_ADMIN_UI_DOCUMENTS_VERSION&&window.NH7_ADMIN_FIX12_BOOTSTRAP_VERSION&&window.NH7_ADMIN_REGISTRATION_REQUESTS_VERSION&&window.NH7_ADMIN_APPROVAL_EMAIL_VERSION&&window.NH7_ADMIN_APPROVAL_EMAIL_UI_VERSION&&window.NH7_ADMIN_REGISTRATION_EMAIL_ACTIONS_VERSION&&window.NH7_ADMIN_REQUEST_SEARCH_VERSION&&window.NH7_ADMIN_NOTIFICATIONS_ZAGREB_VERSION&&window.NH7_ADMIN_QNA_I18N_VERSION;if(!ok)console.error('New Hope 7 stable modules did not all load');const requested=new URL(location.href).searchParams.get('tab');if(requested&&requested!==activeTab&&typeof setTab==='function')setTab(requested)},1200)})();<\/script></body>`);
    html=html.replaceAll('2.3.9.39','2.3.9.40');
    html=html.replace('<script>(()=>{document.querySelectorAll',`<script src="js/nh7-admin-rbac-v350.js?v=${BUILD}"><\/script><script>(()=>{document.querySelectorAll`);
    html=html.replace('&&window.NH7_ADMIN_QNA_I18N_VERSION;', '&&window.NH7_ADMIN_QNA_I18N_VERSION&&window.NH7_ADMIN_RBAC_VERSION;');
    document.open();document.write(html);document.close();
  }catch(error){document.getElementById('error').textContent='خطا در بارگذاری پنل: '+(error&&error.message?error.message:String(error))}
})();
</script>
</body>
</html>
