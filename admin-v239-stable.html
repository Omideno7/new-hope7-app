<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0f766e">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <title>New Hope 7 Admin — Stable 2.3.9.16</title>
  <style>
    body{margin:0;min-height:100dvh;display:grid;place-items:center;background:linear-gradient(180deg,#e9f8f6,#f7fbff);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;color:#102033;padding:24px;box-sizing:border-box}
    main{width:min(620px,100%);background:#fff;border:1px solid #d8ecea;border-radius:24px;padding:24px;text-align:center;box-shadow:0 18px 55px rgba(15,118,110,.16)}
    .spinner{width:46px;height:46px;margin:0 auto 16px;border:5px solid #dff4f0;border-top-color:#0f766e;border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
    h1{font-size:1.25rem;margin:0 0 8px}p{color:#667085;line-height:1.8;margin:0}.error{color:#b42318;margin-top:12px;white-space:pre-wrap}
  </style>
</head>
<body>
<main><div class="spinner"></div><h1>New Hope 7 — نسخهٔ پایدار ۲.۳.۹.۱۶</h1><p>پنل مرتب، ویدیوی پایدار، تحلیل دانشجو و استودیوی مدارک در حال بارگذاری است.</p><div id="error" class="error"></div></main>
<script>
(async()=>{
  const BUILD='2.3.9.16-final-stable-b';
  try{
    if('caches' in window){const keys=await caches.keys();await Promise.all(keys.map(key=>caches.delete(key)))}
    if('serviceWorker' in navigator){const regs=await navigator.serviceWorker.getRegistrations();await Promise.all(regs.map(reg=>reg.unregister()))}
    const response=await fetch('./admin.html?stable='+Date.now(),{cache:'no-store',headers:{'Cache-Control':'no-cache, no-store, must-revalidate','Pragma':'no-cache'}});
    if(!response.ok)throw new Error('Admin HTML '+response.status);
    let html=await response.text();
    html=html.replace('admin-manifest.json?v=2.3.6','admin-manifest.json?v='+BUILD);
    html=html.replace('</head>',`<link rel="stylesheet" href="css/admin-v2.3.9-clean-scroll-v300.css?v=${BUILD}"><link rel="stylesheet" href="css/admin-v2.3.9-clean-features-v311.css?v=${BUILD}"><link rel="stylesheet" href="css/admin-v2.3.9-final-stable-v316.css?v=${BUILD}"><style>.nh7-admin-version-v235{display:none!important}</style></head>`);
    html=html.replace('</body>',`<script src="js/admin-v2.3.9-clean-scroll-v300.js?v=${BUILD}"><\/script><script src="js/admin-v2.3.9-library-clean-v311.js?v=${BUILD}"><\/script><script src="js/admin-v2.3.9-student-clean-v311.js?v=${BUILD}"><\/script><script src="js/admin-v2.3.9-audio-clean-v312.js?v=${BUILD}"><\/script><script src="js/admin-v2.3.9-video-final-v316.js?v=${BUILD}"><\/script><script src="js/admin-v2.3.9-video-save-sync-v316.js?v=${BUILD}"><\/script><script src="js/admin-v2.3.9-student-state-fix-v316.js?v=${BUILD}"><\/script><script src="js/admin-v2.3.9-ui-documents-final-v316.js?v=${BUILD}"><\/script><script src="js/admin-v2.3.9-fix12-bootstrap.js?v=${BUILD}"><\/script><script>(()=>{document.querySelectorAll('.nh7-admin-version-v235,.nh7-clean-scroll-badge,.nh7-stable-final-badge,.nh7-fix12-badge,.nh7-stable-badge').forEach(x=>x.remove());document.documentElement.dataset.nh7AdminBuild='2.3.9.16';setTimeout(()=>{const ok=window.NH7_ADMIN_CLEAN_SCROLL_VERSION&&window.NH7_ADMIN_VIDEO_FINAL_VERSION&&window.NH7_ADMIN_VIDEO_SAVE_SYNC_VERSION&&window.NH7_ADMIN_LIBRARY_CLEAN_VERSION&&window.NH7_ADMIN_STUDENT_CLEAN_VERSION&&window.NH7_ADMIN_STUDENT_STATE_VERSION&&window.NH7_ADMIN_AUDIO_CLEAN_VERSION&&window.NH7_ADMIN_UI_DOCUMENTS_VERSION&&window.NH7_ADMIN_FIX12_BOOTSTRAP_VERSION;if(!ok)console.error('New Hope 7 stable modules did not all load');const requested=new URL(location.href).searchParams.get('tab');if(requested&&requested!==activeTab&&typeof setTab==='function')setTab(requested)},1200)})();<\/script></body>`);
    document.open();document.write(html);document.close();
  }catch(error){document.getElementById('error').textContent='خطا در بارگذاری پنل: '+(error&&error.message?error.message:String(error))}
})();
</script>
</body>
</html>
