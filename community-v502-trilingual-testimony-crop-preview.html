<!doctype html>
<html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>NH7 Community Preview v3</title>
<style>
:root{--bg:#071820;--card:#0d2530;--soft:#113541;--text:#f7fbfd;--muted:#9cb2bb;--line:#ffffff18;--accent:#2bbdc4;--good:#79ddb2;--warn:#ffd685;--danger:#d65d68}
*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#06141b,#0a222b);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,sans-serif}button,input,textarea,select{font:inherit}
main{max-width:820px;margin:auto;padding:18px 14px 60px}.top{position:sticky;top:0;z-index:20;background:#071820e8;backdrop-filter:blur(18px);padding:8px 0}.topline{display:flex;align-items:center;justify-content:space-between;gap:8px}.top h1{font-size:1.08rem;margin:4px 0}.badge,.pill{display:inline-block;padding:5px 9px;border:1px solid #ffffff20;border-radius:999px;font-size:.67rem}.badge{color:#c4fbff;border-color:#2bbdc455}.langbar{display:flex;gap:5px}.langbar button{border:1px solid var(--line);border-radius:999px;padding:6px 9px;background:#ffffff08;color:#fff}.langbar button.active{background:var(--accent)}
.tabs{display:flex;gap:7px;overflow:auto;padding:7px 0}.tabs button{white-space:nowrap;border:1px solid var(--line);border-radius:999px;background:#ffffff08;color:#fff;padding:8px 11px}.tabs button.active{background:var(--accent)}
.panel{display:none}.panel.active{display:block}.card{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:15px;margin:12px 0}.muted{color:var(--muted);font-size:.78rem;line-height:1.8}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.tile{min-height:100px;text-align:start;background:var(--soft);color:#fff;border:1px solid var(--line);border-radius:17px;padding:13px}.tile span{font-size:1.6rem;display:block}.tile strong{display:block;margin:6px 0}.field{display:grid;gap:6px;margin:10px 0}.field label{font-size:.78rem;font-weight:800}.field input,.field textarea,.field select{width:100%;border:1px solid var(--line);border-radius:13px;background:#071820;color:#fff;padding:11px}.field textarea{min-height:130px}.btn{border:0;border-radius:13px;background:var(--accent);color:#fff;padding:10px 13px;font-weight:800}.secondary{background:#ffffff12;border:1px solid var(--line)}.danger{background:var(--danger)}.toolbar,.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.notice{border:1px solid #2bbdc455;background:#2bbdc412;border-radius:14px;padding:11px;font-size:.78rem;line-height:1.85}.warning{border-color:#ffd68555;background:#ffd68512}.success{border-color:#79ddb255;background:#79ddb211}.importance{background:radial-gradient(circle at 85% 0,#258c9550,transparent 35%),var(--card)}.topAccordion{border:0!important;background:transparent!important;margin:0!important;padding:0!important}.topAccordion>summary{font-size:1.05rem;font-weight:900;cursor:pointer;list-style:none;display:flex;align-items:center;justify-content:space-between;gap:10px}.topAccordion>summary::-webkit-details-marker{display:none}.topAccordion>summary::after{content:'⌄';font-size:1.1rem;transition:transform .18s ease}.topAccordion[open]>summary::after{transform:rotate(180deg)}.topBody{padding-top:12px}.versegrid{display:grid;gap:8px;margin-top:10px}.verse{padding:10px;border-radius:13px;background:#ffffff08;border:1px solid var(--line);line-height:1.7}.verse strong{display:block;color:#c7fbff}.guide details{border:1px solid var(--line);border-radius:14px;padding:0;margin:10px 0;background:#ffffff05;overflow:hidden}.guide summary{font-weight:800;cursor:pointer;list-style:none;padding:14px 16px;display:flex;justify-content:space-between;gap:10px}.guide summary::-webkit-details-marker{display:none}.guide summary::after{content:'⌄';transition:transform .18s ease}.guide details[open]>summary::after{transform:rotate(180deg)}.guide li{margin:7px 0;line-height:1.9}.section-body{padding:2px 16px 14px}.topic-block{padding:10px 0;border-top:1px solid var(--line)}.topic-block:first-child{border-top:0}.topic-block h4{margin:4px 0 8px}.phase{border-inline-start:3px solid var(--accent);padding-inline-start:10px;margin:15px 0 8px}.phase h3{margin:0}.record{border:1px solid var(--line);border-radius:16px;padding:12px;background:#071820}.recdot{display:inline-block;width:9px;height:9px;border-radius:50%;background:#e45863;margin-inline-end:6px;animation:p 1s infinite}@keyframes p{50%{opacity:.3}}audio{width:100%;margin-top:8px}.audio,.prayer{border:1px solid var(--line);border-radius:16px;padding:12px;margin:9px 0;background:#ffffff07}.audiohead{display:flex;gap:10px;align-items:flex-start}.art{width:50px;height:50px;border-radius:13px;background:linear-gradient(145deg,#145667,#0b303b);display:grid;place-items:center;font-size:1.45rem}.copy{flex:1}.meta{font-size:.7rem;color:var(--muted)}.checks{display:grid;gap:7px;margin:10px 0}.checks label{display:flex;align-items:flex-start;gap:8px;font-size:.78rem;line-height:1.7}.step{border:1px solid var(--line);border-radius:15px;padding:12px;background:#ffffff06;margin:10px 0}.bar{height:5px;background:#ffffff12;border-radius:99px;overflow:hidden}.bar i{display:block;height:100%;background:var(--accent)}.small{font-size:.72rem}.privacy{border-inline-start:3px solid var(--good)}
.avatar{width:96px;height:96px;border-radius:50%;background:#123946;display:grid;place-items:center;font-size:2rem;overflow:hidden;border:3px solid #ffffff20}.avatar img{width:100%;height:100%;object-fit:cover;transform-origin:center center}
html.nh7-crop-lock,body.nh7-crop-lock{overflow:hidden!important;overscroll-behavior:none!important}.cropModal{position:fixed;inset:0;background:#000c;z-index:100;display:none;align-items:center;justify-content:center;padding:16px;overscroll-behavior:contain;touch-action:none}.cropModal.open{display:flex}.cropCard{width:min(94vw,430px);max-height:calc(100dvh - 32px);overflow:auto;overscroll-behavior:contain;background:#0d2530;border:1px solid #ffffff20;border-radius:22px;padding:16px;box-shadow:0 28px 80px #0009;touch-action:pan-y}.cropStage{width:280px;height:280px;max-width:78vw;max-height:78vw;margin:12px auto;position:relative;overflow:hidden;border-radius:50%;background:#06141b;border:4px solid #ffffff30;touch-action:none;cursor:grab}.cropStage.dragging{cursor:grabbing}.cropStage img{position:absolute;left:50%;top:50%;max-width:none;user-select:none;-webkit-user-drag:none;pointer-events:none;transform-origin:center center}.range{width:100%}.cropActions{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
@media(max-width:520px){.grid{grid-template-columns:1fr 1fr}.topline{align-items:flex-start}.top h1{font-size:.95rem}.cropStage{width:250px;height:250px}}
@media print{.top,.tabs,.no-print,.badge,.langbar{display:none!important}body{background:#fff;color:#111}.card,.prayer{background:#fff;border-color:#aaa}.panel{display:none!important}#adminPrayer.active{display:block!important}.muted,.meta{color:#555}}
</style></head>
<body><main>
<div class="top"><div class="topline"><div><span class="badge">SAFE PREVIEW · LOCAL ONLY</span><h1>New Hope 7 — Community v5.0.2</h1></div><div class="langbar"><button data-lang="fa" class="active">FA</button><button data-lang="en">EN</button><button data-lang="hr">HR</button></div></div><div class="tabs" id="tabs"></div></div>
<section class="panel active" id="more"><div class="card"><h2 id="moreTitle"></h2><div class="grid" id="moreGrid"></div></div></section>
<section class="panel" id="testimonies">
<div class="card importance"><details class="topAccordion"><summary id="importanceTitle"></summary><div class="topBody"><div id="importanceText"></div><div class="versegrid" id="verseGrid"></div></div></details></div>
<div class="card guide"><details class="topAccordion"><summary id="guideTitle"></summary><div class="topBody"><p class="muted" id="guideGoal"></p><h3 id="tipsTitle"></h3><ul id="tipsList"></ul><div id="guideSections"></div></div></details></div>
<div class="card"><h2 id="recordTitle"></h2>
<div class="field"><label id="shortTitleLabel"></label><input id="testimonyTitle"></div>
<div class="field"><label id="displayNameLabel"></label><input id="testimonyName" value="Yuhana"></div>
<div class="field"><label id="typeLabel"></label><select id="testimonyType"></select></div>
<div class="record"><div id="recordStatus" class="muted"></div><div class="toolbar" style="margin-top:8px"><button class="btn" id="recordStart"></button><button class="btn secondary" id="recordPause" disabled></button><button class="btn danger" id="recordStop" disabled></button><button class="btn secondary" id="recordDelete" disabled></button></div><audio id="recordPlayback" controls hidden></audio><div class="field"><label id="uploadLabel"></label><input id="audioFile" type="file" accept="audio/*,.mp3,.m4a,.aac,.wav,.webm"></div></div>
<div class="step"><strong id="stepTitle"></strong><p id="stepText"></p><div class="bar"><i id="stepBar" style="width:7.14%"></i></div><div class="toolbar" style="margin-top:8px"><button class="btn secondary" id="prevStep"></button><button class="btn secondary" id="nextStep"></button></div></div>
<div class="field"><label id="adminNoteLabel"></label><textarea id="testimonyNote"></textarea></div>
<div class="checks"><label><input id="showName" type="checkbox" checked><span id="showNameText"></span></label><label><input id="consent" type="checkbox"><span id="consentText"></span></label><label><input id="healthConsent" type="checkbox"><span id="healthConsentText"></span></label></div>
<button class="btn" id="sendTestimony"></button><div id="testimonyMsg" style="margin-top:10px"></div></div>
<div class="card"><h2 id="approvedAudioTitle"></h2><div id="publicTestimonies"></div></div>
</section>
<section class="panel" id="prayer"><div class="card"><h2 id="prayerTitle"></h2><div class="notice privacy" id="prayerPrivate"></div><p id="prayerLead"></p><p class="muted" id="prayerSpiritual"></p><div class="field"><label id="prayerNameLabel">Name</label><input id="prayerName" value="Yuhana"></div><div class="field"><label id="prayerDetailLabel"></label><textarea id="prayerText"></textarea></div><button class="btn" id="sendPrayer"></button><div id="prayerMsg" style="margin-top:10px"></div></div></section>
<section class="panel" id="profile"><div class="card"><h2 id="profileTitle"></h2><div class="row"><div class="avatar" id="avatar">👤</div><div><strong id="profileName">Yuhana</strong><p class="muted" id="profilePrivate"></p></div></div><div class="field"><label id="profileNameLabel">Display name</label><input id="profileNameInput" value="Yuhana"></div><div class="field"><label id="photoLabel"></label><input id="photoInput" type="file" accept="image/*"></div><div class="toolbar"><button class="btn secondary" id="adjustPhoto" disabled></button><button class="btn" id="saveProfile"></button><button class="btn secondary" id="removePhoto"></button></div><div id="profileMsg"></div></div></section>
<section class="panel" id="adminPrayer"><div class="card"><h2>🙏 Admin · Prayer Requests</h2><p class="muted">Owner/Admin only. No Prayer Servant panel.</p><div class="toolbar no-print"><button class="btn secondary" data-pf="active">Active</button><button class="btn secondary" data-pf="all">All</button><button class="btn" id="printPrayer">PDF / Print</button></div><div id="prayerList"></div></div></section>
<section class="panel" id="adminTestimonies"><div class="card"><h2>✨ Admin · Audio Testimonies</h2><p class="muted">Pending audio is private. After approval it can be published as an audio card.</p><div id="pendingTestimonies"></div></div></section>
</main>

<div class="cropModal" id="cropModal"><div class="cropCard"><h3 id="cropTitle"></h3><p class="muted" id="cropHelp"></p><div class="cropStage" id="cropStage"><img id="cropImage" alt=""></div><div class="field"><label id="zoomLabel"></label><input class="range" id="zoomRange" type="range" min="1" max="3" step="0.01" value="1"></div><div class="cropActions"><button class="btn secondary" id="cropReset"></button><button class="btn" id="cropSave"></button><button class="btn secondary" id="cropClose"></button></div></div></div>

<script>
const GUIDE={"fa":{"langName":"فارسی","importanceTitle":"چرا شهادت شما مهم است؟","importance":["شهادت شما فقط تعریف یک اتفاق نیست؛ راهی است برای به اشتراک گذاشتن محبت خدا با دیگران. وقتی آنچه خدا در زندگی شما انجام داده است را صادقانه و روشن بیان می‌کنید، امید و ایمان خود را به دیگران منتقل می‌کنید.","ممکن است کسی که همان بیماری، همان درد یا همان رنج را تجربه می‌کند، با شنیدن شهادت شما برای دریافت شفا، آزادی و پاسخ دعا تشویق شود. به همین دلیل شهادت خود را کامل، دقیق و از ته دل بیان کنید."],"verses":[["مرقس ۵:۱۹","آنچه خداوند برای تو کرده و رحمت او را بازگو کن."],["مزمور ۶۶:۱۶","بیایید و بشنوید تا آنچه خدا برای جان من کرده است بیان کنم."],["مکاشفه ۱۲:۱۱","آنان به‌واسطهٔ خون بره و کلام شهادت خود غالب آمدند."]],"guideTitle":"🟢 راهنمای ضبط شهادت شفای الهی (صوتی)","goal":"هدف: ارائه یک شهادت کامل و الهام‌بخش از تجربه شفای شما، با تمرکز بر جزئیات مهمی که به شنوندگان کمک می‌کند تا قدرت الهی را درک کنند.","tipsTitle":"✅ نکات کلی برای ضبط","tips":["🌫 مکان آرام: در مکانی ساکت و بدون سر و صدای مزاحم ضبط کنید.","🔊🎤 صدای واضح: نزدیک میکروفون تلفن یا دستگاه ضبط خود صحبت کنید تا صدای شما واضح و رسا باشد.","🗣 انرژی و هیجان: با شور و اشتیاق صحبت کنید. این یک تجربه متحول‌کننده برای شما بوده است، اجازه دهید این حس در صدای شما منعکس شود.","🙏 صداقت: با صداقت و از ته دل صحبت کنید."],"sections":[{"title":"بخش اول — قبل از شفا","topics":[{"title":"🙋 معرفی خودتان","bullets":["نام، سن، شهر و کشور محل اقامت خود را بگویید.","مثال: «نام من [نام شما] است. من [سن] ساله هستم و از [شهر، کشور] هستم.»"]},{"title":"😷 شرح بیماری (قبل از شفا)","bullets":["نام بیماری یا عارضه‌ای که از آن رنج می‌بردید، چه بود؟ (در صورت امکان، نام پزشکی آن را ذکر کنید.)","داستان بیماری را از ابتدا توضیح دهید.","چگونه شروع شد؟ (سال یا تاریخ)","علائم اولیه چه بود؟","درد و مشکلات شما چقدر شدید شد؟","مثال: «در سال [سال]، یک روز صبح از خواب بیدار شدم و درد شدیدی در بدنم احساس کردم. با گذشت روزها، درد شدیدتر شد...»","چه مدت به این بیماری مبتلا بودید؟","این بیماری چگونه بر کار، خانواده و زندگی روزمره شما تأثیر گذاشت؟","مثال: «به دلیل این بیماری، من بسیار ضعیف شدم. دیگر نمی‌توانستم فعالیت‌های روزمره‌ام را انجام دهم. دائماً درد شدید در قفسه سینه و سینه‌ام داشتم...»","چه کارهایی بودید که به دلیل بیماری نمی‌توانستید انجام دهید؟","لیست کنید و با جزئیات توضیح دهید.","آیا از وسایل کمکی مانند ویلچر، عصا، سمعک و غیره استفاده می‌کردید؟","مثال: «با گذشت روزها، وضعیت من بدتر و بدتر شد تا جایی که مجبور شدم از ویلچر استفاده کنم. دیگر نمی‌توانستم از جایی به جای دیگر حرکت کنم و همیشه باید از ویلچر استفاده می‌کردم. زندگی روزمره برایم بسیار دشوار بود.»"]},{"title":"🏥 مراجعه به بیمارستان و تشخیص","bullets":["هنگامی که به بیمارستان رفتید، چه آزمایشاتی انجام شد؟","با چه تشخیصی مواجه شدید؟ (لطفاً نام پزشکی بیماری خود را ذکرکنید)","مثال: «هنگامی که به بیمارستان رسیدم، پزشکان مجبور شدند آزمایشات مختلفی روی من انجام دهند و نتایج آن آزمایشات نشان داد که من مبتلا به [نام پزشکی بیماری] بودم.»"]},{"title":"🩺 درمان‌های پزشکی","bullets":["چه نوع داروهایی توسط پزشک برای بهبود وضعیت شما تجویز شد؟","جزئیات داروها و روش‌های درمانی را ذکر کنید.","مثال: «پس از تشخیص [نام بیماری]، پزشکان مرا تحت درمان با [جزئیات داروها و روش‌های درمانی] قرار دادند.»","آیا به متخصص دیگری ارجاع داده شدید؟ اگر بله، کل فرآیند را توضیح دهید.","آیا پس از مصرف داروهای تجویز شده، وضعیت شما بهبودی یافت؟ (اگر نه، با صداقت بگویید.)"]}]},{"title":"بخش دوم — رسیدن به جلسه دعا و روز شفا","topics":[{"title":"🙇 تشدید بیماری تا شنیدن درباره «جلسات شفا و دعا»","bullets":["چگونه وضعیت شما بدتر شد تا اینکه درباره «جلسات شفا و دعا» شنیدید؟","مثال: «این بیماری بدتر و بدتر شد تا اینکه یک روز در کلیسا درباره شفای دیگران، شنیدم. و بلافاصله ثبت نام کردم، هیجان‌زده از اینکه زمان شفای من فرا رسیده است.»"]},{"title":"🙏 روز شفا چه اتفاقی برای شما افتاد و یا چگونه در آن روز به جلسه دعا وصل شدید؟","bullets":["چگونه شرکت کردید؟ (آیا در کلیسای «امیدنو ۷» حضور داشتید یا به صورت آنلاین وصل شدید؟)","چه حسی داشتید وقتی یوحنای رسول شروع به موعظه کرد؟","چه کلمه‌ای گفته شد یا اعلام شد که باعث شد معجزه خود را دریافت کنید؟","مثال: «در روز جلسه دعا، من به طور کامل شرکت کردم و تمام توجه خود را به برنامه دادم. وقتی زمان عبادت بود، عبادت کردم. وقتی یوحنای رسول شروع به خدمت می‌کرد، احساس کردم حسی در تمام بدنم جاری شد... یوحنای رسول گفت [کلمه‌ای که گفت] و من بلافاصله برای اولین بار در [تعداد سال/ماه] روی پاهایم ایستادم، راه رفتم و هیچ دردی در سینه‌ام نداشتم. احساس قدرت بی‌نظیری در بدنم کردم.»"]},{"title":"🤲 پس از دعا و تغییرات فوری","bullets":["بعد از دعای برادر یوحنا چه اتفاقی افتاد؟","چه تغییرات فوری را تجربه کردید؟","سایر تغییرات فوری را با جزئیات بیان کنید.","مثال: «پس از اتمام خدمت یوحنای رسول، سینه‌ام را بررسی کردم تا ببینم آیا توده‌ای احساس می‌کنم، اما هیچ چیز احساس نکردم یا ندیدم. کاملاً شفا یافته بودم. دیگر دردی نبود. هللویا!»"]}]},{"title":"بخش سوم — تغییرات پس از دعا","topics":[{"title":"🙌 تغییرات پس از «دعا برای شما»","bullets":["پس از «جلسه کلیسا»، چه تغییرات قابل توجه دیگری را تجربه کردید؟","مثال: «بعد از جلسه کلیسا، آن شب با آرامش خوابیدم. روز بعد، پر از زندگی، پر از انرژی، پر از نشاط بودم...»","با جزئیات بیشتر توضیح دهید."]},{"title":"🏃‍➡️ کارهایی که اکنون می‌توانید انجام دهید","bullets":["اکنون چه کارهایی می‌توانید انجام دهید که قبلاً قادر به انجام آنها نبودید؟","با هیجان و طولانی در مورد تمام کارهایی که اکنون می‌توانید انجام دهید صحبت کنید. این بخش را با شور و اشتیاق زیادی بیان کنید."]},{"title":"🩺💉 وضعیت فعلی داروها و پیگیری پزشکی","bullets":["آیا هنوز هیچ دارویی مصرف می‌کنید؟","آیا بعد از دریافت شفای خود به پزشک مراجعه کردید؟","اگر بله، اولین واکنش پزشک چه بود؟","آیا آزمایشات پیگیری انجام داد؟ نتایج آن چه بود؟"]}]},{"title":"بخش چهارم — اهمیت، تأثیر و دعوت","topics":[{"title":"✔️ اهمیت این معجزه","bullets":["آیا این یک معجزه برای شماست؟ چرا؟"]},{"title":"✔️ تأثیر شفا بر زندگی شما","bullets":["این شهادت شفا چگونه بر زندگی شما تأثیر گذاشته است؟"]},{"title":"📣 به اشتراک گذاشتن شهادت و دعوت به کلیسا","bullets":["چگونه شهادت شفای خود را با اطرافیان خود به اشتراک می‌گذارید و چگونه از آن به عنوان ابزاری برای دعوت بسیاری به جلسات کلیسای «امیدنو ۷» استفاده می‌کنید؟","از بیماران در سراسر جهان دعوت کنید تا به جلسات دعای کلیسای «امیدنو ۷» بپیوندند."]},{"title":"🙌 پیام شما به یوحنای رسول","bullets":["چه چیزی دوست دارید به یوحنای رسول بگویید؟","یک کلمه تشکر از تمام کسانی که در کلیسای «امیدنو ۷» خدمت می‌کنند."]}]}],"ui":{"more":"بیشتر","testimonies":"شهادت‌ها","prayer":"درخواست دعا","profile":"پروفایل","adminPrayer":"Admin · دعا","adminTestimony":"Admin · شهادت","testimonyTile":"شهادت‌ها","testimonySub":"شنیدن و ارسال شهادت صوتی","prayerTile":"درخواست دعا","prayerSub":"خصوصی؛ مستقیم برای Admin","profileTile":"پروفایل من","profileSub":"نام، عکس و تنظیم قاب","recordTitle":"🎤 ضبط یا ارسال فایل صوتی","shortTitle":"عنوان کوتاه شهادت","displayName":"نام نمایشی","type":"نوع شهادت","healing":"شفای الهی","answered":"پاسخ دعا","salvation":"نجات و تولد تازه","provision":"تدارک و برکت","other":"سایر","ready":"آماده برای ضبط","start":"● شروع ضبط","pause":"مکث","stop":"توقف","remove":"حذف","upload":"یا فایل صوتی آماده را انتخاب کنید","adminNote":"توضیح کوتاه اختیاری برای Admin","showName":"اجازه می‌دهم در صورت تأیید، نام نمایشی من نشان داده شود.","consent":"اجازه می‌دهم این شهادت صوتی پس از بررسی Admin در New Hope 7 منتشر شود.","healthConsent":"می‌دانم شهادت شفا ممکن است شامل اطلاعات شخصی مربوط به سلامتی من باشد و با انتشار آن موافقم.","submit":"ارسال خصوصی برای بررسی Admin","approvedAudio":"🎧 شهادت‌های صوتی تأییدشده","profileTitle":"👤 پروفایل من","profilePrivate":"عکس در فضای خصوصی حساب شما نگهداری می‌شود.","choosePhoto":"انتخاب عکس پروفایل","adjustPhoto":"تنظیم عکس","saveProfile":"ذخیره پروفایل","removePhoto":"حذف عکس","cropTitle":"تنظیم عکس داخل دایره","cropHelp":"عکس را با انگشت بکشید تا صورت در مرکز قرار بگیرد. با نوار Zoom اندازه را تنظیم کنید.","zoom":"Zoom","cropSave":"ذخیره قاب","cropReset":"بازنشانی","close":"بستن","prayerTitle":"🙏 درخواست دعا","prayerPrivate":"این درخواست فقط به Admin کلیسای امیدنو۷ می‌رسد و عمومی نمی‌شود.","prayerLead":"موضوع درخواست دعای خود را کامل و روشن توضیح دهید تا دقیقاً بدانیم برای چه مسئله‌ای دعا کنیم. لطفاً بنویسید مشکل از چه زمانی شروع شده، وضعیت فعلی چیست، چه چیزی بیشترین فشار را ایجاد کرده و انتظار دارید برای چه تغییری دعا شود.","prayerSpiritual":"اگر خودتان موضوع را مرتبط با نبرد روحانی یا نیاز به رهایی می‌دانید، می‌توانید تجربه و نگرانی خود را هم توضیح دهید تا بدانیم چگونه برای شما دعا کنیم. رمز عبور، شماره مدرک هویتی یا اطلاعات بانکی ننویسید.","prayerDetail":"موضوع و شرح کامل درخواست دعا","sendPrayer":"ارسال خصوصی درخواست دعا","guided":"راهنمای هنگام ضبط","previous":"قبلی","next":"بعدی"}},"en":{"langName":"English","importanceTitle":"Why is your testimony important?","importance":["Your testimony is not only the story of what happened to you; it is a way to share God's love with others. When you clearly and honestly tell what God has done in your life, you pass hope and faith on to those who listen.","Someone facing the same sickness, pain, or suffering may hear your testimony and be encouraged to believe for healing, freedom, and an answer to prayer. So tell your testimony fully, accurately, and from your heart."],"verses":[["Mark 5:19","Tell others what the Lord has done for you and how He showed you mercy."],["Psalm 66:16","Come and hear, and I will tell what God has done for my soul."],["Revelation 12:11","They overcame by the blood of the Lamb and by the word of their testimony."]],"guideTitle":"🟢 Guide for Recording a Divine Healing Testimony (Audio)","goal":"Goal: Give a complete and inspiring testimony of your healing experience, focusing on the important details that help listeners understand the power of God.","tipsTitle":"✅ General recording tips","tips":["🌫 Quiet place: Record in a quiet place without distracting background noise.","🔊🎤 Clear voice: Speak close to your phone or recording-device microphone so your voice is clear and easy to hear.","🗣 Energy and excitement: Speak with passion and enthusiasm. This was a life-changing experience for you; let that be heard in your voice.","🙏 Honesty: Speak honestly and from your heart."],"sections":[{"title":"Section One — Before the Healing","topics":[{"title":"🙋 Introduce yourself","bullets":["State your name, age, city, and country of residence.","Example: “My name is [your name]. I am [age] years old and I am from [city, country].”"]},{"title":"😷 Describe the illness (before the healing)","bullets":["What was the name of the illness or condition you were suffering from? (If possible, give the medical name.)","Tell the story of the illness from the beginning.","How did it start? (Year or date)","What were the first symptoms?","How severe did the pain and problems become?","Example: “In [year], one morning I woke up and felt severe pain in my body. As the days passed, the pain became worse...”","How long had you suffered from this illness?","How did this illness affect your work, family, and daily life?","Example: “Because of this illness I became very weak. I could no longer do my normal daily activities. I constantly had severe pain in my chest...”","What things were you unable to do because of the illness?","List them and explain them in detail.","Did you use assistive devices such as a wheelchair, cane, hearing aid, etc.?","Example: “As the days passed, my condition became worse and worse until I had to use a wheelchair. I could no longer move from place to place and always needed the wheelchair. Daily life became very difficult for me.”"]},{"title":"🏥 Hospital visit and diagnosis","bullets":["When you went to the hospital, what tests were done?","What diagnosis were you given? (Please state the medical name of your illness.)","Example: “When I arrived at the hospital, the doctors performed different tests, and the results showed that I had [medical name of illness].”"]},{"title":"🩺 Medical treatment","bullets":["What medicines did the doctor prescribe to improve your condition?","Give details of the medicines and treatments.","Example: “After I was diagnosed with [illness], the doctors treated me with [details of medicines and treatments].”","Were you referred to another specialist? If yes, explain the whole process.","Did your condition improve after taking the prescribed medicines? (If not, say so honestly.)"]}]},{"title":"Section Two — Hearing About the Prayer Meetings and the Day of Healing","topics":[{"title":"🙇 The illness became worse until you heard about the “Healing and Prayer Meetings”","bullets":["How did your condition become worse until you heard about the “Healing and Prayer Meetings”?","Example: “The illness became worse and worse until one day in church I heard about other people being healed. I immediately registered, excited that my time for healing had come.”"]},{"title":"🙏 What happened on the day of healing, and how did you connect to the prayer meeting?","bullets":["How did you participate? (Were you present at New Hope 7 Church or did you join online?)","How did you feel when Apostle Yuhana began preaching?","What word was spoken or declared that caused you to receive your miracle?","Example: “On the day of the prayer meeting, I participated fully and gave the program my full attention. When it was time to worship, I worshiped. When Apostle Yuhana began ministering, I felt something flowing through my whole body... Apostle Yuhana said [the word that was spoken], and immediately, for the first time in [number of years/months], I stood on my feet, walked, and had no pain in my chest. I felt extraordinary strength in my body.”"]},{"title":"🤲 After prayer and the immediate changes","bullets":["What happened after Brother Yuhana prayed for you?","What immediate changes did you experience?","Describe the other immediate changes in detail.","Example: “After Apostle Yuhana finished ministering, I checked my chest to see if I could feel a lump, but I could not feel or see anything. I was completely healed. There was no more pain. Hallelujah!”"]}]},{"title":"Section Three — Changes After Prayer","topics":[{"title":"🙌 Changes after “prayer for you”","bullets":["After the “church meeting,” what other noticeable changes did you experience?","Example: “After the church meeting, I slept pe qs('#recordStart').onclick=async()=>{try{const stream=await navigator.mediaDevices.getUserMedia({audio:true});const type=['audio/mp4','audio/webm;codecs=opus','audio/webm'].find(x=>MediaRecorder.isTypeSupported?.(x));rec=new MediaRecorder(stream,type?{mimeType:type}:undefined);chunks=[];rec.ondataavailable=e=>{if(e.data.size)chunks.push(e.data)};rec.onstop=()=>{clearInterval(timer);blob=new Blob(chunks,{type:rec.mimeType});revoke();url=URL.createObjectURL(blob);qs('#recordPlayback').src=url;qs('#recordPlayback').hidden=false;stream.getTracks().forEach(t=>t.stop());qs('#recordDelete').disabled=false;status('✓')};rec.start(500);started=Date.now();timer=setInterval(()=>{const s=Math.floor((Date.now()-started)/1000);status(String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0'),true)},500);qs('#recordStart').disabled=true;qs('#recordPause').disabled=false;qs('#recordStop').disabled=false}catch(e){status(U().upload)}};
qs('#recordPause').onclick=()=>{if(!rec)return;if(rec.state==='recording'){rec.pause();qs('#recordPause').textContent=U().next}else if(rec.state==='paused'){rec.resume();qs('#recordPause').textContent=U().pause}};
qs('#recordStop').onclick=()=>{if(rec&&rec.state!=='inactive')rec.stop();qs('#recordStart').disabled=false;qs('#recordPause').disabled=true;qs('#recordStop').disabled=true;qs('#recordPause').textContent=U().pause};
qs('#recordDelete').onclick=()=>{blob=null;revoke();qs('#recordPlayback').hidden=true;qs('#recordPlayback').removeAttribute('src');qs('#recordDelete').disabled=true;status(U().ready)};
qs('#audioFile').onchange=e=>{const f=e.target.files?.[0];if(!f)return;blob=f;revoke();url=URL.createObjectURL(f);qs('#recordPlayback').src=url;qs('#recordPlayback').hidden=false;qs('#recordDelete').disabled=false;status(f.name)};
qs('#sendTestimony').onclick=()=>{const title=qs('#testimonyTitle').value.trim(),name=qs('#testimonyName').value.trim(),type=qs('#testimonyType').value,note=qs('#testimonyNote').value.trim(),show=qs('#showName').checked,consent=qs('#consent').checked,hc=qs('#healthConsent').checked;if(!title||!blob||!consent||(type==='healing'&&!hc)){qs('#testimonyMsg').innerHTML='<div class="notice warning">Please complete the required audio and consent fields.</div>';return}testimonies.unshift({id:'t'+Date.now(),title,name:name||'New Hope 7',type,note,show,status:'pending',url});qs('#testimonyMsg').innerHTML='<div class="notice success">✓</div>';renderLists();go('adminTestimonies')};
qs('#sendPrayer').onclick=()=>{const name=qs('#prayerName').value.trim(),text=qs('#prayerText').value.trim();if(!name||text.length<20){qs('#prayerMsg').innerHTML='<div class="notice warning">Please provide a fuller description.</div>';return}prayers.unshift({id:'p'+Date.now(),name,text,status:'new'});qs('#prayerText').value='';qs('#prayerMsg').innerHTML='<div class="notice success">✓</div>';renderLists()};

function renderAvatar(){
 const a=qs('#avatar');
 if(!croppedPhotoData&&!photoData){a.textContent='👤';return}
 const src=croppedPhotoData||photoData;
 a.innerHTML='<img src="'+src+'" alt="">';
}
function lockCropBackground(){
 cropScrollY=window.scrollY||0;
 document.documentElement.classList.add('nh7-crop-lock');
 document.body.classList.add('nh7-crop-lock');
 document.body.style.position='fixed';
 document.body.style.top=(-cropScrollY)+'px';
 document.body.style.left='0';
 document.body.style.right='0';
 document.body.style.width='100%';
}
function unlockCropBackground(){
 document.documentElement.classList.remove('nh7-crop-lock');
 document.body.classList.remove('nh7-crop-lock');
 document.body.style.position='';
 document.body.style.top='';
 document.body.style.left='';
 document.body.style.right='';
 document.body.style.width='';
 window.scrollTo(0,cropScrollY);
}
function constrainCrop(){
 const im=qs('#cropImage'),stage=qs('#cropStage');
 if(!im.naturalWidth||!stage.clientWidth)return;
 const base=Number(im.dataset.base)||1,scale=base*tempZoom;
 const w=im.naturalWidth*scale,h=im.naturalHeight*scale;
 const maxX=Math.max(0,(w-stage.clientWidth)/2),maxY=Math.max(0,(h-stage.clientHeight)/2);
 tempX=Math.max(-maxX,Math.min(maxX,tempX));
 tempY=Math.max(-maxY,Math.min(maxY,tempY));
}
function applyCropTransform(){
 constrainCrop();
 const im=qs('#cropImage');
 im.style.transform='translate(-50%,-50%) translate('+tempX+'px,'+tempY+'px) scale('+tempZoom+')';
}
function fitCropImage(){
 const im=qs('#cropImage'),stage=qs('#cropStage');
 if(!im.naturalWidth)return;
 const base=Math.max(stage.clientWidth/im.naturalWidth,stage.clientHeight/im.naturalHeight);
 im.dataset.base=base;
 im.style.width=(im.naturalWidth*base)+'px';
 im.style.height=(im.naturalHeight*base)+'px';
 constrainCrop();
}
function makeCroppedAvatar(){
 const im=qs('#cropImage'),stage=qs('#cropStage');
 if(!im.naturalWidth||!stage.clientWidth)return '';
 constrainCrop();
 const base=Number(im.dataset.base)||1,scale=base*tempZoom;
 const sw=stage.clientWidth/scale,sh=stage.clientHeight/scale;
 const imageLeft=stage.clientWidth/2+tempX-(im.naturalWidth*scale)/2;
 const imageTop=stage.clientHeight/2+tempY-(im.naturalHeight*scale)/2;
 let sx=(0-imageLeft)/scale,sy=(0-imageTop)/scale;
 sx=Math.max(0,Math.min(im.naturalWidth-sw,sx));
 sy=Math.max(0,Math.min(im.naturalHeight-sh,sy));
 const canvas=document.createElement('canvas');canvas.width=512;canvas.height=512;
 const ctx=canvas.getContext('2d',{alpha:false});ctx.fillStyle='#071820';ctx.fillRect(0,0,512,512);
 ctx.imageSmoothingEnabled=true;ctx.imageSmoothingQuality='high';
 ctx.drawImage(im,sx,sy,sw,sh,0,0,512,512);
 return canvas.toDataURL('image/jpeg',0.9);
}
function closeCrop(){
 qs('#cropModal').classList.remove('open');
 unlockCropBackground();
 dragging=false;qs('#cropStage').classList.remove('dragging');
}
function openCrop(){
 if(!photoData)return;
 tempX=photoX;tempY=photoY;tempZoom=photoZoom;
 const im=qs('#cropImage');
 im.onload=()=>{fitCropImage();applyCropTransform()};
 im.src=photoData;
 qs('#zoomRange').value=tempZoom;
 lockCropBackground();
 qs('#cropModal').classList.add('open');
 if(im.complete&&im.naturalWidth){fitCropImage();applyCropTransform()}
}
qs('#photoInput').onchange=e=>{const f=e.target.files?.[0];if(!f)return;const rd=new FileReader();rd.onload=()=>{photoData=String(rd.result||'');croppedPhotoData='';photoX=0;photoY=0;photoZoom=1;qs('#adjustPhoto').disabled=false;openCrop()};rd.readAsDataURL(f)};
qs('#adjustPhoto').onclick=openCrop;
qs('#cropClose').onclick=closeCrop;
qs('#cropModal').addEventListener('click',e=>{if(e.target===qs('#cropModal'))closeCrop()});
qs('#cropReset').onclick=()=>{tempX=0;tempY=0;tempZoom=1;qs('#zoomRange').value=1;applyCropTransform()};
qs('#cropSave').onclick=()=>{photoX=tempX;photoY=tempY;photoZoom=tempZoom;croppedPhotoData=makeCroppedAvatar();closeCrop();renderAvatar()};
qs('#zoomRange').oninput=e=>{tempZoom=Number(e.target.value)||1;applyCropTransform()};
const stage=qs('#cropStage');
stage.addEventListener('pointerdown',e=>{e.preventDefault();dragging=true;stage.classList.add('dragging');startX=e.clientX;startY=e.clientY;startPhotoX=tempX;startPhotoY=tempY;stage.setPointerCapture(e.pointerId)});
stage.addEventListener('pointermove',e=>{if(!dragging)return;e.preventDefault();tempX=startPhotoX+(e.clientX-startX);tempY=startPhotoY+(e.clientY-startY);applyCropTransform()});
stage.addEventListener('pointerup',e=>{dragging=false;stage.classList.remove('dragging');try{stage.releasePointerCapture(e.pointerId)}catch(_){}});
stage.addEventListener('pointercancel',()=>{dragging=false;stage.classList.remove('dragging')});
qs('#cropModal').addEventListener('touchmove',e=>{if(e.target.closest?.('#cropStage'))e.preventDefault()},{passive:false});
qs('#saveProfile').onclick=()=>{
 qs('#profileName').textContent=qs('#profileNameInput').value.trim()||'New Hope 7';
 if(photoData&&!croppedPhotoData){
  const im=qs('#cropImage');if(im.naturalWidth)croppedPhotoData=makeCroppedAvatar();
 }
 try{localStorage.setItem('nh7_v502_crop_demo',JSON.stringify({photoData,croppedPhotoData,photoX,photoY,photoZoom,name:qs('#profileNameInput').value.trim()}))}catch(_){}
 renderAvatar();
 qs('#profileMsg').innerHTML='<div class="notice success">✓</div>';
};
qs('#removePhoto').onclick=()=>{photoData='';croppedPhotoData='';photoX=photoY=0;photoZoom=1;qs('#adjustPhoto').disabled=true;qs('#photoInput').value='';renderAvatar()};
try{const p=JSON.parse(localStorage.getItem('nh7_v502_crop_demo')||'null');if(p){photoData=p.photoData||'';croppedPhotoData=p.croppedPhotoData||'';photoX=Number(p.photoX)||0;photoY=Number(p.photoY)||0;photoZoom=Number(p.photoZoom)||1;if(p.name){qs('#profileNameInput').value=p.name;qs('#profileName').textContent=p.name}qs('#adjustPhoto').disabled=!photoData}}catch(_){}
renderAll();
</script></body></html>
