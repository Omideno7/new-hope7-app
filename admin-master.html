<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate"><title>New Hope 7 — MASTER Upload 4.6.0</title><style>:root{--blue:#0b5faa;--green:#16a765;--ink:#102033;--muted:#667085;--line:#d8ecea;--danger:#b42318}*{box-sizing:border-box}body{margin:0;background:linear-gradient(180deg,#e9f8f6,#f7fbff);color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif}.wrap{max-width:900px;margin:auto;padding:16px 12px 60px}.hero{background:linear-gradient(135deg,var(--blue),var(--green));color:#fff;border-radius:24px;padding:18px;margin-bottom:14px}.card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:14px;margin:12px 0;box-shadow:0 8px 24px rgba(16,32,51,.06)}label{display:block;font-weight:700;margin:10px 0}input,select,textarea,button,a.btn{width:100%;font:inherit;border:1px solid #cfe4e2;border-radius:14px;padding:12px;background:#fff;color:var(--ink);margin-top:5px}textarea{min-height:220px;resize:vertical}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:10px}.btn,button{cursor:pointer;font-weight:800;text-decoration:none;text-align:center;display:block}.primary{background:linear-gradient(135deg,var(--blue),var(--green));color:#fff;border:0}.secondary{background:#eef8f7;color:#0f766e}.btn:disabled,button:disabled{opacity:.45;cursor:not-allowed}.status{white-space:pre-wrap;line-height:1.8}.bad{color:var(--danger)}.good{color:#08783d}.small{font-size:.85rem;color:var(--muted)}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><div class="wrap"><div class="hero"><h2 style="margin:0 0 6px">📚 بارگذاری کتاب MASTER — v4.6.0</h2><p style="margin:0">این صفحه از پنل ادمین جداست؛ باز یا بسته‌شدن آن روی دکمه‌ها و اسکرول پنل اثر نمی‌گذارد.</p></div><div class="card"><a class="btn secondary" href="./admin-v239-stable.html">← بازگشت به پنل ادمین</a><div id="auth" class="status">در حال بررسی دسترسی مدیر…</div></div><fieldset id="form" disabled style="border:0;padding:0;margin:0"><div class="card"><label>کتاب مقصد<select id="book"><option value="">＋ کتاب جدید</option></select></label><div class="grid"><label>عنوان فارسی<input id="title_fa"></label><label>English title<input id="title_en" dir="ltr"></label><label>Hrvatski naslov<input id="title_hr" dir="ltr"></label></div><div class="grid"><label>نوع کتابخانه<select id="audience"><option value="public">کتابخانه عمومی</option><option value="ministers">کتابخانه خادمان</option></select></label><label>مجموعه / قفسه<select id="collection"></select></label></div><label>سه فایل MASTER_FA / MASTER_EN / MASTER_HR<input id="files" type="file" multiple accept=".txt,text/plain"></label><div id="counts" class="status small"></div><label>پیش‌نمایش زبان<select id="previewLang"><option value="fa">فارسی</option><option value="en">English</option><option value="hr">Hrvatski</option></select><textarea id="preview" readonly></textarea></label><label><input id="publish" type="checkbox" style="width:auto"> پس از ذخیره منتشر شود</label><label><input id="confirm" type="checkbox" style="width:auto" disabled> سه زبان، فصل اول و فصل آخر را بررسی کردم.</label><button id="save" class="primary" type="button" disabled>ذخیرهٔ هر سه زبان</button><div id="status" class="status"></div></div></fieldset></div><script>(()=>{'use strict';const URL='https://gpzcwffxnddhaeaogdyo.supabase.co',KEY='sb_publishable_v3xXEaJ5Fml7-te1mI4-0g_7R86oM37',LANGS=['fa','en','hr'];let token=localStorage.getItem('nh7_admin_token')||'',items=[],collections=[],book=null,data={};const $=id=>document.getElementById(id);const fallback=[{id:'70072b10-fd02-4cf2-a0dd-5a5e24713ac0',audience:'public',title_fa:'کتاب‌ها و جزوه‌های عمومی',is_active:true},{id:'da1b3ebf-2356-4cc7-ad9f-c7d9bdca5120',audience:'ministers',title_fa:'کتابخانه خادمان',is_active:true}];async function rpc(name,payload={}){if(!token)throw new Error('ابتدا وارد پنل ادمین شوید.');const r=await fetch(URL+'/rest/v1/rpc/'+encodeURIComponent(name),{method:'POST',cache:'no-store',headers:{apikey:KEY,Authorization:'Bearer '+token,'Content-Type':'application/json'},body:JSON.stringify(payload)});const text=await r.text();let d=null;try{d=text?JSON.parse(text):null}catch(_){d=text}if(!r.ok){if(r.status===401){localStorage.removeItem('nh7_admin_token');localStorage.removeItem('nh7_admin_refresh_token')}throw new Error(d?.message||d?.hint||String(d||r.statusText))}return d}const fnums='۰۱۲۳۴۵۶۷۸۹',words={one:1,two:2,three:3,four:4,five:5,six:6,seven:7,eight:8,nine:9,ten:10,eleven:11,twelve:12,thirteen:13,fourteen:14,fifteen:15,sixteen:16,seventeen:17,eighteen:18,nineteen:19,twenty:20,'اول':1,'دوم':2,'سوم':3,'چهارم':4,'پنجم':5,'ششم':6,'هفتم':7,'هشتم':8,'نهم':9,'دهم':10,'یازدهم':11,'دوازدهم':12,'سیزدهم':13,'چهاردهم':14,'پانزدهم':15,'شانزدهم':16,'هفدهم':17,'هجدهم':18,'نوزدهم':19,'بیستم':20,prvo:1,drugo:2,'treće':3,trece:3,'četvrto':4,cetvrto:4,peto:5,'šesto':6,sesto:6,sedmo:7,osmo:8,deveto:9,deseto:10,jedanaesto:11,dvanaesto:12,trinaesto:13,'četrnaesto':14,cetrnaesto:14,petnaesto:15,'šesnaesto':16,sesnaesto:16,sedamnaesto:17,osamnaesto:18,devetnaesto:19,dvadeseto:20};function num(v){v=String(v||'').trim().toLowerCase().replace(/[.]/g,'');let s='';for(const c of v){const i=fnums.indexOf(c);s+=i>=0?String(i):c}return /^\d+$/.test(s)?Number(s):(words[s]||0)}function seq(a){const m=new Map();for(const x of a)if(x.n)m.set(x.n,x.p);const ns=[...m.keys()].sort((a,b)=>a-b);if(ns.length<2||ns[0]!==1)return[];for(let i=0;i<ns.length;i++)if(ns[i]!==i+1)return[];return ns.map(n=>m.get(n)).sort((a,b)=>a-b)}function starts(raw,l){const src=raw.replace(/\\f/g,'\f');let re;if(l==='fa')re=/(?:^|[\n\r\f])\s*فصل\s+(اول|دوم|سوم|چهارم|پنجم|ششم|هفتم|هشتم|نهم|دهم|یازدهم|دوازدهم|سیزدهم|چهاردهم|پانزدهم|شانزدهم|هفدهم|هجدهم|نوزدهم|بیستم|[۰-۹0-9]+)/gmu;else if(l==='en')re=/(?:^|[\n\r\f])\s*chapter\s+(one|two|three|four|five|six|seven|eight|nine|ten|eleven|twelve|thirteen|fourteen|fifteen|sixteen|seventeen|eighteen|nineteen|twenty|[0-9]+)/gmi;else re=/(?:^|[\n\r\f])\s*(?:(prvo|drugo|tre[cć]e|[cč]etvrto|peto|[sš]esto|sedmo|osmo|deveto|deseto|jedanaesto|dvanaesto|trinaesto|[cč]etrnaesto|petnaesto|[sš]esnaesto|sedamnaesto|osamnaesto|devetnaesto|dvadeseto|[0-9]+\.?)\s+poglavlje|poglavlje\s+(prvo|drugo|tre[cć]e|[cč]etvrto|peto|[sš]esto|sedmo|osmo|deveto|deseto|jedanaesto|dvanaesto|trinaesto|[cč]etrnaesto|petnaesto|[sš]esnaesto|sedamnaesto|osamnaesto|devetnaesto|dvadeseto|[0-9]+))/gmi;const a=[];for(const m of src.matchAll(re)){const t=l==='hr'?(m[1]||m[2]):m[1];let p=m.index;if(/[\n\r\f]/.test(src[p]))p++;a.push({n:num(t),p})}return seq(a)}function edition(raw,l){const s=starts(raw,l);if(!s.length)return{text:raw,pages:[{number:1,text:raw}]};const pages=[];for(let i=0;i<s.length;i++)pages.push({number:i+1,text:raw.slice(i?s[i]:0,s[i+1]??raw.length)});if(pages.map(p=>p.text).join('')!==raw)throw new Error('کنترل حفظ متن '+l.toUpperCase()+' ناموفق بود.');return{text:raw,pages}}function fileLang(n){return(n.toUpperCase().match(/(?:^|[_ .-])(FA|EN|HR)(?=$|[_ .-])/)||[])[1]?.toLowerCase()}function fillCollections(){const list=collections.filter(c=>c.is_active&&c.audience===$('audience').value);$('collection').innerHTML=list.map(c=>`<option value="${c.id}">${c.title_fa||c.title_en||c.title_hr||c.slug}</option>`).join('');if(book?.collection_id&&list.some(c=>c.id===book.collection_id))$('collection').value=book.collection_id;refresh()}function selectBook(){book=items.find(x=>x.id===$('book').value)||null;for(const l of LANGS){$('title_'+l).value=book?.['title_'+l]||'';$('title_'+l).disabled=!!book}$('audience').value=book?.audience||'public';$('audience').disabled=!!book;data={};$('confirm').checked=false;fillCollections();show()}function show(){const all=LANGS.every(l=>data[l]),counts=LANGS.map(l=>data[l]?.ed.pages.length||0),same=all&&new Set(counts).size===1,coll=!!$('collection').value;$('counts').textContent=LANGS.map(l=>data[l]?`✅ ${data[l].name} — ${data[l].ed.pages.length} بخش`:`⬜ ${l.toUpperCase()} انتخاب نشده`).join('\n');$('confirm').disabled=!(all&&same&&coll);$('save').disabled=!(all&&same&&coll&&$('confirm').checked);if(all&&!same){$('status').textContent='تعداد بخش‌های سه زبان برابر نیست؛ ذخیره متوقف شد.';$('status').className='status bad'}else if(all&&same){$('status').textContent='سه فایل آماده‌اند. پیش‌نمایش را بررسی کنید.';$('status').className='status good'}preview()}function preview(){$('preview').value=data[$('previewLang').value]?.ed.text||'';$('preview').dir=$('previewLang').value==='fa'?'rtl':'ltr'}async function load(){const access=await rpc('nh7_admin_my_access_v350',{});const a=Array.isArray(access)?access[0]:access;if(!a?.is_admin)throw new Error('این حساب دسترسی ادمین ندارد.');$('auth').textContent='✅ دسترسی ادمین تأیید شد.';$('auth').className='status good';const [d,c]=await Promise.allSettled([rpc('nh7_admin_library_dashboard_v224',{}),rpc('nh7_admin_library_collections_dashboard_v322',{})]);if(d.status!=='fulfilled')throw d.reason;let dash=Array.isArray(d.value)?d.value[0]:d.value;items=dash?.items||[];collections=c.status==='fulfilled'?(Array.isArray(c.value)&&c.value.length===1&&Array.isArray(c.value[0])?c.value[0]:c.value):fallback;if(!Array.isArray(collections)||!collections.length)collections=fallback;$('book').innerHTML='<option value="">＋ کتاب جدید</option>'+items.filter(x=>x.resource_type==='library').map(x=>`<option value="${x.id}">${x.title_fa||x.title_en||x.title_hr||x.id}</option>`).join('');$('form').disabled=false;selectBook()}$('book').onchange=selectBook;$('audience').onchange=fillCollections;$('collection').onchange=show;$('previewLang').onchange=preview;$('confirm').onchange=show;$('files').onchange=async e=>{try{const next={};for(const f of [...e.target.files]){const l=fileLang(f.name);if(!l)throw new Error(f.name+': نام فایل باید FA/EN/HR داشته باشد.');const raw=new TextDecoder('utf-8',{fatal:true}).decode(await f.arrayBuffer());if(!raw.trim())throw new Error(f.name+': فایل خالی است.');next[l]={name:f.name,ed:edition(raw,l)}}data={...data,...next};$('confirm').checked=false;show()}catch(err){$('status').textContent=err.message;$('status').className='status bad'}finally{e.target.value=''}};$('save').onclick=async()=>{if($('save').disabled)return;const payload={id:book?.id||null,title_fa:$('title_fa').value,title_en:$('title_en').value,title_hr:$('title_hr').value,audience:$('audience').value,collection_id:$('collection').value,reader_language:'fa',is_published:$('publish').checked,reader_text:{fa:data.fa.ed,en:data.en.ed,hr:data.hr.ed}};$('form').disabled=true;$('status').textContent='در حال ذخیره و کنترل سرور…';$('status').className='status';try{let r=await rpc('nh7_admin_library_import_ready_v434',{p_item:payload,p_expected_updated_at:book?.updated_at||null});r=Array.isArray(r)?r[0]:r;if(!r?.ok)throw new Error('سرور ذخیره را تأیید نکرد.');$('status').textContent=(r.is_published?'✅ کتاب ذخیره و منتشر شد.':'✅ کتاب ذخیره شد و فعلاً مخفی است.')+'\nشناسه: '+r.id;$('status').className='status good';data={};$('confirm').checked=false;await load()}catch(err){$('status').textContent='ذخیره نشد: '+err.message;$('status').className='status bad'}finally{$('form').disabled=false;show()}};load().catch(err=>{$('auth').textContent='❌ '+err.message+'\nابتدا در پنل ادمین وارد شوید و سپس دوباره این صفحه را باز کنید.';$('auth').className='status bad'})})();</script></body></html>
