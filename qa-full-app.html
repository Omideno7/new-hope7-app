<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<title>New Hope 7 — QA Full App</title>
<style>
body{margin:0;background:#eef8f7;color:#102033;font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif}.boot{min-height:100vh;display:grid;place-items:center;padding:24px}.card{max-width:560px;background:white;border:1px solid #d8ecea;border-radius:24px;padding:22px;box-shadow:0 16px 50px rgba(16,32,51,.12);text-align:center}.card h1{font-size:1.25rem;margin:0 0 8px}.card p{line-height:1.8;color:#667085}.btn{display:inline-flex;text-decoration:none;border:0;border-radius:14px;padding:12px 16px;font-weight:800;background:linear-gradient(135deg,#0b5faa,#16a765);color:white;cursor:pointer}.small{font-size:.82rem;color:#667085;margin-top:12px}
</style>
</head>
<body>
<div class="boot"><section class="card" id="bootCard"><h1>پیش‌نمایش کامل اپ New Hope 7</h1><p id="bootMsg">در حال آماده‌سازی محیط QA…</p></section></div>
<script>
(async()=>{
  const card=document.getElementById('bootCard'),msg=document.getElementById('bootMsg');
  const token=localStorage.getItem('nh7_admin_token')||'';
  if(!token){
    msg.textContent='برای دیدن کتاب‌های منتشرنشده داخل خود اپ، ابتدا در همین لینک آزمایشی وارد پنل ادمین شوید.';
    const a=document.createElement('a');a.className='btn';a.href='admin.html?qa=books-v362';a.textContent='ورود به پنل ادمین';card.appendChild(a);
    const p=document.createElement('div');p.className='small';p.textContent='بعد از ورود، به این صفحه برگردید و Refresh کنید.';card.appendChild(p);return;
  }
  try{
    msg.textContent='در حال بارگذاری نسخه واقعی اپ با داده‌های QA…';
    const r=await fetch('index.html?qa-shell=3.6.2',{cache:'no-store'});if(!r.ok)throw new Error('App shell '+r.status);
    let html=await r.text();
    const marker='<script src="js/app.js?v=2.3.9.43" type="module"></'+'script>';
    const qa='<script>window.NH7_QA_FULL_APP=true;</'+'script>\n<script src="js/nh7-qa-books-preview-v362.js?v=3.6.2"></'+'script>\n';
    if(html.includes(marker))html=html.replace(marker,qa+marker);else html=html.replace('</body>',qa+'</body>');
    html=html.replace('<title>OmideNo7 Church</title>','<title>OmideNo7 Church — QA Preview</title>');
    document.open();document.write(html);document.close();
  }catch(e){
    console.error(e);msg.textContent='نسخه QA بارگذاری نشد: '+(e?.message||e);
  }
})();
</script>
</body>
</html>
