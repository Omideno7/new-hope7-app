<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>New Hope 7 — کد کتابخانه خادمین</title><style>body{margin:0;background:#eef8f7;color:#102033;font-family:system-ui,-apple-system,Segoe UI,Tahoma,sans-serif;padding:20px}.box{max-width:560px;margin:5vh auto;background:#fff;border:1px solid #d8ecea;border-radius:24px;padding:20px;box-shadow:0 14px 40px #10203318}.logo{width:70px;height:70px;border-radius:18px;display:block;margin:auto}h1{text-align:center;font-size:1.35rem}p{line-height:1.75}.field{margin:10px 0}.field label{display:block;font-weight:800;font-size:.85rem;margin-bottom:4px}input{width:100%;box-sizing:border-box;border:1px solid #cfe4e2;border-radius:14px;padding:13px;font:inherit}#code{direction:ltr;text-align:center;text-transform:uppercase;font:800 1.15rem ui-monospace,monospace;letter-spacing:.06em}button{width:100%;border:0;border-radius:14px;padding:13px;font-weight:850;background:linear-gradient(135deg,#0b5faa,#16a765);color:#fff;font-size:1rem;margin-top:8px}button:disabled{opacity:.55}.msg{padding:12px;border-radius:14px;margin-top:12px;display:none}.good{display:block;background:#ecfdf3;color:#08783d}.bad{display:block;background:#fff1f1;color:#a02121}.note{background:#fff7ed;color:#9a3412;padding:11px;border-radius:13px;font-size:.88rem}.small{font-size:.8rem;color:#667085;text-align:center}</style></head><body><main class="box"><img class="logo" src="assets/logo.png" alt="New Hope 7"><h1>🔐 کد دسترسی کتابخانه خادمین</h1><p class="note">این کد فقط روی حسابی کار می‌کند که مدیر کلیسا هنگام ساخت کد انتخاب کرده است. پس از تأیید، دسترسی همان کتاب یا همه کتاب‌های خادمین روی حساب شما فعال می‌شود.</p><div class="field"><label>ایمیل حساب New Hope 7</label><input id="email" type="email" autocomplete="username" dir="ltr"></div><div class="field"><label>رمز عبور حساب</label><input id="password" type="password" autocomplete="current-password" dir="ltr"></div><div class="field"><label>کد دسترسی</label><input id="code" type="text" autocomplete="one-time-code" placeholder="NH7-XXXX-XXXX"></div><button id="redeem">فعال‌کردن دسترسی</button><div id="msg" class="msg"></div><p class="small">رمز عبور فقط مستقیماً برای ورود امن به Supabase ارسال می‌شود و در این صفحه ذخیره نمی‌شود.</p></main><script>(()=>{'use strict';const URL='https://gpzcwffxnddhaeaogdyo.supabase.co',KEY='sb_publishable_v3xXEaJ5Fml7-te1mI4-0g_7R86oM37';const $=id=>document.getElementById(id),msg=$('msg'),btn=$('redeem');function say(t,bad=false){msg.className='msg '+(bad?'bad':'good');msg.textContent=t}async function json(r){const raw=await r.text();let d={};try{d=raw?JSON.parse(raw):{}}catch{d={message:raw}}if(!r.ok)throw new Error(d?.message||d?.error_description||d?.hint||raw||'خطا');return d}btn.onclick=async()=>{const email=$('email').value.trim(),password=$('password').value,code=$('code').value.trim();if(!email||!password||!code)return say('ایمیل، رمز عبور و کد را کامل وارد کنید.',true);btn.disabled=true;msg.className='msg';try{const auth=await json(await fetch(`${URL}/auth/v1/token?grant_type=password`,{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({email,password}),cache:'no-store'}));const access=auth.access_token;if(!access)throw new Error('ورود حساب انجام نشد.');const d=await json(await fetch(`${URL}/rest/v1/rpc/nh7_library_claim_code_redeem_v433`,{method:'POST',headers:{apikey:KEY,Authorization:`Bearer ${access}`,'Content-Type':'application/json'},body:JSON.stringify({p_code:code}),cache:'no-store'}));say('✓ دسترسی با موفقیت فعال شد. اکنون اپ New Hope 7 را باز کن و وارد Library → کتابخانه خادمین شو. اگر اپ باز بود، یک‌بار از Library خارج و دوباره وارد شو.');$('password').value='';try{await fetch(`${URL}/auth/v1/logout`,{method:'POST',headers:{apikey:KEY,Authorization:`Bearer ${access}`}})}catch{}}catch(e){say(String(e.message||e),true)}finally{btn.disabled=false}}})();</script></body></html>
