<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta name="referrer" content="no-referrer">
<script>
(()=>{const hash=new URLSearchParams(location.hash.replace(/^#/,'')),query=new URLSearchParams(location.search),get=key=>hash.get(key)||query.get(key)||'';window.__NH7_ADMIN_RESET_PAYLOAD__={type:String(get('type')||'recovery').toLowerCase(),accessToken:get('access_token'),tokenHash:get('token_hash'),error:get('error_description')||get('error')||'',errorCode:get('error_code')||''};try{const url=new URL(location.href);['access_token','refresh_token','expires_at','expires_in','token_type','token_hash','type','error','error_code','error_description'].forEach(key=>url.searchParams.delete(key));url.hash='';history.replaceState({},'',url.pathname+(url.searchParams.toString()?'?'+url.searchParams.toString():''))}catch(_){}})();
</script>
<title>New Hope 7 — Owner password recovery</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,sans-serif;color:#102238;background:#eef9f8}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background:radial-gradient(circle at top,#fff 0,#eef9f8 55%,#e2f3f0 100%)}
.card{width:min(560px,100%);background:#fff;border:1px solid #d7ebe8;border-radius:28px;padding:28px;box-shadow:0 18px 60px rgba(9,67,86,.12)}
.logo{width:82px;height:82px;object-fit:contain;display:block;margin:0 auto 10px}h1{text-align:center;margin:8px 0}p{line-height:1.8}
.notice{padding:14px;border-radius:14px;background:#eef8ff;border:1px solid #cfe5f8;white-space:pre-line}.error{background:#fff1f1;border-color:#f4caca;color:#a02121}.success{background:#effcf5;border-color:#c5ead4;color:#11633a}
input,select,button{width:100%;font:inherit;border-radius:14px;padding:14px;margin-top:10px;border:1px solid #c9dfdc;background:#fff}.pw{position:relative}.pw input{padding-inline-end:52px}.eye{position:absolute;inset-inline-end:5px;top:5px;width:44px;border:0;background:transparent;padding:10px;cursor:pointer}
.primary{border:0;color:#fff;font-weight:800;background:linear-gradient(90deg,#0d79b8,#15a66f);cursor:pointer}.secondary{cursor:pointer;background:#f3f8fb}.primary:disabled,.secondary:disabled{opacity:.6;cursor:wait}.hidden{display:none!important}.small{font-size:13px;color:#66758a}
@media(max-width:520px){.card{padding:20px}}
</style>
</head>
<body>
<main class="card">
  <img class="logo" src="assets/admin-icon-192.png" alt="New Hope 7">
  <select id="lang"><option value="fa">فارسی</option><option value="en">English</option><option value="hr">Hrvatski</option></select>
  <h1 id="title"></h1>
  <p id="intro"></p>
  <div id="status" class="notice"></div>
  <section id="resetForm" class="hidden">
    <div class="pw"><input id="password" type="password" minlength="8" autocomplete="new-password"><button type="button" class="eye" data-target="password">👁</button></div>
    <div class="pw"><input id="confirm" type="password" minlength="8" autocomplete="new-password"><button type="button" class="eye" data-target="confirm">👁</button></div>
    <button id="save" type="button" class="primary"></button>
  </section>
  <button id="back" type="button" class="secondary"></button>
  <p class="small" id="help"></p>
</main>
<script>
const SUPABASE_URL='https://gpzcwffxnddhaeaogdyo.supabase.co';
const SUPABASE_KEY='sb_publishable_v3xXEaJ5Fml7-te1mI4-0g_7R86oM37';
const ADMIN_URL='https://omideno7.github.io/new-hope7-app/admin-v239-stable.html';
let accessToken='',tokenHash='',authorized=false;
const text={
fa:{title:'بازیابی رمز مالک پنل',intro:'این صفحه فقط رمز حساب مالک پنل مدیریت New Hope 7 را تغییر می‌دهد.',checking:'در حال بررسی امن لینک و دسترسی مالک…',newp:'رمز جدید مالک',confirm:'تکرار رمز جدید',save:'ذخیره رمز جدید',saving:'در حال ذخیره…',invalid:'این لینک معتبر نیست، منقضی شده یا قبلاً استفاده شده است. از صفحه ورود پنل یک لینک تازه درخواست کنید.',forbidden:'این لینک متعلق به حساب مالک پنل نیست و اجازه تغییر رمز ادمین را ندارد.',unavailable:'بررسی امن دسترسی ادمین انجام نشد. برای محافظت از پنل، رمز تغییر داده نشد.',mismatch:'تکرار رمز عبور با رمز اصلی یکسان نیست.',short:'رمز عبور مالک باید حداقل ۸ کاراکتر باشد.',done:'رمز مالک پنل با موفقیت تغییر کرد. اکنون می‌توانید وارد پنل شوید.',back:'بازگشت به صفحه ورود پنل',help:'این مسیر جدا از بازیابی حساب کاربران است. لینک یک‌بارمصرف و دارای زمان انقضا است.',network:'اینترنت در دسترس نیست. اتصال را بررسی کنید.',weak:'یک رمز قوی‌تر با ترکیبی از حروف و عدد انتخاب کنید.',generic:'درخواست انجام نشد. لطفاً دوباره تلاش کنید.'},
en:{title:'Panel owner password recovery',intro:'This page only changes the New Hope 7 panel owner password.',checking:'Securely checking the link and owner access…',newp:'New owner password',confirm:'Confirm new password',save:'Save new password',saving:'Saving…',invalid:'This link is invalid, expired, or already used. Request a fresh link from the panel login page.',forbidden:'This link does not belong to the panel owner account and cannot change the admin password.',unavailable:'The admin access check could not be completed. The password was not changed.',mismatch:'Password confirmation does not match.',short:'The owner password must be at least 8 characters.',done:'The panel owner password was updated. You can now sign in.',back:'Return to panel login',help:'This route is separate from user account recovery. The link is single-use and expires.',network:'No internet connection. Check your connection.',weak:'Choose a stronger password using a mix of letters and numbers.',generic:'The request could not be completed. Please try again.'},
hr:{title:'Obnova lozinke vlasnika panela',intro:'Ova stranica mijenja samo lozinku vlasnika New Hope 7 panela.',checking:'Sigurna provjera poveznice i vlasničkog pristupa…',newp:'Nova lozinka vlasnika',confirm:'Potvrdi novu lozinku',save:'Spremi novu lozinku',saving:'Spremanje…',invalid:'Poveznica nije valjana, istekla je ili je već iskorištena. Zatražite novu na stranici prijave panela.',forbidden:'Ova poveznica ne pripada vlasniku panela i ne može promijeniti administratorsku lozinku.',unavailable:'Provjera administratorskog pristupa nije uspjela. Lozinka nije promijenjena.',mismatch:'Potvrda lozinke nije ista.',short:'Lozinka vlasnika mora imati najmanje 8 znakova.',done:'Lozinka vlasnika panela je promijenjena. Sada se možete prijaviti.',back:'Povratak na prijavu panela',help:'Ova je ruta odvojena od obnove korisničkih računa. Poveznica je jednokratna i istječe.',network:'Nema internetske veze. Provjerite vezu.',weak:'Odaberite jaču lozinku s kombinacijom slova i brojeva.',generic:'Zahtjev nije dovršen. Pokušajte ponovno.'}
};
let lang=localStorage.getItem('nh7_admin_lang')||((navigator.language||'').startsWith('fa')?'fa':(navigator.language||'').startsWith('hr')?'hr':'en');
function $(id){return document.getElementById(id)}
function t(k){return text[lang]?.[k]||text.en[k]||k}
function apply(){document.documentElement.lang=lang;document.documentElement.dir=lang==='fa'?'rtl':'ltr';$('lang').value=lang;$('title').textContent=t('title');$('intro').textContent=t('intro');$('password').placeholder=t('newp');$('confirm').placeholder=t('confirm');$('save').textContent=t('save');$('back').textContent=t('back');$('help').textContent=t('help')}
function show(message,kind='notice'){$('status').textContent=message;$('status').className=kind}
function errorCode(error){return String(error?.code||'').toLowerCase()}
function permanent(error){const code=errorCode(error),status=Number(error?.status||0);return status===401||status===403||code.includes('expired')||code.includes('otp')||code.includes('bad_jwt')||code.includes('invalid_jwt')}
function friendly(error){const code=errorCode(error),status=Number(error?.status||0);if(!navigator.onLine||code==='network_error')return t('network');if(status===401||status===403||code.includes('expired')||code.includes('otp'))return t('invalid');if(status===422||code.includes('weak_password'))return t('weak');return t('generic')}
async function api(path,{method='POST',body,token='',timeout=18000}={}){const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),timeout);try{const headers={apikey:SUPABASE_KEY,'Content-Type':'application/json'};if(token)headers.Authorization='Bearer '+token;const options={method,headers,cache:'no-store',signal:controller.signal};if(body!==undefined)options.body=JSON.stringify(body);const response=await fetch(SUPABASE_URL+path,options);const raw=await response.text();let data={};try{data=raw?JSON.parse(raw):{}}catch(_){data={message:raw}}if(!response.ok){const error=new Error(data?.msg||data?.message||data?.error_description||data?.error||response.statusText);error.status=response.status;error.code=String(data?.code||data?.error_code||'');throw error}return data}catch(error){if(error?.name==='AbortError'){const e=new Error('request_timeout');e.code='request_timeout';throw e}if(error instanceof TypeError){const e=new Error('network_error');e.code='network_error';throw e}throw error}finally{clearTimeout(timer)}}
async function closeRecoverySession(){if(accessToken)await api('/auth/v1/logout',{token:accessToken}).catch(()=>{});accessToken='';tokenHash='';authorized=false}
async function authorizeOwner(){const raw=await api('/rest/v1/rpc/nh7_admin_my_access_v350',{token:accessToken,body:{}});const access=Array.isArray(raw)?raw[0]:raw;if(!access||access.is_owner!==true){await closeRecoverySession();show(t('forbidden'),'notice error');return false}authorized=true;return true}
async function initialize(){apply();show(t('checking'),'notice');const payload=window.__NH7_ADMIN_RESET_PAYLOAD__||{};if(payload.type!=='recovery'||payload.error){show(t('invalid'),'notice error');return}accessToken=payload.accessToken||'';tokenHash=payload.tokenHash||'';try{if(!accessToken&&tokenHash){const data=await api('/auth/v1/verify',{body:{token_hash:tokenHash,type:'recovery'}});accessToken=data.access_token||data.session?.access_token||'';tokenHash=''}if(!accessToken)throw Object.assign(new Error('missing_recovery_token'),{code:'expired'});if(!await authorizeOwner())return;show(t('intro'),'notice');$('resetForm').classList.remove('hidden')}catch(error){console.warn('Owner recovery authorization',error);await closeRecoverySession();show(permanent(error)?t('invalid'):t('unavailable'),'notice error')}}
$('lang').onchange=event=>{lang=event.target.value;localStorage.setItem('nh7_admin_lang',lang);apply()};
document.querySelectorAll('.eye').forEach(button=>button.onclick=()=>{const input=$(button.dataset.target);input.type=input.type==='password'?'text':'password';button.textContent=input.type==='password'?'👁':'🙈'});
$('save').onclick=async()=>{const password=$('password').value,confirm=$('confirm').value;if(password.length<8)return show(t('short'),'notice error');if(password!==confirm)return show(t('mismatch'),'notice error');if(!authorized||!accessToken)return show(t('invalid'),'notice error');const button=$('save'),old=button.textContent;button.disabled=true;button.textContent=t('saving');try{const raw=await api('/rest/v1/rpc/nh7_admin_my_access_v350',{token:accessToken,body:{}});const access=Array.isArray(raw)?raw[0]:raw;if(!access||access.is_owner!==true){await closeRecoverySession();$('resetForm').classList.add('hidden');show(t('forbidden'),'notice error');return}await api('/auth/v1/user',{method:'PUT',token:accessToken,body:{password}});await closeRecoverySession();localStorage.removeItem('nh7_admin_token');localStorage.removeItem('nh7_admin_refresh_token');localStorage.removeItem('nh7_admin_access_v350');$('password').value='';$('confirm').value='';$('resetForm').classList.add('hidden');show(t('done'),'notice success')}catch(error){console.warn('Owner password update',error);show(friendly(error),'notice error');if(permanent(error)){await closeRecoverySession();$('resetForm').classList.add('hidden')}}finally{button.disabled=false;button.textContent=old}};
$('back').onclick=()=>location.href=ADMIN_URL;
initialize();
</script>
</body>
</html>
