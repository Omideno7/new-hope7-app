<body class="nh7-public-v239">
<main id="publicApp" class="nh7-v239-public-message">در حال دریافت سند رسمی…</main>
<script>
(()=>{'use strict';
const SUPABASE_URL='https://gpzcwffxnddhaeaogdyo.supabase.co';
const KEY='sb_publishable_v3xXEaJ5Fml7-te1mI4-0g_7R86oM37';
const token=new URL(location.href).searchParams.get('token')||'';
const app=document.getElementById('publicApp');
const E=value=>String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const N=(value,fallback=0)=>Number.isFinite(Number(value))?Number(value):fallback;
const L=(fa,en,hr,l)=>l==='fa'?fa:l==='hr'?hr:en;
const fallbackStyle=(font,size,color,bold=false)=>({font,size,color,bold,italic:false,underline:false,align:'center',lineHeight:1.45,letterSpacing:0,offsetY:0});
const DEFAULTS={theme:'royal_blue_gold',frame:'ornate_double',background:'soft_gradient',orientation:'landscape',paper:'#fffdf8',accent:'#123e69',accent2:'#c59a38',watermark:{enabled:true,source:'assets/logo.png',opacity:.055,size:58,x:50,y:50,rotate:0,grayscale:true,blend:'multiply'},logo:{enabled:true,source:'assets/logo.png',size:88,x:50,y:9,rotate:0,opacity:1,round:false,blend:'normal'},photo:{enabled:false,source:'',size:110,x:9,y:18,rotate:0,round:50,zoom:1},signature:{source:'',size:125,x:75,y:82,opacity:1},styles:{church:fallbackStyle('Cinzel',13,'#26415f',true),title:fallbackStyle('Cinzel',38,'#123e69',true),name:fallbackStyle('Cormorant Garamond',42,'#172033',true),designation:fallbackStyle('Markazi Text',23,'#8a641f',true),body:{...fallbackStyle('Noto Naskh Arabic',17,'#334155'),lineHeight:1.8},date:fallbackStyle('Vazirmatn',12,'#475569'),signature:fallbackStyle('Vazirmatn',12,'#27364a',true),seal:fallbackStyle('Cinzel',12,'#8a641f',true),meta:fallbackStyle('Vazirmatn',9,'#64748b')}};
function merge(raw,d){const out=JSON.parse(JSON.stringify(DEFAULTS));raw=raw&&typeof raw==='object'?raw:{};for(const key of ['theme','frame','background','orientation','layout','paper','accent','accent2'])if(raw[key]!=null)out[key==='layout'?'orientation':key]=raw[key];out.watermark=Object.assign({},out.watermark,raw.watermark||{});out.logo=Object.assign({},out.logo,raw.logo||{});out.photo=Object.assign({},out.photo,raw.photo||{});out.signature=Object.assign({},out.signature,raw.signature||{});out.styles=Object.assign({},out.styles,raw.styles||{});Object.keys(out.styles).forEach(key=>out.styles[key]=Object.assign({},DEFAULTS.styles[key]||fallbackStyle('Vazirmatn',14,'#334155'),out.styles[key]||{}));if(raw.logoUrl&&!out.logo.source)out.logo.source=raw.logoUrl;if(raw.photoUrl&&!out.photo.source)out.photo.source=raw.photoUrl;if(raw.signatureUrl&&!out.signature.source)out.signature.source=raw.signatureUrl;if(d?.logo_url&&!String(out.logo.source||'').startsWith('data:'))out.logo.source=d.logo_url;if(d?.photo_url&&!out.photo.source){out.photo.source=d.photo_url;out.photo.enabled=true}if(d?.signature_url&&!out.signature.source)out.signature.source=d.signature_url;if(d?.layout)out.orientation=d.layout;if(d?.theme_code)out.theme=d.theme_code;return out}
function css(style){style=style||{};return `font-family:'${E(style.font||'inherit')}';font-size:${N(style.size,16)}px;color:${E(style.color||'#1f2937')};font-weight:${style.bold?800:400};font-style:${style.italic?'italic':'normal'};text-decoration:${style.underline?'underline':'none'};text-align:${E(style.align||'center')};line-height:${N(style.lineHeight,1.45)};letter-spacing:${N(style.letterSpacing,0)}px;transform:translateY(${N(style.offsetY,0)}px)`}
async function lookup(){const response=await fetch(`${SUPABASE_URL}/rest/v1/rpc/nh7_public_document_lookup_v222`,{method:'POST',headers:{apikey:KEY,Authorization:`Bearer ${KEY}`,'Content-Type':'application/json'},body:JSON.stringify({p_token:token}),cache:'no-store'});const text=await response.text();if(!response.ok)throw new Error(text||response.statusText);return JSON.parse(text)}
function localized(row,field,l,fallback=''){return row?.[field+'_'+l]||row?.[field+'_en']||row?.[field+'_fa']||fallback}
function canvas(d){
  const l=d.language||'fa',rtl=l==='fa',design=merge(d.design||{},d),styles=design.styles,logo=design.logo.source||d.logo_url||'assets/logo.png',watermark=design.watermark.source||logo,photo=design.photo.source||d.photo_url||'',signature=design.signature.source||d.signature_url||'',date=new Date(d.issue_date||d.approved_at||Date.now()).toLocaleDateString(l==='fa'?'fa-IR':l==='hr'?'hr-HR':'en-US');
  const title=localized(d,'title',l,L('گواهی رسمی','Official Certificate','Službena potvrda',l)),designation=localized(d,'designation',l,''),body=localized(d,'body',l,''),church=Object.assign({name:l==='fa'?'کلیسای امیدنو۷':l==='hr'?'CRKVA NEW HOPE 7':'NEW HOPE 7 CHURCH'},d.church_info||{},d.design?.church||{}),fields=[];
  if(d.place)fields.push([L('محل','Place','Mjesto',l),d.place]);if(d.minister)fields.push([L('خادم','Minister','Služitelj',l),d.minister]);if(d.witness)fields.push([L('شاهد','Witness','Svjedok',l),d.witness]);(Array.isArray(d.custom_fields)?d.custom_fields:[]).forEach(f=>fields.push([f['label_'+l]||f.label_en||f.label_fa||'',f.value||'']));
  return `<div class="certificate-preview" data-nh7-v239-theme="${E(design.theme)}" data-nh7-v239-frame="${E(design.frame)}" data-nh7-v239-background="${E(design.background)}" data-nh7-v239-orientation="${E(design.orientation)}" dir="${rtl?'rtl':'ltr'}" style="--v239-paper:${E(design.paper)};--v239-accent:${E(design.accent)};--v239-accent-2:${E(design.accent2)}">
    ${d.status==='revoked'?`<div class="nh7-v239-revoked">${E(L('باطل‌شده','REVOKED','PONIŠTENO',l))}</div>`:''}
    ${design.watermark.enabled?`<img class="nh7-v239-watermark" src="${E(watermark)}" alt="" style="left:${N(design.watermark.x,50)}%;top:${N(design.watermark.y,50)}%;width:${N(design.watermark.size,58)}%;opacity:${N(design.watermark.opacity,.055)};transform:translate(-50%,-50%) rotate(${N(design.watermark.rotate,0)}deg);filter:${design.watermark.grayscale?'grayscale(1)':'none'};mix-blend-mode:${E(design.watermark.blend||'multiply')}">`:''}
    ${design.logo.enabled?`<img class="certificate-logo" src="${E(logo)}" alt="New Hope 7" style="position:absolute;left:${N(design.logo.x,50)}%;top:${N(design.logo.y,9)}%;width:${N(design.logo.size,88)}px;height:${N(design.logo.size,88)}px;opacity:${N(design.logo.opacity,1)};border-radius:${design.logo.round?'50%':'12px'};mix-blend-mode:${E(design.logo.blend||'normal')};transform:translate(-50%,-50%) rotate(${N(design.logo.rotate,0)}deg)">`:''}
    ${design.photo.enabled&&photo?`<img class="nh7-v239-photo" src="${E(photo)}" alt="photo" style="left:${N(design.photo.x,9)}%;top:${N(design.photo.y,18)}%;width:${N(design.photo.size,110)}px;height:${N(design.photo.size,110)}px;border-radius:${N(design.photo.round,50)}%;transform:translate(-50%,-50%) rotate(${N(design.photo.rotate,0)}deg) scale(${N(design.photo.zoom,1)})">`:''}
    <div class="certificate-kicker" style="${css(styles.church)}">${E(church.name)}</div>
    <div class="certificate-title" style="${css(styles.title)}">${E(title)}</div>
    <div class="certificate-name" style="${css(styles.name)}">${E(d.user_name||'')}</div>
    ${designation?`<div class="certificate-designation" style="${css(styles.designation)}">${E(designation)}</div>`:''}
    <div class="certificate-body-custom" style="${css(styles.body)}">${E(body)}</div>
    ${d.final_score_percent!=null?`<div class="certificate-score" style="${css(styles.designation)}">${E(L('نمره نهایی','Final score','Završna ocjena',l))}: ${E(d.final_score_percent)}%</div>`:''}
    ${fields.length?`<div class="certificate-fields" style="${css(styles.date)}">${fields.map(([a,b])=>`<div class="certificate-field"><strong>${E(a)}:</strong> ${E(b)}</div>`).join('')}</div>`:''}
    <div class="certificate-footer">
      <div class="certificate-sign" style="${css(styles.date)}">${E(L('تاریخ صدور','Issue date','Datum izdavanja',l))}<br><strong>${E(date)}</strong></div>
      <div class="nh7-v239-center-verify"><div class="certificate-seal" style="${css(styles.seal)}">NEW<br>HOPE 7<br>${E(L('رسمی','OFFICIAL','SLUŽBENO',l))}</div><canvas id="certificateQr" class="nh7-v239-qr"></canvas><small>${E(d.verification_code||'')}</small></div>
      <div>${signature?`<img class="certificate-signature-image" src="${E(signature)}" alt="signature">`:''}<div class="certificate-sign" style="${css(styles.signature)}">${E(L('امضای مسئول کلیسا','Authorized church signature','Ovlašteni potpis',l))}<br><strong>${E(d.approved_by||d.minister||'Apostle Yuhana')}</strong></div></div>
    </div>
    <div class="certificate-meta" style="${css(styles.meta)}">${E(L('شماره سند','Document No.','Broj dokumenta',l))}: ${E(d.certificate_number||'')} · ${E(L('کد اعتبار','Verification code','Kod provjere',l))}: ${E(d.verification_code||'')}</div>
  </div>`;
}
function render(d){const l=d.language||'fa';document.documentElement.lang=l;document.documentElement.dir=l==='fa'?'rtl':'ltr';app.className='';const valid=d.status==='approved';app.innerHTML=`<div class="public-valid ${valid?'':'revoked'}">${E(valid?L('این سند رسمی و معتبر است','This is an official valid document','Ovo je službeni valjani dokument',l):L('این سند لغو شده است','This document has been revoked','Dokument je poništen',l))}</div><div class="public-integrity"><div><strong>${E(L('شماره سند','Document number','Broj dokumenta',l))}</strong><br>${E(d.certificate_number||'-')}</div><div><strong>${E(L('کد اعتبار یکتا','Unique verification code','Jedinstveni kod',l))}</strong><br>${E(d.verification_code||'-')}</div><div><strong>${E(L('اثر دیجیتال','Digital integrity','Digitalni integritet',l))}</strong><br>${E(String(d.content_hash||'').slice(0,24)||'-')}…</div></div><div class="certificate-shell">${canvas(d)}</div><div class="public-actions"><button class="nh7-v239-public-back" onclick="history.length>1?history.back():location.href='index.html'">‹ ${E(L('بازگشت','Back','Natrag',l))}</button><button class="nh7-v239-public-button" onclick="window.print()">🖨 ${E(L('چاپ / ذخیره PDF','Print / Save PDF','Ispis / PDF',l))}</button></div>`;drawQr()}
function drawQr(){const run=()=>{const canvas=document.getElementById('certificateQr');if(!canvas||!window.QRCode)return setTimeout(run,80);QRCode.toCanvas(canvas,location.href,{width:150,margin:1,errorCorrectionLevel:'M'},()=>{})};run()}
(async()=>{if(!/^[0-9a-f-]{36}$/i.test(token)){app.innerHTML='<h2>لینک سند معتبر نیست</h2><p>Invalid document link.</p>';return}try{const data=await lookup();if(!data||!data.found)throw new Error('Not found');render(data)}catch(error){console.error(error);app.innerHTML='<h2>سند پیدا نشد</h2><p>این لینک نامعتبر است یا سند در دسترس نیست.</p><p>Document not found.</p>'}})();
})();
</script>
