<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0f766e">
  <link rel="manifest" href="manifest.json?v=2.3.9.21">
  <link rel="apple-touch-icon" href="assets/logo.png">
  <title>New Hope 7 v2.3.9.21</title>
  <style>
    body{margin:0;min-height:100dvh;display:grid;place-items:center;background:linear-gradient(180deg,#e9f8f6,#f7fbff);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;color:#102033;padding:24px;box-sizing:border-box}
    main{width:min(540px,100%);background:#fff;border:1px solid #d8ecea;border-radius:24px;padding:24px;text-align:center;box-shadow:0 18px 55px rgba(15,118,110,.16)}
    .spinner{width:46px;height:46px;margin:0 auto 16px;border:5px solid #dff4f0;border-top-color:#0f766e;border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
    h1{font-size:1.25rem;margin:0 0 8px}p{color:#667085;line-height:1.8;margin:0}.error{color:#b42318;margin-top:12px;white-space:pre-wrap}
  </style>
</head>
<body>
<main><div class="spinner"></div><h1>در حال باز کردن New Hope 7 نسخه ۲.۳.۹.۲۱</h1><p>کتاب‌خوان فارسی بهبودیافته و نسخه‌های زبانی کتاب‌ها در حال بارگذاری است.</p><div id="error" class="error"></div></main>
<script>
(async()=>{
  const BUILD='2.3.9.21-library-text-quality';
  try{
    if(localStorage.getItem('nh7_app_install_build')!==BUILD){
      if('caches' in window){
        const keys=await caches.keys();
        await Promise.all(keys.filter(key=>key.startsWith('nh7-core-')||key.startsWith('nh7-data-')||key.startsWith('nh7-public-api-')||key.startsWith('omideno7-')).map(key=>caches.delete(key)));
      }
      if('serviceWorker' in navigator){
        const regs=await navigator.serviceWorker.getRegistrations();
        await Promise.all(regs.map(reg=>reg.unregister()));
      }
      localStorage.setItem('nh7_app_install_build',BUILD);
    }
    const response=await fetch('./index.html?v='+encodeURIComponent(BUILD)+'-'+Date.now(),{cache:'no-store',headers:{'Cache-Control':'no-cache'}});
    if(!response.ok)throw new Error('App HTML '+response.status);
    let html=await response.text();
    html=html.replace('manifest.json?v=2.3.9.21','manifest.json?v='+BUILD);
    document.open();document.write(html);document.close();
  }catch(error){document.getElementById('error').textContent='خطا در بارگذاری اپ: '+(error&&error.message?error.message:String(error))}
})();
</script>
</body>
</html>
