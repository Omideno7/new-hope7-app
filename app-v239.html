<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0f766e">
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
  <meta http-equiv="Pragma" content="no-cache">
  <meta http-equiv="Expires" content="0">
  <link rel="manifest" href="manifest.json?v=2.3.9.32">
  <link rel="apple-touch-icon" href="assets/logo.png">
  <title>New Hope 7 v2.3.9.32</title>
  <style>
    body{margin:0;min-height:100dvh;display:grid;place-items:center;background:linear-gradient(180deg,#e9f8f6,#f7fbff);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;color:#102033;padding:24px;box-sizing:border-box}
    main{width:min(540px,100%);background:#fff;border:1px solid #d8ecea;border-radius:24px;padding:24px;text-align:center;box-shadow:0 18px 55px rgba(15,118,110,.16)}
    .spinner{width:46px;height:46px;margin:0 auto 16px;border:5px solid #dff4f0;border-top-color:#0f766e;border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
    h1{font-size:1.25rem;margin:0 0 8px}p{color:#667085;line-height:1.8;margin:0}.error{color:#b42318;margin-top:12px;white-space:pre-wrap}.offline-note{margin-top:10px;color:#0f766e;font-weight:700}
  </style>
</head>
<body>
<main><div class="spinner"></div><h1>در حال باز کردن New Hope 7 نسخه ۲.۳.۹.۳۲</h1><p id="statusText">در حال آماده‌سازی برنامه…</p><p id="offlineNote" class="offline-note"></p><div id="error" class="error"></div></main>
<script>
(async()=>{
  const BUILD='2.3.9.32-online-audio';
  const WORKER='./service-worker.js';
  const SHELL_CACHE='nh7-shell-stable';
  const status=document.getElementById('statusText');
  const offline=document.getElementById('offlineNote');
  const errorBox=document.getElementById('error');
  const shellRequest=new Request('./index.html');
  async function registerWorker(){
    if(!('serviceWorker' in navigator))return null;
    try{
      const registration=await navigator.serviceWorker.register(WORKER,{scope:'./',updateViaCache:'none'});
      try{await registration.update()}catch(_){}
      if(registration.waiting)registration.waiting.postMessage({type:'SKIP_WAITING'});
      return registration;
    }catch(error){console.warn('Worker registration failed',error);return null}
  }
  async function cachedShell(){
    if(!('caches' in window))return null;
    try{const shell=await caches.open(SHELL_CACHE);return await shell.match(shellRequest,{ignoreSearch:true})||await caches.match(shellRequest,{ignoreSearch:true})}catch(_){return null}
  }
  async function networkShell(){
    const controller=new AbortController();const timer=setTimeout(()=>controller.abort(),5000);
    try{
      const response=await fetch('./index.html?build='+encodeURIComponent(BUILD)+'&t='+Date.now(),{cache:'no-store',signal:controller.signal,headers:{'Cache-Control':'no-cache, no-store, must-revalidate','Pragma':'no-cache'}});
      if(!response.ok)throw new Error('App HTML '+response.status);
      if('caches' in window){const shell=await caches.open(SHELL_CACHE);await shell.put(shellRequest,response.clone())}
      return response;
    }finally{clearTimeout(timer)}
  }
  try{
    const registration=await registerWorker();
    let response=null;
    if(navigator.onLine){status.textContent='در حال دریافت آخرین نسخه…';try{response=await networkShell()}catch(error){console.warn(error);response=await cachedShell()}}
    else{status.textContent='در حال بازکردن نسخهٔ ذخیره‌شده…';offline.textContent='حالت آفلاین فعال است';response=await cachedShell()}
    if(!response&&registration){try{await Promise.race([navigator.serviceWorker.ready,new Promise((_,reject)=>setTimeout(()=>reject(new Error('Worker timeout')),6000))]);response=await fetch('./index.html',{cache:'force-cache'})}catch(_){}}
    if(!response)throw new Error('نسخهٔ آفلاین برنامه روی این دستگاه پیدا نشد. یک‌بار با اینترنت برنامه را کامل باز کنید.');
    const html=await response.text();
    localStorage.setItem('nh7_app_install_build',BUILD);
    document.open();document.write(html);document.close();
  }catch(error){document.querySelector('.spinner')?.remove();status.textContent='برنامه باز نشد';errorBox.textContent=error?.message||String(error)}
})();
</script>
</body>
</html>
