<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>New Hope 7 — بازیابی رمز عبور</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,sans-serif;color:#102238;background:#eef9f8}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background:radial-gradient(circle at top,#fff 0,#eef9f8 55%,#e2f3f0 100%)}.card{width:min(560px,100%);background:#fff;border:1px solid #d7ebe8;border-radius:28px;padding:28px;box-shadow:0 18px 60px rgba(9,67,86,.12)}.logo{width:76px;height:76px;object-fit:contain;display:block;margin:0 auto 10px}h1{text-align:center;margin:8px 0}p{line-height:1.8}.notice{padding:14px;border-radius:14px;background:#eef8ff;border:1px solid #cfe5f8}.error{background:#fff1f1;border-color:#f4caca;color:#a02121}.success{background:#effcf5;border-color:#c5ead4;color:#11633a}input,select,button{width:100%;font:inherit;border-radius:14px;padding:14px;margin-top:10px;border:1px solid #c9dfdc;background:#fff}.pw{position:relative}.pw input{padding-inline-end:52px}.eye{position:absolute;inset-inline-end:5px;top:5px;width:44px;border:0;background:transparent;padding:10px;cursor:pointer}.primary{border:0;color:#fff;font-weight:700;background:linear-gradient(90deg,#0d79b8,#15a66f);cursor:pointer}.secondary{cursor:pointer;background:#f3f8fb}.links{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px}.hidden{display:none!important}.small{font-size:13px;color:#66758a}.ltr{direction:ltr;text-align:left}@media(max-width:520px){.card{padding:20px}.links{grid-template-columns:1fr}}
</style>
</head>
<body><main class="card"><img class="logo" src="assets/logo.png" alt="New Hope 7"><select id="lang"><option value="fa">فارسی</option><option value="en">English</option><option value="hr">Hrvatski</option></select><h1 id="title">بازیابی رمز عبور</h1><p id="intro">رمز جدید را وارد کن. رمز باید حداقل ۶ کاراکتر باشد.</p><div id="status" class="notice">در حال بررسی لینک بازیابی…</div><section id="resetForm" class="hidden"><div class="pw"><input id="password" type="password" minlength="6" autocomplete="new-password" placeholder="رمز جدید"><button type="button" class="eye" data-target="password">👁</button></div><div class="pw"><input id="confirm" type="password" minlength="6" autocomplete="new-password" placeholder="تکرار رمز جدید"><button type="button" class="eye" data-target="confirm">👁</button></div><button id="save" type="button" class="primary">ذخیره رمز جدید</button></section><section id="resend" class="hidden"><p id="resendText">لینک معتبر نیست یا منقضی شده است. یک لینک جدید درخواست کن.</p><input id="email" class="ltr" type="email" autocomplete="email" placeholder="Email"><button id="send" type="button" class="secondary">ارسال لینک جدید</button></section><div class="links"><button id="openApp" type="button" class="secondary">باز کردن اپ</button><button id="openAdmin" type="button" class="secondary">ورود پنل ادمین</button></div><p class="small" id="help">لینک‌های قدیمی که به localhost می‌روند قابل استفاده نیستند؛ پس از اصلاح تنظیمات، لینک جدید درخواست کن.</p></main>
<script>
const SUPABASE_URL='https://gpzcwffxnddhaeaogdyo.supabase.co';
const SUPABASE_KEY='sb_publishable_v3xXEaJ5Fml7-te1mI4-0g_7R86oM37';
const RESET_URL='https://omideno7.github.io/new-hope7-app/reset-password.html';
const APP_URL='https://omideno7.github.io/new-hope7-app/';
const ADMIN_URL='https://omideno7.github.io/new-hope7-app/admin.html';
let accessToken='';
const text={fa:{title:'بازیابی رمز عبور',intro:'رمز جدید را وارد کن. رمز باید حداقل ۶ کاراکتر باشد.',checking:'در حال بررسی لینک بازیابی…',newp:'رمز جدید',confirm:'تکرار رمز جدید',save:'ذخیره رمز جدید',invalid:'لینک معتبر نیست یا منقضی شده است. یک لینک جدید درخواست کن.',email:'ایمیل',send:'ارسال لینک جدید',sent:'لینک جدید ارسال شد. ایمیل را بررسی کن.',mismatch:'رمزها یکسان نیستند.',short:'رمز باید حداقل ۶ کاراکتر باشد.',done:'رمز با موفقیت تغییر کرد. اکنون می‌توانی وارد حساب شوی.',app:'باز کردن اپ',admin:'ورود پنل ادمین',help:'لینک‌های قدیمی که به localhost می‌روند قابل استفاده نیستند؛ پس از اصلاح تنظیمات، لینک جدید درخواست کن.',confirmed:'ایمیل حساب با موفقیت تأیید شد.'},en:{title:'Reset password',intro:'Enter a new password with at least 6 characters.',checking:'Checking the recovery link…',newp:'New password',confirm:'Confirm new password',save:'Save new password',invalid:'This link is invalid or expired. Request a new one.',email:'Email',send:'Send a new link',sent:'A new link was sent. Check your email.',mismatch:'Passwords do not match.',short:'Password must have at least 6 characters.',done:'Password updated successfully. You can now sign in.',app:'Open app',admin:'Admin login',help:'Old links pointing to localhost cannot work. Request a new link after the settings are corrected.',confirmed:'Your email was confirmed successfully.'},hr:{title:'Obnova lozinke',intro:'Unesite novu lozinku od najmanje 6 znakova.',checking:'Provjera poveznice…',newp:'Nova lozinka',confirm:'Potvrdite lozinku',save:'Spremi novu lozinku',invalid:'Poveznica nije valjana ili je istekla. Zatražite novu.',email:'E-mail',send:'Pošalji novu poveznicu',sent:'Nova poveznica je poslana. Provjerite e-mail.',mismatch:'Lozinke se ne podudaraju.',short:'Lozinka mora imati najmanje 6 znakova.',done:'Lozinka je uspješno promijenjena. Sada se možete prijaviti.',app:'Otvori aplikaciju',admin:'Prijava administratora',help:'Stare poveznice koje vode na localhost ne rade. Zatražite novu poveznicu nakon ispravka postavki.',confirmed:'E-mail je uspješno potvrđen.'}};
let lang=localStorage.getItem('nh7_reset_lang')||((navigator.language||'').startsWith('fa')?'fa':(navigator.language||'').startsWith('hr')?'hr':'en');
function t(k){return text[lang][k]||text.en[k]||k}function $(id){return document.getElementById(id)}
function apply(){document.documentElement.lang=lang;document.documentElement.dir=lang==='fa'?'rtl':'ltr';$('lang').value=lang;$('title').textContent=t('title');$('intro').textContent=t('intro');$('password').placeholder=t('newp');$('confirm').placeholder=t('confirm');$('save').textContent=t('save');$('email').placeholder=t('email');$('send').textContent=t('send');$('openApp').textContent=t('app');$('openAdmin').textContent=t('admin');$('help').textContent=t('help');if($('resend').dataset.visible==='1')$('resendText').textContent=t('invalid')}
function show(message,kind='notice'){const s=$('status');s.textContent=message;s.className=kind}
async function verifyTokenHash(tokenHash){const r=await fetch(SUPABASE_URL+'/auth/v1/verify',{method:'POST',headers:{apikey:SUPABASE_KEY,'Content-Type':'application/json'},body:JSON.stringify({token_hash:tokenHash,type:'recovery'})});if(!r.ok)throw new Error(await r.text());return r.json()}
async function initialize(){apply();const hash=new URLSearchParams(location.hash.replace(/^#/,'')),query=new URLSearchParams(location.search);const type=hash.get('type')||query.get('type')||'';if(hash.get('error_description')){show(decodeURIComponent(hash.get('error_description')),'notice error');return showResend()}accessToken=hash.get('access_token')||'';if(!accessToken&&query.get('token_hash')){try{const d=await verifyTokenHash(query.get('token_hash'));accessToken=d.access_token||d.session?.access_token||''}catch(e){show(t('invalid'),'notice error');return showResend()}}if(type==='signup'||type==='email_change'){show(t('confirmed'),'notice success');$('resetForm').classList.add('hidden');return}if(accessToken){show(t('intro'),'notice');$('resetForm').classList.remove('hidden')}else{show(t('invalid'),'notice error');showResend()}}
function showResend(){$('resend').classList.remove('hidden');$('resend').dataset.visible='1';$('resendText').textContent=t('invalid')}
$('lang').onchange=e=>{lang=e.target.value;localStorage.setItem('nh7_reset_lang',lang);apply()};document.querySelectorAll('.eye').forEach(b=>b.onclick=()=>{const i=$(b.dataset.target);i.type=i.type==='password'?'text':'password';b.textContent=i.type==='password'?'👁':'🙈'});
$('save').onclick=async()=>{const p=$('password').value,c=$('confirm').value;if(p.length<6)return show(t('short'),'notice error');if(p!==c)return show(t('mismatch'),'notice error');if(!accessToken)return show(t('invalid'),'notice error');$('save').disabled=true;try{const r=await fetch(SUPABASE_URL+'/auth/v1/user',{method:'PUT',headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+accessToken,'Content-Type':'application/json'},body:JSON.stringify({password:p})});if(!r.ok)throw new Error(await r.text());show(t('done'),'notice success');$('resetForm').classList.add('hidden');history.replaceState({},'',location.pathname)}catch(e){show(e.message,'notice error')}finally{$('save').disabled=false}};
$('send').onclick=async()=>{const email=$('email').value.trim().toLowerCase();if(!email)return;try{const r=await fetch(SUPABASE_URL+'/auth/v1/recover',{method:'POST',headers:{apikey:SUPABASE_KEY,'Content-Type':'application/json'},body:JSON.stringify({email,redirect_to:RESET_URL})});if(!r.ok)throw new Error(await r.text());show(t('sent'),'notice success')}catch(e){show(e.message,'notice error')}};
$('openApp').onclick=()=>location.href=APP_URL;$('openAdmin').onclick=()=>location.href=ADMIN_URL;initialize();
</script></body></html>
