<script>
(()=>{const hash=new URLSearchParams(location.hash.replace(/^#/,'')),query=new URLSearchParams(location.search),get=key=>hash.get(key)||query.get(key)||'';window.__NH7_RESET_PAYLOAD__={type:String(get('type')||'recovery').toLowerCase(),accessToken:get('access_token'),tokenHash:get('token_hash'),error:get('error_description')||get('error')||'',errorCode:get('error_code')||''};try{const url=new URL(location.href);['access_token','refresh_token','expires_at','expires_in','token_type','token_hash','type','error','error_code','error_description'].forEach(key=>url.searchParams.delete(key));url.hash='';history.replaceState({},'',url.pathname+(url.searchParams.toString()?'?'+url.searchParams.toString():''))}catch(_){}})();

<title>New Hope 7 — Account recovery</title>
<style>
:root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,sans-serif;color:#102238;background:#eef9f8}
*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:22px;background:radial-gradient(circle at top,#fff 0,#eef9f8 55%,#e2f3f0 100%)}
.card{width:min(560px,100%);background:#fff;border:1px solid #d7ebe8;border-radius:28px;padding:28px;box-shadow:0 18px 60px rgba(9,67,86,.12)}
.logo{width:82px;height:82px;object-fit:contain;display:block;margin:0 auto 10px}h1{text-align:center;margin:8px 0}p{line-height:1.8}
.notice{padding:14px;border-radius:14px;background:#eef8ff;border:1px solid #cfe5f8;white-space:pre-line}.error{background:#fff1f1;border-color:#f4caca;color:#a02121}.success{background:#effcf5;border-color:#c5ead4;color:#11633a}
input,select,button{width:100%;font:inherit;border-radius:14px;padding:14px;margin-top:10px;border:1px solid #c9dfdc;background:#fff}.pw{position:relative}.pw input{padding-inline-end:52px}.eye{position:absolute;inset-inline-end:5px;top:5px;width:44px;border:0;background:transparent;padding:10px;cursor:pointer}
.primary{border:0;color:#fff;font-weight:800;background:linear-gradient(90deg,#0d79b8,#15a66f);cursor:pointer}.secondary{cursor:pointer;background:#f3f8fb}.primary:disabled,.secondary:disabled{opacity:.6;cursor:wait}
.links{display:grid;grid-template-columns:1fr;gap:10px;margin-top:14px}.hidden{display:none!important}.small{font-size:13px;color:#66758a}.ltr{direction:ltr;text-align:left}
@media(max-width:520px){.card{padding:20px}}
</style>
</head>
<body>
<main class="card">
  <img class="logo" src="assets/logo.png" alt="New Hope 7">
  <select id="lang"><option value="fa">فارسی</option><option value="en">English</option><option value="hr">Hrvatski</option></select>
  <h1 id="title"></h1>
  <p id="intro"></p>
  <div id="status" class="notice"></div>

  <section id="resetForm" class="hidden">
    <div class="pw"><input id="password" type="password" minlength="6" autocomplete="new-password"><button type="button" class="eye" data-target="password">👁</button></div>
    <div class="pw"><input id="confirm" type="password" minlength="6" autocomplete="new-password"><button type="button" class="eye" data-target="confirm">👁</button></div>
    <button id="save" type="button" class="primary"></button>
  </section>

  <section id="resend" class="hidden">
    <p id="resendText"></p>
    <input id="email" class="ltr" type="email" autocomplete="email">
    <button id="send" type="button" class="secondary"></button>
  </section>

  <div class="links"><button id="openApp" type="button" class="secondary"></button></div>
  <p class="small" id="help"></p>
</main>
<script>
const SUPABASE_URL='https://gpzcwffxnddhaeaogdyo.supabase.co';
const SUPABASE_KEY='sb_publishable_v3xXEaJ5Fml7-te1mI4-0g_7R86oM37';
const RESET_URL='https://omideno7.github.io/new-hope7-app/reset-password.html';
const APP_URL='https://omideno7.github.io/new-hope7-app/app-v239.html';
const ADMIN_RESET_URL='https://omideno7.github.io/new-hope7-app/admin-reset-password.html';
const OWNER_EMAIL='omideno7church@gmail.com';
let accessToken='',tokenHash='';
const text={
fa:{title:'بازیابی رمز حساب کاربری',intro:'اگر لینک بازیابی معتبر است، رمز جدید حساب کاربری را وارد کنید.',checking:'در حال بررسی لینک…',newp:'رمز جدید',confirm:'تکرار رمز جدید',save:'ذخیره رمز جدید',invalid:'این لینک معتبر نیست یا منقضی شده است. می‌توانید یک لینک بازیابی جدید درخواست کنید.',email:'ایمیل حساب کاربری',send:'ارسال لینک بازیابی جدید',sending:'در حال ارسال…',saving:'در حال ذخیره…',sent:'اگر این ایمیل در سیستم وجود داشته باشد، لینک بازیابی ارسال شد. پوشه Spam/Junk را هم بررسی کنید.',mismatch:'تکرار رمز عبور با رمز اصلی یکسان نیست.',short:'رمز عبور باید حداقل ۶ کاراکتر باشد.',done:'رمز عبور با موفقیت تغییر کرد. اکنون می‌توانید وارد حساب کاربری شوید.',app:'باز کردن New Hope 7',help:'این صفحه فقط برای حساب کاربران است. لینک‌های بازیابی یک‌بارمصرف و دارای زمان انقضا هستند.',confirmed:'ایمیل حساب با موفقیت تأیید شد. اکنون می‌توانید به برنامه برگردید.',badEmail:'یک آدرس ایمیل معتبر وارد کنید.',network:'اینترنت در دسترس نیست. اتصال را بررسی و دوباره تلاش کنید.',timeout:'پاسخ سرور طول کشید. چند لحظه بعد دوباره تلاش کنید.',rate:'تعداد درخواست‌ها زیاد بوده است. چند دقیقه صبر کنید و دوباره تلاش کنید.',generic:'درخواست انجام نشد. لطفاً چند لحظه بعد دوباره تلاش کنید.',adminBlocked:'این صفحه برای بازیابی حساب کاربران است و رمز حساب مالک پنل را تغییر نمی‌دهد.'},
en:{title:'User password recovery',intro:'If your recovery link is valid, enter a new password for your user account.',checking:'Checking the link…',newp:'New password',confirm:'Confirm new password',save:'Save new password',invalid:'This link is invalid or expired. You can request a new password recovery link.',email:'User account email',send:'Send a new recovery link',sending:'Sending…',saving:'Saving…',sent:'If this email exists in the system, a recovery link has been sent. Check Spam/Junk too.',mismatch:'Password confirmation does not match.',short:'Password must be at least 6 characters.',done:'Password updated successfully. You can now sign in to your user account.',app:'Open New Hope 7',help:'This page is only for user accounts. Recovery links are single-use and expire after a limited time.',confirmed:'Your account email was confirmed successfully. You can now return to the app.',badEmail:'Enter a valid email address.',network:'No internet connection. Check your connection and try again.',timeout:'The server took too long to respond. Try again in a moment.',rate:'Too many requests. Wait a few minutes and try again.',generic:'The request could not be completed. Please try again in a moment.',adminBlocked:'This page only recovers user accounts and cannot change the panel owner password.'},
hr:{title:'Obnova korisničke lozinke',intro:'Ako je poveznica valjana, unesite novu lozinku korisničkog računa.',checking:'Provjera poveznice…',newp:'Nova lozinka',confirm:'Potvrdi novu lozinku',save:'Spremi novu lozinku',invalid:'Poveznica nije valjana ili je istekla. Možete zatražiti novu poveznicu za obnovu lozinke.',email:'E-mail korisničkog računa',send:'Pošalji novu poveznicu',sending:'Slanje…',saving:'Spremanje…',sent:'Ako ovaj e-mail postoji u sustavu, poveznica za obnovu je poslana. Provjerite i Spam/Junk.',mismatch:'Potvrda lozinke nije ista.',short:'Lozinka mora imati najmanje 6 znakova.',done:'Lozinka je uspješno promijenjena. Sada se možete prijaviti u korisnički račun.',app:'Otvori New Hope 7',help:'Ova je stranica samo za korisničke račune. Poveznice su jednokratne i imaju rok valjanosti.',confirmed:'E-mail računa je uspješno potvrđen. Sada se možete vratiti u aplikaciju.',badEmail:'Unesite valjanu e-mail adresu.',network:'Nema internetske veze. Provjerite vezu i pokušajte ponovno.',timeout:'Poslužitelj predugo odgovara. Pokušajte ponovno za trenutak.',rate:'Previše zahtjeva. Pričekajte nekoliko minuta i pokušajte ponovno.',generic:'Zahtjev nije dovršen. Pokušajte ponovno za trenutak.',adminBlocked:'Ova stranica obnavlja samo korisničke račune i ne može promijeniti lozinku vlasnika panela.'}
};
let lang=localStorage.getItem('nh7_reset_lang')||((navigator.language||'').startsWith('fa')?'fa':(navigator.language||'').startsWith('hr')?'hr':'en');
function t(k){return text[lang]?.[k]||text.en[k]||k}
function $(id){return document.getElementById(id)}
function validEmail(v){return /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(String(v||'').trim())}
function apply(){document.documentElement.lang=lang;document.documentElement.dir=lang==='fa'?'rtl':'ltr';$('lang').value=lang;$('title').textContent=t('title');$('intro').textContent=t('intro');$('password').placeholder=t('newp');$('confirm').placeholder=t('confirm');$('save').textContent=t('save');$('email').placeholder=t('email');$('send').textContent=t('send');$('openApp').textContent=t('app');$('help').textContent=t('help');if($('resend').dataset.visible==='1')$('resendText').textContent=t('invalid')}
function tokenEmail(value){try{let part=String(value||'').split('.')[1].replace(/-/g,'+').replace(/_/g,'/');part+= '='.repeat((4-part.length%4)%4);const payload=JSON.parse(atob(part));return String(payload.email||'').trim().toLowerCase()}catch(_){return''}}
function ownerTokenBlocked(){return tokenEmail(accessToken)===OWNER_EMAIL}
function forwardOwnerRecovery(){if(!accessToken)return false;const fragment=new URLSearchParams({access_token:accessToken,type:'recovery'});location.replace(ADMIN_RESET_URL+'#'+fragment.toString());return true}
function show(message,kind='notice'){$('status').textContent=message;$('status').className=kind}
function friendly(error){const code=String(error?.code||'').toLowerCase(),status=Number(error?.status||0);if(!navigator.onLine||code==='network_error')return t('network');if(code==='request_timeout')return t('timeout');if(status===429||code.includes('rate'))return t('rate');if(status===401||status===403||code.includes('expired')||code.includes('otp'))return t('invalid');if(status===422||code.includes('weak_password'))return lang==='fa'?'یک رمز قوی‌تر با ترکیبی از حروف و عدد انتخاب کنید.':lang==='hr'?'Odaberite jaču lozinku s kombinacijom slova i brojeva.':'Choose a stronger password using a mix of letters and numbers.';return t('generic')}
function permanentRecoveryError(error){const code=String(error?.code||'').toLowerCase(),status=Number(error?.status||0);return status===401||status===403||code==='missing_recovery_token'||code.includes('expired')||code.includes('otp_expired')||code.includes('bad_jwt')||code.includes('invalid_jwt')}
async function api(path,{method='POST',body,token='',timeout=18000}={}){const controller=new AbortController(),timer=setTimeout(()=>controller.abort(),timeout);try{const headers={apikey:SUPABASE_KEY,'Content-Type':'application/json'};if(token)headers.Authorization='Bearer '+token;const opt={method,headers,cache:'no-store',signal:controller.signal};if(body!==undefined)opt.body=JSON.stringify(body);const r=await fetch(SUPABASE_URL+path,opt);const raw=await r.text();let data={};try{data=raw?JSON.parse(raw):{}}catch(_){data={message:raw}}if(!r.ok){const e=new Error(data?.msg||data?.message||data?.error_description||data?.error||r.statusText);e.status=r.status;e.code=String(data?.code||data?.error_code||'');throw e}return data}catch(error){if(error?.name==='AbortError'){const e=new Error('request_timeout');e.code='request_timeout';throw e}if(error instanceof TypeError){const e=new Error('network_error');e.code='network_error';throw e}throw error}finally{clearTimeout(timer)}}
async function verifyTokenHash(tokenHash,type){return api('/auth/v1/verify',{body:{token_hash:tokenHash,type:type||'recovery'}})}
function showResend(){$('resend').classList.remove('hidden');$('resend').dataset.visible='1';$('resendText').textContent=t('invalid')}
async function initialize(){apply();show(t('checking'),'notice');const payload=window.__NH7_RESET_PAYLOAD__||{},type=payload.type||'recovery';if(!['recovery','signup','email_change'].includes(type)){show(t('invalid'),'notice error');$('resetForm').classList.add('hidden');return}if(payload.error){show(t('invalid'),'notice error');showResend();return}accessToken=payload.accessToken||'';tokenHash=payload.tokenHash||'';
if(type==='signup'||type==='email_change'){if(!accessToken&&tokenHash){try{const d=await verifyTokenHash(tokenHash,type);accessToken=d.access_token||d.session?.access_token||'';tokenHash=''}catch(error){console.warn('Confirmation verify',error);show(t('invalid'),'notice error');showResend();return}}show(t('confirmed'),'notice success');$('resetForm').classList.add('hidden');return}
if(!accessToken&&tokenHash){try{const d=await verifyTokenHash(tokenHash,'recovery');accessToken=d.access_token||d.session?.access_token||'';tokenHash=''}catch(error){console.warn('Recovery verify',error);show(friendly(error),'notice error');showResend();return}}
if(accessToken&&ownerTokenBlocked()){forwardOwnerRecovery();return}if(accessToken){show(t('intro'),'notice');$('resetForm').classList.remove('hidden')}else{show(t('invalid'),'notice error');showResend()}}
$('lang').onchange=e=>{lang=e.target.value;localStorage.setItem('nh7_reset_lang',lang);apply()};
document.querySelectorAll('.eye').forEach(b=>b.onclick=()=>{const i=$(b.dataset.target);i.type=i.type==='password'?'text':'password';b.textContent=i.type==='password'?'👁':'🙈'});
$('save').onclick=async()=>{const p=$('password').value,c=$('confirm').value;if(p.length<6)return show(t('short'),'notice error');if(p!==c)return show(t('mismatch'),'notice error');if(!accessToken&&!tokenHash){show(t('invalid'),'notice error');showResend();return}const button=$('save'),old=button.textContent;button.disabled=true;button.textContent=t('saving');try{if(!accessToken&&tokenHash){const d=await verifyTokenHash(tokenHash,'recovery');accessToken=d.access_token||d.session?.access_token||'';tokenHash=''}if(!accessToken)throw Object.assign(new Error('missing_recovery_token'),{code:'expired'});if(ownerTokenBlocked()){forwardOwnerRecovery();return}await api('/auth/v1/user',{method:'PUT',token:accessToken,body:{password:p}});api('/auth/v1/logout',{token:accessToken}).catch(()=>{});localStorage.removeItem('nh7_user_session_v170');localStorage.setItem('nh7_explicit_logout','1');localStorage.removeItem('nh7_recovery_requested_at');$('password').value='';$('confirm').value='';show(t('done'),'notice success');$('resetForm').classList.add('hidden')}catch(error){console.warn('Password update',error);show(friendly(error),'notice error');if(permanentRecoveryError(error)){accessToken='';tokenHash='';showResend()}}finally{button.disabled=false;button.textContent=old}};
$('send').onclick=async()=>{const email=$('email').value.trim().toLowerCase();if(!validEmail(email))return show(t('badEmail'),'notice error');if(email===OWNER_EMAIL)return show(t('adminBlocked'),'notice error');const button=$('send'),old=button.textContent;button.disabled=true;button.textContent=t('sending');try{localStorage.setItem('nh7_recovery_requested_at',String(Date.now()));await api('/auth/v1/recover?redirect_to='+encodeURIComponent(RESET_URL),{body:{email}});show(t('sent'),'notice success')}catch(error){console.warn('Recovery resend',error);show(friendly(error),'notice error')}finally{button.disabled=false;button.textContent=old}};
$('openApp').onclick=()=>location.href=APP_URL;
initialize();
</script>
</body>
</html>
