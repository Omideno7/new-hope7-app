# Source-only unsigned QA target. Pairing/signing/release identity requires Wave8 acceptance.
name: NewHope7WatchWave7QA
options:
  deploymentTarget:
    watchOS: "10.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGNING_ALLOWED: "NO"
targets:
  NewHope7Watch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: NewHope7Watch
      - path: GeneratedBible
        buildPhase: resources
    info:
      path: NewHope7Watch/Info.plist
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.omideno7.newhope7.qa.wave7.watchapp
        MARKETING_VERSION: "2.5.0"
        CURRENT_PROJECT_VERSION: "27001"
        CODE_SIGNING_ALLOWED: "NO"
