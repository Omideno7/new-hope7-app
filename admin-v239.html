<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0f766e">
  <link rel="manifest" href="admin-manifest.json?v=2.3.9-document-fix3">
  <link rel="apple-touch-icon" href="assets/admin-apple-touch-icon.png">
  <title>New Hope 7 Admin v2.3.9</title>
  <style>
    body{margin:0;min-height:100dvh;display:grid;place-items:center;background:linear-gradient(180deg,#e9f8f6,#f7fbff);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;color:#102033;padding:24px;box-sizing:border-box}
    main{width:min(550px,100%);background:#fff;border:1px solid #d8ecea;border-radius:24px;padding:24px;text-align:center;box-shadow:0 18px 55px rgba(15,118,110,.16)}
    .spinner{width:46px;height:46px;margin:0 auto 16px;border:5px solid #dff4f0;border-top-color:#0f766e;border-radius:50%;animation:spin .8s linear infinite}@keyframes spin{to{transform:rotate(360deg)}}
    h1{font-size:1.25rem;margin:0 0 8px}p{color:#667085;line-height:1.8;margin:0}.error{color:#b42318;margin-top:12px;white-space:pre-wrap}
  </style>
</head>
<body>
<main><div class="spinner"></div><h1>در حال باز کردن پنل ادمین نسخه ۲.۳.۹</h1><p>استودیوی مدارک Fix 3، صدور مدرک و نمایش عکس در حال بارگذاری است.</p><div id="error" class="error"></div></main>
<script>
(async()=>{
  const BUILD='2.3.9-document-studio-fix3';
  try{
    if(localStorage.getItem('nh7_admin_install_build')!==BUILD){
      if('caches' in window){
        const keys=await caches.keys();
        await Promise.all(keys.filter(key=>key.startsWith('nh7-core-')||key.startsWith('nh7-data-')||key.startsWith('nh7-public-api-')||key.startsWith('omideno7-')).map(key=>caches.delete(key)));
      }
      if('serviceWorker' in navigator){
        const regs=await navigator.serviceWorker.getRegistrations();
        await Promise.all(regs.map(reg=>reg.unregister()));
      }
      localStorage.setItem('nh7_admin_install_build',BUILD);
    }
    const response=await fetch('./admin.html?v='+encodeURIComponent(BUILD)+'-'+Date.now(),{cache:'no-store',headers:{'Cache-Control':'no-cache'}});
    if(!response.ok)throw new Error('Admin HTML '+response.status);
    let html=await response.text();
    html=html.replace('admin-manifest.json?v=2.3.6','admin-manifest.json?v=2.3.9-document-fix3');
    html=html.replace('</head>','<link rel="stylesheet" href="css/admin-v2.3.8-student-fix.css?v=2.3.9-document-fix3"><link rel="stylesheet" href="css/admin-v2.3.9-document-studio.css?v=2.3.9-document-fix3"><link rel="stylesheet" href="css/admin-v2.3.9-document-studio-fix1.css?v=2.3.9-document-fix3"><link rel="stylesheet" href="css/admin-v2.3.9-document-runtime-fix3.css?v=2.3.9-document-fix3"><style>.nh7-admin-version-v235{font-size:0!important}.nh7-admin-version-v235::after{content:"v2.3.9 FIX 3"!important;font-size:.72rem!important}</style></head>');
    html=html.replace('</body>','<script src="js/admin-v2.3.8-student-fix.js?v=2.3.9-document-fix3"><\/script><script src="js/admin-v2.3.9-document-studio.js?v=2.3.9-document-fix3"><\/script><script src="js/admin-v2.3.9-document-studio-fix1.js?v=2.3.9-document-fix3"><\/script><script src="js/admin-v2.3.9-document-studio-focus-fix2.js?v=2.3.9-document-fix3"><\/script><script src="js/admin-v2.3.9-document-runtime-fix3.js?v=2.3.9-document-fix3"><\/script></body>');
    document.open();document.write(html);document.close();
  }catch(error){document.getElementById('error').textContent='خطا در بارگذاری پنل: '+(error&&error.message?error.message:String(error))}
})();
</script>
</body>
</html>
