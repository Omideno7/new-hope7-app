<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Open New Hope 7</title>
<style>
:root{color-scheme:light dark}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:24px;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;background:#071820;color:#f7fbfd}
.card{width:min(92vw,460px);padding:26px;border-radius:24px;background:#0d2530;border:1px solid #ffffff18;text-align:center;box-shadow:0 20px 70px #0006}
img{width:88px;height:88px;border-radius:22px}.muted{color:#9db4be;line-height:1.65}.actions{display:grid;gap:10px;margin-top:18px}.btn{display:block;padding:13px 16px;border-radius:14px;text-decoration:none;font-weight:800}.ios{background:#fff;color:#111}.android{background:#2bbdc4;color:#fff}.target{font-size:.72rem;color:#9db4be;margin-top:12px;word-break:break-word}
</style>
</head><body>
<main class="card">
<img src="assets/new-hope7-logo-192.png" alt="New Hope 7">
<h1>New Hope 7</h1>
<p class="muted" id="message">Opening New Hope 7…</p>
<div class="actions">
<a class="btn ios" href="https://apps.apple.com/app/id6803187205">Open in App Store</a>
<a class="btn android" href="https://play.google.com/store/search?q=New%20Hope%207&c=apps">Open in Google Play</a>
</div>
<div class="target" id="target"></div>
</main>
<script>
(()=>{'use strict';
 const u=new URL(location.href),compact=String(u.searchParams.get('target')||''),parts=compact.split(':'),compactType=String(parts[0]||''),type=compactType||String(u.searchParams.get('type')||''),preview=u.searchParams.get('preview')==='1'||location.hostname==='raw.githack.com'||location.hostname==='rawcdn.githack.com';
 const details=type==='sermon'?'Sermon '+String(compactType==='sermon'?(parts[1]||''):(u.searchParams.get('id')||'')):type==='verse'?'Bible '+String(compactType==='verse'?(parts[1]||''):(u.searchParams.get('book')||''))+' '+String(compactType==='verse'?(parts[2]||''):(u.searchParams.get('chapter')||''))+':'+String(compactType==='verse'?(parts[3]||''):(u.searchParams.get('verse')||'')):'New Hope 7';
 document.getElementById('target').textContent=details;
 const fa=(navigator.language||'').toLowerCase().startsWith('fa'),hr=(navigator.language||'').toLowerCase().startsWith('hr');
 document.getElementById('message').textContent=fa?'اگر New Hope 7 نصب باشد، این لینک مستقیماً داخل اپ باز می‌شود. در غیر این صورت فروشگاه باز می‌شود.':hr?'Ako je New Hope 7 instaliran, poveznica se otvara izravno u aplikaciji. Inače se otvara trgovina aplikacija.':'If New Hope 7 is installed, this link opens directly in the app. Otherwise, the app store opens.';
 if(preview)return;
 const ua=navigator.userAgent||'';
 const ios=/iPhone|iPad|iPod/i.test(ua),android=/Android/i.test(ua);
 const iosStore='https://apps.apple.com/app/id6803187205',playStore='https://play.google.com/store/search?q=New%20Hope%207&c=apps';
 let scheme='';
 if(type==='sermon'){
   const id=String(compactType==='sermon'?(parts[1]||''):(u.searchParams.get('id')||''));
   if(id)scheme='newhope7://sermon/'+encodeURIComponent(id);
 }else if(type==='verse'){
   const b=String(compactType==='verse'?(parts[1]||''):(u.searchParams.get('book')||'')),c=String(compactType==='verse'?(parts[2]||''):(u.searchParams.get('chapter')||'')),v=String(compactType==='verse'?(parts[3]||''):(u.searchParams.get('verse')||''));
   if(b&&c&&v)scheme='newhope7://bible/'+encodeURIComponent(b)+'/'+encodeURIComponent(c)+'/'+encodeURIComponent(v);
 }
 let left=false;const markLeft=()=>{if(document.hidden)left=true};document.addEventListener('visibilitychange',markLeft,{once:false});window.addEventListener('pagehide',()=>{left=true},{once:true});
 if(android&&scheme){
   const target=scheme.replace(/^newhope7:\/\//,'');
   const fallback=encodeURIComponent(playStore);
   location.href='intent://'+target+'#Intent;scheme=newhope7;S.browser_fallback_url='+fallback+';end';
   return;
 }
 if(ios&&scheme){
   const frame=document.createElement('iframe');frame.hidden=true;frame.src=scheme;document.body.appendChild(frame);
   setTimeout(()=>{try{frame.remove()}catch(_){}if(!left&&!document.hidden)location.replace(iosStore)},1500);
   return;
 }
 if(ios)setTimeout(()=>location.replace(iosStore),500);
 else if(android)setTimeout(()=>location.replace(playStore),500);
})();
</script>
</body></html>
