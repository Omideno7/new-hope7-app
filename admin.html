function tr(k){return (T[lang]&&T[lang][k])||k}
function h(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function setLang(l){lang=l;localStorage.setItem('nh7_admin_lang',l);document.documentElement.lang=l;document.body.dir=l==='fa'?'rtl':'ltr';render()}
function setTab(t){activeTab=t;localStorage.setItem('nh7_admin_tab',t);render()}
function isApproved(s){return String(s||'').toLowerCase()==='approved'}
function isRejected(s){return ['rejected','denied','blocked'].includes(String(s||'').toLowerCase())}
function isPending(s){return !isApproved(s)&&!isRejected(s)&&String(s||'').toLowerCase()!=='archived'}
function pillStatus(s){const st=String(s||'pending'),k=st.toLowerCase();const cls=(isApproved(st)||['answered','completed','issued','active'].includes(k))?'approved':isRejected(st)?'rejected':'pending';return '<span class="pill '+cls+'">'+h(st)+'</span>'}
function normEmailValue(v){return String(v||'').trim().toLowerCase()}
function getType(r){return String(r?.type||normalizePayload(r?.payload).kind||'registration')}
function registrationKey(r){const email=normEmailValue(getEmail(r));return email?getType(r)+'|'+email:''}
function duplicateRows(r){const key=registrationKey(r);return key?state.registrations.filter(x=>registrationKey(x)===key):[]}
function getEffectiveStatus(r){const raw=String(r?.status||'pending').toLowerCase();if(isApproved(raw)||isRejected(raw))return raw;const siblings=duplicateRows(r);return siblings.some(x=>isApproved(x.status))?'approved':raw}
function isEffectiveApproved(r){return isApproved(getEffectiveStatus(r))}
function isEffectivePending(r){return isPending(getEffectiveStatus(r))}

function normalizePayload(p){if(!p)return{};if(typeof p==='string'){try{return JSON.parse(p)}catch(e){return{raw:p}}}return p}
function getEmail(r){const p=normalizePayload(r.payload);return p.email||r.email||r.user_email||r.author_email||''}
function getName(r){const p=normalizePayload(r.payload);return (p.fullName||p.name||((p.firstName||'')+' '+(p.lastName||'')).trim()||r.author_name||r.name||'-')}
function getPhone(r){const p=normalizePayload(r.payload);return p.phone||p.whatsapp||r.phone||''}
function getDevice(r){const p=normalizePayload(r?.payload);return r?.device_id||r?.deviceId||p.device_id||p.deviceId||p.device||''}
function getCreated(r){return r.created_at?new Date(r.created_at).toLocaleString(lang==='fa'?'fa-IR':lang==='hr'?'hr-HR':'en-US'):''}
function jwtExpiredText(t){return String(t||'').includes('PGRST303')||String(t||'').toLowerCase().includes('jwt expired')}
async function refreshAdminSession(){if(!refreshToken)return false;try{const r=await fetch(SUPABASE_URL+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{apikey:SUPABASE_KEY,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:refreshToken})});if(!r.ok)return false;const d=await r.json();token=d.access_token;refreshToken=d.refresh_token||refreshToken;localStorage.setItem('nh7_admin_token',token);localStorage.setItem('nh7_admin_refresh_token',refreshToken);return true}catch(e){return false}}
async function fetchWithTimeout(url,opt={},timeoutMs=15000){
  const controller=new AbortController();
  const timer=setTimeout(()=>controller.abort(),timeoutMs);
  try{return await fetch(url,Object.assign({},opt,{signal:controller.signal}))}
  catch(e){if(e?.name==='AbortError')throw new Error(lang==='fa'?'زمان دریافت اطلاعات تمام شد. دوباره تازه‌سازی کنید.':'Request timed out. Please refresh.');throw e}
  finally{clearTimeout(timer)}
}
async function authFetch(path,opt={}){
  const makeHeaders=()=>Object.assign({apikey:SUPABASE_KEY,Authorization:'Bearer '+(token||SUPABASE_KEY),'Content-Type':'application/json',Prefer:'return=representation'},opt.headers||{});
  let r=await fetchWithTimeout(SUPABASE_URL+path,Object.assign({},opt,{headers:makeHeaders()}));
  if(!r.ok){const txt=await r.text();if(jwtExpiredText(txt)&&await refreshAdminSession()){r=await fetchWithTimeout(SUPABASE_URL+path,Object.assign({},opt,{headers:makeHeaders()}));if(r.ok)return r.status===204?null:r.json()}if(jwtExpiredText(txt)){logout();alert(lang==='fa'?'نشست ادمین منقضی شد. دوباره وارد شوید.':'Admin session expired. Sign in again.')}throw new Error(txt)}
  return r.status===204?null:r.json();
}
async function adminRpc(name,payload={}){return authFetch('/rest/v1/rpc/'+name,{method:'POST',body:JSON.stringify(payload)})}

}

}

async function loadAll(silent=false){
  if(!token||adminLoadInFlight)return;
  adminLoadInFlight=true;
  state.loading=true;
  if(!silent)render();
  try{
    const critical=await Promise.allSettled([
      loadRegistrationFeed(),
      authFetch('/rest/v1/qa_questions?select=*&order=created_at.desc&limit=500'),
      authFetch('/rest/v1/meeting_settings?select=*&id=eq.active&limit=1')
    ]);
    const [registrations,questions,meeting]=critical;
    if(registrations.status==='fulfilled')state.registrations=registrations.value||[];
    if(questions.status==='fulfilled')state.questions=questions.value||[];
    if(meeting.status==='fulfilled')state.meeting=(meeting.value||[])[0]||{};
    state.lastError=critical.filter(x=>x.status==='rejected').map(x=>String(x.reason?.message||x.reason||'')).join('\n');
    state.loading=false;
    lastLoadedAt=new Date().toISOString();
    notifyIfNew();
    render(false);

    const secondary=await Promise.allSettled([
      authFetch('/rest/v1/notification_inbox?select=*&order=delivered_at.desc&limit=100'),
      authFetch('/rest/v1/sermon_categories?select=*&order=sort_order.asc,created_at.desc'),
      authFetch('/rest/v1/sermons?select=*&order=sort_order.asc,published_at.desc'),
      authFetch('/rest/v1/notification_schedules?select=*&order=sort_order.asc'),
      authFetch('/rest/v1/daily_content?select=*&order=content_type.asc,day_number.asc'),

function findRegistrationForQuestion(q){const qp=normalizePayload(q.payload);const qEmail=String(q.author_email||q.email||q.user_email||qp.author_email||qp.email||qp.user_email||'').trim().toLowerCase();const qDevice=String(q.device_id||q.deviceId||qp.device_id||qp.deviceId||'').trim();if(qEmail){const byEmail=state.registrations.find(r=>String(getEmail(r)||'').trim().toLowerCase()===qEmail);if(byEmail)return byEmail;}if(qDevice){const byDevice=state.registrations.find(r=>String(r.device_id||normalizePayload(r.payload).device_id||'').trim()===qDevice);if(byDevice)return byDevice;}return null}

function dcVal(o,path){try{return path.split('.').reduce((x,k)=>x?.[k],o)||''}catch(e){return''}}
function dailyImportText(){return lang==='fa'?{title:'ورود و خروج گروهی ۳۶۵ روز',help:'برای هر زبان یک فایل JSON، TXT یا CSV انتخاب کن. ابتدا پیش‌نمایش بگیر؛ سپس اطلاعات روزها در Supabase ذخیره می‌شود.',fa:'فایل فارسی',en:'فایل انگلیسی',hr:'فایل کرواتی',preview:'پیش‌نمایش فایل‌ها',import:'ذخیره در Supabase',merge:'ترکیب و به‌روزرسانی (پیشنهادی)',replace:'جایگزینی کامل این بخش',json:'خروجی JSON سه‌زبانه',txt:'خروجی TXT',template:'دانلود نمونه فایل',days:'تعداد روزهای شناسایی‌شده',missing:'روزهای پیدا نشده',invalid:'ردیف‌های نامعتبر',ready:'آماده ذخیره',confirmReplace:'در حالت جایگزینی، همه روزهای فعلی این بخش حذف و فایل جدید ذخیره می‌شود. ادامه می‌دهی؟',done:'ورود گروهی با موفقیت انجام شد.',select:'حداقل یک فایل انتخاب کن.',busy:'در حال ذخیره...',format:'قالب‌های مطمئن: JSON، TXT و CSV. برای PDF یا DOCX ابتدا متن را به TXT یا JSON تبدیل کن.'}:{title:'Bulk import / export 365 days',help:'Choose one JSON, TXT, or CSV file per language. Preview first, then save to Supabase.',fa:'Persian file',en:'English file',hr:'Croatian file',preview:'Preview files',import:'Save to Supabase',merge:'Merge and update (recommended)',replace:'Replace this content type',json:'Export multilingual JSON',txt:'Export TXT',template:'Download template',days:'Detected days',missing:'Missing days',invalid:'Invalid rows',ready:'Ready to import',confirmReplace:'Replace mode deletes all current days for this content type before importing. Continue?',done:'Bulk import completed.',select:'Choose at least one file.',busy:'Saving...',format:'Reliable formats: JSON, TXT, and CSV. Convert PDF or DOCX to TXT or JSON first.'}}
function renderDailyBulkTools(type){const z=dailyImportText();const pv=dailyImportPreview;let preview='';if(pv){const langs=['fa','en','hr'].filter(l=>pv.byLang[l]);const allDays=[...new Set(langs.flatMap(l=>Object.keys(pv.byLang[l]).map(Number)))].sort((a,b)=>a-b);const missing=[];for(let i=1;i<=365;i++)if(!langs.some(l=>pv.byLang[l][i]))missing.push(i);preview='<div class="preview-box"><div class="'+(pv.errors.length?'preview-warn':'preview-good')+'"><b>'+z.days+': '+allDays.length+'</b> · '+z.invalid+': '+pv.errors.length+'</div>'+(missing.length?'<div class="preview-warn">'+z.missing+': '+missing.slice(0,40).join(', ')+(missing.length>40?' …':'')+'</div>':'<div class="preview-good">'+z.ready+'</div>')+(pv.errors.length?'<div class="preview-bad">'+pv.errors.slice(0,8).map(h).join('<br>')+'</div>':'')+'<table class="mini-table"><thead><tr><th>Day</th><th>FA</th><th>EN</th><th>HR</th></tr></thead><tbody>'+allDays.slice(0,12).map(day=>'<tr><td>'+day+'</td>'+['fa','en','hr'].map(l=>'<td>'+(pv.byLang[l]?.[day]?'✓':'—')+'</td>').join('')+'</tr>').join('')+'</tbody></table></div>'}return '<div class="import-box"><h4>📥 '+z.title+'</h4><p class="muted small">'+z.help+'</p><p class="notice">'+z.format+'</p><div class="grid2"><select id="dc_import_mode"><option value="merge">'+z.merge+'</option><option value="replace">'+z.replace+'</option></select><div class="actions three"><button class="btn ghost" onclick="downloadDailyTemplate()">'+z.template+'</button><button class="btn secondary" onclick="exportDailyContentJSON()">'+z.json+'</button><button class="btn secondary" onclick="exportDailyContentTXT()">'+z.txt+'</button></div></div>'+[['fa',z.fa],['en',z.en],['hr',z.hr]].map(([l,label])=>'<label class="file-row"><b>'+label+'</b><input id="dc_file_'+l+'" type="file" accept=".json,.txt,.csv,text/plain,application/json,text/csv"></label>').join('')+'<div class="actions"><button class="btn secondary" onclick="previewDailyImport()" '+(dailyImportBusy?'disabled':'')+'>'+z.preview+'</button><button class="btn primary" onclick="commitDailyImport()" '+(!pv||dailyImportBusy?'disabled':'')+'>'+(dailyImportBusy?z.busy:z.import)+'</button></div><div class="progress-line"><span id="dc_import_progress"></span></div>'+preview+'</div>'}
function normalizeDigits(v){return String(v??'').replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d))}
function cleanImportValue(v){return String(v??'').trim()}
function parseJsonDaily(text){let d=JSON.parse(text);if(Array.isArray(d))return d;if(Array.isArray(d.days))return d.days;if(Array.isArray(d.items))return d.items;const vals=Object.entries(d).filter(([k,v])=>/^\d+$/.test(k)&&v&&typeof v==='object').map(([k,v])=>Object.assign({day:Number(k)},v));if(vals.length)return vals;throw new Error('JSON: days/items array not found')}
function parseCsvLine(line){const out=[];let cur='',q=false;for(let i=0;i<line.length;i++){const c=line[i];if(c==='"'){if(q&&line[i+1]==='"'){cur+='"';i++}else q=!q}else if(c===','&&!q){out.push(cur);cur=''}else cur+=c}out.push(cur);return out}
function parseCsvDaily(text){const lines=text.replace(/^\uFEFF/,'').split(/\r?\n/).filter(x=>x.trim());if(lines.length<2)throw new Error('CSV: empty');const heads=parseCsvLine(lines[0]).map(x=>x.trim().toLowerCase());return lines.slice(1).map(line=>{const vals=parseCsvLine(line),o={};heads.forEach((k,i)=>o[k]=vals[i]??'');return {day:Number(normalizeDigits(o.day||o.day_number)),title:o.title||o.heading||'',mainVerse:{reference:o.reference||o.verse_reference||'',text:o.verse||o.verse_text||''},message:o.message||o.proclamation||'',prayer:o.prayer||o.action||o.action_step||''}}).filter(x=>x.day)}
function parseTxtDaily(text){const normalized=normalizeDigits(text).replace(/\r/g,'');const re=/^(?:day|روز|dan)\s*[:#-]?\s*(\d{1,3})\b/im;const starts=[];const lines=normalized.split('\n');let pos=0;for(const line of lines){const m=line.match(re);if(m)starts.push({day:Number(m[1]),pos});pos+=line.length+1}if(!starts.length)throw new Error('TXT: Day 1 / روز ۱ / Dan 1 not found');const rows=[];for(let i=0;i<starts.length;i++){const block=normalized.slice(starts[i].pos,starts[i+1]?.pos??normalized.length);const fields={body:[]};let current='body';for(const ln of block.split('\n').slice(1)){const m=ln.match(/^\s*(title|عنوان|naslov|reference|مرجع|آیه|verse|stih|message|پیام|proclamation|اعلان|prayer|دعا|action(?: step)?|قدم عملی|korak)\s*[:：]\s*(.*)$/i);if(m){current=m[1].toLowerCase();fields[current]=[m[2]]}else{(fields[current]||(fields[current]=[])).push(ln)}}const pick=keys=>{for(const k of Object.keys(fields))if(keys.some(x=>k.includes(x)))return cleanImportValue(fields[k].join('\n'));return''};rows.push({day:starts[i].day,title:pick(['title','عنوان','naslov']),mainVerse:{reference:pick(['reference','مرجع']),text:pick(['verse','آیه','stih'])},message:pick(['message','پیام']),proclamation:pick(['proclamation','اعلان']),prayer:pick(['prayer','دعا']),actionStep:pick(['action','قدم عملی','korak']),body:cleanImportValue(fields.body.join('\n'))})}return rows}
async function readDailyImportFile(file){const text=await file.text(),n=(file.name||'').toLowerCase();if(n.endsWith('.json'))return parseJsonDaily(text);if(n.endsWith('.csv'))return parseCsvDaily(text);return parseTxtDaily(text)}
function itemLangValue(v,l){if(v==null)return'';if(typeof v==='string'||typeof v==='number')return String(v);if(typeof v==='object')return v[l]??v.text?.[l]??v.value??'';return''}
function singleLangContent(raw,l,type,day){const x=raw&&typeof raw==='object'?raw:{},mainKey=type==='faith'?'proclamation':'message',extraKey=type==='daily_juice'?'actionStep':'prayer';const mv=x.mainVerse||x.verse||{};return {day,title:itemLangValue(x.title??x.heading,l),reference:cleanImportValue(mv.reference??x.reference??''),verse:itemLangValue(mv.text??x.verseText??(typeof x.verse==='string'?x.verse:''),l),body:itemLangValue(x[mainKey]??x.message??x.proclamation??x.body,l),extra:itemLangValue(x[extraKey]??x.prayer??x.actionStep??x.action,l)}}
async function previewDailyImport(){const z=dailyImportText(),type=document.getElementById('dc_type').value,byLang={},errors=[];for(const l of ['fa','en','hr']){const f=document.getElementById('dc_file_'+l)?.files?.[0];if(!f)continue;try{const rows=await readDailyImportFile(f);byLang[l]={};rows.forEach((r,i)=>{const day=Number(normalizeDigits(r.day||r.day_number||i+1));if(!Number.isInteger(day)||day<1||day>365){errors.push(l.toUpperCase()+': invalid day '+(r.day??i+1));return}byLang[l][day]=singleLangContent(r,l,type,day)})}catch(e){errors.push(l.toUpperCase()+': '+e.message)}}if(!Object.keys(byLang).length){alert(z.select);return}dailyImportPreview={type,byLang,errors};render()}
function mergeDailyImportRecord(type,day,byLang,existing){const d=JSON.parse(JSON.stringify(existing?.content_data||{}));d.day=day;d.title=d.title||{};d.mainVerse=d.mainVerse||{};d.mainVerse.text=d.mainVerse.text||{};const mainKey=type==='faith'?'proclamation':'message',extraKey=type==='daily_juice'?'actionStep':'prayer';d[mainKey]=d[mainKey]||{};d[extraKey]=d[extraKey]||{};for(const l of ['fa','en','hr']){const v=byLang[l]?.[day];if(!v)continue;if(v.title)d.title[l]=v.title;if(v.reference)d.mainVerse.reference=v.reference;if(v.verse)d.mainVerse.text[l]=v.verse;if(v.body)d[mainKey][l]=v.body;if(v.extra)d[extraKey][l]=v.extra}return d}
async function commitDailyImport(){if(!dailyImportPreview||dailyImportBusy)return;const z=dailyImportText(),mode=document.getElementById('dc_import_mode').value,type=dailyImportPreview.type;if(mode==='replace'&&!confirm(z.confirmReplace))return;dailyImportBusy=true;render();try{if(mode==='replace')await authFetch('/rest/v1/daily_content?content_type=eq.'+encodeURIComponent(type),{method:'DELETE'});const days=[...new Set(Object.values(dailyImportPreview.byLang).flatMap(m=>Object.keys(m).map(Number)))].sort((a,b)=>a-b);const rows=days.map(day=>{const existing=state.dailyContent.find(x=>x.content_type===type&&Number(x.day_number)===day);return {content_type:type,day_number:day,content_data:mergeDailyImportRecord(type,day,dailyImportPreview.byLang,existing),is_active:existing?.is_active!==false,sort_order:day,updated_at:new Date().toISOString()}});for(let i=0;i<rows.length;i+=40){await authFetch('/rest/v1/daily_content?on_conflict=content_type,day_number',{method:'POST',headers:{Prefer:'resolution=merge-duplicates,return=minimal'},body:JSON.stringify(rows.slice(i,i+40))})}dailyImportPreview=null;alert(z.done);await loadAll(true)}catch(e){alert(e.message)}finally{dailyImportBusy=false;render()}}
function downloadBlob(name,text,type='application/json'){const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([text],{type}));a.download=name;document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},500)}

function exportDailyContentTXT(){const type=document.getElementById('dc_type').value,mainKey=type==='faith'?'proclamation':'message',extraKey=type==='daily_juice'?'actionStep':'prayer';for(const l of ['fa','en','hr']){const text=state.dailyContent.filter(x=>x.content_type===type).sort((a,b)=>a.day_number-b.day_number).map(x=>{const d=x.content_data||{};return 'Day '+x.day_number+'\n'+txtField('Title',dcVal(d,'title.'+l))+txtField('Reference',dcVal(d,'mainVerse.reference'))+txtField('Verse',dcVal(d,'mainVerse.text.'+l))+txtField(mainKey==='proclamation'?'Proclamation':'Message',dcVal(d,mainKey+'.'+l))+txtField(extraKey==='actionStep'?'Action Step':'Prayer',dcVal(d,extraKey+'.'+l))}).join('\n---\n\n');downloadBlob(type+'_365_'+l+'.txt',text,'text/plain;charset=utf-8')}}

function studentCourseSummary(email,courseCode){email=studentEmail(email);const lessons=state.schoolLessons.filter(l=>l.is_active!==false&&schoolCourseCode(l)===courseCode).sort((a,b)=>Number(a.lesson_order||999)-Number(b.lesson_order||999));const lessonCodes=new Set(lessons.map(l=>String(l.lesson_code||'')));const progress=state.schoolProgress.filter(p=>studentEmail(p.user_email)===email&&lessonCodes.has(String(p.lesson_code||'')));const pMap=new Map(progress.map(p=>[String(p.lesson_code||''),p]));const completed=lessons.filter(l=>{const p=pMap.get(String(l.lesson_code||''));return !!p?.completed_at||Number(p?.progress_percent||0)>=100}).length;const expected=lessons.filter(schoolLessonHasAssignment);const assignments=state.schoolAssignments.filter(a=>studentEmail(a.user_email)===email&&String(a.course_code||'foundation_school')===courseCode);const aMap=new Map(assignments.map(a=>[String(a.lesson_code||''),a]));const submitted=expected.filter(l=>aMap.has(String(l.lesson_code||''))).length;const approved=expected.filter(l=>String(aMap.get(String(l.lesson_code||''))?.status||'')==='approved').length;const revision=expected.filter(l=>String(aMap.get(String(l.lesson_code||''))?.status||'')==='needs_revision').length;const pending=expected.filter(l=>String(aMap.get(String(l.lesson_code||''))?.status||'')==='submitted').length;const scores=expected.map(l=>aMap.get(String(l.lesson_code||''))).filter(Boolean).map(a=>Number(a.score_percent||0));const assignmentAverage=scores.length?Math.round(scores.reduce((a,b)=>a+b,0)/scores.length):0;const attempts=state.schoolAttempts.filter(a=>studentEmail(a.user_email)===email&&(String(a.course_code||'')===courseCode||String(a.lesson_code||'')==='course:'+courseCode)).sort((a,b)=>String(b.submitted_at||'').localeCompare(String(a.submitted_at||'')));const passed=attempts.some(a=>a.passed===true);const latest=attempts[0]||null;const best=attempts.length?Math.max(...attempts.map(a=>Number(a.final_score_percent??a.score_percent??0))):0;const certificate=state.schoolCertificates.filter(c=>studentEmail(c.user_email)===email&&String(c.course_code||'foundation_school')===courseCode).sort((a,b)=>String(b.updated_at||'').localeCompare(String(a.updated_at||'')))[0]||null;const ready=lessons.length>0&&completed===lessons.length&&submitted===expected.length;let key='not_started';if(passed)key='passed';else if(attempts.length)key='attempted';else if(ready)key='ready';else if(completed||submitted)key='in_progress';return{courseCode,lessons,pMap,completed,expected,aMap,submitted,approved,revision,pending,assignmentAverage,attempts,passed,latest,best,certificate,ready,key}}
function studentMainSummary(student){const courses=(state.schoolCourses.length?state.schoolCourses:[{course_code:'foundation_school',title_fa:'مدرسه بنیادی مسیحی',title_en:'Foundation School',title_hr:'Škola temelja',is_active:true}]).filter(c=>c.is_active!==false).map(c=>studentCourseSummary(student.email,c.course_code));const primary=courses.find(c=>c.courseCode==='foundation_school')||courses[0]||studentCourseSummary(student.email,'foundation_school');return{courses,primary}}
function studentStatusLabel(key){if(lang==='fa')return{passed:'قبول شده',attempted:'آزمون داده',ready:'آماده آزمون',in_progress:'در حال یادگیری',not_started:'شروع نکرده'}[key]||key;if(lang==='hr')return{passed:'Položio/la',attempted:'Pristupio/la ispitu',ready:'Spreman/na za ispit',in_progress:'U tijeku',not_started:'Nije započeo/la'}[key]||key;return{passed:'Passed',attempted:'Exam attempted',ready:'Ready for exam',in_progress:'In progress',not_started:'Not started'}[key]||key}

function certificateStatusLabel(c){if(!c)return lang==='fa'?'صادر نشده':lang==='hr'?'Nije izdano':'Not issued';const st=String(c.status||'draft');if(lang==='fa')return st==='approved'?'صادر شده':st==='revoked'?'لغو شده':'در انتظار صدور';if(lang==='hr')return st==='approved'?'Izdano':st==='revoked'?'Poništeno':'Čeka izdavanje';return st==='approved'?'Issued':st==='revoked'?'Revoked':'Pending issue'}
function studentPassesFilter(student,sum){const p=sum.primary,key=p.key;if(studentFilter==='all')return true;if(studentFilter==='approved')return studentRegistrationStatus(student.registration)==='approved';if(studentFilter==='no_activity')return key==='not_started';if(studentFilter==='in_progress')return key==='in_progress';if(studentFilter==='missing_assignments')return p.expected.length>p.submitted;if(studentFilter==='ready')return key==='ready';if(studentFilter==='attempted')return key==='attempted';if(studentFilter==='passed')return key==='passed';return true}

function renderStudentCourseDashboard(student,c){const course=state.schoolCourses.find(x=>x.course_code===c.courseCode)||{course_code:c.courseCode,title_fa:c.courseCode,title_en:c.courseCode,title_hr:c.courseCode};const lessonRows=c.lessons.map(l=>{const code=String(l.lesson_code||''),p=c.pMap.get(code),done=!!p?.completed_at||Number(p?.progress_percent||0)>=100,expected=schoolLessonHasAssignment(l),a=c.aMap.get(code),as=expected?(a?String(a.status||'submitted'):'missing'):'none';const asLabel=as==='approved'?(lang==='fa'?'تأیید شده':'Approved'):as==='submitted'?(lang==='fa'?'در انتظار بررسی':'Pending review'):as==='needs_revision'?(lang==='fa'?'نیاز به اصلاح':'Needs revision'):as==='missing'?(lang==='fa'?'انجام نشده':'Missing'):(lang==='fa'?'ندارد':'None');return `<tr><td>${h(schoolLessonTitle(l))}<br><small>${h(code)}</small></td><td class="${done?'':'red-label'}">${done?'✅ '+(lang==='fa'?'تکمیل':'Completed'):'○ '+(lang==='fa'?'تکمیل نشده':'Not completed')}</td><td class="${['missing','needs_revision'].includes(as)?'red-label':''}">${h(asLabel)}${a?`<br><small>${Number(a.score_percent||0)}%</small>`:''}</td><td>${p?.updated_at?h(new Date(p.updated_at).toLocaleDateString()):'-'}</td></tr>`}).join('');const attemptRows=c.attempts.map(a=>`<tr><td>#${h(a.attempt_number||1)}</td><td>${h(a.objective_score_percent??a.score_percent??0)}%</td><td>${h(a.assignment_score_percent??0)}%</td><td><strong>${h(a.final_score_percent??a.score_percent??0)}%</strong></td><td class="${a.passed?'':'red-label'}">${a.passed?'✅ '+(lang==='fa'?'قبول':'Passed'):'↻ '+(lang==='fa'?'نیاز به مرور':'Review')}</td><td>${a.duration_seconds!=null?formatDurationClock(a.duration_seconds):'-'}</td><td>${a.submitted_at?h(new Date(a.submitted_at).toLocaleString()):'-'}</td></tr>`).join('');return `<section class="course-dashboard"><h3>${h(courseTitle(course))}</h3><div class="exam-results-grid"><div class="stat"><b>${c.completed}/${c.lessons.length}</b><span>${lang==='fa'?'درس‌ها':'Lessons'}</span></div> async function issueCertificate(){const entry=certificateSelected();if(!entry){alert(lang==='fa'?'ابتدا باید دانشجوی قبول‌شده‌ای وجود داشته باشد.':'No passed student is available.');return}const student=entry.student,course=entry.sum.primary.courseCode||'foundation_school',existing=state.schoolCertificates.find(c=>studentEmail(c.user_email)===student.email&&String(c.course_code)===course);if(!confirm(lang==='fa'?'مدرک این دانشجو با تأیید ادمین صادر شود؟':'Approve and issue this certificate?'))return;try{if(existing){await authFetch('/rest/v1/school_certificates?id=eq.'+encodeURIComponent(existing.id),{method:'PATCH',body:JSON.stringify({user_name:student.name,status:'approved',language:certificateLanguage,final_score_percent:entry.sum.primary.best,approved_by:'Apostle Yuhana',approved_at:new Date().toISOString(),revoked_at:null,updated_at:new Date().toISOString()})})}else{try{await adminRpc('nh7_admin_issue_school_certificate',{p_user_email:student.email,p_user_name:student.name,p_course_code:course,p_language:certificateLanguage,p_final_score:entry.sum.primary.best,p_approved_by:'Apostle Yuhana'})}catch(e){await authFetch('/rest/v1/school_certificates',{method:'POST',body:JSON.stringify({user_email:student.email,user_name:student.name,course_code:course,status:'approved',language:certificateLanguage,certificate_number:'NH7-FS-'+new Date().getFullYear()+'-'+String(Date.now()).slice(-6),final_score_percent:entry.sum.primary.best,approved_by:'Apostle Yuhana',approved_at:new Date().toISOString(),updated_at:new Date().toISOString()})})}}await loadAll(true);alert(lang==='fa'?'مدرک صادر شد.':'Certificate issued.')}catch(e){alert(e.message)}}
