<!doctype html><html lang="fa"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>OmideNo7 Admin</title><link rel="stylesheet" href="css/styles.css"><style>.admin-wrap{max-width:980px;margin:0 auto;padding:18px}.admin-hero{background:linear-gradient(135deg,#1167b1,#1dbf73);color:white}.admin-hero h1{margin:0 0 10px}.table-wrap{overflow:auto}table{width:100%;border-collapse:collapse}th,td{border-bottom:1px solid #d7edf7;padding:10px;text-align:start;vertical-align:top}input,textarea,select{width:100%;box-sizing:border-box;margin:6px 0;padding:12px;border:1px solid #cae4ef;border-radius:14px;background:#fff}textarea{min-height:90px}.row{display:grid;grid-template-columns:1fr 1fr;gap:12px}.actions{display:flex;gap:8px;flex-wrap:wrap}.muted{opacity:.75}.success{color:#08783d;font-weight:700}@media(max-width:700px){.row{grid-template-columns:1fr}}</style></head><body><main id="adminApp" class="admin-wrap"></main><script>
const SUPABASE_URL='https://gpzcwffxnddhaeaogdyo.supabase.co';
const SUPABASE_KEY='sb_publishable_v3xXEaJ5Fml7-te1mI4-0g_7R86oM37';
let lang=localStorage.getItem('nh7_admin_lang')||'fa';
let token=localStorage.getItem('nh7_admin_token')||'';
const T={
 fa:{title:'پنل مدیریت امیدنو۷',login:'ورود مدیر',email:'ایمیل',password:'رمز عبور',signIn:'ورود',logout:'خروج',refresh:'تازه‌سازی',users:'درخواست‌های کاربران',questions:'پرسش و پاسخ',settings:'تنظیمات جلسه کلیسا',empty:'هنوز اطلاعاتی دریافت نشده است.',type:'نوع',name:'نام',contact:'تماس',language:'زبان',status:'وضعیت',actions:'عملیات',approve:'تأیید',reject:'رد',question:'پرسش',answer:'پاسخ',saveAnswer:'ذخیره پاسخ',saveSettings:'ذخیره اطلاعات جلسه',provider:'ارائه‌دهنده',meetingUrl:'لینک جلسه',phone:'شماره تماس',accessCode:'کد دسترسی',securityCode:'کد امنیتی',extraInfo:'توضیح جلسه / زمان جلسه دعا',saved:'ذخیره شد',noQuestions:'هنوز پرسشی ثبت نشده است.',setup:'ابتدا فایل SQL نسخه جدید را در Supabase SQL Editor اجرا کن.',approvedMsg:'درخواست تأیید شد.',rejectedMsg:'درخواست رد شد.',saving:'در حال ذخیره...',details:'جزئیات'},
 en:{title:'OmideNo7 Admin Panel',login:'Admin Login',email:'Email',password:'Password',signIn:'Sign in',logout:'Logout',refresh:'Refresh',users:'User Requests',questions:'Questions & Answers',settings:'Church Meeting Settings',empty:'No data received yet.',type:'Type',name:'Name',contact:'Contact',language:'Language',status:'Status',actions:'Actions',approve:'Approve',reject:'Reject',question:'Question',answer:'Answer',saveAnswer:'Save answer',saveSettings:'Save meeting details',provider:'Provider',meetingUrl:'Meeting link',phone:'Phone number',accessCode:'Access code',securityCode:'Security code',extraInfo:'Meeting note / prayer time',saved:'Saved',noQuestions:'No questions yet.',setup:'First run the latest SQL file in Supabase SQL Editor.',approvedMsg:'Request approved.',rejectedMsg:'Request rejected.',saving:'Saving...',details:'Details'},
 hr:{title:'Administracija OmideNo7',login:'Prijava administratora',email:'Email',password:'Lozinka',signIn:'Prijava',logout:'Odjava',refresh:'Osvježi',users:'Zahtjevi korisnika',questions:'Pitanja i odgovori',settings:'Postavke crkvenog sastanka',empty:'Još nema podataka.',type:'Vrsta',name:'Ime',contact:'Kontakt',language:'Jezik',status:'Status',actions:'Radnje',approve:'Odobri',reject:'Odbij',question:'Pitanje',answer:'Odgovor',saveAnswer:'Spremi odgovor',saveSettings:'Spremi podatke sastanka',provider:'Pružatelj',meetingUrl:'Link sastanka',phone:'Telefonski broj',accessCode:'Pristupni kod',securityCode:'Sigurnosni kod',extraInfo:'Napomena / vrijeme molitve',saved:'Spremljeno',noQuestions:'Još nema pitanja.',setup:'Najprije pokrenite najnoviju SQL datoteku u Supabase SQL Editoru.',approvedMsg:'Zahtjev odobren.',rejectedMsg:'Zahtjev odbijen.',saving:'Spremanje...',details:'Detalji'}
};
function tr(k){return T[lang][k]||k} function h(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function setLang(l){lang=l;localStorage.setItem('nh7_admin_lang',l);document.documentElement.lang=l;document.body.dir=l==='fa'?'rtl':'ltr';render();}
async function authFetch(path,opt={}){const headers=Object.assign({'apikey':SUPABASE_KEY,'Authorization':'Bearer '+(token||SUPABASE_KEY),'Content-Type':'application/json','Prefer':'return=representation'},opt.headers||{});const r=await fetch(SUPABASE_URL+path,Object.assign({},opt,{headers}));if(!r.ok) throw new Error(await r.text());return r.status===204?null:r.json();}
async function signIn(){const email=document.getElementById('email').value.trim();const password=document.getElementById('password').value;const r=await fetch(SUPABASE_URL+'/auth/v1/token?grant_type=password',{method:'POST',headers:{'apikey':SUPABASE_KEY,'Content-Type':'application/json'},body:JSON.stringify({email,password})});if(!r.ok){alert(await r.text());return;}const data=await r.json();token=data.access_token;localStorage.setItem('nh7_admin_token',token);render();}
async function updateStatus(id,status){const msg=document.getElementById('adminMsg');try{if(msg)msg.textContent=tr('saving'); await authFetch('/rest/v1/registrations?id=eq.'+encodeURIComponent(id),{method:'PATCH',headers:{'Prefer':'return=representation'},body:JSON.stringify({status,updated_at:new Date().toISOString()})}); if(msg)msg.innerHTML='<span class="success">'+(status==='approved'?tr('approvedMsg'):tr('rejectedMsg'))+'</span>'; await loadRows();}catch(e){if(msg)msg.innerHTML='<span style="color:#b00020">'+h(e.message)+'</span>'; alert(e.message);}}

function formatPayload(p){
 const keys=['firstName','lastName','email','phone','birthDate','city','country','spiritualAge','churchMember','churchName','pastorName','waterBaptism','salvationPrayer','eventsInterest','howFound','testimony','submittedAt'];
 return keys.filter(k=>p && p[k]).map(k=>'<div><strong>'+h(k)+':</strong> '+h(p[k])+'</div>').join('');
}
async function loadRows(){const box=document.getElementById('rows');if(!box)return;box.innerHTML='<p>...</p>';try{const rows=await authFetch('/rest/v1/registrations?select=*&order=created_at.desc&limit=300');if(!rows.length){box.innerHTML='<p class="muted">'+tr('empty')+'</p>';return;}box.innerHTML='<div class="table-wrap"><table><thead><tr><th>'+tr('type')+'</th><th>'+tr('name')+'</th><th>'+tr('contact')+'</th><th>'+tr('language')+'</th><th>'+tr('status')+'</th><th>'+tr('actions')+'</th></tr></thead><tbody>'+rows.map(r=>{const p=r.payload||{};return '<tr><td>'+h(r.type)+'</td><td>'+h((p.firstName||'')+' '+(p.lastName||''))+'</td><td>'+h((p.email||'')+' '+(p.phone||''))+'</td><td>'+h(r.language||'')+'</td><td>'+h(r.status||'')+'</td><td><div class="actions"><button onclick="updateStatus(\''+r.id+'\',\'approved\')">'+tr('approve')+'</button><button onclick="updateStatus(\''+r.id+'\',\'rejected\')">'+tr('reject')+'</button></div></td></tr><tr><td colspan="6"><details><summary>'+tr('details')+'</summary><div class="payload-details">'+formatPayload(p)+'</div></details></td></tr>'}).join('')+'</tbody></table></div>'}catch(e){box.innerHTML='<div class="notice">'+h(e.message)+'<br>'+tr('setup')+'</div>';}}
async function answerQuestion(id){const el=document.getElementById('answer_'+id);const answer=(el?.value||'').trim();if(!answer){alert(tr('answer'));return;}await authFetch('/rest/v1/qa_questions?id=eq.'+encodeURIComponent(id),{method:'PATCH',body:JSON.stringify({answer_text:answer,status:'answered',answered_at:new Date().toISOString(),updated_at:new Date().toISOString()})});loadQaRows();}
async function loadQaRows(){const box=document.getElementById('qaRows');if(!box)return;box.innerHTML='<p>...</p>';try{const rows=await authFetch('/rest/v1/qa_questions?select=*&order=created_at.desc&limit=300');if(!rows.length){box.innerHTML='<p class="muted">'+tr('noQuestions')+'</p>';return;}box.innerHTML='<div class="list">'+rows.map(r=>'<div class="card"><p><strong>'+tr('question')+':</strong> '+h(r.question_text)+'</p><p><strong>'+tr('name')+':</strong> '+h(r.author_name||'-')+'<br><strong>'+tr('email')+':</strong> '+h(r.author_email||'-')+'</p><p class="muted">'+h(r.language||'')+' · '+h(r.status||'')+'</p><textarea id="answer_'+r.id+'" placeholder="'+tr('answer')+'">'+h(r.answer_text||'')+'</textarea><button onclick="answerQuestion(\''+r.id+'\')">'+tr('saveAnswer')+'</button></div>').join('')+'</div>'}catch(e){box.innerHTML='<div class="notice">'+h(e.message)+'<br>'+tr('setup')+'</div>';}}
async function loadMeetingSettings(){try{const rows=await authFetch('/rest/v1/meeting_settings?select=*&id=eq.active&limit=1');const s=(rows&&rows[0])||{};['provider','meeting_url','security_code','extra_info'].forEach(k=>{const el=document.getElementById('ms_'+k);if(el)el.value=s[k]||''});if(!document.getElementById('ms_extra_info').value){document.getElementById('ms_extra_info').value=lang==='fa'?'جلسه دعا هر روز ساعت ۵ صبح به وقت کرواسی برگزار می‌شود. برای ورود، روی لینک جلسه بزنید و فقط کد امنیتی را وارد کنید.':lang==='hr'?'Molitveni sastanak održava se svaki dan u 05:00 po hrvatskom vremenu. Za ulazak otvorite poveznicu i unesite samo sigurnosni kod.':'Prayer meeting is held daily at 05:00 Croatia time. To join, open the meeting link and enter only the security code.';}}catch(e){document.getElementById('meetingMsg').innerHTML='<span class="muted">'+h(e.message)+'<br>'+tr('setup')+'</span>';}}
async function saveMeetingSettings(){const payload={id:'active',provider:val('provider')||'FreeConferenceCall',meeting_url:val('meeting_url'),phone_number:'',access_code:'',security_code:val('security_code'),extra_info:val('extra_info'),updated_at:new Date().toISOString()};await authFetch('/rest/v1/meeting_settings?on_conflict=id',{method:'POST',headers:{'Prefer':'resolution=merge-duplicates,return=representation'},body:JSON.stringify(payload)});document.getElementById('meetingMsg').innerHTML='<span class="success">'+tr('saved')+'</span>';}
function val(k){return (document.getElementById('ms_'+k)?.value||'').trim()}
function renderMeetingSettings(){return '<section class="card"><h2>'+tr('settings')+'</h2><p class="muted">'+(lang==='fa'?'فقط لینک جلسه و کد امنیتی برای کاربران تأییدشده نمایش داده می‌شود. شماره تماس و کد دسترسی نمایش داده نمی‌شود.':lang==='hr'?'Korisnicima se prikazuju samo poveznica sastanka i sigurnosni kod. Telefonski broj i pristupni kod se ne prikazuju.':'Only meeting link and security code are shown to approved users. Phone number and access code are not shown.')+'</p><div class="row"><input id="ms_provider" placeholder="'+tr('provider')+'"><input id="ms_meeting_url" placeholder="'+tr('meetingUrl')+'"></div><div class="row"><input id="ms_security_code" placeholder="'+tr('securityCode')+'"><textarea id="ms_extra_info" placeholder="'+tr('extraInfo')+'"></textarea></div><div class="actions"><button class="primary-btn" onclick="saveMeetingSettings()">'+tr('saveSettings')+'</button></div><p id="meetingMsg" class="muted"></p></section>'}
function render(){document.getElementById('adminApp').innerHTML='<section class="card admin-hero"><h1>'+tr('title')+'</h1><select onchange="setLang(this.value)"><option value="fa" '+(lang==='fa'?'selected':'')+'>فارسی</option><option value="en" '+(lang==='en'?'selected':'')+'>English</option><option value="hr" '+(lang==='hr'?'selected':'')+'>Hrvatski</option></select></section>'+(!token?'<section class="card"><h2>'+tr('login')+'</h2><input id="email" placeholder="'+tr('email')+'" value="omideno7church@gmail.com"><input id="password" type="password" placeholder="'+tr('password')+'"><button class="primary-btn" onclick="signIn()">'+tr('signIn')+'</button><p class="muted">'+tr('setup')+'</p></section>':'<section class="card"><div class="actions"><button class="secondary-btn" onclick="localStorage.removeItem(\'nh7_admin_token\');token=\'\';render()">'+tr('logout')+'</button><button class="primary-btn" onclick="loadRows();loadQaRows();loadMeetingSettings()">'+tr('refresh')+'</button></div><p id="adminMsg" class="muted"></p></section>'+renderMeetingSettings()+'<section class="card"><h2>'+tr('users')+'</h2><div id="rows"></div></section><section class="card"><h2>'+tr('questions')+'</h2><div id="qaRows"></div></section>');if(token){loadRows();loadQaRows();loadMeetingSettings();}}
render();
</script></body></html>
