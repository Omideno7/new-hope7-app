<!doctype html>
<html lang="fa" dir="rtl">
<head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>New Hope 7 Admin</title><link rel="stylesheet" href="css/styles.css"></head>
<body><main class="view" style="max-width:900px;margin:auto;padding-bottom:30px" id="adminApp"></main>
<script>
const SUPABASE_URL='https://gpzcwffxnddhaeaogdyo.supabase.co';
const SUPABASE_KEY='sb_publishable_v3xXEaJ5Fml7-te1mI4-0g_7R86oM37';
let lang=localStorage.getItem('nh7_admin_lang')||'fa';
let token=localStorage.getItem('nh7_admin_token')||'';
const T={
 fa:{title:'پنل مدیریت امید نو ۷',login:'ورود مدیر',email:'ایمیل',password:'رمز عبور',signIn:'ورود',logout:'خروج',users:'درخواست‌های کاربران',type:'نوع درخواست',name:'نام',contact:'تماس',status:'وضعیت',language:'زبان',actions:'عملیات',approved:'تأیید شده',pending:'در انتظار تأیید',rejected:'رد شده',approve:'تأیید',reject:'رد',refresh:'تازه‌سازی',empty:'هنوز اطلاعاتی دریافت نشده است.',questions:'پرسش و پاسخ',question:'پرسش',answer:'پاسخ',statusAnswered:'پاسخ داده شده',saveAnswer:'ثبت پاسخ',noQuestions:'هنوز پرسشی دریافت نشده است.',setup:'برای فعال شدن این پنل، فایل docs/supabase_schema_v1_3.sql را در Supabase SQL Editor اجرا کن و سپس در Supabase Auth برای ایمیل omideno7church@gmail.com کاربر بساز.'},
 en:{title:'New Hope 7 Admin Panel',login:'Admin Login',email:'Email',password:'Password',signIn:'Sign in',logout:'Logout',users:'User Requests',type:'Request type',name:'Name',contact:'Contact',status:'Status',language:'Language',actions:'Actions',approved:'Approved',pending:'Pending',rejected:'Rejected',approve:'Approve',reject:'Reject',refresh:'Refresh',empty:'No records yet.',questions:'Questions & Answers',question:'Question',answer:'Answer',statusAnswered:'Answered',saveAnswer:'Save answer',noQuestions:'No questions yet.',setup:'To activate this panel, run docs/supabase_schema_v1_3.sql in Supabase SQL Editor, then create an Auth user for omideno7church@gmail.com.'},
 hr:{title:'New Hope 7 Admin Panel',login:'Admin prijava',email:'Email',password:'Lozinka',signIn:'Prijava',logout:'Odjava',users:'Zahtjevi korisnika',type:'Vrsta zahtjeva',name:'Ime',contact:'Kontakt',status:'Status',language:'Jezik',actions:'Radnje',approved:'Odobreno',pending:'Na čekanju',rejected:'Odbijeno',approve:'Odobri',reject:'Odbij',refresh:'Osvježi',empty:'Još nema podataka.',questions:'Pitanja i odgovori',question:'Pitanje',answer:'Odgovor',statusAnswered:'Odgovoreno',saveAnswer:'Spremi odgovor',noQuestions:'Još nema pitanja.',setup:'Za aktivaciju panela pokrenite docs/supabase_schema_v1_3.sql u Supabase SQL Editoru, zatim napravite Auth korisnika za omideno7church@gmail.com.'}
};
function tr(k){return T[lang][k]||k} function h(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function setLang(l){lang=l;localStorage.setItem('nh7_admin_lang',l);document.documentElement.lang=l;document.body.dir=l==='fa'?'rtl':'ltr';render();}
async function authFetch(path, opt={}){const headers=Object.assign({'apikey':SUPABASE_KEY,'Authorization':'Bearer '+(token||SUPABASE_KEY),'Content-Type':'application/json','Prefer':'return=representation'},opt.headers||{});const r=await fetch(SUPABASE_URL+path,Object.assign({},opt,{headers}));if(!r.ok) throw new Error(await r.text());return r.status===204?null:r.json();}
async function signIn(){const email=document.getElementById('email').value.trim();const password=document.getElementById('password').value;const r=await fetch(SUPABASE_URL+'/auth/v1/token?grant_type=password',{method:'POST',headers:{'apikey':SUPABASE_KEY,'Content-Type':'application/json'},body:JSON.stringify({email,password})});if(!r.ok){alert(await r.text());return;}const data=await r.json();token=data.access_token;localStorage.setItem('nh7_admin_token',token);render();loadRows();}
async function updateStatus(id,status){await authFetch('/rest/v1/registrations?id=eq.'+encodeURIComponent(id),{method:'PATCH',body:JSON.stringify({status,updated_at:new Date().toISOString()})});loadRows();}

async function answerQuestion(id){
  const el=document.getElementById('answer_'+id); const answer=(el?.value||'').trim();
  if(!answer){ alert(tr('answer')); return; }
  await authFetch('/rest/v1/qa_questions?id=eq.'+encodeURIComponent(id),{method:'PATCH',body:JSON.stringify({answer_text:answer,status:'answered',answered_at:new Date().toISOString()})});
  loadQaRows();
}
async function loadQaRows(){
  const box=document.getElementById('qaRows'); if(!box)return; box.innerHTML='<p>...</p>';
  try{
    const rows=await authFetch('/rest/v1/qa_questions?select=*&order=created_at.desc&limit=200');
    if(!rows.length){box.innerHTML='<p class="muted">'+tr('noQuestions')+'</p>';return;}
    box.innerHTML='<div class="list">'+rows.map(r=>'<div class="card"><p><strong>'+tr('question')+':</strong> '+h(r.question_text)+'</p><p class="muted">'+h(r.language||'')+' · '+h(r.status||'')+'</p><textarea id="answer_'+r.id+'" placeholder="'+tr('answer')+'">'+h(r.answer_text||'')+'</textarea><button onclick="answerQuestion(\''+r.id+'\')">'+tr('saveAnswer')+'</button></div>').join('')+'</div>';
  }catch(e){box.innerHTML='<div class="notice">'+h(e.message)+'<br>'+tr('setup')+'</div>';}
}

async function loadRows(){const box=document.getElementById('rows');if(!box)return;box.innerHTML='<p>...</p>';try{const rows=await authFetch('/rest/v1/registrations?select=*&order=created_at.desc&limit=200');if(!rows.length){box.innerHTML='<p class="muted">'+tr('empty')+'</p>';return;}box.innerHTML='<div class="table-wrap"><table><thead><tr><th>'+tr('type')+'</th><th>'+tr('name')+'</th><th>'+tr('contact')+'</th><th>'+tr('language')+'</th><th>'+tr('status')+'</th><th>'+tr('actions')+'</th></tr></thead><tbody>'+rows.map(r=>{const p=r.payload||{};return '<tr><td>'+h(r.type)+'</td><td>'+h((p.firstName||'')+' '+(p.lastName||''))+'</td><td>'+h((p.email||'')+' '+(p.phone||''))+'</td><td>'+h(r.language||'')+'</td><td>'+h(r.status||'')+'</td><td><button onclick="updateStatus(\''+r.id+'\',\'approved\')">'+tr('approve')+'</button> <button onclick="updateStatus(\''+r.id+'\',\'rejected\')">'+tr('reject')+'</button></td></tr><tr><td colspan="6"><small>'+h(JSON.stringify(p,null,2))+'</small></td></tr>'}).join('')+'</tbody></table></div>'}catch(e){box.innerHTML='<div class="notice">'+h(e.message)+'<br>'+tr('setup')+'</div>';}}
function render(){document.getElementById('adminApp').innerHTML='<section class="card hero"><h1>'+tr('title')+'</h1><select onchange="setLang(this.value)"><option value="fa" '+(lang==='fa'?'selected':'')+'>فارسی</option><option value="en" '+(lang==='en'?'selected':'')+'>English</option><option value="hr" '+(lang==='hr'?'selected':'')+'>Hrvatski</option></select></section>'+(!token?'<section class="card"><h2>'+tr('login')+'</h2><input id="email" placeholder="'+tr('email')+'" value="omideno7church@gmail.com"><input id="password" type="password" placeholder="'+tr('password')+'"><button class="primary-btn" onclick="signIn()">'+tr('signIn')+'</button><p class="muted">'+tr('setup')+'</p></section>':'<section class="card"><button class="secondary-btn" onclick="localStorage.removeItem(\'nh7_admin_token\');token=\'\';render()">'+tr('logout')+'</button> <button class="primary-btn" onclick="loadRows();loadQaRows()">'+tr('refresh')+'</button></section><section class="card"><h2>'+tr('users')+'</h2><div id="rows"></div></section><section class="card"><h2>'+tr('questions')+'</h2><div id="qaRows"></div></section>');if(token){loadRows();loadQaRows();}}
render();
</script></body></html>
