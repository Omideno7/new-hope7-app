function cleanAudioTitle(name){return String(name||'').replace(/\.[^.]+$/,'').replace(/[_-]+/g,' ').replace(/\s+/g,' ').trim()}
function formatDurationClock(seconds){seconds=Math.max(0,Math.round(Number(seconds)||0));const h=Math.floor(seconds/3600),m=Math.floor((seconds%3600)/60),s=seconds%60;return h?`${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`:`${m}:${String(s).padStart(2,'0')}`}

function normalizeDigits(v){return String(v??'').replace(/[۰-۹]/g,d=>'۰۱۲۳۴۵۶۷۸۹'.indexOf(d)).replace(/[٠-٩]/g,d=>'٠١٢٣٤٥٦٧٨٩'.indexOf(d))}
function cleanImportValue(v){return String(v??'').trim()}
function parseJsonDaily(text){let d=JSON.parse(text);if(Array.isArray(d))return d;if(Array.isArray(d.days))return d.days;if(Array.isArray(d.items))return d.items;const vals=Object.entries(d).filter(([k,v])=>/^\d+$/.test(k)&&v&&typeof v==='object').map(([k,v])=>Object.assign({day:Number(k)},v));if(vals.length)return vals;throw new Error('JSON: days/items array not found')}
function parseCsvLine(line){const out=[];let cur='',q=false;for(let i=0;i<line.length;i++){const c=line[i];if(c==='"'){if(q&&line[i+1]==='"'){cur+='"';i++}else q=!q}else if(c===','&&!q){out.push(cur);cur=''}else cur+=c}out.push(cur);return out}
function parseCsvDaily(text){const lines=text.replace(/^\uFEFF/,'').split(/\r?\n/).filter(x=>x.trim());if(lines.length<2)throw new Error('CSV: empty');const heads=parseCsvLine(lines[0]).map(x=>x.trim().toLowerCase());return lines.slice(1).map(line=>{const vals=parseCsvLine(line),o={};heads.forEach((k,i)=>o[k]=vals[i]??'');return {day:Number(normalizeDigits(o.day||o.day_number)),title:o.title||o.heading||'',mainVerse:{reference:o.reference||o.verse_reference||'',text:o.verse||o.verse_text||''},message:o.message||o.proclamation||'',prayer:o.prayer||o.action||o.action_step||''}}).filter(x=>x.day)}
function parseTxtDaily(text){const normalized=normalizeDigits(text).replace(/\r/g,'');const re=/^(?:day|روز|dan)\s*[:#-]?\s*(\d{1,3})\b/im;const starts=[];const lines=normalized.split('\n');let pos=0;for(const line of lines){const m=line.match(re);if(m)starts.push({day:Number(m[1]),pos});pos+=line.length+1}if(!starts.length)throw new Error('TXT: Day 1 / روز ۱ / Dan 1 not found');const rows=[];for(let i=0;i<starts.length;i++){const block=normalized.slice(starts[i].pos,starts[i+1]?.pos??normalized.length);const fields={body:[]};let current='body';for(const ln of block.split('\n').slice(1)){const m=ln.match(/^\s*(title|عنوان|naslov|reference|مرجع|آیه|verse|stih|message|پیام|proclamation|اعلان|prayer|دعا|action(?: step)?|قدم عملی|korak)\s*[:：]\s*(.*)$/i);if(m){current=m[1].toLowerCase();fields[current]=[m[2]]}else{(fields[current]||(fields[current]=[])).push(ln)}}const pick=keys=>{for(const k of Object.keys(fields))if(keys.some(x=>k.includes(x)))return cleanImportValue(fields[k].join('\n'));return''};rows.push({day:starts[i].day,title:pick(['title','عنوان','naslov']),mainVerse:{reference:pick(['reference','مرجع']),text:pick(['verse','آیه','stih'])},message:pick(['message','پیام']),proclamation:pick(['proclamation','اعلان']),prayer:pick(['prayer','دعا']),actionStep:pick(['action','قدم عملی','korak']),body:cleanImportValue(fields.body.join('\n'))})}return rows}
async function readDailyImportFile(file){const text=await file.text(),n=(file.name||'').toLowerCase();if(n.endsWith('.json'))return parseJsonDaily(text);if(n.endsWith('.csv'))return parseCsvDaily(text);return parseTxtDaily(text)}
function itemLangValue(v,l){if(v==null)return'';if(typeof v==='string'||typeof v==='number')return String(v);if(typeof v==='object')return v[l]??v.text?.[l]??v.value??'';return''}
function singleLangContent(raw,l,type,day){const x=raw&&typeof raw==='object'?raw:{},mainKey=type==='faith'?'proclamation':'message',extraKey=type==='daily_juice'?'actionStep':'prayer';const mv=x.mainVerse||x.verse||{};return {day,title:itemLangValue(x.title??x.heading,l),reference:cleanImportValue(mv.reference??x.reference??''),verse:itemLangValue(mv.text??x.verseText??(typeof x.verse==='string'?x.verse:''),l),body:itemLangValue(x[mainKey]??x.message??x.proclamation??x.body,l),extra:itemLangValue(x[extraKey]??x.prayer??x.actionStep??x.action,l)}}

  const courseOpts=courses.map(x=>`<option value="${h(x.course_code)}" ${(x.course_code===(e.course_code||'foundation_school'))?'selected':''}>${h((lang==='fa'?x.title_fa:lang==='hr'?x.title_hr:x.title_en)||x.title_fa||x.course_code)}</option>`).join('');
  const lessonOpts=lessons.map(x=>`<option value="${h(x.lesson_code)}" ${x.lesson_code===e.lesson_code?'selected':''}>${h(slv(x.content_data||{},'translations.'+lang+'.class_title')||x.lesson_code)}</option>`).join('');
  const exams=state.schoolExams.map(x=>`<article class="request-card"><div class="req-head"><div><div class="req-name">${h((lang==='fa'?x.title_fa:lang==='hr'?x.title_hr:x.title_en)||x.title_fa||x.lesson_code)}</div><div class="req-meta">${h(x.exam_scope||'lesson')} · ${h(x.course_code||x.lesson_code)} · ${h(x.passing_score)}% ${lang==='fa'?'حد قبولی':'pass'} · ${h(x.exam_weight??70)}% + ${h(x.assignment_weight??30)}% · ${(x.questions||[]).length} ${lang==='fa'?'سؤال':'questions'}${x.shuffle_questions?' · 🔀':''}</div></div><span class="pill ${x.is_active?'approved':'rejected'}">${x.is_active?'Active':'Inactive'}</span></div><div class="actions"><button class="btn secondary" onclick="startExamEdit('${x.id}')">Edit</button><button class="btn danger-btn" onclick="deleteSchoolExam('${x.id}')">Delete</button></div></article>`).join('');
  const attempts=state.schoolAttempts.slice(0,500),passed=attempts.filter(x=>x.passed).length,average=attempts.length?Math.round(attempts.reduce((s,x)=>s+Number(x.final_score_percent??x.score_percent??0),0)/attempts.length):0;
  const attemptRows=attempts.map(a=>`<tr><td>${h(a.user_name||'-')}<br><small>${h(a.user_email||'')}</small></td><td>${h(a.course_code||a.lesson_code||'')}</td><td>${lang==='fa'?'آزمون':'Exam'} ${h(a.objective_score_percent??a.score_percent)}%<br>${lang==='fa'?'تکلیف':'Assignments'} ${h(a.assignment_score_percent??0)}%<br><strong>${lang==='fa'?'نهایی':'Final'} ${h(a.final_score_percent??a.score_percent)}%</strong></td><td>${a.passed?'✅':'↻'}</td><td>#${h(a.attempt_number||1)}<br><small>${h(a.submitted_at?new Date(a.submitted_at).toLocaleString():'')}</small></td><td><button class="btn secondary" onclick="selectedAttemptId='${a.id}';render()">${lang==='fa'?'جزئیات':'Details'}</button></td></tr>`).join('');
  return `<section class="panel-card" id="examEditor"><h3>${lang==='fa'?'ساخت و مدیریت آزمون':'Exam management'}</h3><div class="import-box"><h4>${lang==='fa'?'ورود آماده یا گروهی سؤال‌ها':'Ready-made or bulk question import'}</h4><div class="exam-builder-toolbar"><button class="btn primary" onclick="importFoundationExam()">✨ ${lang==='fa'?'بارگذاری آزمون بنیادی ۵۰ سؤالی':'Load 50-question Foundation exam'}</button><label class="btn secondary">📁 ${lang==='fa'?'انتخاب فایل JSON':'Choose JSON file'}<input type="file" accept=".json,application/json" onchange="importExamFile(this)" hidden></label><button class="btn ghost" onclick="downloadExamTemplate()">⬇ Template</button></div></div><div class="grid2"><select id="ex_scope"><option value="course" ${(e.exam_scope||'lesson')==='course'?'selected':''}>${lang==='fa'?'آزمون کل دوره':'Course final exam'}</option><option value="lesson" ${(e.exam_scope||'lesson')==='lesson'?'selected':''}>${lang==='fa'?'آزمون یک درس':'Lesson exam'}</option></select><input id="ex_order" type="number" min="1" value="${h(e.sort_order||1)}" placeholder="Order"></div><label>${lang==='fa'?'انتخاب دوره':'Course'}</label><select id="ex_course">${courseOpts}</select><label>${lang==='fa'?'انتخاب درس برای آزمون درسی':'Lesson (for lesson exam)'}</label><select id="ex_lesson">${lessonOpts}</select><div class="grid3"><input id="ex_fa" placeholder="عنوان فارسی" value="${h(e.title_fa||'')}"><input id="ex_en" placeholder="English title" value="${h(e.title_en||'')}"><input id="ex_hr" placeholder="Hrvatski naslov" value="${h(e.title_hr||'')}"></div><h4>${lang==='fa'?'محاسبه نمره نهایی':'Final grade calculation'}</h4><div class="grid3"><label>${lang==='fa'?'حد قبولی نهایی':'Final passing score'}<input id="ex_pass" type="number" min="0" max="100" value="${h(e.passing_score??70)}"></label><label>${lang==='fa'?'حداکثر دفعات آزمون':'Maximum attempts'}<input id="ex_attempts" type="number" min="1" value="${h(e.max_attempts||3)}"></label><label>${lang==='fa'?'تعداد سؤال در هر تلاش':'Questions per attempt'}<input id="ex_questions_per_attempt" type="number" min="0" max="${examQuestionsDraft.length||500}" value="${h(e.questions_per_attempt||examQuestionsDraft.length||50)}"></label></div><div class="grid2"><label>${lang==='fa'?'وزن آزمون کتبی':'Written exam weight'}<input id="ex_exam_weight" type="number" min="0" max="100" value="${h(e.exam_weight??70)}"></label><label>${lang==='fa'?'وزن تکالیف':'Assignment weight'}<input id="ex_assignment_weight" type="number" min="0" max="100" value="${h(e.assignment_weight??30)}"></label></div><p class="muted">${lang==='fa'?'جمع دو وزن باید دقیقاً ۱۰۰ باشد.':'The two weights must total exactly 100.'}</p><div class="grid3"><textarea id="ex_intro_fa" placeholder="مقدمه فارسی">${h(e.intro_fa||'')}</textarea><textarea id="ex_intro_en" class="ltr" placeholder="English introduction">${h(e.intro_en||'')}</textarea><textarea id="ex_intro_hr" class="ltr" placeholder="Hrvatski uvod">${h(e.intro_hr||'')}</textarea></div><h4>${lang==='fa'?'پیام قبولی':'Pass message'}</h4><div class="grid3"><textarea id="ex_pass_fa">${h(e.pass_message_fa||'')}</textarea><textarea id="ex_pass_en" class="ltr">${h(e.pass_message_en||'')}</textarea><textarea id="ex_pass_hr" class="ltr">${h(e.pass_message_hr||'')}</textarea></div><h4>${lang==='fa'?'پیام نیاز به مطالعه مجدد':'Review-needed message'}</h4><div class="grid3"><textarea id="ex_fail_fa">${h(e.fail_message_fa||'')}</textarea><textarea id="ex_fail_en" class="ltr">${h(e.fail_message_en||'')}</textarea><textarea id="ex_fail_hr" class="ltr">${h(e.fail_message_hr||'')}</textarea></div><div class="grid3"><label><input id="ex_require" type="checkbox" ${e.require_course_completion?'checked':''}> ${lang==='fa'?'الزام تکمیل همه درس‌ها':'Require all lessons completed'}</label><label><input id="ex_require_assignments" type="checkbox" ${e.require_assignments_before_exam?'checked':''}> ${lang==='fa'?'الزام ارسال همه تکالیف پیش از آزمون':'Require assignments before exam'}</label><label><input id="ex_shuffle" type="checkbox" ${e.shuffle_questions?'checked':''}> ${lang==='fa'?'تغییر تصادفی ترتیب سؤال‌ها در هر تلاش':'Shuffle questions on every attempt'}</label></div><hr><h3>${lang==='fa'?'ویرایش سؤال‌ها':'Question editor'}</h3>${questionEditorHtml()}<button class="btn secondary" onclick="addExamQuestion()">+ ${lang==='fa'?'افزودن سؤال':'Add question'}</button><label><input id="ex_active" type="checkbox" ${e.is_active!==false?'checked':''}> Active</label><div class="actions"><button class="btn primary" onclick="saveSchoolExam()">${lang==='fa'?'ذخیره آزمون':'Save exam'}</button><button class="btn ghost" onclick="editingExamId='';examQuestionsDraft=[];examMetaDraft={};render()">New</button></div></section><section class="panel-card"><h3>${lang==='fa'?'آزمون‌های موجود':'Existing exams'}</h3>${exams||'<div class="empty">No exams</div>'}</section>${renderSchoolAssignmentsAdmin()}<section class="panel-card"><h3>${lang==='fa'?'نتایج آزمون‌ها':'Exam results'}</h3><div class="exam-results-grid"><div class="stat"><b>${attempts.length}</b><span>${lang==='fa'?'کل تلاش‌ها':'Attempts'}</span></div><div class="stat"><b>${passed}</b><span>${lang==='fa'?'قبول‌شده':'Passed'}</span></div><div class="stat"><b>${attempts.length-passed}</b><span>${lang==='fa'?'نیاز به مرور':'Review needed'}</span></div><div class="stat"><b>${average}%</b><span>${lang==='fa'?'میانگین نهایی':'Final average'}</span></div></div><div style="overflow:auto"><table class="mini-table"><thead><tr><th>User</th><th>Course</th><th>Scores</th><th>Status</th><th>Attempt</th><th></th></tr></thead><tbody>${attemptRows}</tbody></table></div></section>${renderAttemptDetail()}`
}
async function saveSchoolExam(){captureExamQuestions();const scope=document.getElementById('ex_scope').value,course=document.getElementById('ex_course').value,lesson=document.getElementById('ex_lesson').value,examWeight=Number(document.getElementById('ex_exam_weight').value||0),assignmentWeight=Number(document.getElementById('ex_assignment_weight').value||0);if(examWeight+assignmentWeight!==100){alert(lang==='fa'?'جمع وزن آزمون و تکالیف باید دقیقاً ۱۰۰ باشد.':'Exam and assignment weights must total exactly 100.');return}const questions=examQuestionsDraft.map(normalizedExamQuestion);if(!questions.length){alert(lang==='fa'?'حداقل یک سؤال لازم است.':'At least one question is required.');return}for(let i=0;i<questions.length;i++){const q=questions[i];if(!String(q.question?.fa||q.question?.en||'').trim()||q.options.length<2||q.correct<0||q.correct>=q.options.length){alert((lang==='fa'?'اشکال در سؤال شماره ':'Problem in question ')+(i+1));return}}const payload={exam_scope:scope,course_code:course,lesson_code:scope==='course'?'course:'+course:lesson,title_fa:document.getElementById('ex_fa').value,title_en:document.getElementById('ex_en').value,title_hr:document.getElementById('ex_hr').value,intro_fa:document.getElementById('ex_intro_fa').value,intro_en:document.getElementById('ex_intro_en').value,intro_hr:document.getElementById('ex_intro_hr').value,pass_message_fa:document.getElementById('ex_pass_fa').value,pass_message_en:document.getElementById('ex_pass_en').value,pass_message_hr:document.getElementById('ex_pass_hr').value,fail_message_fa:document.getElementById('ex_fail_fa').value,fail_message_en:document.getElementById('ex_fail_en').value,fail_message_hr:document.getElementById('ex_fail_hr').value,passing_score:Number(document.getElementById('ex_pass').value||70),max_attempts:Number(document.getElementById('ex_attempts').value||3),exam_weight:examWeight,assignment_weight:assignmentWeight,questions_per_attempt:Number(document.getElementById('ex_questions_per_attempt').value||questions.length),shuffle_questions:document.getElementById('ex_shuffle').checked,require_course_completion:document.getElementById('ex_require').checked,require_assignments_before_exam:document.getElementById('ex_require_assignments').checked,sort_order:Number(document.getElementById('ex_order').value||1),questions,is_active:document.getElementById('ex_active').checked,updated_at:new Date().toISOString()};try{if(editingExamId)await authFetch('/rest/v1/school_exams?id=eq.'+editingExamId,{method:'PATCH',body:JSON.stringify(payload)});else await authFetch('/rest/v1/school_exams',{method:'POST',body:JSON.stringify(payload)});editingExamId='';examQuestionsDraft=[];examMetaDraft={};await loadAll(true);alert(lang==='fa'?'آزمون با موفقیت ذخیره شد.':'Exam saved successfully.')}catch(e){alert(e.message)}}
async function deleteSchoolExam(id){if(!confirm(tr('confirmDelete')))return;await authFetch('/rest/v1/school_exams?id=eq.'+id,{method:'DELETE'});editingExamId='';examQuestionsDraft=[];examMetaDraft={};await loadAll(true)}
async function resetSchoolProgress(id){if(!confirm(lang==='fa'?'پیشرفت این مورد ریست شود؟':'Reset this progress?'))return;await authFetch('/rest/v1/school_progress?id=eq.'+id,{method:'DELETE'});await loadAll(true)}
function renderActivePanel(){if(activeTab==='overview')return adminDashboard();if(activeTab==='approved')return renderRequests(true);if(activeTab==='qa')return renderQa();if(activeTab==='sermons')return renderSermons();if(activeTab==='notifications')return renderNotifications();if(activeTab==='dailycontent')return renderDailyContent();if(activeTab==='schoolcontent')return renderSchoolContent();if(activeTab==='schoolresults')return renderSchoolResults();if(activeTab==='meetings')return renderMeetings();if(activeTab==='messages')return renderMessages();return renderRequests(false)}
function render(){document.documentElement.lang=lang;document.body.dir=lang==='fa'?'rtl':'ltr';const app=document.getElementById('adminApp');app.innerHTML=!token?renderLogin():renderTop()+renderBody()+'<button class="fab-refresh" onclick="loadAll()">⟳</button>';}
render();
if(token)loadAll(true);
if(refreshTimer)clearInterval(refreshTimer);
refreshTimer=setInterval(()=>{if(token)loadAll(true)},60000);
</script>
