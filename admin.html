<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>OmideNo7 Admin</title>
  <link rel="manifest" href="admin-manifest.json">
  <link rel="icon" href="assets/admin-icon-192.png" type="image/png">
  <link rel="apple-touch-icon" href="assets/admin-apple-touch-icon.png">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="OmideNo7 Admin">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#0f766e">
  <link rel="stylesheet" href="css/styles.css">
  <style>
    :root{--blue:#0b5faa;--green:#16a765;--ink:#102033;--muted:#667085;--bg:#eef8f7;--card:#ffffff;--line:#d8ecea;--danger:#b42318;--warn:#b54708;--shadow:0 12px 34px rgba(15,118,110,.14)}
    *{box-sizing:border-box}
    body{margin:0;background:linear-gradient(180deg,#e9f8f6,#f7fbff);color:var(--ink);font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif}
    button,input,textarea,select{font:inherit}
    .admin-shell{max-width:1100px;margin:0 auto;padding:14px 12px 96px}
    .topbar{position:sticky;top:0;z-index:50;margin:-14px -12px 12px;padding:calc(10px + env(safe-area-inset-top)) 12px 10px;background:rgba(244,251,250,.94);backdrop-filter:blur(16px);border-bottom:1px solid var(--line)}
    .brand{display:flex;align-items:center;gap:10px}.brand img{width:44px;height:44px;border-radius:14px;box-shadow:var(--shadow);background:#fff}.brand h1{font-size:1.05rem;margin:0}.brand p{margin:2px 0 0;color:var(--muted);font-size:.82rem}
    .top-actions{display:flex;gap:8px;align-items:center;margin-top:10px}.top-actions select{max-width:150px}.top-actions button{white-space:nowrap}
    .hero{background:linear-gradient(135deg,var(--blue),var(--green));color:white;border-radius:24px;padding:18px;box-shadow:var(--shadow);margin-bottom:12px}.hero h2{margin:0 0 6px;font-size:1.25rem}.hero p{margin:0;opacity:.9}
    .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin:12px 0}.stat{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:12px;box-shadow:0 8px 22px rgba(16,32,51,.06)}.stat b{display:block;font-size:1.45rem}.stat span{font-size:.82rem;color:var(--muted)}
    .tabs{position:sticky;top:86px;z-index:40;display:flex;gap:8px;overflow-x:auto;margin:0 -12px 12px;padding:8px 12px;background:rgba(244,251,250,.92);backdrop-filter:blur(10px);border-bottom:1px solid rgba(216,236,234,.8)}
    .tab{border:1px solid var(--line);background:#fff;color:var(--ink);border-radius:999px;padding:10px 12px;min-width:max-content;box-shadow:0 4px 14px rgba(16,32,51,.04)}.tab.active{background:linear-gradient(135deg,var(--blue),var(--green));color:white;border-color:transparent}.badge{display:inline-flex;min-width:22px;height:22px;padding:0 6px;align-items:center;justify-content:center;margin-inline-start:6px;background:#e11d48;color:white;border-radius:999px;font-size:.78rem;font-weight:800}.tab.active .badge{background:#fff;color:var(--blue)}
    .card,.panel-card{background:var(--card);border:1px solid var(--line);border-radius:22px;padding:14px;margin:12px 0;box-shadow:0 10px 28px rgba(16,32,51,.06)}.panel-card h3,.card h2{margin:0 0 10px}.muted{color:var(--muted)}.small{font-size:.84rem}.success{color:#08783d;font-weight:800}.danger{color:var(--danger);font-weight:800}.warn{color:var(--warn);font-weight:800}
    .grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}.toolbar input,.toolbar select{flex:1;min-width:180px}.field,input,textarea,select{width:100%;border:1px solid #cfe4e2;background:#fff;border-radius:14px;padding:12px;margin:5px 0}textarea{min-height:96px;resize:vertical}.pill{display:inline-flex;align-items:center;gap:4px;border-radius:999px;padding:5px 9px;background:#eef8f7;color:#0f766e;font-size:.8rem;font-weight:700}.pill.pending{background:#fff7ed;color:#b54708}.pill.approved{background:#ecfdf3;color:#08783d}.pill.rejected{background:#fef3f2;color:#b42318}
    .request-card{background:#fff;border:1px solid var(--line);border-radius:20px;padding:14px;margin:10px 0;box-shadow:0 7px 22px rgba(16,32,51,.05)}.req-head{display:flex;justify-content:space-between;gap:10px;align-items:flex-start}.req-name{font-size:1.04rem;font-weight:850}.req-meta{margin-top:4px;color:var(--muted);font-size:.88rem;word-break:break-word}.actions{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:8px;margin-top:12px}.actions.three{grid-template-columns:repeat(3,minmax(0,1fr))}.btn{border:0;border-radius:14px;padding:12px 10px;font-weight:800;cursor:pointer;text-align:center;text-decoration:none;display:inline-flex;justify-content:center;align-items:center;gap:6px}.primary{background:linear-gradient(135deg,var(--blue),var(--green));color:white}.secondary{background:#eef8f7;color:#0f766e}.danger-btn{background:#fef3f2;color:#b42318}.ghost{background:#f4f8fb;color:#344054}.btn:disabled{opacity:.55;cursor:not-allowed}.detail-box{border-top:1px dashed var(--line);margin-top:12px;padding-top:10px}.detail-row{display:grid;grid-template-columns:150px 1fr;gap:8px;border-bottom:1px solid #f0f5f5;padding:7px 0}.detail-row strong{color:#344054}.empty{padding:22px;text-align:center;color:var(--muted);background:#fff;border:1px dashed var(--line);border-radius:20px}.notice{padding:12px;border-radius:16px;background:#fff7ed;color:#9a3412;margin:10px 0;word-break:break-word}.fab-refresh{position:fixed;right:16px;bottom:18px;z-index:80;border:0;border-radius:999px;background:linear-gradient(135deg,var(--blue),var(--green));color:#fff;width:58px;height:58px;box-shadow:0 14px 30px rgba(15,118,110,.35);font-size:1.35rem}.ltr{direction:ltr;text-align:left}.hidden{display:none!important}
    @media(max-width:700px){.admin-shell{padding:10px 10px 88px}.stats{grid-template-columns:1fr 1fr}.grid2{grid-template-columns:1fr}.actions,.actions.three{grid-template-columns:1fr}.detail-row{grid-template-columns:1fr}.tabs{top:82px}.top-actions{display:grid;grid-template-columns:1fr 1fr}.top-actions select{max-width:none}.request-card{padding:13px}.req-head{display:block}.stat b{font-size:1.25rem}}
  </style>
</head>

<main id="adminApp" class="admin-shell"></main>
<script>
const SUPABASE_URL='https://gpzcwffxnddhaeaogdyo.supabase.co';
const SUPABASE_KEY='sb_publishable_v3xXEaJ5Fml7-te1mI4-0g_7R86oM37';
let lang=localStorage.getItem('nh7_admin_lang')||'fa';
let token=localStorage.getItem('nh7_admin_token')||'';
let activeTab=localStorage.getItem('nh7_admin_tab')||'requests';
let currentFilter='pending';
let currentSearch='';
let state={registrations:[],questions:[],messages:[],meeting:{},loading:false,lastError:''};
let refreshTimer=null;
let lastCounts=JSON.parse(localStorage.getItem('nh7_admin_last_counts')||'{"pending":0,"questions":0}');
const T={
 fa:{title:'پنل مدیریت امیدنو۷',sub:'داشبورد سریع مدیریت مدرسه، جلسات و پرسش‌ها',login:'ورود مدیر',email:'ایمیل',password:'رمز عبور',signIn:'ورود',logout:'خروج',refresh:'تازه‌سازی',enableAlerts:'فعال‌سازی هشدار',requests:'درخواست‌ها',approvedUsers:'تأیید شده‌ها',questions:'پرسش و پاسخ',meetings:'جلسات',messages:'پیام‌ها',settings:'تنظیمات',pending:'در انتظار',approved:'تأیید شده',rejected:'رد شده',all:'همه',search:'جستجو نام یا ایمیل',empty:'هنوز اطلاعاتی دریافت نشده است.',newRequests:'درخواست جدید',newQuestions:'پرسش جدید',totalApproved:'کاربر تأیید شده',name:'نام',contact:'تماس',language:'زبان',status:'وضعیت',approve:'تأیید',reject:'رد',delete:'حذف',emailUser:'ایمیل به شخص',details:'جزئیات',question:'پرسش',answer:'پاسخ',saveAnswer:'ذخیره پاسخ',archive:'بایگانی',saveSettings:'ذخیره اطلاعات جلسه',provider:'ارائه‌دهنده',meetingUrl:'لینک جلسه',securityCode:'کد امنیتی',extraInfo:'توضیح جلسه / زمان دعا',saved:'ذخیره شد',setup:'اگر خطا دیدی، مطمئن شو SQLهای لازم در Supabase اجرا شده‌اند.',approvedMsg:'درخواست تأیید شد.',rejectedMsg:'درخواست رد شد.',deletedMsg:'حذف شد.',saving:'در حال ذخیره...',mailSubject:'درباره ثبت‌نام شما در OmideNo7',mailBody:'سلام،\nاز ثبت‌نام شما در OmideNo7 سپاسگزاریم. لطفاً اطلاعات/مدارک تکمیلی را برای بررسی درخواست ارسال کنید.\nبا برکت،\nتیم OmideNo7',anonNote:'نام شخص فقط برای ادمین نمایش داده می‌شود؛ پاسخ عمومی می‌تواند گمنام نمایش داده شود.',alertOpen:'هشدارها وقتی پنل ادمین روی گوشی باز باشد نمایش داده می‌شوند. برای هشدار دائمی/ایمیل، مرحله سروری لازم است.',noEmail:'ایمیل ثبت نشده است.',confirmDelete:'آیا مطمئنی حذف شود؟',onlyMeetingVisible:'برای کاربران فقط لینک جلسه و کد امنیتی نمایش داده می‌شود.'},
 en:{title:'OmideNo7 Admin Panel',sub:'Fast dashboard for school, meetings, and Q&A',login:'Admin Login',email:'Email',password:'Password',signIn:'Sign in',logout:'Logout',refresh:'Refresh',enableAlerts:'Enable alerts',requests:'Requests',approvedUsers:'Approved',questions:'Q&A',meetings:'Meetings',messages:'Messages',settings:'Settings',pending:'Pending',approved:'Approved',rejected:'Rejected',all:'All',search:'Search name or email',empty:'No data received yet.',newRequests:'New requests',newQuestions:'New questions',totalApproved:'Approved users',name:'Name',contact:'Contact',language:'Language',status:'Status',approve:'Approve',reject:'Reject',delete:'Delete',emailUser:'Email user',details:'Details',question:'Question',answer:'Answer',saveAnswer:'Save answer',archive:'Archive',saveSettings:'Save meeting details',provider:'Provider',meetingUrl:'Meeting link',securityCode:'Security code',extraInfo:'Meeting note / prayer time',saved:'Saved',setup:'If you see an error, make sure the required Supabase SQL files have been run.',approvedMsg:'Request approved.',rejectedMsg:'Request rejected.',deletedMsg:'Deleted.',saving:'Saving...',mailSubject:'Regarding your OmideNo7 registration',mailBody:'Hello,\nThank you for registering with OmideNo7. Please send the missing information/documents so we can review your request.\nBlessings,\nOmideNo7 Admin Team',anonNote:'The author is visible only to admins; public answers can remain anonymous.',alertOpen:'Alerts appear while the admin panel is open on your phone. Persistent push/email requires a server step.',noEmail:'No email address is recorded.',confirmDelete:'Are you sure you want to delete this?',onlyMeetingVisible:'Only the meeting link and security code are shown to users.'},
 hr:{title:'Administracija OmideNo7',sub:'Brza nadzorna ploča za školu, sastanke i pitanja',login:'Prijava administratora',email:'Email',password:'Lozinka',signIn:'Prijava',logout:'Odjava',refresh:'Osvježi',enableAlerts:'Uključi obavijesti',requests:'Zahtjevi',approvedUsers:'Odobreni',questions:'Pitanja',meetings:'Sastanci',messages:'Poruke',settings:'Postavke',pending:'Na čekanju',approved:'Odobreno',rejected:'Odbijeno',all:'Sve',search:'Traži ime ili email',empty:'Još nema podataka.',newRequests:'Novi zahtjevi',newQuestions:'Nova pitanja',totalApproved:'Odobreni korisnici',name:'Ime',contact:'Kontakt',language:'Jezik',status:'Status',approve:'Odobri',reject:'Odbij',delete:'Izbriši',emailUser:'Pošalji email',details:'Detalji',question:'Pitanje',answer:'Odgovor',saveAnswer:'Spremi odgovor',archive:'Arhiviraj',saveSettings:'Spremi podatke sastanka',provider:'Pružatelj',meetingUrl:'Link sastanka',securityCode:'Sigurnosni kod',extraInfo:'Napomena / vrijeme molitve',saved:'Spremljeno',setup:'Ako vidite grešku, provjerite jesu li potrebne Supabase SQL datoteke pokrenute.',approvedMsg:'Zahtjev odobren.',rejectedMsg:'Zahtjev odbijen.',deletedMsg:'Izbrisano.',saving:'Spremanje...',mailSubject:'Vaša OmideNo7 registracija',mailBody:'Pozdrav,\nHvala na registraciji u OmideNo7. Molimo pošaljite dodatne informacije/dokumente kako bismo pregledali zahtjev.\nBlagoslov,\nOmideNo7 Admin Team',anonNote:'Autor je vidljiv samo administratorima; javni odgovori mogu ostati anonimni.',alertOpen:'Obavijesti se prikazuju dok je admin panel otvoren na telefonu. Trajne push/email obavijesti traže serverski korak.',noEmail:'Email nije unesen.',confirmDelete:'Jeste li sigurni da želite izbrisati?',onlyMeetingVisible:'Korisnicima se prikazuju samo poveznica i sigurnosni kod.'}
};
function tr(k){return (T[lang]&&T[lang][k])||k}
function h(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function setLang(l){lang=l;localStorage.setItem('nh7_admin_lang',l);document.documentElement.lang=l;document.body.dir=l==='fa'?'rtl':'ltr';render()}
function setTab(t){activeTab=t;localStorage.setItem('nh7_admin_tab',t);render()}
function isApproved(s){return String(s||'').toLowerCase()==='approved'}
function isRejected(s){return ['rejected','denied','blocked'].includes(String(s||'').toLowerCase())}
function isPending(s){return !isApproved(s)&&!isRejected(s)&&String(s||'').toLowerCase()!=='archived'}
function pillStatus(s){const st=String(s||'pending');const cls=isApproved(st)?'approved':isRejected(st)?'rejected':'pending';return '<span class="pill '+cls+'">'+h(st)+'</span>'}
function normalizePayload(p){if(!p)return{};if(typeof p==='string'){try{return JSON.parse(p)}catch(e){return{raw:p}}}return p}
function getEmail(r){const p=normalizePayload(r.payload);return p.email||r.email||r.user_email||r.author_email||''}
function getName(r){const p=normalizePayload(r.payload);return (p.fullName||p.name||((p.firstName||'')+' '+(p.lastName||'')).trim()||r.author_name||r.name||'-')}
function getPhone(r){const p=normalizePayload(r.payload);return p.phone||p.whatsapp||r.phone||''}
function getCreated(r){return r.created_at?new Date(r.created_at).toLocaleString(lang==='fa'?'fa-IR':lang==='hr'?'hr-HR':'en-US'):''}
async function authFetch(path,opt={}){const headers=Object.assign({'apikey':SUPABASE_KEY,'Authorization':'Bearer '+(token||SUPABASE_KEY),'Content-Type':'application/json','Prefer':'return=representation'},opt.headers||{});const r=await fetch(SUPABASE_URL+path,Object.assign({},opt,{headers}));if(!r.ok)throw new Error(await r.text());return r.status===204?null:r.json()}
async function signIn(){const email=document.getElementById('email').value.trim();const password=document.getElementById('password').value;const r=await fetch(SUPABASE_URL+'/auth/v1/token?grant_type=password',{method:'POST',headers:{'apikey':SUPABASE_KEY,'Content-Type':'application/json'},body:JSON.stringify({email,password})});if(!r.ok){alert(await r.text());return}const data=await r.json();token=data.access_token;localStorage.setItem('nh7_admin_token',token);await loadAll();render()}
function logout(){localStorage.removeItem('nh7_admin_token');token='';state={registrations:[],questions:[],messages:[],meeting:{},loading:false,lastError:''};render()}
async function loadAll(silent=false){if(!token)return;state.loading=true;if(!silent)render();try{const [registrations,questions,msgs,meeting]=await Promise.allSettled([authFetch('/rest/v1/registrations?select=*&order=created_at.desc&limit=500'),authFetch('/rest/v1/qa_questions?select=*&order=created_at.desc&limit=500'),authFetch('/rest/v1/notification_inbox?select=*&order=delivered_at.desc&limit=80'),authFetch('/rest/v1/meeting_settings?select=*&id=eq.active&limit=1')]);state.registrations=registrations.status==='fulfilled'?(registrations.value||[]):state.registrations;state.questions=questions.status==='fulfilled'?(questions.value||[]):state.questions;state.messages=msgs.status==='fulfilled'?(msgs.value||[]):[];state.meeting=meeting.status==='fulfilled'?((meeting.value&&meeting.value[0])||{}):state.meeting;state.lastError=[registrations,questions,meeting].filter(x=>x.status==='rejected').map(x=>x.reason.message).join('\n');notifyIfNew();}catch(e){state.lastError=e.message}finally{state.loading=false;render(false)}}
function counts(){const pending=state.registrations.filter(r=>isPending(r.status)).length;const approved=state.registrations.filter(r=>isApproved(r.status)).length;const newQ=state.questions.filter(q=>String(q.status||'new').toLowerCase()!=='answered'&&String(q.status||'new').toLowerCase()!=='archived').length;return{pending,approved,newQ}}
function notifyIfNew(){const c=counts();if(('Notification' in window)&&Notification.permission==='granted'){if(c.pending>lastCounts.pending)new Notification('OmideNo7 Admin',{body:c.pending+' '+tr('newRequests'),icon:'assets/admin-icon-192.png'});if(c.newQ>lastCounts.questions)new Notification('OmideNo7 Admin',{body:c.newQ+' '+tr('newQuestions'),icon:'assets/admin-icon-192.png'});}lastCounts={pending:c.pending,questions:c.newQ};localStorage.setItem('nh7_admin_last_counts',JSON.stringify(lastCounts));document.title=(c.pending+c.newQ?('('+(c.pending+c.newQ)+') '):'')+'OmideNo7 Admin'}
async function enableAlerts(){if(!('Notification'in window)){alert('Notifications are not supported on this browser.');return}const p=await Notification.requestPermission();alert(p==='granted'?tr('saved'):p)}
async function updateStatus(id,status){try{setMessage(tr('saving'));await authFetch('/rest/v1/registrations?id=eq.'+encodeURIComponent(id),{method:'PATCH',body:JSON.stringify({status,updated_at:new Date().toISOString()})});setMessage(status==='approved'?tr('approvedMsg'):tr('rejectedMsg'),'success');await loadAll(true)}catch(e){setMessage(e.message,'danger');alert(e.message)}}
async function deleteRequest(id){if(!confirm(tr('confirmDelete')))return;try{await authFetch('/rest/v1/registrations?id=eq.'+encodeURIComponent(id),{method:'DELETE'});setMessage(tr('deletedMsg'),'success');await loadAll(true)}catch(e){setMessage(e.message,'danger');alert(e.message)}}
async function answerQuestion(id){const answer=(document.getElementById('answer_'+id)?.value||'').trim();if(!answer){alert(tr('answer'));return}try{await authFetch('/rest/v1/qa_questions?id=eq.'+encodeURIComponent(id),{method:'PATCH',body:JSON.stringify({answer_text:answer,status:'answered',answered_at:new Date().toISOString(),updated_at:new Date().toISOString()})});setMessage(tr('saved'),'success');await loadAll(true)}catch(e){setMessage(e.message,'danger');alert(e.message)}}
async function archiveQuestion(id){try{await authFetch('/rest/v1/qa_questions?id=eq.'+encodeURIComponent(id),{method:'PATCH',body:JSON.stringify({status:'archived',updated_at:new Date().toISOString()})});await loadAll(true)}catch(e){alert(e.message)}}
function setMessage(msg,type='muted'){const el=document.getElementById('adminMsg');if(el)el.className=type,el.textContent=msg}
function mailto(email,subject,body){if(!email){alert(tr('noEmail'));return '#'}return 'mailto:'+encodeURIComponent(email)+'?subject='+encodeURIComponent(subject)+'&body='+encodeURIComponent(body)}
function requestEmailLink(r){const email=getEmail(r);const name=getName(r);return mailto(email,tr('mailSubject'),tr('mailBody')+'\n\n'+tr('name')+': '+name+'\n'+tr('email')+': '+email)}
function detailRows(obj){const p=normalizePayload(obj.payload)||obj;const priority=['firstName','lastName','fullName','name','email','phone','birthDate','city','country','spiritualAge','churchMember','churchName','pastorName','waterBaptism','salvationPrayer','eventsInterest','howFound','testimony','submittedAt','reason','message','raw'];const keys=[...priority.filter(k=>p[k]),...Object.keys(p).filter(k=>!priority.includes(k)&&p[k])];if(!keys.length)return '<p class="muted">-</p>';return keys.map(k=>'<div class="detail-row"><strong>'+h(k)+'</strong><span>'+h(Array.isArray(p[k])?p[k].join(', '):p[k])+'</span></div>').join('')}
function renderLogin(){return '<div class="hero"><h2>'+tr('title')+'</h2><p>'+tr('sub')+'</p></div><section class="card"><h2>'+tr('login')+'</h2><input id="email" autocomplete="username" placeholder="'+tr('email')+'" value="omideno7church@gmail.com"><input id="password" autocomplete="current-password" type="password" placeholder="'+tr('password')+'"><button class="btn primary" onclick="signIn()">'+tr('signIn')+'</button><p class="muted small">'+tr('setup')+'</p></section>'}
function renderTop(){const c=counts();return '<div class="topbar"><div class="brand"><img src="assets/admin-icon-192.png" alt=""><div><h1>'+tr('title')+'</h1><p>'+tr('sub')+'</p></div></div><div class="top-actions"><select onchange="setLang(this.value)"><option value="fa" '+(lang==='fa'?'selected':'')+'>فارسی</option><option value="en" '+(lang==='en'?'selected':'')+'>English</option><option value="hr" '+(lang==='hr'?'selected':'')+'>Hrvatski</option></select><button class="btn secondary" onclick="loadAll()">⟳ '+tr('refresh')+'</button><button class="btn ghost" onclick="enableAlerts()">🔔 '+tr('enableAlerts')+'</button><button class="btn danger-btn" onclick="logout()">'+tr('logout')+'</button></div></div><div class="stats"><div class="stat"><b>'+c.pending+'</b><span>'+tr('newRequests')+'</span></div><div class="stat"><b>'+c.newQ+'</b><span>'+tr('newQuestions')+'</span></div><div class="stat"><b>'+c.approved+'</b><span>'+tr('totalApproved')+'</span></div></div><div id="adminMsg" class="muted small"></div>'+tabsHtml()}
function tabsHtml(){const c=counts();const tabs=[['requests',tr('requests'),c.pending],['approved',tr('approvedUsers'),0],['qa',tr('questions'),c.newQ],['meetings',tr('meetings'),0],['messages',tr('messages'),0]];return '<nav class="tabs">'+tabs.map(([id,label,b])=>'<button class="tab '+(activeTab===id?'active':'')+'" onclick="setTab(\''+id+'\')">'+label+(b?'<span class="badge">'+b+'</span>':'')+'</button>').join('')+'</nav>'}
function renderRequests(approvedOnly=false){let rows=state.registrations.slice();if(approvedOnly)rows=rows.filter(r=>isApproved(r.status));else if(currentFilter==='pending')rows=rows.filter(r=>isPending(r.status));else if(currentFilter==='approved')rows=rows.filter(r=>isApproved(r.status));else if(currentFilter==='rejected')rows=rows.filter(r=>isRejected(r.status));if(currentSearch){const q=currentSearch.toLowerCase();rows=rows.filter(r=>(getName(r)+' '+getEmail(r)+' '+getPhone(r)+' '+JSON.stringify(r.payload||{})).toLowerCase().includes(q))}return '<section class="panel-card"><h3>'+(approvedOnly?tr('approvedUsers'):tr('requests'))+'</h3><div class="toolbar"><input placeholder="'+tr('search')+'" value="'+h(currentSearch)+'" oninput="currentSearch=this.value;render()">'+(!approvedOnly?'<select onchange="currentFilter=this.value;render()"><option value="pending" '+(currentFilter==='pending'?'selected':'')+'>'+tr('pending')+'</option><option value="all" '+(currentFilter==='all'?'selected':'')+'>'+tr('all')+'</option><option value="approved" '+(currentFilter==='approved'?'selected':'')+'>'+tr('approved')+'</option><option value="rejected" '+(currentFilter==='rejected'?'selected':'')+'>'+tr('rejected')+'</option></select>':'')+'</div>'+(!rows.length?'<div class="empty">'+tr('empty')+'</div>':rows.map(renderRequestCard).join(''))+'</section>'}
function renderRequestCard(r){const name=getName(r);const email=getEmail(r);const phone=getPhone(r);const type=h(r.type||'registration');return '<article class="request-card"><div class="req-head"><div><div class="req-name">'+h(name)+'</div><div class="req-meta">'+type+' · '+h(getCreated(r))+'<br>'+h(email)+(phone?' · '+h(phone):'')+'</div></div>'+pillStatus(r.status)+'</div><details class="detail-box"><summary>'+tr('details')+'</summary>'+detailRows(r)+'</details><div class="actions three"><button class="btn primary" onclick="updateStatus(\''+r.id+'\',\'approved\')">✅ '+tr('approve')+'</button><button class="btn ghost" onclick="updateStatus(\''+r.id+'\',\'rejected\')">⛔ '+tr('reject')+'</button><a class="btn secondary" href="'+h(requestEmailLink(r))+'">✉️ '+tr('emailUser')+'</a></div><div class="actions"><button class="btn danger-btn" onclick="deleteRequest(\''+r.id+'\')">🗑 '+tr('delete')+'</button></div></article>'}
function renderQa(){let rows=state.questions.slice();const unanswered=rows.filter(q=>String(q.status||'new').toLowerCase()!=='answered'&&String(q.status||'new').toLowerCase()!=='archived');return '<section class="panel-card"><h3>'+tr('questions')+'</h3><p class="muted small">'+tr('anonNote')+'</p>'+(!rows.length?'<div class="empty">'+tr('empty')+'</div>':rows.map(renderQuestionCard).join(''))+'</section>'}
function renderQuestionCard(q){const email=q.author_email||q.email||'';const status=q.status||'new';return '<article class="request-card"><div class="req-head"><div><div class="req-name">'+h(q.author_name||'-')+'</div><div class="req-meta">'+h(email)+' · '+h(q.language||'')+' · '+h(getCreated(q))+'</div></div>'+pillStatus(status)+'</div><p><strong>'+tr('question')+':</strong> '+h(q.question_text||q.question||'')+'</p><textarea id="answer_'+q.id+'" placeholder="'+tr('answer')+'">'+h(q.answer_text||'')+'</textarea><div class="actions three"><button class="btn primary" onclick="answerQuestion(\''+q.id+'\')">'+tr('saveAnswer')+'</button><a class="btn secondary" href="'+h(mailto(email,tr('mailSubject'),tr('mailBody')))+'">✉️ '+tr('emailUser')+'</a><button class="btn ghost" onclick="archiveQuestion(\''+q.id+'\')">'+tr('archive')+'</button></div></article>'}
function renderMeetings(){const s=state.meeting||{};return '<section class="panel-card"><h3>'+tr('meetings')+'</h3><p class="muted small">'+tr('onlyMeetingVisible')+'</p><div class="grid2"><input id="ms_provider" placeholder="'+tr('provider')+'" value="'+h(s.provider||'FreeConferenceCall')+'"><input id="ms_meeting_url" class="ltr" placeholder="'+tr('meetingUrl')+'" value="'+h(s.meeting_url||'')+'"></div><div class="grid2"><input id="ms_security_code" class="ltr" placeholder="'+tr('securityCode')+'" value="'+h(s.security_code||'')+'"><textarea id="ms_extra_info" placeholder="'+tr('extraInfo')+'">'+h(s.extra_info||defaultMeetingNote())+'</textarea></div><button class="btn primary" onclick="saveMeetingSettings()">'+tr('saveSettings')+'</button><p id="meetingMsg" class="muted small"></p></section>'}
function defaultMeetingNote(){return lang==='fa'?'جلسه دعا هر روز ساعت ۵ صبح به وقت کرواسی برگزار می‌شود. برای ورود، روی لینک جلسه بزنید و فقط کد امنیتی را وارد کنید.':lang==='hr'?'Molitveni sastanak održava se svaki dan u 05:00 po hrvatskom vremenu. Za ulazak otvorite poveznicu i unesite samo sigurnosni kod.':'Prayer meeting is held daily at 05:00 Croatia time. To join, open the meeting link and enter only the security code.'}
async function saveMeetingSettings(){const payload={id:'active',provider:document.getElementById('ms_provider').value.trim()||'FreeConferenceCall',meeting_url:document.getElementById('ms_meeting_url').value.trim(),phone_number:'',access_code:'',security_code:document.getElementById('ms_security_code').value.trim(),extra_info:document.getElementById('ms_extra_info').value.trim(),updated_at:new Date().toISOString()};try{await authFetch('/rest/v1/meeting_settings?on_conflict=id',{method:'POST',headers:{'Prefer':'resolution=merge-duplicates,return=representation'},body:JSON.stringify(payload)});document.getElementById('meetingMsg').innerHTML='<span class="success">'+tr('saved')+'</span>';await loadAll(true)}catch(e){document.getElementById('meetingMsg').innerHTML='<span class="danger">'+h(e.message)+'</span>'}}
function renderMessages(){return '<section class="panel-card"><h3>'+tr('messages')+'</h3><p class="muted small">'+(lang==='fa'?'این بخش فقط آخرین پیام‌های صندوق ورودی ابری را نشان می‌دهد. اصلاح کامل حذف پیام‌ها را در نسخه بعدی اپ انجام می‌دهیم.':lang==='hr'?'Ovdje se prikazuju zadnje poruke iz cloud inboxa. Potpuni popravak brisanja poruka ide u sljedeće izdanje aplikacije.':'This shows the latest cloud inbox messages. Full inbox deletion logic will be fixed in the next app version.')+'</p>'+(!state.messages.length?'<div class="empty">'+tr('empty')+'</div>':state.messages.map(m=>'<article class="request-card"><div class="req-name">'+h(m.title||m.subject||'-')+'</div><div class="req-meta">'+h(m.user_email||m.device_id||'global')+' · '+h(m.language||'')+' · '+h(m.delivered_at||m.created_at||'')+'</div><p>'+h(m.body||m.message||m.content||'')+'</p></article>').join(''))+'</section>'}
function renderBody(){if(state.loading)return '<div class="empty">...</div>';if(state.lastError)return '<div class="notice">'+h(state.lastError)+'<br>'+tr('setup')+'</div>'+renderActivePanel();return renderActivePanel()}
function renderActivePanel(){if(activeTab==='approved')return renderRequests(true);if(activeTab==='qa')return renderQa();if(activeTab==='meetings')return renderMeetings();if(activeTab==='messages')return renderMessages();return renderRequests(false)}
function render(){document.documentElement.lang=lang;document.body.dir=lang==='fa'?'rtl':'ltr';const app=document.getElementById('adminApp');app.innerHTML=!token?renderLogin():renderTop()+renderBody()+'<button class="fab-refresh" onclick="loadAll()">⟳</button>';}
render();
if(token)loadAll(true);
if(refreshTimer)clearInterval(refreshTimer);
refreshTimer=setInterval(()=>{if(token)loadAll(true)},60000);
</script>
</body>
</html>
