function tr(k){return (T[lang]&&T[lang][k])||k}
function h(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]))}
function setLang(l){lang=l;localStorage.setItem('nh7_admin_lang',l);document.documentElement.lang=l;document.body.dir=l==='fa'?'rtl':'ltr';render()}
function setTab(t){activeTab=t;localStorage.setItem('nh7_admin_tab',t);render()}
function isApproved(s){return String(s||'').toLowerCase()==='approved'}
function isRejected(s){return ['rejected','denied','blocked'].includes(String(s||'').toLowerCase())}
function isPending(s){return !isApproved(s)&&!isRejected(s)&&String(s||'').toLowerCase()!=='archived'}
function pillStatus(s){const st=String(s||'pending');const cls=isApproved(st)?'approved':isRejected(st)?'rejected':'pending';return '<span class="pill '+cls+'">'+h(st)+'</span>'}
function normEmailValue(v){return String(v||'').trim().toLowerCase()}
function getType(r){return String(r?.type||normalizePayload(r?.payload).kind||'registration')}
function registrationKey(r){const email=normEmailValue(getEmail(r));return email?getType(r)+'|'+email:''}
function duplicateRows(r){const key=registrationKey(r);return key?state.registrations.filter(x=>registrationKey(x)===key):[]}
function getEffectiveStatus(r){const raw=String(r?.status||'pending').toLowerCase();if(isApproved(raw)||isRejected(raw))return raw;const siblings=duplicateRows(r);return siblings.some(x=>isApproved(x.status))?'approved':raw}
function isEffectiveApproved(r){return isApproved(getEffectiveStatus(r))}
function isEffectivePending(r){return isPending(getEffectiveStatus(r))}

function normalizePayload(p){if(!p)return{};if(typeof p==='string'){try{return JSON.parse(p)}catch(e){return{raw:p}}}return p}
function getEmail(r){const p=normalizePayload(r.payload);return p.email||r.email||r.user_email||r.author_email||''}
function getName(r){const p=normalizePayload(r.payload);return (p.fullName||p.name||((p.firstName||'')+' '+(p.lastName||'')).trim()||r.author_name||r.name||'-')}
function getPhone(r){const p=normalizePayload(r.payload);return p.phone||p.whatsapp||r.phone||''}
function getDevice(r){const p=normalizePayload(r?.payload);return r?.device_id||r?.deviceId||p.device_id||p.deviceId||p.device||''}
function getCreated(r){return r.created_at?new Date(r.created_at).toLocaleString(lang==='fa'?'fa-IR':lang==='hr'?'hr-HR':'en-US'):''}
function jwtExpiredText(t){return String(t||'').includes('PGRST303')||String(t||'').toLowerCase().includes('jwt expired')}
async function refreshAdminSession(){if(!refreshToken)return false;try{const r=await fetch(SUPABASE_URL+'/auth/v1/token?grant_type=refresh_token',{method:'POST',headers:{apikey:SUPABASE_KEY,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:refreshToken})});if(!r.ok)return false;const d=await r.json();token=d.access_token;refreshToken=d.refresh_token||refreshToken;localStorage.setItem('nh7_admin_token',token);localStorage.setItem('nh7_admin_refresh_token',refreshToken);return true}catch(e){return false}}
async function authFetch(path,opt={}){
  const makeHeaders=()=>Object.assign({apikey:SUPABASE_KEY,Authorization:'Bearer '+(token||SUPABASE_KEY),'Content-Type':'application/json',Prefer:'return=representation'},opt.headers||{});
  let r=await fetch(SUPABASE_URL+path,Object.assign({},opt,{headers:makeHeaders()}));
  if(!r.ok){const txt=await r.text();if(jwtExpiredText(txt)&&await refreshAdminSession()){r=await fetch(SUPABASE_URL+path,Object.assign({},opt,{headers:makeHeaders()}));if(r.ok)return r.status===204?null:r.json()}if(jwtExpiredText(txt)){logout();alert(lang==='fa'?'نشست ادمین منقضی شد. دوباره وارد شوید.':'Admin session expired. Sign in again.')}throw new Error(txt)}
  return r.status===204?null:r.json();
}
async function adminRpc(name,payload={}){return authFetch('/rest/v1/rpc/'+name,{method:'POST',body:JSON.stringify(payload)})}

async function signIn(){const email=document.getElementById('email').value.trim();const password=document.getElementById('password').value;const r=await fetch(SUPABASE_URL+'/auth/v1/token?grant_type=password',{method:'POST',headers:{apikey:SUPABASE_KEY,'Content-Type':'application/json'},body:JSON.stringify({email,password})});if(!r.ok){alert(await r.text());return}const data=await r.json();token=data.access_token;refreshToken=data.refresh_token||'';localStorage.setItem('nh7_admin_token',token);if(refreshToken)localStorage.setItem('nh7_admin_refresh_token',refreshToken);await loadAll();render()}
function logout(){localStorage.removeItem('nh7_admin_token');localStorage.removeItem('nh7_admin_refresh_token');token='';refreshToken='';state={registrations:[],questions:[],messages:[],meeting:{},sermons:[],categories:[],schedules:[],dailyContent:[],legacyAudio:[],loading:false,lastError:''};render()}
async function loadAll(silent=false){if(!token)return;state.loading=true;if(!silent)render();try{const results=await Promise.allSettled([
  authFetch('/rest/v1/registrations?select=*&order=created_at.desc&limit=2000'),
  authFetch('/rest/v1/qa_questions?select=*&order=created_at.desc&limit=500'),
  authFetch('/rest/v1/notification_inbox?select=*&order=delivered_at.desc&limit=100'),
  authFetch('/rest/v1/meeting_settings?select=*&id=eq.active&limit=1'),
  authFetch('/rest/v1/sermon_categories?select=*&order=sort_order.asc,created_at.desc'),
  authFetch('/rest/v1/sermons?select=*&order=sort_order.asc,published_at.desc'),
  authFetch('/rest/v1/notification_schedules?select=*&order=sort_order.asc'),
  authFetch('/rest/v1/daily_content?select=*&order=content_type.asc,day_number.asc'),
  fetch('./data/audio/messages.json',{cache:'no-store'}).then(r=>{if(!r.ok)throw new Error('legacy audio');return r.json()})
]);const [registrations,questions,msgs,meeting,categories,sermons,schedules,dailyContent,legacyAudio]=results;state.registrations=registrations.status==='fulfilled'?(registrations.value||[]):state.registrations;state.questions=questions.status==='fulfilled'?(questions.value||[]):state.questions;state.messages=msgs.status==='fulfilled'?(msgs.value||[]):state.messages;state.meeting=meeting.status==='fulfilled'?((meeting.value||[])[0]||{}):state.meeting;state.categories=categories.status==='fulfilled'?(categories.value||[]):state.categories;state.sermons=sermons.status==='fulfilled'?(sermons.value||[]):state.sermons;state.schedules=schedules.status==='fulfilled'?(schedules.value||[]):state.schedules;state.dailyContent=dailyContent.status==='fulfilled'?(dailyContent.value||[]):state.dailyContent;state.legacyAudio=legacyAudio.status==='fulfilled'?((legacyAudio.value?.categories||[]).flatMap(c=>(c.items||[]).map(i=>Object.assign({legacy_category:c},i)))):state.legacyAudio;state.lastError=[registrations,questions,meeting].filter(x=>x.status==='rejected').map(x=>x.reason.message).join('\n');notifyIfNew()}catch(e){state.lastError=e.message}finally{state.loading=false;render(false)}}
function counts(){const pending=state.registrations.filter(r=>isEffectivePending(r)).length;const approved=state.registrations.filter(r=>isEffectiveApproved(r)).length;const newQ=state.questions.filter(q=>String(q.status||'new').toLowerCase()!=='answered'&&String(q.status||'new').toLowerCase()!=='archived').length;return{pending,approved,newQ}}
function notifyIfNew(){const c=counts();if(('Notification' in window)&&Notification.permission==='granted'){if(c.pending>lastCounts.pending)new Notification('OmideNo7 Admin',{body:c.pending+' '+tr('newRequests'),icon:'assets/admin-icon-192.png'});if(c.newQ>lastCounts.questions)new Notification('OmideNo7 Admin',{body:c.newQ+' '+tr('newQuestions'),icon:'assets/admin-icon-192.png'});}lastCounts={pending:c.pending,questions:c.newQ};localStorage.setItem('nh7_admin_last_counts',JSON.stringify(lastCounts));document.title=(c.pending+c.newQ?('('+(c.pending+c.newQ)+') '):'')+'OmideNo7 Admin'}
async function enableAlerts(){if(!('Notification'in window)){alert('Notifications are not supported on this browser.');return}const p=await Notification.requestPermission();alert(p==='granted'?tr('saved'):p)}
async function updateStatus(id,status){try{setMessage(tr('saving'));await authFetch('/rest/v1/registrations?id=eq.'+encodeURIComponent(id),{method:'PATCH',body:JSON.stringify({status,updated_at:new Date().toISOString()})});setMessage(status==='approved'?tr('approvedMsg'):tr('rejectedMsg'),'success');await loadAll(true)}catch(e){setMessage(e.message,'danger');alert(e.message)}}
async function deleteRequest(id){if(!confirm(tr('confirmDelete')))return;try{try{await adminRpc('nh7_admin_delete_registration',{p_id:id})}catch(rpcErr){console.warn('RPC delete failed, trying REST delete',rpcErr);await authFetch('/rest/v1/registrations?id=eq.'+encodeURIComponent(id),{method:'DELETE'})}setMessage(tr('deletedMsg'),'success');await loadAll(true)}catch(e){const msg=tr('needAdminSql')+'\n'+e.message;setMessage(msg,'danger');alert(msg)}}
async function syncDuplicateStatuses(){if(!confirm(tr('syncStatuses')+'؟'))return;try{setMessage(tr('saving'));await adminRpc('nh7_admin_sync_duplicate_registration_statuses',{});setMessage(tr('syncDone'),'success');await loadAll(true)}catch(e){const msg=tr('needAdminSql')+'\n'+e.message;setMessage(msg,'danger');alert(msg)}}
async function cleanupRegistrationDuplicates(){if(!confirm(tr('dedupe')+'؟'))return;try{setMessage(tr('saving'));await adminRpc('nh7_admin_cleanup_registration_duplicates',{p_email:null,p_type:null});setMessage(tr('dedupeDone'),'success');await loadAll(true)}catch(e){const msg=tr('needAdminSql')+'\n'+e.message;setMessage(msg,'danger');alert(msg)}}
async function cleanupRegistrationDuplicatesFor(email,type){if(!email){alert(tr('noEmail'));return}if(!confirm(tr('deleteDupEmail')+'\n'+email+'؟'))return;try{setMessage(tr('saving'));await adminRpc('nh7_admin_cleanup_registration_duplicates',{p_email:email,p_type:type||null});setMessage(tr('dedupeDone'),'success');await loadAll(true)}catch(e){const msg=tr('needAdminSql')+'\n'+e.message;setMessage(msg,'danger');alert(msg)}}
async function answerQuestion(id){const answer=(document.getElementById('answer_'+id)?.value||'').trim();if(!answer){alert(tr('answer'));return}try{await authFetch('/rest/v1/qa_questions?id=eq.'+encodeURIComponent(id),{method:'PATCH',body:JSON.stringify({answer_text:answer,status:'answered',answered_at:new Date().toISOString(),updated_at:new Date().toISOString()})});setMessage(tr('saved'),'success');await loadAll(true)}catch(e){setMessage(e.message,'danger');alert(e.message)}}
async function archiveQuestion(id){try{await authFetch('/rest/v1/qa_questions?id=eq.'+encodeURIComponent(id),{method:'PATCH',body:JSON.stringify({status:'archived',updated_at:new Date().toISOString()})});await loadAll(true)}catch(e){alert(e.message)}}
async function deleteQuestion(id){if(!confirm(tr('confirmDelete')))return;try{await authFetch('/rest/v1/qa_questions?id=eq.'+encodeURIComponent(id),{method:'DELETE'});setMessage(tr('deletedMsg'),'success');await loadAll(true)}catch(e){setMessage(e.message,'danger');alert(e.message)}}
function setMessage(msg,type='muted'){const el=document.getElementById('adminMsg');if(el)el.className=type,el.textContent=msg}
function mailto(email,subject,body){if(!email)return '#';return 'mailto:'+encodeURIComponent(email)+'?subject='+encodeURIComponent(subject)+'&body='+encodeURIComponent(body)}
function emailActionHtml(email,subject,body,label){if(!email)return '<button type="button" class="btn ghost" disabled title="'+h(tr('noEmail'))+'">✉️ '+h(label)+' — '+h(tr('noEmail'))+'</button>';return '<a class="btn secondary" href="'+h(mailto(email,subject,body))+'">✉️ '+h(label)+'</a>'}
function inboxActionHtml(email,device,name){if(!email&&!device)return '<button type="button" class="btn ghost" disabled title="'+h(tr('inboxTargetMissing'))+'">📥 '+h(tr('sendInbox'))+'</button>';return '<button type="button" class="btn secondary" onclick="sendInboxMessage(decodeURIComponent(\''+encodeURIComponent(email||'')+'\'),decodeURIComponent(\''+encodeURIComponent(device||'')+'\'),decodeURIComponent(\''+encodeURIComponent(name||'')+'\'))">📥 '+h(tr('sendInbox'))+'</button>'}
function requestEmailLink(r){const email=getEmail(r);const name=getName(r);return mailto(email,tr('mailSubject'),tr('mailBody')+'\n\n'+tr('name')+': '+name+'\n'+tr('email')+': '+email)}
function findRegistrationForQuestion(q){const qp=normalizePayload(q.payload);const qEmail=String(q.author_email||q.email||q.user_email||qp.author_email||qp.email||qp.user_email||'').trim().toLowerCase();const qDevice=String(q.device_id||q.deviceId||qp.device_id||qp.deviceId||'').trim();if(qEmail){const byEmail=state.registrations.find(r=>String(getEmail(r)||'').trim().toLowerCase()===qEmail);if(byEmail)return byEmail;}if(qDevice){const byDevice=state.registrations.find(r=>String(r.device_id||normalizePayload(r.payload).device_id||'').trim()===qDevice);if(byDevice)return byDevice;}return null}
function getQuestionEmail(q){const p=normalizePayload(q.payload);const direct=q.author_email||q.email||q.user_email||p.author_email||p.email||p.user_email||'';if(direct)return String(direct).trim().toLowerCase();const reg=findRegistrationForQuestion(q);return reg?getEmail(reg):''}
function getQuestionName(q){const p=normalizePayload(q.payload);const direct=q.author_name||q.name||q.user_name||q.full_name||p.author_name||p.name||p.fullName||p.full_name||String((p.firstName||'')+' '+(p.lastName||'')).trim();if(direct)return direct;const reg=findRegistrationForQuestion(q);return reg?getName(reg):'-'}
function getQuestionDevice(q){const p=normalizePayload(q?.payload);const direct=q?.device_id||q?.deviceId||p.device_id||p.deviceId||p.device||'';if(direct)return direct;const reg=findRegistrationForQuestion(q);return reg?getDevice(reg):''}
function getQuestionContactHtml(q){const name=getQuestionName(q);const email=getQuestionEmail(q);const reg=findRegistrationForQuestion(q);const phone=reg?getPhone(reg):(q.phone||normalizePayload(q.payload).phone||'');return '<div class="detail-box contact-box"><div class="detail-row"><strong>'+h(tr('name'))+'</strong><span>'+h(name||'-')+'</span></div><div class="detail-row"><strong>'+h(tr('email'))+'</strong><span>'+h(email||tr('noEmail'))+'</span></div>'+(phone?'<div class="detail-row"><strong>Phone</strong><span>'+h(phone)+'</span></div>':'')+'</div>'}
function detailRows(obj){const p=normalizePayload(obj.payload)||obj;const priority=['firstName','lastName','fullName','name','email','phone','birthDate','city','country','spiritualAge','churchMember','churchName','pastorName','waterBaptism','salvationPrayer','eventsInterest','howFound','testimony','submittedAt','reason','message','raw'];const keys=[...priority.filter(k=>p[k]),...Object.keys(p).filter(k=>!priority.includes(k)&&p[k])];if(!keys.length)return '<p class="muted">-</p>';return keys.map(k=>'<div class="detail-row"><strong>'+h(k)+'</strong><span>'+h(Array.isArray(p[k])?p[k].join(', '):p[k])+'</span></div>').join('')}
function renderLogin(){return '<div class="hero"><h2>'+tr('title')+'</h2><p>'+tr('sub')+'</p></div><section class="card"><h2>'+tr('login')+'</h2><input id="email" autocomplete="username" placeholder="'+tr('email')+'" value="omideno7church@gmail.com"><input id="password" autocomplete="current-password" type="password" placeholder="'+tr('password')+'"><button class="btn primary" onclick="signIn()">'+tr('signIn')+'</button><p class="muted small">'+tr('setup')+'</p></section>'}
function renderTop(){const c=counts();return '<div class="topbar"><div class="brand"><img src="assets/admin-icon-192.png" alt=""><div><h1>'+tr('title')+'</h1><p>'+tr('sub')+'</p></div></div><div class="top-actions"><select onchange="setLang(this.value)"><option value="fa" '+(lang==='fa'?'selected':'')+'>فارسی</option><option value="en" '+(lang==='en'?'selected':'')+'>English</option><option value="hr" '+(lang==='hr'?'selected':'')+'>Hrvatski</option></select><button class="btn secondary" onclick="loadAll()">⟳ '+tr('refresh')+'</button><button class="btn ghost" onclick="enableAlerts()">🔔 '+tr('enableAlerts')+'</button><button class="btn danger-btn" onclick="logout()">'+tr('logout')+'</button></div></div><div class="stats"><div class="stat"><b>'+c.pending+'</b><span>'+tr('newRequests')+'</span></div><div class="stat"><b>'+c.newQ+'</b><span>'+tr('newQuestions')+'</span></div><div class="stat"><b>'+c.approved+'</b><span>'+tr('totalApproved')+'</span></div></div><div id="adminMsg" class="muted small"></div>'+tabsHtml()}
function tabsHtml(){const c=counts();const tabs=[['requests',tr('requests'),c.pending],['approved',tr('approvedUsers'),0],['qa',tr('questions'),c.newQ],['sermons',tr('sermons'),0],['notifications',tr('notificationCenter'),0],['dailycontent',lang==='fa'?'محتوای روزانه':lang==='hr'?'Dnevni sadržaj':'Daily Content',0],['meetings',tr('meetings'),0],['messages',tr('messages'),0]];return '<nav class="tabs">'+tabs.map(([id,label,b])=>'<button class="tab '+(activeTab===id?'active':'')+'" onclick="setTab(\''+id+'\')">'+label+(b?'<span class="badge">'+b+'</span>':'')+'</button>').join('')+'</nav>'}
function renderRequests(approvedOnly=false){let rows=state.registrations.slice();if(approvedOnly)rows=rows.filter(r=>isEffectiveApproved(r));else if(currentFilter==='pending')rows=rows.filter(r=>isEffectivePending(r));else if(currentFilter==='approved')rows=rows.filter(r=>isEffectiveApproved(r));else if(currentFilter==='rejected')rows=rows.filter(r=>isRejected(getEffectiveStatus(r)));if(currentSearch){const q=currentSearch.toLowerCase();rows=rows.filter(r=>(getName(r)+' '+getEmail(r)+' '+getPhone(r)+' '+JSON.stringify(r.payload||{})).toLowerCase().includes(q))}const adminTools=!approvedOnly?'<button class="btn secondary" onclick="syncDuplicateStatuses()">✅ '+tr('syncStatuses')+'</button><button class="btn danger-btn" onclick="cleanupRegistrationDuplicates()">🧹 '+tr('dedupe')+'</button>':'';return '<section class="panel-card"><h3>'+(approvedOnly?tr('approvedUsers'):tr('requests'))+'</h3><div class="toolbar"><input placeholder="'+tr('search')+'" value="'+h(currentSearch)+'" oninput="currentSearch=this.value;render()">'+(!approvedOnly?'<select onchange="currentFilter=this.value;render()"><option value="pending" '+(currentFilter==='pending'?'selected':'')+'>'+tr('pending')+'</option><option value="all" '+(currentFilter==='all'?'selected':'')+'>'+tr('all')+'</option><option value="approved" '+(currentFilter==='approved'?'selected':'')+'>'+tr('approved')+'</option><option value="rejected" '+(currentFilter==='rejected'?'selected':'')+'>'+tr('rejected')+'</option></select>'+adminTools:'')+'</div>'+(!rows.length?'<div class="empty">'+tr('empty')+'</div>':rows.map(renderRequestCard).join(''))+'</section>'}
function renderRequestCard(r){const name=getName(r);const email=getEmail(r);const phone=getPhone(r);const device=getDevice(r);const type=getType(r);const raw=String(r.status||'pending');const effective=getEffectiveStatus(r);const dups=duplicateRows(r);const dupCount=Math.max(0,dups.length-1);const statusHtml=pillStatus(effective)+(effective!==raw?'<span class="db-status">'+tr('rawStatus')+': '+h(raw)+'</span>':'');const dupHtml=dupCount?'<div class="dup-note">'+dupCount+' '+tr('duplicates')+' — '+tr('effectiveStatus')+': '+h(effective)+'</div>':'';const dupBtn=(email&&dupCount)?'<button class="btn danger-btn" onclick="cleanupRegistrationDuplicatesFor(decodeURIComponent(\''+encodeURIComponent(email)+'\'),decodeURIComponent(\''+encodeURIComponent(type)+'\'))">🧹 '+tr('deleteDupEmail')+'</button>':'';return '<article class="request-card"><div class="req-head"><div><div class="req-name">'+h(name)+'</div><div class="req-meta">'+h(type)+' · '+h(getCreated(r))+'<br>'+h(email)+(phone?' · '+h(phone):'')+'</div>'+dupHtml+'</div>'+statusHtml+'</div><details class="detail-box"><summary>'+tr('details')+'</summary><div class="detail-row"><strong>'+tr('rawStatus')+'</strong><span>'+h(raw)+'</span></div><div class="detail-row"><strong>'+tr('effectiveStatus')+'</strong><span>'+h(effective)+'</span></div>'+detailRows(r)+'</details><div class="actions three"><button class="btn primary" onclick="updateStatus(\''+r.id+'\',\'approved\')">✅ '+tr('approve')+'</button><button class="btn ghost" onclick="updateStatus(\''+r.id+'\',\'rejected\')">⛔ '+tr('reject')+'</button>'+emailActionHtml(email,tr('mailSubject'),tr('mailBody')+'\n\n'+tr('name')+': '+name+'\n'+tr('email')+': '+email,tr('emailUser'))+inboxActionHtml(email,device,name)+'</div><div class="actions"><button class="btn danger-btn" onclick="deleteRequest(\''+r.id+'\')">🗑 '+tr('delete')+'</button>'+dupBtn+'</div></article>'}
function renderQa(){let rows=state.questions.slice();const unanswered=rows.filter(q=>String(q.status||'new').toLowerCase()!=='answered'&&String(q.status||'new').toLowerCase()!=='archived');return '<section class="panel-card"><h3>'+tr('questions')+'</h3><p class="muted small">'+tr('anonNote')+'</p>'+(!rows.length?'<div class="empty">'+tr('empty')+'</div>':rows.map(renderQuestionCard).join(''))+'</section>'}
function renderQuestionCard(q){const email=getQuestionEmail(q);const name=getQuestionName(q);const device=getQuestionDevice(q);const status=q.status||'new';const mailBody=tr('mailBody')+'\n\n'+tr('question')+': '+(q.question_text||q.question||'');return '<article class="request-card"><div class="req-head"><div><div class="req-name">'+h(name||'-')+'</div><div class="req-meta">'+h(email||tr('noEmail'))+' · '+h(q.language||'')+' · '+h(getCreated(q))+'</div></div>'+pillStatus(status)+'</div>'+getQuestionContactHtml(q)+'<p><strong>'+tr('question')+':</strong> '+h(q.question_text||q.question||'')+'</p><textarea id="answer_'+q.id+'" placeholder="'+tr('answer')+'">'+h(q.answer_text||'')+'</textarea><div class="actions three"><button class="btn primary" onclick="answerQuestion(\''+q.id+'\')">'+tr('saveAnswer')+'</button>'+emailActionHtml(email,tr('mailSubject'),mailBody,tr('emailUser'))+inboxActionHtml(email,device,name)+'<button class="btn ghost" onclick="archiveQuestion(\''+q.id+'\')">'+tr('archive')+'</button></div><div class="actions"><button class="btn danger-btn" onclick="deleteQuestion(\''+q.id+'\')">🗑 '+tr('delete')+'</button></div></article>'}
function renderMeetings(){const s=state.meeting||{};return '<section class="panel-card"><h3>'+tr('meetings')+'</h3><p class="muted small">'+tr('onlyMeetingVisible')+'</p><div class="grid2"><input id="ms_provider" placeholder="'+tr('provider')+'" value="'+h(s.provider||'FreeConferenceCall')+'"><input id="ms_meeting_url" class="ltr" placeholder="'+tr('meetingUrl')+'" value="'+h(s.meeting_url||'')+'"></div><div class="grid2"><input id="ms_security_code" class="ltr" placeholder="'+tr('securityCode')+'" value="'+h(s.security_code||'')+'"><textarea id="ms_extra_info" placeholder="'+tr('extraInfo')+'">'+h(s.extra_info||defaultMeetingNote())+'</textarea></div><button class="btn primary" onclick="saveMeetingSettings()">'+tr('saveSettings')+'</button><p id="meetingMsg" class="muted small"></p></section>'}

function uuid(){return (crypto&&crypto.randomUUID)?crypto.randomUUID():'xxxxxxxx-xxxx-4xxx-yxxx-xxxxxxxxxxxx'.replace(/[xy]/g,c=>{const r=Math.random()*16|0,v=c==='x'?r:(r&3|8);return v.toString(16)})}

function cleanAudioTitle(name){return String(name||'').replace(/\.[^.]+$/,'').replace(/[_-]+/g,' ').replace(/\s+/g,' ').trim()}
function formatDurationClock(seconds){seconds=Math.max(0,Math.round(Number(seconds)||0));const h=Math.floor(seconds/3600),m=Math.floor((seconds%3600)/60),s=seconds%60;return h?`${h}:${String(m).padStart(2,'0')}:${String(s).padStart(2,'0')}`:`${m}:${String(s).padStart(2,'0')}`}
function parseDurationClock(value){const p=String(value||'').trim().split(':').map(Number);if(p.some(x=>!Number.isFinite(x)))return 0;if(p.length===3)return Math.max(0,Math.round(p[0]*3600+p[1]*60+p[2]));if(p.length===2)return Math.max(0,Math.round(p[0]*60+p[1]));const n=Number(value);return Number.isFinite(n)?Math.max(0,Math.round(n*60)):0}
function inspectSermonAudio(file){if(!file)return;sermonAudioFile=file;const clean=cleanAudioTitle(file.name);if(!String(sermonDraft.title_fa||'').trim())sermonDraft.title_fa=clean;const url=URL.createObjectURL(file),probe=document.createElement('audio');probe.preload='metadata';probe.onloadedmetadata=()=>{if(Number.isFinite(probe.duration)&&probe.duration>0){sermonDraft.duration_seconds=Math.round(probe.duration);sermonDraft.duration_minutes=Math.round((probe.duration/60)*100)/100}URL.revokeObjectURL(url);render()};probe.onerror=()=>{URL.revokeObjectURL(url);render()};probe.src=url}
function safeName(name){return String(name||'file').toLowerCase().replace(/[^a-z0-9._-]+/g,'-').replace(/^-+|-+$/g,'')}
async function storageUpload(file,folder){if(!file)return'';const path=folder+'/'+Date.now()+'-'+safeName(file.name);const r=await fetch(SUPABASE_URL+'/storage/v1/object/church-audio/'+path,{method:'POST',headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+token,'x-upsert':'true','Content-Type':file.type||'application/octet-stream'},body:file});if(!r.ok)throw new Error(await r.text());return SUPABASE_URL+'/storage/v1/object/public/church-audio/'+path}

function renderDailyContent(){const x=dailyContentFormItem(),d=x.content_data||{};const type=x.content_type||'daily_word';const rows=state.dailyContent.filter(r=>r.content_type===type).sort((a,b)=>a.day_number-b.day_number);return '<section class="panel-card"><h3>'+(lang==='fa'?'مدیریت محتوای روزانه':'Daily Content Management')+'</h3><div class="grid2"><select id="dc_type" onchange="editingDailyContentId=\'\';render()"><option value="daily_word" '+(type==='daily_word'?'selected':'')+'>Daily Word</option><option value="faith" '+(type==='faith'?'selected':'')+'>Faith</option><option value="daily_juice" '+(type==='daily_juice'?'selected':'')+'>Daily Juice</option></select><input id="dc_day" type="number" min="1" value="'+h(x.day_number||1)+'"></div><input id="dc_ref" placeholder="Bible reference" value="'+h(dcVal(d,'mainVerse.reference'))+'">'+['fa','en','hr'].map(l=>'<h4>'+l.toUpperCase()+'</h4><input id="dc_title_'+l+'" placeholder="Title" value="'+h(dcVal(d,'title.'+l))+'"><textarea id="dc_verse_'+l+'" placeholder="Verse text">'+h(dcVal(d,'mainVerse.text.'+l))+'</textarea><textarea id="dc_message_'+l+'" placeholder="Message / Proclamation">'+h(dcVal(d,(type==='faith'?'proclamation':'message')+'.'+l))+'</textarea><textarea id="dc_prayer_'+l+'" placeholder="Prayer / Action step">'+h(dcVal(d,(type==='daily_juice'?'actionStep':'prayer')+'.'+l))+'</textarea>').join('')+'<label><input id="dc_active" type="checkbox" '+(x.is_active!==false?'checked':'')+'> Active</label><div class="actions"><button class="btn primary" onclick="saveDailyContent()">'+tr('save')+'</button><button class="btn ghost" onclick="editingDailyContentId=\'\';render()">New</button></div></section><section class="panel-card"><h3>'+dailyContentLabel(type)+'</h3>'+rows.map(r=>'<article class="request-card"><div class="req-head"><div><b>Day '+r.day_number+'</b><div class="req-meta">'+h(dcVal(r.content_data,'title.'+lang)||dcVal(r.content_data,'title.en'))+'</div></div><span class="pill '+(r.is_active?'approved':'rejected')+'">'+(r.is_active?'Active':'Inactive')+'</span></div><div class="actions"><button class="btn secondary" onclick="editingDailyContentId=\''+r.id+'\';render()">Edit</button><button class="btn danger-btn" onclick="deleteDailyContent(\''+r.id+'\')">Delete</button></div></article>').join('')+'</section>'}
async function saveDailyContent(){const type=document.getElementById('dc_type').value,day=Number(document.getElementById('dc_day').value||1);const existing=editingDailyContentId?state.dailyContent.find(x=>x.id===editingDailyContentId):state.dailyContent.find(x=>x.content_type===type&&Number(x.day_number)===day);const d=JSON.parse(JSON.stringify(existing?.content_data||{}));d.day=day;d.title=d.title||{};d.mainVerse=d.mainVerse||{text:{}};d.mainVerse.text=d.mainVerse.text||{};const mainKey=type==='faith'?'proclamation':'message';d[mainKey]=d[mainKey]||{};const extraKey=type==='daily_juice'?'actionStep':'prayer';d[extraKey]=d[extraKey]||{};d.mainVerse.reference=document.getElementById('dc_ref').value.trim();['fa','en','hr'].forEach(l=>{d.title[l]=document.getElementById('dc_title_'+l).value;d.mainVerse.text[l]=document.getElementById('dc_verse_'+l).value;d[mainKey][l]=document.getElementById('dc_message_'+l).value;d[extraKey][l]=document.getElementById('dc_prayer_'+l).value});const payload={content_type:type,day_number:day,content_data:d,is_active:document.getElementById('dc_active').checked,sort_order:day,updated_at:new Date().toISOString()};try{if(existing)await authFetch('/rest/v1/daily_content?id=eq.'+existing.id,{method:'PATCH',body:JSON.stringify(payload)});else await authFetch('/rest/v1/daily_content',{method:'POST',body:JSON.stringify(payload)});editingDailyContentId='';await loadAll(true)}catch(e){alert(e.message)}}
async function deleteDailyContent(id){if(!confirm(tr('confirmDelete')))return;try{await authFetch('/rest/v1/daily_content?id=eq.'+id,{method:'DELETE'});editingDailyContentId='';await loadAll(true)}catch(e){alert(e.message)}}
async function cleanupNotificationDuplicates(){try{const n=await adminRpc('nh7_admin_cleanup_scheduled_inbox_duplicates',{});alert((lang==='fa'?'تعداد پیام‌های تکراری حذف‌شده: ':'Removed duplicates: ')+(n??0));await loadAll(true)}catch(e){alert(e.message)}}

function renderActivePanel(){if(activeTab==='approved')return renderRequests(true);if(activeTab==='qa')return renderQa();if(activeTab==='sermons')return renderSermons();if(activeTab==='notifications')return renderNotifications();if(activeTab==='dailycontent')return renderDailyContent();if(activeTab==='meetings')return renderMeetings();if(activeTab==='messages')return renderMessages();return renderRequests(false)}
function render(){document.documentElement.lang=lang;document.body.dir=lang==='fa'?'rtl':'ltr';const app=document.getElementById('adminApp');app.innerHTML=!token?renderLogin():renderTop()+renderBody()+'<button class="fab-refresh" onclick="loadAll()">⟳</button>';}
render();
if(token)loadAll(true);
if(refreshTimer)clearInterval(refreshTimer);
refreshTimer=setInterval(()=>{if(token)loadAll(true)},60000);
</script>
</body>
