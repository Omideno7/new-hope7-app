<!doctype html>
<html lang="en" dir="ltr">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="theme-color" content="#1d4ed8" />
  <title>OmideNo7 Church</title>
  <link rel="manifest" href="manifest.json?v=2.3.9" />
  <link rel="icon" href="assets/logo.png" />
  <link rel="stylesheet" href="css/styles.css?v=2.3.9" />
  <link rel="stylesheet" href="css/v2.2.0.css?v=2.3.9" />
  <link rel="stylesheet" href="css/v2.2.2.css?v=2.3.9" />
  <link rel="stylesheet" href="css/v2.2.3.css?v=2.3.9" />
  <link rel="stylesheet" href="css/v2.2.4.css?v=2.3.9" />
  <link rel="stylesheet" href="css/v2.3.0-access-bible.css?v=2.3.9" />
  <link rel="stylesheet" href="css/v2.3.4-my-notes.css?v=2.3.9" />
  <link rel="stylesheet" href="css/nh7-library-text-reader-v250.css?v=2.3.9-reader1" />
  <script>
    window.NH7_ONESIGNAL_APP_ID = '86f4116a-707a-4959-aa3f-7c703f57bf7e';
    window.NH7_VERSION = '2.3.9';
    window.NH7_BASE_PATH = new URL('.', window.location.href).pathname;
    window.OneSignalDeferred = window.OneSignalDeferred || [];
    OneSignalDeferred.push(async function(OneSignal) {
      try {
        await OneSignal.init({
          appId: window.NH7_ONESIGNAL_APP_ID,
          serviceWorkerPath: window.NH7_BASE_PATH + 'service-worker.js',
          serviceWorkerParam: { scope: window.NH7_BASE_PATH },
          notifyButton: { enable: false },
          allowLocalhostAsSecureOrigin: true
        });
      } catch (err) { console.warn('OneSignal init failed', err); }
    });
  </script>
  <script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>
</head>
<body>
  <div id="amenGate" class="amen-gate hidden" role="dialog" aria-modal="true">
    <div class="amen-card">
      <img src="assets/logo.png" alt="OmideNo7" class="amen-logo" />
      <h1 id="amenTitle">OmideNo7</h1>
      <p id="amenMessage">God is with you today.</p>
      <button id="amenButton" class="primary-btn">Amen</button>
    </div>
  </div>

  <div id="appShell" class="app-shell">
    <header class="topbar">
      <button id="backBtn" class="icon-btn hidden" aria-label="Back">‹</button>
      <div class="brand">
        <img src="assets/logo.png" alt="" />
        <div>
          <strong>OmideNo7 Church</strong>
          <small id="breadcrumb">Home</small>
        </div>
      </div>
      <button id="inboxBtn" class="icon-btn inbox-top-btn" aria-label="Inbox">📥<span id="inboxBadge" class="inbox-badge hidden">0</span></button>
      <select id="langSelect" class="lang-select" aria-label="Language">
        <option value="en">EN</option>
        <option value="fa">FA</option>
        <option value="hr">HR</option>
      </select>
    </header>

    <main id="view" class="view"></main>

    <nav class="bottom-nav" aria-label="Main navigation">
      <button data-route="home" class="nav-item active"><span>⌂</span><small data-i18n="nav.home">Home</small></button>
      <button data-route="daily" class="nav-item"><span>☀</span><small data-i18n="nav.daily">Daily</small></button>
      <button data-route="bible" class="nav-item"><span>📖</span><small data-i18n="nav.bible">Bible</small></button>
      <button data-route="plans" class="nav-item"><span>✓</span><small data-i18n="nav.plans">Plans</small></button>
      <button data-route="school" class="nav-item"><span>🎓</span><small data-i18n="nav.school">School</small></button>
      <button data-route="more" class="nav-item"><span>☰</span><small data-i18n="nav.more">More</small></button>
    </nav>
  </div>

  <template id="loadingTpl"><section class="card"><p>Loading...</p></section></template>
  <script src="https://cdn.jsdelivr.net/npm/mammoth@1.12.0/mammoth.browser.min.js" defer></script>
  <script src="js/nh7-access-bootstrap-v230.js?v=2.3.9"></script>
  <script src="js/app.js?v=2.3.9" type="module"></script>
  <script src="js/nh7-app-enhancements-v230.js?v=2.3.9" type="module"></script>
  <script src="js/nh7-my-notes-v234.js?v=2.3.9" type="module"></script>
  <script src="js/nh7-library-text-reader-v250.js?v=2.3.9-reader1" defer></script>
</body>
</html>
