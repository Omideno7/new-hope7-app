<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <meta name="robots" content="noindex,nofollow,noarchive" />
  <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate" />
  <meta http-equiv="Pragma" content="no-cache" />
  <meta http-equiv="Expires" content="0" />
  <title>New Hope 7 — Integration QA 3.6.3</title>
  <style>
    :root{font-family:system-ui,-apple-system,"Segoe UI",Tahoma,sans-serif;color-scheme:light}
    *{box-sizing:border-box}
    body{margin:0;min-height:100vh;display:grid;place-items:center;background:#eef4ff;color:#15213b;padding:24px}
    .loader{width:min(560px,100%);background:#fff;border:1px solid #d8e2f4;border-radius:20px;padding:28px;box-shadow:0 18px 55px rgba(34,62,112,.14);text-align:center}
    .logo{width:82px;height:82px;object-fit:contain;margin-bottom:12px}
    h1{font-size:21px;margin:0 0 10px}
    p{margin:7px 0;line-height:1.7}
    .muted{color:#667085;font-size:13px}
    .spinner{width:40px;height:40px;border:4px solid #dbe6ff;border-top-color:#1d4ed8;border-radius:50%;margin:20px auto 8px;animation:spin .8s linear infinite}
    .error{display:none;margin-top:18px;padding:14px;border-radius:12px;background:#fff1f1;color:#8a1c1c;text-align:right;white-space:pre-wrap}
    button{border:0;border-radius:10px;padding:11px 18px;background:#1d4ed8;color:#fff;font:700 14px inherit;cursor:pointer;margin-top:12px}
    @keyframes spin{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
  <main class="loader" id="qaLoader">
    <img class="logo" src="../../assets/logo.png" alt="New Hope 7" onerror="this.style.display='none'" />
    <h1>در حال آماده‌سازی نسخهٔ کامل آزمایشی New Hope 7</h1>
    <p>نسخهٔ جاری اپ، ۱۹ کتاب اپوکریفا، فایل‌های صوتی زنده، آیات ذخیره‌شده و ۹ کتاب منتشرنشده در حال یکپارچه‌سازی هستند.</p>
    <div class="spinner" aria-hidden="true"></div>
    <p class="muted">این صفحه فقط برای بررسی است و تغییرات آن هنوز وارد نسخهٔ اصلی نشده‌اند.</p>
    <div class="error" id="qaError"></div>
  </main>
  <script src="launcher-v363.js?v=3.6.3.2"></script>
</body>
</html>
