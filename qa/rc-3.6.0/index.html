<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">
  <title>New Hope 7 User QA — RC 3.6.0</title>
  <style>html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#07111d;color:#fff}main{min-height:100vh;display:grid;place-items:center;padding:24px;box-sizing:border-box;text-align:center}.box{max-width:580px}.spin{width:44px;height:44px;border:4px solid rgba(255,255,255,.2);border-top-color:#fff;border-radius:50%;margin:0 auto 18px;animation:s .85s linear infinite}@keyframes s{to{transform:rotate(360deg)}}small{opacity:.72}</style>
</head>
<body>
<main><div class="box"><div class="spin"></div><h2>New Hope 7 — Student Achievement QA</h2><p>Loading RC 3.6.0…</p><small>QA only — push identity, presence tracking and service-worker writes are disabled in this preview.</small></div></main>
<script>
(async()=>{
  const commit='a5225092c80bea44432d7527dc678180c02cdd57';
  const raw=`https://raw.githubusercontent.com/Omideno7/new-hope7-app/${commit}/index.html`;
  const assets=`https://raw.githack.com/Omideno7/new-hope7-app/${commit}/`;
  try{
    const r=await fetch(raw,{cache:'no-store'});if(!r.ok)throw new Error('App RC source HTTP '+r.status);
    let html=await r.text();
    html=html.replace('<head>','<head>\n  <base href="'+assets+'">\n  <meta name="robots" content="noindex,nofollow,noarchive">\n  <meta http-equiv="Cache-Control" content="no-store, no-cache, must-revalidate">');
    html=html.replace("if ('serviceWorker' in navigator) {","if (false && 'serviceWorker' in navigator) {");
    html=html.replace('OneSignalDeferred.push(async function(OneSignal) {','if(false) OneSignalDeferred.push(async function(OneSignal) {');
    html=html.replace(/\s*<script src="https:\/\/cdn\.onesignal\.com\/sdks\/web\/v16\/OneSignalSDK\.page\.js" defer><\/script>/,'');
    html=html.replace(/\s*<script src="js\/nh7-push-identity-v360\.js\?v=3\.6\.0" defer><\/script>/,'');
    html=html.replace(/\s*<script src="js\/nh7-app-presence-v360\.js\?v=3\.6\.0" defer><\/script>/,'');
    document.open();document.write(html);document.close();
  }catch(error){document.body.innerHTML='<main><div class="box"><h2>App preview could not load</h2><p>'+String(error&&error.message||error)+'</p></div></main>'}
})();
</script>
</body>
</html>
