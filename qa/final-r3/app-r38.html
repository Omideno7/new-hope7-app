<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="robots" content="noindex,nofollow,noarchive">
  <meta http-equiv="Cache-Control" content="no-store,no-cache,must-revalidate">
  <title>New Hope 7 — Final QA R3.8</title>
  <style>
    html,body{margin:0;min-height:100%;font-family:system-ui,-apple-system,"Segoe UI",Tahoma;background:#eef4ff;color:#13213d}
    main{min-height:100vh;display:grid;place-items:center;padding:24px;box-sizing:border-box}
    .box{width:min(610px,100%);background:#fff;border:1px solid #d8e4f4;border-radius:22px;padding:26px;text-align:center;box-shadow:0 18px 55px rgba(34,62,112,.13)}
    .spin{width:42px;height:42px;border:4px solid #dbe6fa;border-top-color:#1d4ed8;border-radius:50%;margin:18px auto;animation:s .8s linear infinite}
    .err{display:none;background:#fff0f0;color:#8f2323;padding:14px;border-radius:12px;white-space:pre-wrap;text-align:right;line-height:1.7}
    @keyframes s{to{transform:rotate(360deg)}}
  </style>
</head>
<body>
<main><div class="box">
  <h2>New Hope 7 — Final QA R3.8</h2>
  <p>در حال بازکردن نسخهٔ کامل آزمایشی روی دامنهٔ اصلی کلیسا…</p>
  <div class="spin"></div>
  <small>همان نشست حساب اپ اصلی + پلیر اختصاصی 3.9.7</small>
  <div id="err" class="err"></div>
</div></main>
<script>
(async()=>{'use strict';
  const SOURCE='https://raw.githubusercontent.com/Omideno7/new-hope7-app/495e91acda3469d8f2d57a77082f3c38edadfcb1/qa/final-r3/app.html?r38=1';
  const OLD_ASSETS='b1ffc0ac6c7c6c87fdae3fe0d8da0ab9d45262c8';
  const NEW_ASSETS='b5d77e0d25454b18788968babf80045af45f76da';
  const errorBox=document.getElementById('err');
  function fail(error){document.querySelector('.spin')?.remove();errorBox.style.display='block';errorBox.textContent='نسخهٔ R3.8 بارگذاری نشد.\n'+String(error?.message||error)}
  try{
    try{await caches.delete('nh7-audio-media-v396')}catch(_){}
    const remove=[];
    for(let i=0;i<localStorage.length;i++){const key=localStorage.key(i);if(key?.startsWith('nh7_audio_media_v396:'))remove.push(key)}
    remove.forEach(key=>localStorage.removeItem(key));
    const response=await fetch(SOURCE,{cache:'no-store'});
    if(!response.ok)throw new Error('QA source HTTP '+response.status);
    let html=await response.text();
    html=html
      .replace("if('serviceWorker'in navigator){try{for(const reg of await navigator.serviceWorker.getRegistrations())await reg.unregister()}catch(_){}}",'')
      .replaceAll(OLD_ASSETS,NEW_ASSETS)
      .replaceAll('nh7-audio-signed-v396.js','nh7-audio-signed-v397.js')
      .replaceAll('R3.6','R3.8')
      .replaceAll('r3_6','r3_8')
      .replaceAll('3.9.6','3.9.7')
      .replaceAll("396-'","397-'")
      .replaceAll('r3=396','r3=398')
      .replaceAll('v=3960','v=3980')
      .replace('Signed Audio ownership + Download/Offline','Same-origin QA + Custom Audio + Offline');
    document.open();document.write(html);document.close();
  }catch(error){fail(error)}
})();
</script>
</body>
</html>
