<!doctype html><html lang="fa" dir="rtl"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="robots" content="noindex,nofollow"><meta http-equiv="Cache-Control" content="no-store"><title>New Hope 7 Admin QA 3.9.5</title><style>:root{--b:#0b5faa;--g:#0f806b;--ink:#102033;--muted:#667085;--line:#d7e7e5;--red:#b42318}*{box-sizing:border-box}body{margin:0;background:#eef7f6;color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Tahoma}.shell{max-width:1050px;margin:auto;padding:14px 10px 60px}.hero{background:linear-gradient(135deg,var(--b),var(--g));color:#fff;border-radius:22px;padding:18px}.card{background:#fff;border:1px solid var(--line);border-radius:18px;padding:14px;margin:12px 0}.hidden{display:none!important}label{display:block;font-weight:800;margin:8px 0 4px}input,select{width:100%;padding:11px;border:1px solid #cfe0de;border-radius:11px}.row{display:flex;gap:7px;flex-wrap:wrap}.btn{border:0;border-radius:11px;padding:10px 12px;font-weight:850;cursor:pointer}.primary{background:linear-gradient(135deg,var(--b),var(--g));color:#fff}.secondary{background:#eef5f5;color:#174652}.danger{background:#fff0ee;color:var(--red)}.status{padding:10px;border-radius:11px;background:#f7fbfb;border:1px solid var(--line);margin-top:8px;white-space:pre-wrap}.ok{background:#ecfdf3;color:#08783d}.error{background:#fff1f0;color:#a4251c}.busy{background:#fff8e7;color:#805e00}.account,.item{border:1px solid var(--line);border-radius:13px;padding:10px;margin:8px 0}.account b,.account small{display:block}.account small{color:var(--muted);margin:3px 0}.items{display:grid;grid-template-columns:1fr 1fr;gap:8px}.item{display:flex;gap:8px}.item input{width:20px;height:20px}.pill{display:inline-block;border-radius:999px;padding:3px 8px;background:#eaf8f4;color:#08765d;font-size:.72rem;margin:2px}.top{display:flex;justify-content:space-between;gap:8px;align-items:center}@media(max-width:700px){.items{grid-template-columns:1fr}.row .btn{flex:1}.top{display:block}}</style></head><body><main class="shell"><section class="hero"><h1>🛠 مدیریت حساب‌ها و دسترسی خادمین — QA 3.9.5</h1><p>فهرست‌ها برای Owner و ادمین‌های فعال دارای مجوز مشاهده قابل دسترسی‌اند. عملیات حذف کامل و Grant خادمین همچنان Owner-only باقی می‌ماند.</p></section><section id="login" class="card"><h2>ورود ادمین</h2><label>ایمیل</label><input id="email" type="email" autocomplete="username"><label>رمز عبور</label><input id="password" type="password" autocomplete="current-password"><button id="loginBtn" class="btn primary">ورود</button><div id="loginStatus" class="status"></div></section><section id="work" class="hidden"><div class="card top"><div><h2 id="who">Admin</h2><small id="role"></small></div><div class="row"><button id="refresh" class="btn secondary">تازه‌سازی همه</button><button id="logout" class="btn danger">خروج</button></div></div><section class="card"><div class="top"><h2>📚 کاربران تأییدشده و دسترسی خادمین</h2><b id="userCount">0</b></div><label>کاربر</label><select id="userSelect"><option value="">انتخاب کنید…</option></select><div id="items" class="items"></div><button id="saveAccess" class="btn primary">ذخیره دسترسی‌ها</button><div id="accessStatus" class="status"></div></section><section class="card"><div class="top"><h2>👤 مدیریت اکانت‌ها</h2><b id="accountCount">0</b></div><div class="row"><button class="btn secondary active" data-mode="all">همه</button><button class="btn secondary" data-mode="test">فقط Test/QA/Demo</button></div><input id="search" type="search" placeholder="نام، ایمیل یا ID"><div class="row"><button id="searchBtn" class="btn secondary">جستجو</button><button id="clearBtn" class="btn secondary">پاک‌کردن</button></div><div id="accounts"></div><h3>درخواست‌های بدون Auth</h3><div id="orphans"></div><div id="accountStatus" class="status"></div></section></section></main><script>(()=>{'use strict';const SB='https://gpzcwffxnddhaeaogdyo.supabase.co',KEY='sb_publishable_v3xXEaJ5Fml7-te1mI4-0g_7R86oM37';let access='',refresh='',me=null,dash={users:[],items:[],grants:[]},mode='all';const $=s=>document.querySelector(s),H=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot',"'":'&#39;'}[c]));function st(id,text,type=''){const n=$(id);n.className='status '+type;n.textContent=text||''}async function token(force=false){if(access&&!force)return access;if(!refresh)return access;const r=await fetch(`${SB}/auth/v1/token?grant_type=refresh_token`,{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({refresh_token:refresh}),cache:'no-store'}),x=await r.json();if(!r.ok)throw Error(x.message||'refresh_failed');access=x.access_token;refresh=x.refresh_token||refresh;return access}async function rpc(name,body={}){const t=await token();if(!t)throw Error('login_required');let r=await fetch(`${SB}/rest/v1/rpc/${name}`,{method:'POST',headers:{apikey:KEY,Authorization:'Bearer '+t,'Content-Type':'application/json'},body:JSON.stringify(body),cache:'no-store'});if(r.status===401&&refresh){await token(true);return rpc(name,body)}const text=await r.text();let x={};try{x=text?JSON.parse(text):{}}catch(_){x={message:text}}if(!r.ok)throw Error(x.message||x.error||text||r.statusText);while(Array.isArray(x)&&x.length===1)x=x[0];return x}async function login(){const e=$('#email').value.trim().toLowerCase(),p=$('#password').value;if(!e||!p)return st('#loginStatus','ایمیل و رمز را کامل وارد کنید.','error');st('#loginStatus','در حال ورود…','busy');try{const r=await fetch(`${SB}/auth/v1/token?grant_type=password`,{method:'POST',headers:{apikey:KEY,'Content-Type':'application/json'},body:JSON.stringify({email:e,password:p}),cache:'no-store'}),x=await r.json();if(!r.ok||!x.access_token)throw Error(x.message||x.msg||'login_failed');access=x.access_token;refresh=x.refresh_token||'';me=await rpc('nh7_admin_my_access_v350');if(!me?.is_admin)throw Error('این حساب ادمین فعال نیست.');$('#login').classList.add('hidden');$('#work').classList.remove('hidden');$('#who').textContent=me.display_name||me.email||'Admin';$('#role').textContent=(me.is_owner?'Owner':'Admin')+' · '+(me.permissions||[]).join(', ');await loadAll()}catch(e){access=refresh='';st('#loginStatus','خطا: '+e.message,'error')}}async function loadAccess(){st('#accessStatus','در حال دریافت…','busy');try{dash=Object.assign({users:[],items:[],grants:[]},await rpc('nh7_admin_content_access_dashboard_v395'));const users=dash.users||[],items=dash.items||[];$('#userCount').textContent=`${users.length} کاربر · ${items.length} منبع`;$('#userSelect').innerHTML='<option value="">انتخاب کنید…</option>'+users.map(u=>`<option value="${H(u.user_id)}">${H(u.display_name||u.email)} — ${H(u.email)}</option>`).join('');renderItems();st('#accessStatus',items.length?`✓ ${users.length} کاربر و ${items.length} منبع دریافت شد.`:`✓ ${users.length} کاربر تأییدشده دریافت شد؛ هنوز منبعی با Audience = ministers منتشر نشده است.`,'ok')}catch(e){st('#accessStatus','خطا: '+e.message,'error')}}function renderItems(){const uid=$('#userSelect').value,root=$('#items'),gr=dash.grants||[],items=dash.items||[];root.innerHTML=items.length?items.map(i=>{const on=gr.some(g=>String(g.user_id)===uid&&g.scope==='library_item'&&String(g.resource_id)===String(i.id)&&!g.revoked_at);return `<label class="item"><input type="checkbox" data-item="${H(i.id)}" ${on?'checked':''}><span><b>${H(i.title_fa||i.title_en||i.file_name)}</b><small>${H(i.title_en||'')}</small></span></label>`}).join(''):'<p>منبع خادمین وجود ندارد.</p>';$('#saveAccess').disabled=!me?.is_owner}async function saveAccess(){if(!me?.is_owner)return alert('Grant دسترسی خادمین در این نسخه فقط با Owner انجام می‌شود.');const uid=$('#userSelect').value,u=(dash.users||[]).find(x=>String(x.user_id)===uid);if(!u)return alert('کاربر را انتخاب کنید.');st('#accessStatus','در حال ذخیره…','busy');try{for(const c of document.querySelectorAll('[data-item]'))await rpc('nh7_owner_set_library_item_access_v381',{p_user_email:u.email,p_item_id:c.dataset.item,p_active:c.checked,p_notes:'Admin QA 3.9.5'});await loadAccess();$('#userSelect').value=uid;renderItems();st('#accessStatus','✓ ذخیره شد.','ok')}catch(e){st('#accessStatus','خطا: '+e.message,'error')}}function accountHtml(a){const pills=[a.registration_complete?'ثبت‌نام کامل':'ناقص',a.registration_approved_complete?'تأییدشده':'تأییدنشده',a.is_test?'TEST':''].filter(Boolean).map(x=>`<span class="pill">${x}</span>`).join('');return `<article class="account"><b>${H(a.display_name||a.email)}</b><small>${H(a.email)}</small>${pills}<div class="row">${a.registration_id?`<button class="btn secondary" data-del-request="${H(a.registration_id)}">حذف فقط درخواست</button>`:''}${me?.is_owner?`<button class="btn danger" data-del-full="${H(a.user_id)}" data-email="${H(a.email)}">حذف کامل حساب</button>`:''}</div></article>`}function orphanHtml(a){return `<article class="account"><b>${H(a.display_name||a.email)}</b><small>${H(a.email)} · بدون Auth</small>${a.registration_id?`<button class="btn secondary" data-del-request="${H(a.registration_id)}">حذف درخواست</button>`:''}</article>`}async function loadAccounts(){st('#accountStatus','در حال دریافت…','busy');try{const x=await rpc('nh7_admin_account_directory_v395',{p_search:$('#search').value.trim(),p_test_only:mode==='test'}),accounts=x.accounts||[],orphans=x.registration_orphans||[];$('#accountCount').textContent=`${accounts.length} حساب · ${orphans.length} درخواست بدون Auth`;$('#accounts').innerHTML=accounts.map(accountHtml).join('')||'<p>حسابی پیدا نشد.</p>';$('#orphans').innerHTML=orphans.map(orphanHtml).join('')||'<p>موردی وجود ندارد.</p>';st('#accountStatus','✓ فهرست به‌روز شد.','ok')}catch(e){st('#accountStatus','خطا: '+e.message,'error')}}async function loadAll(){await Promise.all([loadAccess(),loadAccounts()])}$('#loginBtn').onclick=login;$('#userSelect').onchange=renderItems;$('#saveAccess').onclick=saveAccess;$('#refresh').onclick=loadAll;$('#searchBtn').onclick=loadAccounts;$('#clearBtn').onclick=()=>{$('#search').value='';loadAccounts()};$('#logout').onclick=()=>{access=refresh='';me=null;$('#work').classList.add('hidden');$('#login').classList.remove('hidden')};document.querySelectorAll('[data-mode]').forEach(b=>b.onclick=()=>{mode=b.dataset.mode;loadAccounts()});document.addEventListener('click',async e=>{const req=e.target.closest('[data-del-request]');if(req){if(!confirm('فقط درخواست حذف شود؟'))return;try{await rpc('nh7_admin_registration_delete_v350',{p_id:req.dataset.delRequest});await loadAccounts()}catch(x){alert(x.message)}return}const full=e.target.closest('[data-del-full]');if(full){if(!me?.is_owner)return;const em=full.dataset.email;if(prompt(`برای حذف کامل ایمیل را وارد کنید:\n${em}`)!==em)return;if(!confirm('تمام داده‌های این حساب حذف شود؟'))return;try{await rpc('nh7_admin_delete_account_full_v381',{p_user_id:full.dataset.delFull,p_confirmation_email:em});await loadAll()}catch(x){alert(x.message)}}});})();</script></body></html>
