name: Validate and Deploy New Hope 7

on:
  push:
    branches:
      - main
      - qa/final-integration-20260825
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: nh7-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          files=(
            service-worker.js
            push/OneSignalSDKWorker.js
            sw-media-stream-bypass-v332.js
            sw-offline-v329.js
            sw-offline-path-fix-v329.js
            js/nh7-security-core-v340.js
            js/nh7-qna-i18n-v341.js
            js/nh7-offline-startup-v327.js
            js/nh7-offline-core-v327.js
            js/nh7-offline-data-v329.js
            js/nh7-audio-route-stability-v330.js
            js/nh7-auto-update-v335.js
            js/nh7-notifications-zagreb-v334.js
            js/nh7-auth-signup-guard-v343.js
            js/nh7-school-registration-v342.js
            js/nh7-auth-recovery-v342.js
            js/nh7-registration-canonical-v353.js
            js/nh7-push-account-bind-v361.js
            js/nh7-ui-stability-v329.js
            js/nh7-access-bootstrap-v230.js
            js/nh7-offline-persistence-v323.js
            js/nh7-offline-playback-bridge-v332.js
            js/nh7-book-reader-v281.js
            js/nh7-library-language-v321.js
            js/nh7-library-collections-v322.js
            js/nh7-apocrypha-v270.js
            js/nh7-large-mov-native-fallback-v273.js
            js/nh7-secure-media-watermark-v272.js
            js/nh7-protected-audio-gate-v316.js
            js/nh7-school-audio-native-v337.js
            js/admin-v2.3.9-clean-scroll-v300.js
            js/admin-v2.3.9-library-clean-v311.js
            js/admin-v2.3.9-apocrypha-catalog-v274.js
            js/admin-v2.3.9-apocrypha-text-only-v320.js
            js/admin-v2.3.9-library-collections-v322.js
            js/admin-v2.3.9-student-clean-v311.js
            js/admin-v2.3.9-audio-clean-v312.js
            js/admin-v2.3.9-video-final-v316.js
            js/admin-v2.3.9-video-save-sync-v316.js
            js/admin-v2.3.9-video-person-access-v317.js
            js/admin-v2.3.9-student-state-fix-v316.js
            js/admin-v2.3.9-ui-documents-final-v316.js
            js/admin-v2.3.9-fix12-bootstrap.js
            js/admin-v2.3.9-registration-requests-v331.js
            js/admin-v2.3.9-notifications-zagreb-v333.js
            js/admin-qna-i18n-v341.js
            js/nh7-admin-rbac-v350.js
          )
          for file in "${files[@]}"; do
            test -f "$file"
            node --check "$file"
          done
          if [[ -f qa/final-20260825/assets/nh7-apocrypha-complete-v370.js ]]; then
            node --check qa/final-20260825/assets/nh7-apocrypha-complete-v370.js
          fi

      - name: Validate release metadata and protected bundle
        run: |
          node <<'NODE'
          const fs=require('fs');
          const fail=m=>{throw new Error(m)};
          const version=JSON.parse(fs.readFileSync('version.json','utf8'));
          const manifest=JSON.parse(fs.readFileSync('manifest.json','utf8'));
          const adminManifest=JSON.parse(fs.readFileSync('admin-manifest.json','utf8'));
          const index=fs.readFileSync('index.html','utf8');
          if(!/^\d+\.\d+\.\d+\.\d+$/.test(version.app||''))fail('version.json app is invalid');
          if(!/^\d+\.\d+\.\d+\.\d+$/.test(version.admin||''))fail('version.json admin is invalid');
          if(!index.includes(`window.NH7_VERSION = '${version.app}'`))fail(`index.html version does not match version.json app ${version.app}`);
          if(!index.includes('NH7_ONESIGNAL_WORKER')||!index.includes('push/OneSignalSDKWorker.js'))fail('OneSignal worker wiring missing from index.html');
          if(manifest.start_url!=='./index.html')fail('manifest start_url must be ./index.html');
          if(!adminManifest||typeof adminManifest!=='object')fail('admin-manifest.json invalid');
          const school=JSON.parse(fs.readFileSync('data/school/school_content.json','utf8'));
          if(school.meta?.protectedContent!==true)fail('School content must be protected');
          if(!Array.isArray(school.lessons)||school.lessons.length!==0)fail('Protected school lessons must not ship in public bundle');
          console.log('Release metadata OK',version);
          NODE

      - name: Validate auth, RBAC and required shell files
        shell: bash
        run: |
          set -euo pipefail
          grep -q "OneSignalSDK.sw.js" push/OneSignalSDKWorker.js
          ! grep -q "OneSignalSDK.sw.js" sw-offline-v329.js
          grep -q "nh7-security-core-v340.js?v=3.4.1" index.html
          grep -q "nh7-qna-i18n-v341.js?v=2.3.9.36" index.html
          grep -q "nh7-notifications-zagreb-v334.js?v=2.3.9.35e" index.html
          grep -q "nh7-auto-update-v335.js" index.html
          grep -q "nh7-school-audio-native-v337.js" index.html
          grep -q "admin-v2.3.9-notifications-zagreb-v333.js" admin-v239-stable.html
          grep -q "admin-qna-i18n-v341.js" admin-v239-stable.html
          required=(
            admin.html admin-v239.html admin-v239-stable.html app-v239.html index.html
            reset-password.html admin-reset-password.html version.json service-worker.js
            push/OneSignalSDKWorker.js js/nh7-security-core-v340.js js/nh7-qna-i18n-v341.js
            js/nh7-auth-signup-guard-v343.js js/nh7-school-registration-v342.js
            js/nh7-auth-recovery-v342.js js/nh7-registration-canonical-v353.js
            js/nh7-admin-rbac-v350.js css/admin-v2.3.9-clean-scroll-v300.css
            css/admin-v2.3.9-clean-features-v311.css css/admin-v2.3.9-final-stable-v316.css
            css/admin-v2.3.9-library-mobile-v320.css css/nh7-book-reader-v280.css
            css/nh7-library-collections-v322.css css/nh7-secure-media-watermark-v272.css
            css/nh7-apocrypha-v270.css
          )
          for file in "${required[@]}"; do test -f "$file"; done
          node scripts/verify-admin-rbac-v350.mjs
          node scripts/verify-auth-hotfix-v348.mjs

      - name: Validate HTML inline scripts
        run: |
          node <<'NODE'
          const fs=require('fs');
          const files=['admin.html','admin-v239.html','admin-v239-stable.html','admin-reset-password.html','reset-password.html','app-v239.html','index.html','certificate-v239.html'];
          if(fs.existsSync('qa/final-20260825/app.html'))files.push('qa/final-20260825/app.html');
          for(const file of files){
            const html=fs.readFileSync(file,'utf8');
            const blocks=[...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)].map(x=>x[1]).filter(Boolean);
            blocks.forEach((code,index)=>new Function(code+`\n//# sourceURL=${file}-inline-${index}`));
          }
          console.log('Inline scripts parsed:',files.length,'HTML files');
          NODE

      - name: Validate Final QA integration files
        if: github.ref == 'refs/heads/qa/final-integration-20260825'
        run: |
          test -f qa/final-20260825/index.html
          test -f qa/final-20260825/app.html
          test -f qa/final-20260825/STATUS.md
          test -f qa/final-20260825/assets/nh7-apocrypha-complete-v370.js
          grep -q "3.7.0-FINAL-QA" qa/final-20260825/app.html
          grep -q "3.7.0-complete-apocrypha" qa/final-20260825/assets/nh7-apocrypha-complete-v370.js
          grep -q "a4235c6c0c38d24abf4dbd6a975f2a03c196de60" qa/final-20260825/app.html
          grep -q "e35ed1dcc417a4e6a5d3dc2188544d777156a4d6" qa/final-20260825/app.html
          echo "Final QA integration files OK"

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout validated main commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
