name: Validate and Deploy New Hope 7

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: new-hope7-pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Validate current runtime JavaScript
        shell: bash
        run: |
          set -euo pipefail
          files=(
            service-worker.js
            sw-navigation-fresh-v403.js
            sw-release-core-v403.js
            sw-media-stream-bypass-v332.js
            sw-offline-v329.js
            sw-offline-path-fix-v329.js
            push/OneSignalSDKWorker.js
            js/nh7-security-core-v340.js
            js/nh7-qna-i18n-v341.js
            js/nh7-offline-startup-v327.js
            js/nh7-offline-core-v327.js
            js/nh7-offline-data-v422.js
            js/nh7-audio-route-stability-v423.js
            js/nh7-audio-classic-v484.js
            js/nh7-audio-miniplayer-v487.js
            js/nh7-settings-controller-v403.js
            js/nh7-delete-account-v253.js
            js/nh7-auto-update-v335.js
            js/nh7-notifications-zagreb-v334.js
            js/nh7-auth-signup-guard-v343.js
            js/nh7-school-registration-v342.js
            js/nh7-auth-recovery-v342.js
            js/nh7-registration-canonical-v353.js
            js/nh7-registration-final-guard-v401.js
            js/nh7-push-account-bind-v362.js
            js/nh7-school-exam-v344.js
            js/nh7-school-path-v351.js
            js/nh7-ui-stability-v329.js
            js/nh7-access-bootstrap-v230.js
            js/nh7-offline-persistence-v323.js
            js/nh7-offline-playback-bridge-v332.js
            js/nh7-book-reader-v283.js
            js/nh7-book-reading-telemetry-v490.js
            js/nh7-library-language-v321.js
            js/nh7-library-collections-v322.js
            js/nh7-admin-ai-v490.js
            js/nh7-admin-student-report-v491.js
            js/nh7-admin-school-workflow-v247.js
          )
          for file in "${files[@]}"; do
            test -f "$file"
            node --check "$file"
          done

      - name: Validate current app wiring
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const fail=m=>{throw new Error(m)};
          const version=JSON.parse(fs.readFileSync('version.json','utf8'));
          const index=fs.readFileSync('index.html','utf8');
          const worker=fs.readFileSync('service-worker.js','utf8');
          const releaseCore=fs.readFileSync('sw-release-core-v403.js','utf8');
          const audio=fs.readFileSync('js/nh7-audio-classic-v484.js','utf8');
          const mini=fs.readFileSync('js/nh7-audio-miniplayer-v487.js','utf8');
          const reading=fs.readFileSync('js/nh7-book-reading-telemetry-v490.js','utf8');
          const school=JSON.parse(fs.readFileSync('data/school/school_content.json','utf8'));

          if(!/^\d+\.\d+\.\d+\.\d+$/.test(version.app||''))fail('Invalid app version');
          if(!/^\d+\.\d+\.\d+\.\d+$/.test(version.admin||''))fail('Invalid admin version');
          if(!index.includes(`window.NH7_VERSION = '${version.app}'`))fail('index version mismatch');
          if(!index.includes('js/nh7-school-exam-v344.js?v=2.3.9.50'))fail('School exam runtime missing');
          if(!index.includes('js/nh7-school-path-v351.js?v=4.6.6'))fail('School path v351 missing');
          if(!index.includes('js/nh7-audio-classic-v484.js?v=4.8.4'))fail('Audio engine v484 missing');
          if(!index.includes('js/nh7-audio-miniplayer-v487.js?v=4.8.7'))fail('Audio mini-player v487 missing');
          if(!index.includes('js/nh7-book-reading-telemetry-v490.js?v=4.9.0'))fail('Book telemetry v490 missing');
          if(!index.includes('js/nh7-settings-controller-v403.js?v=4.6.4'))fail('Settings runtime missing');
          if(!index.includes('js/nh7-delete-account-v253.js?v=2.5.4'))fail('Delete account runtime missing');

          if(!worker.includes('sw-navigation-fresh-v403.js?v=4.0.3'))fail('Fresh navigation worker missing');
          if(!worker.includes('sw-release-core-v403.js?v=4.9.0'))fail('Release core v4.9.0 missing');
          if(worker.indexOf('sw-navigation-fresh-v403.js')>worker.indexOf('sw-offline-v329.js'))fail('Fresh navigation worker must load before offline worker');

          for(const required of [
            "NH7_AUDIO_CLASSIC_VERSION='4.8.4'",
            "playNextTrack('auto-ended')",
            "safe('nexttrack'",
            "safe('previoustrack'",
            'data-now-next'
          ]) if(!audio.includes(required))fail('Audio v484 missing '+required);

          for(const required of [
            'data-mini-close',
            'nh7_audio_close_resume_v487:',
            'writeResumeSnapshot',
            'playPreviousTrack',
            'playNextTrack'
          ]) if(!mini.includes(required))fail('Mini-player v487 missing '+required);

          for(const required of [
            'nh7_library_reading_record_v490',
            'p_delta_seconds',
            'p_total_sections'
          ]) if(!reading.includes(required))fail('Reading telemetry missing '+required);

          if(school.meta?.protectedContent!==true)fail('School content must remain protected');
          if(!Array.isArray(school.lessons)||school.lessons.length!==0)fail('Protected lessons must not ship publicly');

          const match=releaseCore.match(/const NH7_RELEASE_ASSETS=\[([\s\S]*?)\];/);
          if(!match)fail('Release offline asset list missing');
          const paths=[...match[1].matchAll(/'([^']+)'/g)].map(m=>m[1]);
          const missing=[];
          for(const p of paths){
            if(p==='./'||!p.startsWith('./'))continue;
            const file=p.slice(2);
            if(!fs.existsSync(file))missing.push(file);
          }
          if(missing.length)fail('Missing release offline assets: '+missing.join(', '));
          const currentScripts=[...index.matchAll(/<script\s+src="(js\/[^"?]+)(?:\?[^"]*)?"/g)].map(m=>'./'+m[1]);
          const missingFromRelease=currentScripts.filter(p=>!paths.includes(p));
          if(missingFromRelease.length)fail('Current app scripts not guaranteed offline: '+missingFromRelease.join(', '));

          if(!releaseCore.includes("NH7_RELEASE_CORE_VERSION='4.9.0-admin-ai-library-report'"))fail('Release core version mismatch');
          if(!releaseCore.includes('./js/nh7-audio-classic-v484.js'))fail('Audio engine not cached');
          if(!releaseCore.includes('./js/nh7-audio-miniplayer-v487.js'))fail('Mini-player not cached');
          if(!releaseCore.includes('./js/nh7-book-reading-telemetry-v490.js'))fail('Reading telemetry not cached');
          if(!index.includes('NH7_ONESIGNAL_WORKER')||!index.includes('push/OneSignalSDKWorker.js'))fail('OneSignal worker wiring missing');

          console.log('Current app validation OK',version,'offline assets',paths.length);
          NODE

      - name: Validate current Admin AI and reports wiring
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'admin-qna-i18n-v341.js' admin-v239-stable.html
          grep -q 'nh7-admin-ai-v490.js?v=4.9.0' admin-v239-stable.html
          grep -q 'nh7-admin-student-report-v491.js?v=4.9.1' admin-v239-stable.html

          grep -q 'AI draft answer' js/nh7-admin-ai-v490.js
          grep -q 'Translate question' js/nh7-admin-ai-v490.js
          grep -q 'Translate answer' js/nh7-admin-ai-v490.js
          grep -q 'Auto-translate FA/EN/HR titles' js/nh7-admin-ai-v490.js
          grep -q 'AI draft feedback' js/nh7-admin-ai-v490.js
          grep -q 'PREVIEW_ONLY' js/nh7-admin-ai-v490.js

          grep -q 'Student Report Center' js/nh7-admin-student-report-v491.js
          grep -q 'nh7_admin_student_profile_v451' js/nh7-admin-student-report-v491.js
          grep -q 'nh7_admin_library_reading_v490' js/nh7-admin-student-report-v491.js
          grep -q 'Incorrect answers' js/nh7-admin-student-report-v491.js
          grep -q 'PDF / Print' js/nh7-admin-student-report-v491.js
          grep -q 'window.print' js/nh7-admin-student-report-v491.js
          grep -q 'nh7CloseStudentReportPreviewV491' js/nh7-admin-student-report-v491.js
          grep -q 'nh7PrintStudentReportNowV491' js/nh7-admin-student-report-v491.js
          grep -q 'nh7-admin-school-workflow-v247.js' admin-v239-stable.html
          grep -q 'nh7-assignment-answer-text' js/nh7-admin-school-workflow-v247.js
          grep -q 'overflow-wrap:anywhere' js/nh7-admin-school-workflow-v247.js

          grep -q 'nh7_is_admin' supabase/functions/nh7-admin-ai-v490/index.ts
          grep -q 'OPENAI_API_KEY' supabase/functions/nh7-admin-ai-v490/index.ts
          grep -q "action==='draft_answer'" supabase/functions/nh7-admin-ai-v490/index.ts
          grep -q "action==='draft_feedback'" supabase/functions/nh7-admin-ai-v490/index.ts

      - name: Validate HTML inline scripts and JSON
        shell: bash
        run: |
          node <<'NODE'
          const fs=require('fs');
          for(const file of ['admin.html','admin-v239.html','admin-v239-stable.html','admin-reset-password.html','reset-password.html','app-v239.html','index.html']){
            const html=fs.readFileSync(file,'utf8');
            const blocks=[...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)].map(x=>x[1]).filter(Boolean);
            blocks.forEach((code,index)=>new Function(code+`\n//# sourceURL=${file}-inline-${index}`));
          }
          for(const file of ['admin-manifest.json','manifest.json','version.json'])JSON.parse(fs.readFileSync(file,'utf8'));
          console.log('HTML and JSON validation passed');
          NODE

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout validated main commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
