name: Deploy New Hope 7 to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main

      - name: Repair offline worker syntax for push registration
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('sw-offline-v329.js')
          s = p.read_text(encoding='utf-8')
          old_import = "try{importScripts('https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.sw.js')}catch(error){console.warn('OneSignal SW unavailable',error)}\n\n"
          s = s.replace(old_import, '', 1)
          old_tail = "catch(error){reply({ok:false,error:error?.message||String(error)})})())});"
          new_tail = "catch(error){reply({ok:false,error:error?.message||String(error)})}})())});"
          if old_tail in s:
              s = s.replace(old_tail, new_tail, 1)
          p.write_text(s, encoding='utf-8')
          PY
          node --check sw-offline-v329.js
          if ! git diff --quiet -- sw-offline-v329.js; then
            git config user.name "New Hope 7 CI"
            git config user.email "actions@github.com"
            git add sw-offline-v329.js
            git commit -m "Fix offline worker syntax for push registration"
            git push origin HEAD:main
          fi

      - name: Validate current New Hope 7 production shell
        run: |
          node --check service-worker.js
          node --check push/OneSignalSDKWorker.js
          node --check sw-media-stream-bypass-v332.js
          node --check sw-offline-v329.js
          node --check sw-offline-path-fix-v329.js
          node --check js/nh7-security-core-v340.js
          node --check js/nh7-offline-startup-v327.js
          node --check js/nh7-offline-core-v327.js
          node --check js/nh7-offline-data-v329.js
          node --check js/nh7-audio-route-stability-v330.js
          node --check js/nh7-auto-update-v335.js
          node --check js/nh7-notifications-zagreb-v334.js
          node --check js/nh7-school-registration-v331.js
          node --check js/nh7-ui-stability-v329.js
          node --check js/nh7-access-bootstrap-v230.js
          node --check js/nh7-offline-persistence-v323.js
          node --check js/nh7-offline-playback-bridge-v332.js
          node --check js/nh7-book-reader-v281.js
          node --check js/nh7-library-language-v321.js
          node --check js/nh7-library-collections-v322.js
          node --check js/nh7-apocrypha-v270.js
          node --check js/nh7-large-mov-native-fallback-v273.js
          node --check js/nh7-secure-media-watermark-v272.js
          node --check js/nh7-protected-audio-gate-v316.js
          node --check js/nh7-school-audio-native-v337.js
          node --check js/admin-v2.3.9-clean-scroll-v300.js
          node --check js/admin-v2.3.9-library-clean-v311.js
          node --check js/admin-v2.3.9-apocrypha-catalog-v274.js
          node --check js/admin-v2.3.9-apocrypha-text-only-v320.js
          node --check js/admin-v2.3.9-library-collections-v322.js
          node --check js/admin-v2.3.9-student-clean-v311.js
          node --check js/admin-v2.3.9-audio-clean-v312.js
          node --check js/admin-v2.3.9-video-final-v316.js
          node --check js/admin-v2.3.9-video-save-sync-v316.js
          node --check js/admin-v2.3.9-video-person-access-v317.js
          node --check js/admin-v2.3.9-student-state-fix-v316.js
          node --check js/admin-v2.3.9-ui-documents-final-v316.js
          node --check js/admin-v2.3.9-fix12-bootstrap.js
          node --check js/admin-v2.3.9-registration-requests-v331.js
          node --check js/admin-v2.3.9-notifications-zagreb-v333.js
          grep -q "2.3.9.35b" service-worker.js
          grep -q "OneSignalSDK.sw.js" push/OneSignalSDKWorker.js
          ! grep -q "OneSignalSDK.sw.js" sw-offline-v329.js
          grep -q "NH7_ONESIGNAL_WORKER" index.html
          grep -q "push/OneSignalSDKWorker.js" index.html
          grep -q "nh7-security-core-v340.js?v=3.4.0" index.html
          grep -q "3.4.0-security-core" js/nh7-security-core-v340.js
          grep -q '"protectedContent": true' data/school/school_content.json
          node -e "const s=JSON.parse(require('fs').readFileSync('data/school/school_content.json','utf8'));if(!Array.isArray(s.lessons)||s.lessons.length!==0)throw new Error('Protected school lessons must not ship in the public bundle')"
          grep -q "nh7-notifications-zagreb-v334.js?v=2.3.9.35e" index.html
          grep -q "nh7-auto-update-v335.js" index.html
          grep -q "nh7-school-audio-native-v337.js" index.html
          grep -q "admin-v2.3.9-notifications-zagreb-v333.js" admin-v239-stable.html
          grep -q '"start_url": "./index.html"' manifest.json
          grep -q '"app":"2.3.9.35"' version.json
          grep -q '"admin":"2.3.9.33"' version.json
          test -f admin.html
          test -f admin-v239.html
          test -f admin-v239-stable.html
          test -f app-v239.html
          test -f index.html
          test -f version.json
          test -f service-worker.js
          test -f push/OneSignalSDKWorker.js
          test -f js/nh7-security-core-v340.js
          test -f js/nh7-notifications-zagreb-v334.js
          test -f js/nh7-auto-update-v335.js
          test -f js/nh7-school-audio-native-v337.js
          test -f js/admin-v2.3.9-notifications-zagreb-v333.js
          test -f css/admin-v2.3.9-clean-scroll-v300.css
          test -f css/admin-v2.3.9-clean-features-v311.css
          test -f css/admin-v2.3.9-final-stable-v316.css
          test -f css/admin-v2.3.9-library-mobile-v320.css
          test -f css/nh7-book-reader-v280.css
          test -f css/nh7-library-collections-v322.css
          test -f css/nh7-secure-media-watermark-v272.css
          test -f css/nh7-apocrypha-v270.css
          node -e "const fs=require('fs');for(const file of ['admin-v239.html','admin-v239-stable.html','app-v239.html','index.html','certificate-v239.html']){const html=fs.readFileSync(file,'utf8');const blocks=[...html.matchAll(/<script(?:\\s[^>]*)?>([\\s\\S]*?)<\\/script>/gi)].map(x=>x[1]).filter(Boolean);blocks.forEach((code,index)=>new Function(code+'\\n//# sourceURL='+file+'-inline-'+index));}"
          node -e "for(const f of ['admin-manifest.json','manifest.json','version.json'])JSON.parse(require('fs').readFileSync(f,'utf8'))"

  deploy:
    needs: validate
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout latest main
        uses: actions/checkout@v4
        with:
          ref: main
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
