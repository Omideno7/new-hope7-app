name: Apply School Identity UI v127

on:
  push:
    branches: [feature/school-identity-credentials]
    paths:
      - 'scripts/apply-school-identity-ui-v127.py'
      - '.github/workflows/apply-school-identity-ui-v127.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apply:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feature/school-identity-credentials
          fetch-depth: 0
      - name: Apply deterministic feature-branch patch
        run: python3 scripts/apply-school-identity-ui-v127.py
      - name: Validate patched files
        shell: bash
        run: |
          set -euo pipefail
          node --check js/nh7-student-identity-v127.js
          node --check js/nh7-admin-student-academic-v540.js
          node --check js/nh7-admin-student-report-v496.js
          python3 scripts/validate_next_native_optimization_guard.py
          node scripts/verify-school-identity-v127.mjs
          node scripts/verify-school-identity-integration-v127.mjs
          git diff --check
      - name: Commit feature-branch integration
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet; then
            echo 'No patch changes required.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html sw-release-core-v403.js js/nh7-admin-student-academic-v540.js js/nh7-admin-student-report-v496.js
          git commit -m 'Issue #127: integrate Student Identity UI on feature branch'
          git push origin HEAD:feature/school-identity-credentials

# Workflow-file edits are intentionally excluded from the bot commit because
# GitHub Apps require a separate workflows permission for those paths.
