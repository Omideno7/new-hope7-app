name: Audit Supabase Public Catalogue v4.2.6

on:
  push:
    branches: ['audit/supabase-deploy-capability-v426']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      SB: https://gpzcwffxnddhaeaogdyo.supabase.co
      KEY: sb_publishable_v3xXEaJ5Fml7-te1mI4-0g_7R86oM37
    steps:
      - name: Probe public API paths read only
        shell: bash
        run: |
          set -u
          probe(){
            label="$1"; shift
            file="/tmp/${label}.txt"
            code=$(curl -sS -o "$file" -w '%{http_code}' "$@" || true)
            echo "=== ${label} status=${code} ==="
            python3 - "$file" <<'PY'
          import pathlib,sys
          p=pathlib.Path(sys.argv[1])
          text=p.read_text(errors='replace') if p.exists() else ''
          print(text[:1500].replace('\n',' '))
          PY
          }
          probe auth_settings -H "apikey: $KEY" "$SB/auth/v1/settings"
          probe categories_apikey -H "apikey: $KEY" -H 'Accept: application/json' "$SB/rest/v1/sermon_categories?select=id,name_fa,is_active,created_at&order=created_at.desc&limit=5"
          probe sermons_apikey -H "apikey: $KEY" -H 'Accept: application/json' "$SB/rest/v1/sermons?select=id,title_fa,is_published,audio_url,category_id,created_at&is_published=eq.true&order=created_at.desc&limit=10"
          probe categories_bearer -H "apikey: $KEY" -H "Authorization: Bearer $KEY" -H 'Accept: application/json' "$SB/rest/v1/sermon_categories?select=id,name_fa,is_active,created_at&order=created_at.desc&limit=5"
          probe sermons_bearer -H "apikey: $KEY" -H "Authorization: Bearer $KEY" -H 'Accept: application/json' "$SB/rest/v1/sermons?select=id,title_fa,is_published,audio_url,category_id,created_at&is_published=eq.true&order=created_at.desc&limit=10"
