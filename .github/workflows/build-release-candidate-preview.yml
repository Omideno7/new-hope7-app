name: Build New Hope 7 release-candidate preview

on:
  push:
    branches: [release-candidate-2.4.0-preview]
  pull_request:
    branches: [release-candidate-2.4.0-preview]
    types: [opened, reopened, synchronize]

permissions:
  contents: write

jobs:
  integrate:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout release candidate
        uses: actions/checkout@v4
        with:
          ref: release-candidate-2.4.0-preview
          fetch-depth: 0

      - name: Merge current production hotfixes
        run: |
          git config user.name "New Hope 7 RC Builder"
          git config user.email "actions@github.com"
          git fetch origin main
          git merge --no-ff -X theirs origin/main -m "Merge production 2.3.9.40 into 2.4.0 release candidate"

      - name: Wire next-release modules into current production shell
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import json, re

          version = '2.4.0.241'
          p = Path('index.html')
          s = p.read_text(encoding='utf-8')
          s = re.sub(r"window\.NH7_VERSION\s*=\s*'[^']+'", f"window.NH7_VERSION = '{version}'", s)
          s = re.sub(r'manifest\.json\?v=[^"\']+', f'manifest.json?v={version}', s)
          if 'css/nh7-spiritual-plans-v240.css' not in s:
              anchor = '<link rel="stylesheet" href="css/nh7-apocrypha-v270.css?v=2.3.9.33" />'
              extra = anchor + f'\n  <link rel="stylesheet" href="css/nh7-spiritual-plans-v240.css?v={version}" />'
              s = s.replace(anchor, extra)
          preview_script = f'  <script src="js/nh7-apocrypha-preview-v240.js?v={version}" defer></script>\n'
          if 'js/nh7-apocrypha-preview-v240.js' not in s:
              anchor = '  <script src="js/nh7-apocrypha-v270.js?v=2.3.9.33" defer></script>\n'
              s = s.replace(anchor, preview_script + anchor)
          p.write_text(s, encoding='utf-8')

          p = Path('admin.html')
          s = p.read_text(encoding='utf-8')
          s = re.sub(r'css/admin-v2\.3\.5-analytics\.css\?v=[^"\']+', f'css/admin-v2.3.5-analytics.css?v={version}', s)
          s = re.sub(r'js/admin-v2\.3\.5-analytics\.js\?v=[^"\']+', f'js/admin-v2.3.5-analytics.js?v={version}', s)
          p.write_text(s, encoding='utf-8')

          p = Path('app-v239.html')
          s = p.read_text(encoding='utf-8')
          s = re.sub(r'manifest\.json\?v=[^"\']+', f'manifest.json?v={version}', s)
          s = re.sub(r'assets/apple-touch-icon\.png\?v=[^"\']+', f'assets/apple-touch-icon.png?v={version}', s)
          s = re.sub(r'index\.html\?v=[^&"\']+', f'index.html?v={version}', s)
          p.write_text(s, encoding='utf-8')

          Path('version.json').write_text(json.dumps({
              'app': version,
              'admin': version,
              'channel': 'release_candidate',
              'production_main_merged': '2.3.9.40'
          }, ensure_ascii=False, separators=(',', ':')) + '\n', encoding='utf-8')
          PY

      - name: Validate release candidate
        run: |
          node --check js/app.js
          node --check js/nh7-spiritual-plans-v240.js
          node --check js/nh7-apocrypha-preview-v240.js
          node --check js/nh7-auth-recovery-v342.js
          node --check js/nh7-school-registration-v342.js
          node --check js/nh7-admin-rbac-v350.js
          grep -q "renderSpiritualPlansV240" js/app.js
          grep -q "accountLoginError" js/app.js
          grep -q "nh7-spiritual-plans-v240.css" index.html
          grep -q "nh7-apocrypha-preview-v240.js" index.html
          grep -q "nh7-auth-recovery-v342.js" index.html
          grep -q "nh7-school-registration-v342.js" index.html
          grep -q '"app":"2.4.0.241"' version.json
          test -s data/apocrypha/runtime/apocrypha-browser-19.preview.json
          node scripts/validate-spiritual-plans.mjs
          node scripts/verify-spiritual-plans-render.mjs
          node scripts/validate-apocrypha-19.mjs

      - name: Commit integrated release candidate
        run: |
          git add -A
          if git diff --cached --quiet; then
            echo "Release candidate already integrated"
          else
            git commit -m "Build full-app 2.4.0.241 release candidate"
            git push origin HEAD:release-candidate-2.4.0-preview
          fi
