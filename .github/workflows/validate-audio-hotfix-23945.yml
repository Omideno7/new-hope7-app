name: Validate signed audio hotfix 2.3.9.45
on:
  push:
    branches: [hotfix/audio-signed-2.3.9.45]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Validate JavaScript and HTML
        run: |
          node --check js/nh7-audio-signed-v396.js
          node <<'NODE'
          const fs=require('fs'),h=fs.readFileSync('index.html','utf8');
          [...h.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)].forEach((m,i)=>new Function(m[1]+`\n//# sourceURL=index-${i}`));
          const owner=h.indexOf('js/nh7-audio-signed-v396.js?v=2.3.9.45');
          const app=h.indexOf('js/app.js?v=2.3.9.45');
          if(owner<0||app<0||owner>app)throw Error('Signed audio owner must load before app.js');
          if(!h.includes("window.NH7_VERSION = '2.3.9.45'"))throw Error('Index version mismatch');
          NODE
      - name: Verify exclusive button ownership and stable offline IDs
        run: |
          grep -q "NH7_AUDIO_SIGNED_VERSION='3.9.6'" js/nh7-audio-signed-v396.js
          grep -q 'button.onclick=null\|b.onclick=null' js/nh7-audio-signed-v396.js
          grep -q "removeAttribute('data-offline-download')" js/nh7-audio-signed-v396.js
          grep -q "window.addEventListener('click',intercept,true)" js/nh7-audio-signed-v396.js
          grep -q "kind:'sermon',sermon_id" js/nh7-audio-signed-v396.js
          grep -q "kind:'audio',lesson_code" js/nh7-audio-signed-v396.js
          grep -q '__nh7_audio_v396__' js/nh7-audio-signed-v396.js
          grep -q 'nh7_school_record_audio_v380' js/nh7-audio-signed-v396.js
          grep -q 'در حال دانلود ${p}%' js/nh7-audio-signed-v396.js
          grep -q 'is-downloaded-v396' js/nh7-audio-signed-v396.js
      - name: Verify Edge CORS and custom authentication
        run: |
          set -euo pipefail
          curl -sS -D /tmp/options.headers -o /tmp/options.body -X OPTIONS \
            -H 'Origin: https://omideno7.github.io' \
            -H 'Access-Control-Request-Method: POST' \
            -H 'Access-Control-Request-Headers: authorization,apikey,content-type,x-client-info' \
            'https://gpzcwffxnddhaeaogdyo.supabase.co/functions/v1/nh7-school-media-access'
          grep -qi '^access-control-allow-origin: https://omideno7.github.io' /tmp/options.headers
          code=$(curl -sS -o /tmp/noauth.body -w '%{http_code}' -X POST \
            -H 'Origin: https://omideno7.github.io' \
            -H 'Content-Type: application/json' \
            --data '{"kind":"sermon","sermon_id":"2307950e-7b9e-4dfe-abbf-0dab5b93b8af"}' \
            'https://gpzcwffxnddhaeaogdyo.supabase.co/functions/v1/nh7-school-media-access')
          test "$code" = "401"
          grep -q 'login_required' /tmp/noauth.body
      - name: Validate release metadata and service worker refresh
        run: |
          node <<'NODE'
          const fs=require('fs'),v=JSON.parse(fs.readFileSync('version.json','utf8'));
          if(v.app!=='2.3.9.45')throw Error('version.json app mismatch');
          const sw=fs.readFileSync('service-worker.js','utf8');
          if(!sw.includes('2.3.9.45')||!sw.includes('audio-signed-v396'))throw Error('Service worker cache bust missing');
          NODE
          echo 'Production audio hotfix validation passed.'
