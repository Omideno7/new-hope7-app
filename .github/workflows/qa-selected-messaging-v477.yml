name: Selected Messaging Native Bind v477 QA

on:
  push:
    branches:
      - fix/selected-messaging-native-bind-v477-20260920
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify scoped diff
        shell: bash
        run: |
          set -euo pipefail
          base=ade1ba9787cca040953417c9108d6ff64d47f8c1
          git diff --name-only "$base"...HEAD > /tmp/changed
          cat /tmp/changed
          allowed='^(js/nh7-push-account-bind-v362\.js|index\.html|service-worker\.js|sw-release-core-v403\.js|\.github/workflows/qa-selected-messaging-v477\.yml)$'
          bad=$(grep -Ev "$allowed" /tmp/changed || true)
          test -z "$bad"
          ! grep -Eq '^(supabase/|data/|admin)' /tmp/changed

      - name: Validate JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check js/nh7-push-account-bind-v362.js
          node --check service-worker.js
          node --check sw-release-core-v403.js

      - name: Verify Web and Native account binding
        shell: bash
        run: |
          set -euo pipefail
          file=js/nh7-push-account-bind-v362.js
          grep -q "OneSignal.login(userId)" "$file"
          grep -q "O.login(i.userId)" "$file"
          grep -q "window.plugins?.OneSignal" "$file"
          grep -q "OneSignal.logout" "$file"
          grep -q "O.logout" "$file"
          grep -q "s?.user?.id" "$file"
          grep -q "account_linked:'true'" "$file"
          ! grep -Eq "tags=.*email|email:.*tags|addTags\([^)]*email" "$file"

      - name: Verify native retry lifecycle
        shell: bash
        run: |
          set -euo pipefail
          file=js/nh7-push-account-bind-v362.js
          grep -q "deviceready" "$file"
          grep -q "queueNativeBind(true)" "$file"
          grep -q "NH7_PUSH_ACCOUNT_NATIVE_STATE" "$file"
          grep -q "NH7_PUSH_ACCOUNT_REBIND" "$file"

      - name: Verify release wiring and cache
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'service-worker.js?v=4.7.7' index.html
          grep -q 'js/nh7-push-account-bind-v362.js?v=3.6.2' index.html
          ! grep -q 'nh7-push-account-bind-v361.js' index.html
          grep -q 'sw-release-core-v403.js?v=4.7.7' service-worker.js
          grep -q "NH7_RELEASE_CORE_VERSION='4.7.7-selected-push-native'" sw-release-core-v403.js
          grep -q "nh7-release-core-v477-selected-push-native" sw-release-core-v403.js
          grep -q 'nh7-push-account-bind-v362.js' sw-release-core-v403.js
          ! grep -q 'nh7-push-account-bind-v361.js' sw-release-core-v403.js

      - name: Verify no messaging server or user-data mutation
        shell: bash
        run: |
          set -euo pipefail
          ! grep -Eq 'service_role|notification_inbox|nh7_admin_campaigns|ONESIGNAL_REST_API_KEY|localStorage\.clear|sessionStorage\.clear' js/nh7-push-account-bind-v362.js
          echo 'Selected messaging native binding scope OK'