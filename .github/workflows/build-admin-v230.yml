name: Build canonical admin v2.3.0

on:
  push:
    branches:
      - release/v2.3.0-access-bible-batch
    paths:
      - tools/build-admin-v230.mjs
      - js/admin-v2.2.5.js
      - admin.html
      - css/admin-v2.3.0-student-profile.css
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/v2.3.0-access-bible-batch
      - name: Generate cleaned admin file
        run: node tools/build-admin-v230.mjs
      - name: Validate generated JavaScript
        run: node --check js/admin-v2.2.5-v230.js
      - name: Commit generated files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin.html js/admin-v2.2.5-v230.js
          if git diff --cached --quiet; then
            echo "No generated changes"
          else
            git commit -m "Generate canonical admin student profile v2.3.0 [skip ci]"
            git push origin HEAD:release/v2.3.0-access-bible-batch
          fi
