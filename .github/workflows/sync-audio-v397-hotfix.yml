name: Sync audio v397 into hotfix
on:
  push:
    branches: [hotfix/audio-custom-offline-2.3.9.46]
    paths: ['.github/workflows/sync-audio-v397-hotfix.yml']
permissions:
  contents: write
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: hotfix/audio-custom-offline-2.3.9.46
          fetch-depth: 0
      - name: Copy validated QA module
        run: |
          set -euo pipefail
          git fetch origin qa/final-integration-20260825-r3:refs/remotes/origin/qa/final-integration-20260825-r3
          git show origin/qa/final-integration-20260825-r3:qa/final-r3/nh7-audio-signed-v397.js > js/nh7-audio-signed-v397.js
          node --check js/nh7-audio-signed-v397.js
      - name: Commit synchronized module
        run: |
          git config user.name 'Omideno7'
          git config user.email 'omideno7church@gmail.com'
          git add js/nh7-audio-signed-v397.js
          git commit -m 'fix(audio): add custom player and IndexedDB offline v3.9.7'
          git push origin HEAD:hotfix/audio-custom-offline-2.3.9.46
