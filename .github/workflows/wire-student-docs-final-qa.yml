name: Wire Student and Documents Final QA

on:
  push:
    branches: [release/final-qa-student-docs-23950]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/final-qa-student-docs-23950
          fetch-depth: 0
      - name: Wire tested student and document modules
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          p=Path('admin.html')
          s=p.read_text(encoding='utf-8')

          css='''  <link rel="stylesheet" href="css/admin-v2.3.9-clean-features-v311.css?v=3.1.1">\n  <link rel="stylesheet" href="css/admin-v2.3.9-document-runtime-fix4.css?v=2.3.9-f4">\n  <link rel="stylesheet" href="css/admin-v2.3.9-document-select-fix5.css?v=2.3.9-f6">\n'''
          if 'admin-v2.3.9-clean-features-v311.css' not in s:
              marker='  <link rel="stylesheet" href="css/admin-v2.3.5-analytics.css?v=2.3.6">\n'
              if marker not in s:
                  raise SystemExit('analytics CSS marker not found')
              s=s.replace(marker,marker+css,1)

          js='''  <script src="js/admin-v2.3.9-student-clean-v311.js?v=3.1.1"></script>\n  <script src="js/admin-v2.3.9-student-state-fix-v316.js?v=3.1.6"></script>\n  <script src="js/admin-v2.3.9-document-runtime-fix4.js?v=2.3.9-f4"></script>\n  <script src="js/admin-v2.3.9-document-select-fix5.js?v=2.3.9-f6"></script>\n'''
          if 'admin-v2.3.9-student-clean-v311.js' not in s:
              marker='  <script src="js/admin-v2.3.5-analytics.js?v=2.3.6"></script>\n'
              if marker not in s:
                  raise SystemExit('analytics JS marker not found')
              s=s.replace(marker,marker+js,1)

          p.write_text(s,encoding='utf-8')
          PY

          node --check js/admin-v2.3.9-student-clean-v311.js
          node --check js/admin-v2.3.9-student-state-fix-v316.js
          node --check js/admin-v2.3.9-document-runtime-fix4.js
          node --check js/admin-v2.3.9-document-select-fix5.js

          grep -q 'nh7-clean-student-backdrop' css/admin-v2.3.9-clean-features-v311.css
          grep -q 'nh7-f4-overlay' css/admin-v2.3.9-document-runtime-fix4.css
          grep -q 'nh7-f5-cert-select' css/admin-v2.3.9-document-select-fix5.css
          grep -q 'NH7DocumentStudioFix4' js/admin-v2.3.9-document-runtime-fix4.js
          grep -q 'nh7-f4-overlay' js/admin-v2.3.9-document-select-fix5.js

          python3 <<'PY'
          from pathlib import Path
          s=Path('admin.html').read_text(encoding='utf-8')
          a=s.index('admin-v2.3.5-analytics.js?v=2.3.6')
          st=s.index('admin-v2.3.9-student-clean-v311.js')
          sg=s.index('admin-v2.3.9-student-state-fix-v316.js')
          dr=s.index('admin-v2.3.9-document-runtime-fix4.js')
          ds=s.index('admin-v2.3.9-document-select-fix5.js')
          rb=s.index('nh7-admin-rbac-v350.js')
          assert a < st < sg < dr < ds < rb
          assert s.count('admin-v2.3.9-student-clean-v311.js') == 1
          assert s.count('admin-v2.3.9-document-runtime-fix4.js') == 1
          print('Student/Documents QA wiring OK')
          PY

          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin.html
          git commit -m 'fix(qa): activate stable student panel and document studio'
          git push origin HEAD:release/final-qa-student-docs-23950
