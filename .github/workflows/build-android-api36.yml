name: Build Android API 36 Candidate

on:
  push:
    branches: [release/google-play-api36]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      APP_ID: com.omideno7.newhope7
      APP_NAME: New Hope 7
      VERSION_NAME: 2.3.9.50
      VERSION_CODE: '23950'
    steps:
      - uses: actions/checkout@v4
        name: Checkout release candidate

      - uses: actions/setup-node@v4
        name: Set up Node 22
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        name: Set up Java 21
        with:
          distribution: temurin
          java-version: '21'

      - uses: android-actions/setup-android@v3
        name: Set up Android SDK

      - name: Install Android 16 / API 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'

      - name: Create Capacitor wrapper from current web main
        shell: bash
        run: |
          set -euo pipefail
          rm -rf native-release
          mkdir -p native-release/www native-release/assets
          cp index.html app-v239.html reset-password.html manifest.json version.json native-release/www/
          for dir in assets css js data offline push; do cp -R "$dir" native-release/www/; done
          cp assets/logo.png native-release/assets/logo.png
          cat > native-release/package.json <<'JSON'
          {
            "name": "new-hope-7-android-release",
            "private": true,
            "version": "2.3.9-50",
            "dependencies": {
              "@capacitor/android": "8.5.0",
              "@capacitor/core": "8.5.0",
              "@capacitor/file-transfer": "2.0.5",
              "@capacitor/filesystem": "8.1.3",
              "@capacitor/local-notifications": "8.3.1",
              "onesignal-cordova-plugin": "5.5.3"
            },
            "devDependencies": {
              "@capacitor/assets": "3.0.5",
              "@capacitor/cli": "8.5.0"
            }
          }
          JSON
          cat > native-release/capacitor.config.json <<'JSON'
          {
            "appId": "com.omideno7.newhope7",
            "appName": "New Hope 7",
            "webDir": "www",
            "server": {"androidScheme":"https","cleartext":false},
            "android": {"backgroundColor":"#ffffff","webContentsDebuggingEnabled":false},
            "plugins": {"LocalNotifications":{"iconColor":"#0f766e"}}
          }
          JSON
          cd native-release
          npm install --no-audit --no-fund
          npx cap add android
          npx cap sync android

      - name: Configure release identity, SDK and optimization
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re
          root=Path('native-release/android')
          variables=root/'variables.gradle'
          text=variables.read_text()
          text=re.sub(r'minSdkVersion\s*=\s*\d+', 'minSdkVersion = 24', text)
          text=re.sub(r'compileSdkVersion\s*=\s*\d+', 'compileSdkVersion = 36', text)
          text=re.sub(r'targetSdkVersion\s*=\s*\d+', 'targetSdkVersion = 36', text)
          variables.write_text(text)

          gradle=root/'app/build.gradle'
          text=gradle.read_text()
          text=re.sub(r'versionCode\s*(?:=\s*)?\d+', 'versionCode 23950', text)
          text=re.sub(r'versionName\s*(?:=\s*)?["\'][^"\']+["\']', 'versionName "2.3.9.50"', text)
          text=re.sub(r'minifyEnabled\s*(?:=\s*)?false', 'minifyEnabled true', text)
          if re.search(r'shrinkResources\s*(?:=\s*)?false', text):
              text=re.sub(r'shrinkResources\s*(?:=\s*)?false', 'shrinkResources true', text)
          elif 'minifyEnabled true' in text and 'shrinkResources' not in text:
              text=text.replace('minifyEnabled true', 'minifyEnabled true\n            shrinkResources true', 1)
          gradle.write_text(text)

          manifest=root/'app/src/main/AndroidManifest.xml'
          text=manifest.read_text()
          if 'android.permission.POST_NOTIFICATIONS' not in text:
              m=re.search(r'<manifest\b[^>]*>',text,re.S)
              if not m: raise SystemExit('AndroidManifest root missing')
              text=text[:m.end()]+'\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />'+text[m.end():]
          if 'usesCleartextTraffic' not in text:
              text=text.replace('<application','<application android:usesCleartextTraffic="false"',1)
          manifest.write_text(text)
          PY

      - name: Generate branded Android assets
        run: |
          cd native-release
          npx capacitor-assets generate --android --iconBackgroundColor '#ffffff' --iconBackgroundColorDark '#ffffff' --splashBackgroundColor '#ffffff' --splashBackgroundColorDark '#ffffff'
          npx cap sync android

      - name: Validate native candidate
        shell: bash
        run: |
          set -euo pipefail
          cd native-release
          grep -R "applicationId.*com.omideno7.newhope7" android/app/build.gradle
          grep -R "versionCode.*23950" android/app/build.gradle
          grep -R 'versionName.*2.3.9.50' android/app/build.gradle
          grep -R 'compileSdkVersion = 36' android/variables.gradle
          grep -R 'targetSdkVersion = 36' android/variables.gradle
          grep -R 'minSdkVersion = 24' android/variables.gradle
          grep -R 'POST_NOTIFICATIONS' android/app/src/main/AndroidManifest.xml
          grep -R 'usesCleartextTraffic="false"' android/app/src/main/AndroidManifest.xml
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          ET.parse('android/app/src/main/AndroidManifest.xml')
          print('AndroidManifest XML OK')
          PY
          test -f android/app/src/main/assets/public/index.html
          test -f android/app/src/main/assets/public/js/nh7-settings-controller-v403.js
          test -f android/app/src/main/assets/public/js/nh7-delete-account-v253.js
          npm ls onesignal-cordova-plugin --depth=0
          grep -R -i -q 'onesignal' android/capacitor-cordova-android-plugins android/app android/capacitor.settings.gradle
          echo 'OneSignal native bridge detected'

      - name: Build optimized unsigned release AAB
        shell: bash
        run: |
          set -euo pipefail
          cd native-release/android
          chmod +x gradlew
          ./gradlew bundleRelease --stacktrace
          test -f app/build/outputs/bundle/release/app-release.aab
          cp app/build/outputs/bundle/release/app-release.aab ../../New_Hope_7_2.3.9.50_API36_UNSIGNED.aab

      - name: Build side-load QA APK
        shell: bash
        run: |
          set -euo pipefail
          cd native-release/android
          ./gradlew assembleDebug --stacktrace
          test -f app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk ../../New_Hope_7_2.3.9.50_API36_QA.apk

      - name: Produce release audit and project archive
        shell: bash
        run: |
          set -euo pipefail
          cd native-release
          {
            echo 'New Hope 7 Android Release Candidate'
            echo "Commit: $GITHUB_SHA"
            echo "Package: $APP_ID"
            echo "Version name: $VERSION_NAME"
            echo "Version code: $VERSION_CODE"
            echo 'Capacitor: 8.5.0'
            echo 'OneSignal Native: onesignal-cordova-plugin 5.5.3'
            echo 'compileSdk: 36'
            echo 'targetSdk: 36'
            echo 'minSdk: 24'
            echo 'Java: 21'
            echo 'R8/resource shrinking: enabled'
            echo 'Signing: UNSIGNED release AAB — final AAB must use the existing Google Play Upload Key'
            echo
            npm ls --depth=0 || true
            echo
            ls -lh ../New_Hope_7_2.3.9.50_API36_UNSIGNED.aab ../New_Hope_7_2.3.9.50_API36_QA.apk
            echo
            sha256sum ../New_Hope_7_2.3.9.50_API36_UNSIGNED.aab ../New_Hope_7_2.3.9.50_API36_QA.apk
          } > ANDROID_RELEASE_AUDIT.txt
          rm -rf android/.gradle android/app/build android/build node_modules
          zip -qr ../New_Hope_7_Android_API36_Project.zip . -x '*.DS_Store'

      - uses: actions/upload-artifact@v4
        name: Upload AAB candidate
        with:
          name: New_Hope_7_API36_UNSIGNED_AAB
          path: New_Hope_7_2.3.9.50_API36_UNSIGNED.aab
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@v4
        name: Upload QA APK
        with:
          name: New_Hope_7_API36_QA_APK
          path: New_Hope_7_2.3.9.50_API36_QA.apk
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@v4
        name: Upload Android project and audit
        with:
          name: New_Hope_7_Android_API36_Project
          path: |
            New_Hope_7_Android_API36_Project.zip
            native-release/ANDROID_RELEASE_AUDIT.txt
          if-no-files-found: error
          retention-days: 14
