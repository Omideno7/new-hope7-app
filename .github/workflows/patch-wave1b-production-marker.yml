name: Patch Wave 1B production root marker

on:
  push:
    branches: [release/wave1b-production-23950]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message || '', 'production root marker applied') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/wave1b-production-23950
          fetch-depth: 0
      - name: Prevent redundant plan rerenders
        run: |
          python <<'PY'
          from pathlib import Path
          path=Path('js/nh7-spiritual-plans-v412.js')
          text=path.read_text(encoding='utf-8')
          if "nh7SpiritualPlansRootMarker" in text:
              print('Root marker already applied.')
              raise SystemExit(0)
          old="""    await renderSpiritualPlansV240(context(), currentParams);
              VIEW.dataset.spiritualPlans = VERSION;
          """
          new="""    await renderSpiritualPlansV240(context(), currentParams);
              if(!VIEW.querySelector('#nh7SpiritualPlansRootMarker')){
                const marker=document.createElement('span');
                marker.id='nh7SpiritualPlansRootMarker'; marker.hidden=true;
                VIEW.appendChild(marker);
              }
              VIEW.dataset.spiritualPlans = VERSION;
          """
          if old not in text:
              raise SystemExit('Render marker block not found')
          text=text.replace(old,new)
          text=text.replace("if(active && !document.querySelector('#nh7Wave1BBanner')) renderPlans(currentParams);", "if(active && !VIEW.querySelector('#nh7SpiritualPlansRootMarker')) renderPlans(currentParams);")
          path.write_text(text,encoding='utf-8')
          PY
          node --check js/nh7-spiritual-plans-v412.js
      - name: Commit marker patch
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'Omideno7'
          git config user.email 'omideno7church@gmail.com'
          git add js/nh7-spiritual-plans-v412.js
          git commit -m 'fix(plans): production root marker applied'
          git push origin HEAD:release/wave1b-production-23950
