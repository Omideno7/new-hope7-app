name: Apply Wave 2 library and ministers-access QA wiring

on:
  push:
    branches: [release/wave2-library-access-23951]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wire:
    if: ${{ !contains(github.event.head_commit.message || '', 'wire Wave 2 library QA') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/wave2-library-access-23951
          fetch-depth: 0

      - name: Wire isolated reader and admin access manager
        run: |
          python <<'PY'
          from pathlib import Path

          index = Path('index.html')
          text = index.read_text(encoding='utf-8')
          old = '<script src="js/nh7-book-reader-v281.js?v=2.3.9.33" defer></script>'
          new = '<script src="js/nh7-book-reader-v283.js?v=2.3.9.51-wave2" defer></script>'
          if new not in text:
              if old not in text:
                  raise SystemExit('Book reader script marker was not found in index.html')
              text = text.replace(old, new, 1)
          index.write_text(text, encoding='utf-8')

          admin = Path('admin.html')
          text = admin.read_text(encoding='utf-8')
          marker = '  <script id="nh7AdminRbacRuntime" defer src="js/nh7-admin-rbac-v350.js?v=2.3.9.40"></script>'
          addon = '  <script id="nh7AdminLibraryAccessV396" defer src="js/nh7-admin-library-access-v396.js?v=3.9.6-wave2"></script>'
          if addon not in text:
              if marker not in text:
                  raise SystemExit('Admin RBAC marker was not found in admin.html')
              text = text.replace(marker, marker + '\n' + addon, 1)
          admin.write_text(text, encoding='utf-8')

          offline = Path('sw-offline-v329.js')
          text = offline.read_text(encoding='utf-8')
          text = text.replace("const VERSION='v2.3.9.50-wave1b-plans';", "const VERSION='v2.3.9.51-wave2-library-qa';", 1)
          if "'./js/nh7-book-reader-v283.js'" not in text:
              if "'./js/nh7-book-reader-v281.js'" not in text:
                  raise SystemExit('Offline reader cache marker was not found')
              text = text.replace("'./js/nh7-book-reader-v281.js'", "'./js/nh7-book-reader-v283.js'", 1)
          offline.write_text(text, encoding='utf-8')
          PY

          node --check js/nh7-book-reader-v283.js
          node --check js/nh7-admin-library-access-v396.js
          grep -q 'nh7-book-reader-v283.js?v=2.3.9.51-wave2' index.html
          grep -q 'nh7-admin-library-access-v396.js?v=3.9.6-wave2' admin.html
          grep -q "const VERSION='v2.3.9.51-wave2-library-qa'" sw-offline-v329.js
          grep -q "'./js/nh7-book-reader-v283.js'" sw-offline-v329.js

      - name: Commit QA wiring
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'Omideno7'
          git config user.email 'omideno7church@gmail.com'
          git add index.html admin.html sw-offline-v329.js
          git commit -m 'feat(library): wire Wave 2 library QA'
          git push origin HEAD:release/wave2-library-access-23951
