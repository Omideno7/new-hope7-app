name: Next Native iOS Store Candidate

on:
  push:
    branches: [release/native-store-next-20261003, feature/final-qa-v2500-20261004]
  workflow_dispatch:
    inputs:
      version_name:
        description: App Store marketing version
        required: true
        default: '2.5.0'
      build_number:
        description: iOS build number; must be greater than current App Store build 24003
        required: true
        default: '25001'

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-15
    timeout-minutes: 60
    env:
      APP_ID: com.omideno7.newhope7
      APP_NAME: New Hope 7
      VERSION_NAME: ${{ inputs.version_name || '2.5.0' }}
      BUILD_NUMBER: ${{ inputs.build_number || '25001' }}

    steps:
      - name: Checkout native release candidate
        uses: actions/checkout@v4

      - name: Validate optimized release invariants
        run: |
          python3 scripts/validate_next_native_optimization_guard.py
          python3 scripts/validate_native_release_candidate.py

      - name: Select Xcode 26+
        shell: bash
        run: |
          set -euo pipefail
          XCODE_PATH=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          test -n "${XCODE_PATH:-}"
          sudo xcode-select -s "$XCODE_PATH/Contents/Developer"
          xcodebuild -version
          xcrun --sdk iphoneos --show-sdk-version

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build native web bundle from this exact release commit
        shell: bash
        run: |
          set -euo pipefail
          rm -rf ios-release
          mkdir -p ios-release/www ios-release/assets

          for file in index.html app-v239.html reset-password.html certificate.html support.html manifest.json version.json service-worker.js; do
            if [ -f "$file" ]; then cp "$file" ios-release/www/; fi
          done
          for file in sw-*.js; do
            if [ -f "$file" ]; then cp "$file" ios-release/www/; fi
          done
          for dir in assets css js data offline push public; do
            if [ -d "$dir" ]; then cp -R "$dir" ios-release/www/; fi
          done
          cp assets/logo.png ios-release/assets/logo.png

          # Native wrapper isolation: native OneSignal owns APNs and WebView must not register the web SW.
          python3 <<'PY'
          from pathlib import Path
          p=Path('ios-release/www/index.html')
          text=p.read_text(encoding='utf-8')
          text=text.replace(
              "if ('serviceWorker' in navigator) {",
              "if (!window.Capacitor?.isNativePlatform?.() && 'serviceWorker' in navigator) {"
          )
          text=text.replace(
              '<script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>',
              '<!-- Web OneSignal SDK disabled inside iOS native wrapper; native OneSignal owns APNs -->'
          )
          p.write_text(text,encoding='utf-8')
          PY

          cat > ios-release/package.json <<'JSON'
          {
            "name": "new-hope-7-ios-next",
            "private": true,
            "version": "2.5.0",
            "dependencies": {
              "@capacitor/core": "8.5.0",
              "@capacitor/ios": "8.5.0",
              "@capacitor/file-transfer": "2.0.5",
              "@capacitor/filesystem": "8.1.3",
              "@capacitor/local-notifications": "8.3.1",
              "onesignal-cordova-plugin": "5.5.3"
            },
            "devDependencies": {
              "@capacitor/assets": "3.0.5",
              "@capacitor/cli": "8.5.0"
            }
          }
          JSON

          cat > ios-release/capacitor.config.json <<'JSON'
          {
            "appId": "com.omideno7.newhope7",
            "appName": "New Hope 7",
            "webDir": "www",
            "ios": {
              "backgroundColor": "#ffffff",
              "contentInset": "automatic"
            },
            "plugins": {
              "LocalNotifications": {}
            }
          }
          JSON

          cd ios-release
          npm install --no-audit --no-fund
          npx cap add ios
          npx cap sync ios

      - name: Configure iOS identity, version, privacy and push
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import os,plistlib,re

          version=os.environ['VERSION_NAME']
          build=os.environ['BUILD_NUMBER']
          if not build.isdigit() or int(build) <= 24003:
              raise SystemExit('BUILD_NUMBER must be numeric and > 24003')

          proj=Path('ios-release/ios/App/App.xcodeproj/project.pbxproj')
          text=proj.read_text()
          text=re.sub(r'PRODUCT_BUNDLE_IDENTIFIER = [^;]+;', 'PRODUCT_BUNDLE_IDENTIFIER = com.omideno7.newhope7;', text)
          text=re.sub(r'MARKETING_VERSION = [^;]+;', f'MARKETING_VERSION = {version};', text)
          text=re.sub(r'CURRENT_PROJECT_VERSION = [^;]+;', f'CURRENT_PROJECT_VERSION = {build};', text)
          text=re.sub(r'IPHONEOS_DEPLOYMENT_TARGET = [^;]+;', 'IPHONEOS_DEPLOYMENT_TARGET = 15.0;', text)
          if re.search(r'TARGETED_DEVICE_FAMILY = [^;]+;', text):
              text=re.sub(r'TARGETED_DEVICE_FAMILY = [^;]+;', 'TARGETED_DEVICE_FAMILY = "1,2";', text)
          else:
              text=text.replace(
                  'IPHONEOS_DEPLOYMENT_TARGET = 15.0;',
                  'IPHONEOS_DEPLOYMENT_TARGET = 15.0;\n\t\t\t\tTARGETED_DEVICE_FAMILY = "1,2";'
              )
          if re.search(r'SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD = [^;]+;', text):
              text=re.sub(r'SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD = [^;]+;', 'SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD = YES;', text)
          else:
              text=text.replace(
                  'TARGETED_DEVICE_FAMILY = "1,2";',
                  'TARGETED_DEVICE_FAMILY = "1,2";\n\t\t\t\tSUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD = YES;'
              )
          if 'CODE_SIGN_ENTITLEMENTS = App/App.entitlements;' not in text:
              text=text.replace(
                  'PRODUCT_BUNDLE_IDENTIFIER = com.omideno7.newhope7;',
                  'CODE_SIGN_ENTITLEMENTS = App/App.entitlements;\n\t\t\t\tPRODUCT_BUNDLE_IDENTIFIER = com.omideno7.newhope7;'
              )
          proj.write_text(text)

          entitlements=Path('ios-release/ios/App/App/App.entitlements')
          entitlements.write_text("\n".join([
              '<?xml version="1.0" encoding="UTF-8"?>',
              '<!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">',
              '<plist version="1.0">',
              '<dict>',
              '    <key>aps-environment</key>',
              '    <string>production</string>',
              '</dict>',
              '</plist>',
          ])+"\n")

          info=Path('ios-release/ios/App/App/Info.plist')
          with info.open('rb') as fh:
              plist=plistlib.load(fh)
          modes=list(plist.get('UIBackgroundModes',[]))
          for mode in ('audio','remote-notification'):
              if mode not in modes:
                  modes.append(mode)
          plist['UIBackgroundModes']=modes
          plist.setdefault(
              'NSLocationWhenInUseUsageDescription',
              'New Hope 7 uses your location only when you choose to enable location-based notification features.'
          )
          plist['ITSAppUsesNonExemptEncryption']=False
          with info.open('wb') as fh:
              plistlib.dump(plist,fh,sort_keys=False)
          PY

      - name: Generate branded iOS assets
        shell: bash
        run: |
          set -euo pipefail
          cd ios-release
          npx capacitor-assets generate --ios --iconBackgroundColor '#ffffff' --iconBackgroundColorDark '#ffffff' --splashBackgroundColor '#ffffff' --splashBackgroundColorDark '#ffffff'
          npx cap sync ios

      - name: Validate packaged feature set and native configuration
        shell: bash
        run: |
          set -euo pipefail
          cd ios-release
          SDK_VERSION=$(xcrun --sdk iphoneos --show-sdk-version)
          MAJOR=${SDK_VERSION%%.*}
          test "$MAJOR" -ge 26

          grep -q 'PRODUCT_BUNDLE_IDENTIFIER = com.omideno7.newhope7;' ios/App/App.xcodeproj/project.pbxproj
          grep -q "MARKETING_VERSION = $VERSION_NAME;" ios/App/App.xcodeproj/project.pbxproj
          grep -q "CURRENT_PROJECT_VERSION = $BUILD_NUMBER;" ios/App/App.xcodeproj/project.pbxproj
          grep -q 'CODE_SIGN_ENTITLEMENTS = App/App.entitlements;' ios/App/App.xcodeproj/project.pbxproj
          grep -q 'TARGETED_DEVICE_FAMILY = "1,2";' ios/App/App.xcodeproj/project.pbxproj
          grep -q 'SUPPORTS_MAC_DESIGNED_FOR_IPHONE_IPAD = YES;' ios/App/App.xcodeproj/project.pbxproj
          grep -q '<string>production</string>' ios/App/App/App.entitlements
          grep -q '<string>audio</string>' ios/App/App/Info.plist
          grep -q '<string>remote-notification</string>' ios/App/App/Info.plist
          grep -q '<key>ITSAppUsesNonExemptEncryption</key>' ios/App/App/Info.plist

          test -f ios/App/App/public/js/nh7-push-account-bind-v364.js
          test -f ios/App/App/public/js/nh7-audio-classic-v484.js
          test -f ios/App/App/public/js/nh7-audio-miniplayer-v487.js
          test -f ios/App/App/public/js/nh7-audio-library-v500.js
          test -f ios/App/App/public/js/nh7-media-player-v500.js
          test -f ios/App/App/public/js/nh7-appearance-personalization-v514.js
          test -f ios/App/App/public/js/nh7-reader-toolbar-v452.js
          test -f ios/App/App/public/js/nh7-school-path-v351.js
          test -f ios/App/App/public/js/nh7-inbox-badge-sync-v418.js
          test -f ios/App/App/public/js/nh7-sermon-social-v443.js
          test -f ios/App/App/public/js/nh7-delete-account-v253.js

          grep -q 'nh7-push-account-bind-v364.js?v=3.6.4-native' ios/App/App/public/index.html
          grep -q 'nh7-media-player-v500.js?v=5.3.5-cover-sync' ios/App/App/public/index.html
          grep -q 'nh7-appearance-personalization-v514.js?v=5.2.0' ios/App/App/public/index.html
          grep -q "!window.Capacitor?.isNativePlatform?.()" ios/App/App/public/index.html
          if grep -q 'cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js' ios/App/App/public/index.html; then
            echo 'Web OneSignal SDK must not be active inside iOS native wrapper' >&2
            exit 1
          fi
          grep -q 'confirmNativeExternalId' ios/App/App/public/js/nh7-push-account-bind-v364.js
          grep -q 'nh7_inbox_snapshot_v419' ios/App/App/public/js/nh7-inbox-badge-sync-v418.js
          grep -q 'nh7_sermon_social_batch_v444' ios/App/App/public/js/nh7-sermon-social-v443.js
          npm ls onesignal-cordova-plugin --depth=0

      - name: Build unsigned Release for iOS Simulator
        shell: bash
        run: |
          set -euo pipefail
          cd ios-release/ios/App
          xcodebuild -project App.xcodeproj -scheme App -configuration Release -sdk iphonesimulator -destination 'generic/platform=iOS Simulator' CODE_SIGNING_ALLOWED=NO build | tee ../../../IOS_NEXT_SIMULATOR_BUILD.log

      - name: Build unsigned Release for generic iOS device
        shell: bash
        run: |
          set -euo pipefail
          cd ios-release/ios/App
          xcodebuild -project App.xcodeproj -scheme App -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' CODE_SIGNING_ALLOWED=NO build | tee ../../../IOS_NEXT_DEVICE_BUILD.log

      - name: Materialize local Swift package and produce self-contained project
        shell: bash
        run: |
          set -euo pipefail
          CAP_DIR='ios-release/ios/App/CapApp-SPM'
          if [ -L "$CAP_DIR" ]; then
            REAL_TARGET=$(cd "$(dirname "$CAP_DIR")" && python3 -c 'import os; print(os.path.realpath("CapApp-SPM"))')
            rm "$CAP_DIR"
            cp -R "$REAL_TARGET" "$CAP_DIR"
          fi
          test -f "$CAP_DIR/Package.swift"

          {
            echo 'New Hope 7 — Next iOS Store Candidate'
            echo "Commit: $GITHUB_SHA"
            echo "Bundle ID: $APP_ID"
            echo "Version: $VERSION_NAME"
            echo "Build: $BUILD_NUMBER"
            echo 'Minimum iOS: 15.0'
            echo 'Device family: Universal iPhone + iPad'
            echo 'Apple silicon Mac destination: enabled (Designed for iPhone/iPad)'
            echo 'Capacitor: 8.5.0'
            echo 'OneSignal native plugin: 5.5.3'
            echo 'Native push binding: v364'
            echo 'Background modes: audio, remote-notification'
            echo 'Push entitlement: production'
            echo 'Supabase optimization guard: required before build'
            echo 'Signing: not performed in CI; reuse the existing App Store signing identity/profile'
          } > IOS_NEXT_RELEASE_AUDIT.txt

          rm -rf ios-release/ios/App/build ios-release/ios/App/DerivedData
          zip -qry New_Hope_7_iOS_Next_SELF_CONTAINED.zip ios-release IOS_NEXT_RELEASE_AUDIT.txt IOS_NEXT_SIMULATOR_BUILD.log IOS_NEXT_DEVICE_BUILD.log -x '*.DS_Store'
          unzip -l New_Hope_7_iOS_Next_SELF_CONTAINED.zip | grep 'ios-release/ios/App/CapApp-SPM/Package.swift'

      - name: Upload iOS candidate project and build evidence
        uses: actions/upload-artifact@v4
        with:
          name: New_Hope_7_iOS_Next_Candidate
          path: |
            New_Hope_7_iOS_Next_SELF_CONTAINED.zip
            IOS_NEXT_RELEASE_AUDIT.txt
            IOS_NEXT_SIMULATOR_BUILD.log
            IOS_NEXT_DEVICE_BUILD.log
          if-no-files-found: error
          retention-days: 14
