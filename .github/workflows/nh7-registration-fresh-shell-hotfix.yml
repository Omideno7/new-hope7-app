name: NH7 Registration Fresh Shell Hotfix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    if: github.event.head_commit.message != 'hotfix: force fresh canonical registration shell'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Patch registration-critical cache paths
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          from datetime import datetime, timezone, timedelta

          def replace_required(path, old, new):
              p=Path(path); s=p.read_text(encoding='utf-8')
              if old not in s:
                  if new in s: return False
                  raise SystemExit(f'Expected text not found in {path}')
              p.write_text(s.replace(old,new),encoding='utf-8')
              return True

          # Force a new SW/core cache generation.
          replace_required('sw-offline-v329.js',
              "const VERSION='v2.3.9.40-recovery-admin-rbac';",
              "const VERSION='v2.3.9.43-registration-gate-v355';")

          # Navigations to the app shell must be network-first when online.
          old_nav="if(appNavigation(url))event.respondWith((async()=>{const cached=await shellResponse();if(cached){event.waitUntil(updateCache(SHELL_URL,CORE_CACHE).then(async response=>{if(response)await (await caches.open(SHELL_CACHE)).put(canonicalRequest(SHELL_URL),response.clone())}));return cached}return await updateCache(SHELL_URL,CORE_CACHE)||await caches.match(OFFLINE_URL,{ignoreSearch:true})})());"
          new_nav="if(appNavigation(url))event.respondWith((async()=>{const fresh=await updateCache(request,CORE_CACHE);if(fresh){const shell=await caches.open(SHELL_CACHE);await shell.put(canonicalRequest(request),fresh.clone());return fresh}return await caches.match(request,{ignoreSearch:true})||await shellResponse()||await caches.match(OFFLINE_URL,{ignoreSearch:true})})());"
          replace_required('sw-offline-v329.js',old_nav,new_nav)

          # Registration/auth JS must also prefer network over a stale cached copy.
          marker="function isStatic(url){return /\\.(?:js|css|png|jpe?g|webp|svg|ico|woff2?|ttf)$/i.test(url.pathname)}"
          fresh_fn=marker+"\nfunction criticalFresh(url){const rel=scopeRelative(url);return ['js/nh7-auth-signup-guard-v343.js','js/nh7-registration-canonical-v353.js','js/nh7-school-registration-v342.js','js/app.js'].includes(rel)}"
          replace_required('sw-offline-v329.js',marker,fresh_fn)
          old_static="if(url.origin===self.location.origin&&(isData(url)||isStatic(url))){\n    const cacheName=isData(url)?DATA_CACHE:CORE_CACHE;\n    event.respondWith((async()=>{const cache=await caches.open(cacheName),key=canonicalRequest(request),cached=await cache.match(key)||await caches.match(request,{ignoreSearch:true});if(cached){event.waitUntil(updateCache(request,cacheName).then(()=>{}));return cached}const fresh=await updateCache(request,cacheName);if(fresh)return fresh;return isData(url)?offlineDataResponse(url):unavailable(url)})());\n  }"
          new_static="if(url.origin===self.location.origin&&(isData(url)||isStatic(url))){\n    const cacheName=isData(url)?DATA_CACHE:CORE_CACHE;\n    event.respondWith((async()=>{const cache=await caches.open(cacheName),key=canonicalRequest(request),cached=await cache.match(key)||await caches.match(request,{ignoreSearch:true});if(criticalFresh(url)){const fresh=await updateCache(request,cacheName);if(fresh)return fresh;if(cached)return cached;return unavailable(url)}if(cached){event.waitUntil(updateCache(request,cacheName).then(()=>{}));return cached}const fresh=await updateCache(request,cacheName);if(fresh)return fresh;return isData(url)?offlineDataResponse(url):unavailable(url)})());\n  }"
          replace_required('sw-offline-v329.js',old_static,new_static)

          p=Path('service-worker.js'); s=p.read_text(encoding='utf-8')
          s=s.replace('v2.3.9.42 — canonical-only school registration','v2.3.9.43 — strict registration gate + fresh shell')
          s=s.replace('v=2.3.9.42','v=2.3.9.43')
          p.write_text(s,encoding='utf-8')

          p=Path('index.html'); s=p.read_text(encoding='utf-8')
          s=s.replace('2.3.9.41','2.3.9.43').replace('nh7-auth-signup-guard-v343.js?v=3.5.2','nh7-auth-signup-guard-v343.js?v=3.5.5')
          p.write_text(s,encoding='utf-8')

          p=Path('app-v239.html'); s=p.read_text(encoding='utf-8').replace('2.3.9.40','2.3.9.43'); p.write_text(s,encoding='utf-8')
          Path('version.json').write_text('{"app":"2.3.9.43","admin":"2.3.9.40","updated_at":"2026-08-24T18:55:00+02:00"}',encoding='utf-8')
          PY
      - name: Commit hotfix
        shell: bash
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'NH7 Release Bot'
          git config user.email 'actions@users.noreply.github.com'
          git add sw-offline-v329.js service-worker.js index.html app-v239.html version.json
          git commit -m 'hotfix: force fresh canonical registration shell'
          git push