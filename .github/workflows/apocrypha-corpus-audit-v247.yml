name: Apocrypha Corpus Audit v2.4.7

on:
  push:
    branches:
      - release-candidate-2.4.0-preview
    paths:
      - scripts/apocrypha-corpus-audit-v247.mjs

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout RC
        uses: actions/checkout@v4
      - name: Run corpus audit
        shell: bash
        run: node scripts/apocrypha-corpus-audit-v247.mjs || true
      - name: Commit audit report back to RC
        if: always()
        shell: bash
        run: |
          if [ -f artifacts/apocrypha-corpus-audit-v247.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add artifacts/apocrypha-corpus-audit-v247.json
            if ! git diff --cached --quiet; then
              git commit -m "test(apocrypha): record corpus audit result"
              git push
            fi
          fi
      - name: Upload audit report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apocrypha-corpus-audit-v247
          path: artifacts/apocrypha-corpus-audit-v247.json
          if-no-files-found: ignore
