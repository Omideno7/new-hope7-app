name: Build Android Selected Push QA APK v478

on:
  push:
    branches: ['fix/android-native-selected-push-v478-20260920']
    paths:
      - '.github/workflows/android-selected-push-apk-v478.yml'
      - 'index.html'
      - 'js/nh7-push-account-bind-v363.js'
      - 'js/nh7-notifications-zagreb-v334.js'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Install Android API 36
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_HOME:-/usr/local/lib/android/sdk}"
          SDKMANAGER=$(find "$SDK_ROOT/cmdline-tools" -type f -name sdkmanager 2>/dev/null | sort -V | tail -1)
          test -n "$SDKMANAGER"
          yes | "$SDKMANAGER" --licenses >/dev/null || true
          "$SDKMANAGER" 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"

      - name: Validate selected-user binding
        shell: bash
        run: |
          set -euo pipefail
          node --check js/nh7-push-account-bind-v363.js
          grep -q "O.login(i.userId)" js/nh7-push-account-bind-v363.js
          grep -q "User?.pushSubscription" js/nh7-push-account-bind-v363.js
          grep -q "O.logout" js/nh7-push-account-bind-v363.js
          grep -q 'nh7-push-account-bind-v363.js?v=3.6.3' index.html
          ! grep -q 'nh7-push-account-bind-v361.js' index.html

      - name: Build isolated QA APK
        shell: bash
        run: |
          set -euo pipefail
          rm -rf native-push-qa
          mkdir -p native-push-qa/www native-push-qa/assets
          cp index.html app-v239.html reset-password.html manifest.json version.json native-push-qa/www/
          for dir in assets css js data offline push; do cp -R "$dir" native-push-qa/www/; done
          cp assets/logo.png native-push-qa/assets/logo.png

          python3 <<'PY'
          from pathlib import Path
          p=Path('native-push-qa/www/index.html')
          text=p.read_text()
          text=text.replace('<script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>','<!-- Web OneSignal SDK disabled inside Android native QA wrapper -->')
          p.write_text(text)
          PY

          cat > native-push-qa/package.json <<'JSON'
          {
            "name": "new-hope-7-selected-push-qa",
            "private": true,
            "version": "4.7.8",
            "dependencies": {
              "@capacitor/android": "8.5.0",
              "@capacitor/core": "8.5.0",
              "@capacitor/file-transfer": "2.0.5",
              "@capacitor/filesystem": "8.1.3",
              "@capacitor/local-notifications": "8.3.1",
              "onesignal-cordova-plugin": "5.5.3"
            },
            "devDependencies": {
              "@capacitor/assets": "3.0.5",
              "@capacitor/cli": "8.5.0"
            }
          }
          JSON

          cat > native-push-qa/capacitor.config.json <<'JSON'
          {
            "appId": "com.omideno7.newhope7",
            "appName": "New Hope 7 Push QA",
            "webDir": "www",
            "server": {"androidScheme":"https","cleartext":false},
            "android": {"backgroundColor":"#ffffff","webContentsDebuggingEnabled":false}
          }
          JSON

          cd native-push-qa
          npm install --no-audit --no-fund
          npx cap add android
          npx cap sync android

          python3 <<'PY'
          from pathlib import Path
          import re
          root=Path('android')
          v=root/'variables.gradle'
          t=v.read_text()
          t=re.sub(r'minSdkVersion\s*=\s*\d+', 'minSdkVersion = 24', t)
          t=re.sub(r'compileSdkVersion\s*=\s*\d+', 'compileSdkVersion = 36', t)
          t=re.sub(r'targetSdkVersion\s*=\s*\d+', 'targetSdkVersion = 36', t)
          v.write_text(t)

          g=root/'app/build.gradle'
          t=g.read_text()
          t=re.sub(r'versionCode\s*(?:=\s*)?\d+', 'versionCode 47801', t)
          t=re.sub(r'versionName\s*(?:=\s*)?["\'][^"\']+["\']', 'versionName "4.7.8-pushqa"', t)
          m=re.search(r'buildTypes\s*\{',t)
          if not m: raise SystemExit('buildTypes block missing')
          t=t[:m.end()]+'\n        debug {\n            applicationIdSuffix ".qa"\n            versionNameSuffix "-qa"\n        }\n'+t[m.end():]
          g.write_text(t)

          manifest=root/'app/src/main/AndroidManifest.xml'
          t=manifest.read_text()
          if 'android.permission.POST_NOTIFICATIONS' not in t:
              m=re.search(r'<manifest\b[^>]*>',t,re.S)
              if not m: raise SystemExit('manifest root missing')
              t=t[:m.end()]+'\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />'+t[m.end():]
          if 'usesCleartextTraffic' not in t:
              t=t.replace('<application','<application android:usesCleartextTraffic="false"',1)
          manifest.write_text(t)
          PY

          test -f android/app/src/main/assets/public/js/nh7-push-account-bind-v363.js
          grep -q 'O.login(i.userId)' android/app/src/main/assets/public/js/nh7-push-account-bind-v363.js
          grep -q 'User?.pushSubscription' android/app/src/main/assets/public/js/nh7-push-account-bind-v363.js
          if grep -q 'cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js' android/app/src/main/assets/public/index.html; then
            echo 'Web OneSignal SDK must not be active in native QA' >&2
            exit 1
          fi
          npm ls onesignal-cordova-plugin --depth=0

          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
          test -f app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk ../../New_Hope_7_Android_Selected_Push_QA_v478.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: New_Hope_7_Android_Selected_Push_QA_v478
          path: New_Hope_7_Android_Selected_Push_QA_v478.apk
          if-no-files-found: error
          retention-days: 14
