name: RC 2.5.1 isolated static QA

on:
  push:
    branches:
      - agent/ministers-id-access-reader-251
    paths:
      - scripts/v251-static-qa.mjs

permissions:
  contents: write

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run v2.5.1 static QA
        shell: bash
        run: node scripts/v251-static-qa.mjs || true
      - name: Record QA report
        if: always()
        shell: bash
        run: |
          if [ -f artifacts/v251-static-qa.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add artifacts/v251-static-qa.json
            if ! git diff --cached --quiet; then
              git commit -m "test(v251): record isolated static QA result"
              git push
            fi
          fi
      - name: Upload QA report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: v251-static-qa
          path: artifacts/v251-static-qa.json
          if-no-files-found: ignore
