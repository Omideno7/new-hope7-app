name: Apply Wave 2 library integration to current main baseline

on:
  push:
    branches: [release/wave2-library-mainready-23951]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  integrate:
    if: ${{ !contains(github.event.head_commit.message || '', 'apply Wave 2 library package') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/wave2-library-mainready-23951
          fetch-depth: 0

      - name: Bring only tested Wave 2 library files onto current main baseline
        run: |
          set -euo pipefail
          git fetch origin release/wave2-library-access-23951:refs/remotes/origin/release/wave2-library-access-23951

          git show origin/release/wave2-library-access-23951:js/app.js > js/app.js
          git show origin/release/wave2-library-access-23951:js/nh7-book-reader-v283.js > js/nh7-book-reader-v283.js
          git show origin/release/wave2-library-access-23951:js/nh7-admin-library-access-v396.js > js/nh7-admin-library-access-v396.js
          git show origin/release/wave2-library-access-23951:js/nh7-library-collections-v322.js > js/nh7-library-collections-v322.js
          git show origin/release/wave2-library-access-23951:sw-offline-v329.js > sw-offline-v329.js

          python <<'PY'
          from pathlib import Path

          # Preserve every current-main hotfix and only swap the reader module.
          index = Path('index.html')
          text = index.read_text(encoding='utf-8')
          old = '<script src="js/nh7-book-reader-v281.js?v=2.3.9.33" defer></script>'
          new = '<script src="js/nh7-book-reader-v283.js?v=2.3.9.51" defer></script>'
          if new not in text:
              if old not in text:
                  raise SystemExit('index reader marker missing')
              text = text.replace(old, new, 1)
          index.write_text(text, encoding='utf-8')

          # Add the tested approved-user ministers access panel without replacing admin.html.
          admin = Path('admin.html')
          text = admin.read_text(encoding='utf-8')
          addon = '  <script id="nh7AdminLibraryAccessV396" defer src="js/nh7-admin-library-access-v396.js?v=3.9.6"></script>'
          if addon not in text:
              marker = '  <script id="nh7AdminRbacRuntime" defer src="js/nh7-admin-rbac-v350.js?v=2.3.9.40"></script>'
              if marker not in text:
                  raise SystemExit('admin RBAC marker missing')
              text = text.replace(marker, marker + '\n' + addon, 1)
          admin.write_text(text, encoding='utf-8')

          # Current main added the fasting hotfix after the old Wave 2 branch split.
          # Keep it in the offline core while using the tested Wave 2 cache/reader package.
          sw = Path('sw-offline-v329.js')
          text = sw.read_text(encoding='utf-8')
          text = text.replace("const VERSION='v2.3.9.51-wave2-library-catalog-v397';", "const VERSION='v2.3.9.51-wave2-library-mainready';", 1)
          needle = "'./js/nh7-spiritual-plans-v240.js','./js/nh7-spiritual-plans-v412.js'"
          replacement = "'./js/nh7-spiritual-plans-v240.js','./js/nh7-spiritual-plans-v412.js','./js/nh7-fasting-practical-note-removal-v413.js'"
          if 'nh7-fasting-practical-note-removal-v413.js' not in text:
              if needle not in text:
                  raise SystemExit('offline spiritual plans cache marker missing')
              text = text.replace(needle, replacement, 1)
          sw.write_text(text, encoding='utf-8')
          PY

          node --check js/app.js
          node --check js/nh7-book-reader-v283.js
          node --check js/nh7-admin-library-access-v396.js
          node --check js/nh7-library-collections-v322.js
          node --check sw-offline-v329.js
          grep -q 'nh7-book-reader-v283.js?v=2.3.9.51' index.html
          grep -q 'nh7-fasting-practical-note-removal-v413.js?v=4.1.3' index.html
          grep -q 'nh7-admin-library-access-v396.js?v=3.9.6' admin.html
          grep -q "nh7-fasting-practical-note-removal-v413.js" sw-offline-v329.js
          grep -q "nh7-book-reader-v283.js" sw-offline-v329.js

      - name: Commit package
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'Omideno7'
          git config user.email 'omideno7church@gmail.com'
          git add index.html admin.html sw-offline-v329.js js/app.js js/nh7-book-reader-v283.js js/nh7-admin-library-access-v396.js js/nh7-library-collections-v322.js
          git commit -m 'feat(library): apply Wave 2 library package to current main baseline'
          git push origin HEAD:release/wave2-library-mainready-23951
