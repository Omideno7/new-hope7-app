name: Celebrations v464 Release QA
on:
  push:
    branches: [qa/celebrations-v464-release-20260919]
    paths:
      - scripts/celebrations-v464/**
      - .github/workflows/celebrations-v464-release-qa.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: celebrations-v464-release-qa
  cancel-in-progress: false
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check unchanged production baseline
        run: |
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = '2df1fabd295a0b2de2eaf1486e41c41242a4c52f'
      - name: Prepare five runtime files only
        run: |
          python scripts/celebrations-v464/prepare_release.py
          sed -i "s/localStorage.getItem('nh7_lang')/item('nh7_lang')/" js/nh7-celebrations-v464.js
      - name: Install fixed browser test dependencies
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium webkit
      - name: Cache upgrade and syntax tests
        run: node scripts/celebrations-v464/cache_qa.cjs
      - name: Chromium and WebKit regression tests
        run: python scripts/celebrations-v464/release_qa.py
      - name: Commit verified runtime to QA branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html service-worker.js sw-release-core-v403.js js/nh7-celebrations-v464.js css/nh7-celebrations-v464.css
          git diff --cached --name-only
          git commit -m 'test(celebrations): verified release runtime and cache wiring [skip ci]'
          git push origin HEAD:qa/celebrations-v464-release-20260919
          python - <<'PY'
          import subprocess, json
          from pathlib import Path
          paths=['index.html','service-worker.js','sw-release-core-v403.js','js/nh7-celebrations-v464.js','css/nh7-celebrations-v464.css']
          out={'baseline':'2df1fabd295a0b2de2eaf1486e41c41242a4c52f','tested_commit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'runtime':{p:subprocess.check_output(['git','rev-parse','HEAD:'+p],text=True).strip() for p in paths}}
          Path('qa-output/runtime-manifest.json').write_text(json.dumps(out,indent=2))
          print(json.dumps(out,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: celebrations-v464-release-qa
          path: qa-output/
          if-no-files-found: warn
          retention-days: 14
