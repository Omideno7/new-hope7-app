name: Celebrations v464 Release QA
on:
  push:
    branches: [qa/celebrations-v464-release-20260919]
    paths:
      - scripts/celebrations-v464/**
      - .github/workflows/celebrations-v464-release-qa.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: celebrations-v464-release-qa
  cancel-in-progress: false
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Check unchanged production baseline
        run: |
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = '2df1fabd295a0b2de2eaf1486e41c41242a4c52f'
      - name: Prepare five runtime files only
        run: |
          python scripts/celebrations-v464/prepare_release.py
          sed -i "s/localStorage.getItem('nh7_lang')/item('nh7_lang')/" js/nh7-celebrations-v464.js
          python - <<'PY'
          from pathlib import Path
          p=Path('js/nh7-celebrations-v464.js');s=p.read_text()
          old="confetti.style.setProperty('--drift',i%2?'12px':'-12px');layer.append(confetti)"
          new="confetti.style.setProperty('--drift',i%2?'12px':'-12px');confetti.style.animation='nh7Confetti464 3.4s ease-in '+(.5+i*.035)+'s forwards';layer.append(confetti)"
          assert old in s
          p.write_text(s.replace(old,new))
          q=Path('scripts/celebrations-v464/release_qa.py');t=q.read_text()
          t=t.replace('static now(){return window.__qaNow}', 'static now(){return RealDate.now()}')
          old="    a=first.evaluate('(n)=>getComputedStyle(n).transform');p.wait_for_timeout(900);b=first.evaluate('(n)=>getComputedStyle(n).transform');assert a!=b,(a,b)"
          new='''    p.bring_to_front()
              p.wait_for_function("()=>{const n=document.querySelector('.nh7-bday-confetti464');return n&&getComputedStyle(n).transform!=='none'}",timeout=3200)
              frame_a=p.screenshot(animations='allow')
              a=first.evaluate('(n)=>({transform:getComputedStyle(n).transform,time:performance.now(),animations:n.getAnimations().map(a=>({time:a.currentTime,state:a.playState}))})')
              p.wait_for_timeout(600)
              frame_b=p.screenshot(animations='allow')
              b=first.evaluate('(n)=>({transform:getComputedStyle(n).transform,time:performance.now(),animations:n.getAnimations().map(a=>({time:a.currentTime,state:a.playState}))})')
              (OUT/f'{engine}-animation-diagnostic-{language}.json').write_text(json.dumps({'before':a,'after':b,'painted_frames_differ':frame_a!=frame_b},indent=2))
              assert a['transform']!=b['transform'] and b['transform']!='none' and frame_a!=frame_b,(a,b)
          '''
          # Match the four-space indentation of the nested scenario function.
          lines=new.splitlines();new='\n'.join([lines[0]]+['    '+x.lstrip() for x in lines[1:] if x.strip()])
          assert old in t
          q.write_text(t.replace(old,new))
          PY
      - name: Install fixed browser test dependencies
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium webkit
      - name: Cache upgrade and syntax tests
        run: node scripts/celebrations-v464/cache_qa.cjs
      - name: Chromium and WebKit regression tests
        run: python scripts/celebrations-v464/release_qa.py
      - name: Commit verified runtime to QA branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html service-worker.js sw-release-core-v403.js js/nh7-celebrations-v464.js css/nh7-celebrations-v464.css
          git diff --cached --name-only
          git commit -m 'test(celebrations): verified release runtime and cache wiring [skip ci]'
          git push origin HEAD:qa/celebrations-v464-release-20260919
          python - <<'PY'
          import subprocess, json
          from pathlib import Path
          paths=['index.html','service-worker.js','sw-release-core-v403.js','js/nh7-celebrations-v464.js','css/nh7-celebrations-v464.css']
          out={'baseline':'2df1fabd295a0b2de2eaf1486e41c41242a4c52f','tested_commit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'runtime':{p:subprocess.check_output(['git','rev-parse','HEAD:'+p],text=True).strip() for p in paths}}
          Path('qa-output/runtime-manifest.json').write_text(json.dumps(out,indent=2))
          print(json.dumps(out,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: celebrations-v464-release-qa
          path: qa-output/
          if-no-files-found: warn
          retention-days: 14
