name: Export Android 2.5.0 Source

on:
  push:
    branches:
      - build/android-2.5.0-export

jobs:
  export:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout frozen main source
        uses: actions/checkout@v4
      - name: Verify frozen release commit ancestry
        run: |
          git rev-parse HEAD
          git show -s --format='%H %s' HEAD
      - name: Package exact source tree
        run: |
          tar --exclude='.git' --exclude='./nh7-main-dba24de.tar.gz' -czf nh7-main-dba24de.tar.gz .
          sha256sum nh7-main-dba24de.tar.gz > nh7-main-dba24de.sha256
      - name: Upload source artifact
        uses: actions/upload-artifact@v4
        with:
          name: nh7-main-dba24de
          path: |
            nh7-main-dba24de.tar.gz
            nh7-main-dba24de.sha256
          if-no-files-found: error
          retention-days: 1
