name: Validate Admin v2.3.8

on:
  push:
    branches: [main]
    paths:
      - 'js/admin-v2.3.8-student-fix.js'
      - 'css/admin-v2.3.8-student-fix.css'
      - 'admin-v238.html'
      - '.github/workflows/validate-admin-v238.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: node --check js/admin-v2.3.8-student-fix.js
      - name: Verify required files
        run: |
          test -f admin-v238.html
          test -f css/admin-v2.3.8-student-fix.css
      - name: Record validation success
        run: |
          mkdir -p validation
          printf 'Admin v2.3.8 validation passed at %s\nCommit: %s\n' "$(date -u +%Y-%m-%dT%H:%M:%SZ)" "$GITHUB_SHA" > validation/admin-v238-success.txt
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add validation/admin-v238-success.txt
          git commit -m "Validate admin v2.3.8 [skip ci]"
          git push
