name: Validate New Hope 7 v2.3.9

on:
  push:
    branches: [main]
    paths:
      - 'service-worker.js'
      - 'app-v239.html'
      - 'admin-v239.html'
      - 'js/admin-v2.3.8-student-fix.js'
      - 'js/admin-v2.3.9-document-studio.js'
      - 'css/admin-v2.3.8-student-fix.css'
      - 'css/admin-v2.3.9-document-studio.css'
      - 'manifest.json'
      - 'admin-manifest.json'
      - '.github/workflows/validate-admin-v238.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Check JavaScript syntax
        run: |
          node --check service-worker.js
          node --check js/admin-v2.3.8-student-fix.js
          node --check js/admin-v2.3.9-document-studio.js
      - name: Verify required files and JSON
        run: |
          test -f app-v239.html
          test -f admin-v239.html
          test -f css/admin-v2.3.8-student-fix.css
          test -f css/admin-v2.3.9-document-studio.css
          node -e "JSON.parse(require('fs').readFileSync('manifest.json','utf8')); JSON.parse(require('fs').readFileSync('admin-manifest.json','utf8'))"
