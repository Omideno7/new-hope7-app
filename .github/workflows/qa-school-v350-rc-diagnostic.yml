name: QA School v350 RC Diagnostic
on:
  push:
    branches: [release/school-v350-rc-20260917]
    paths:
      - qa/rc-school-v350-diagnostic.js
      - .github/workflows/qa-school-v350-rc-diagnostic.yml
permissions:
  contents: read
jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          npm install --prefix /tmp/nh7-rcdiag playwright@1.55.0 --ignore-scripts --no-audit --no-fund
          /tmp/nh7-rcdiag/node_modules/.bin/playwright install --with-deps chromium
      - name: Diagnose RC School mount
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/nh7-diag-http.log 2>&1 &
          node qa/rc-school-v350-diagnostic.js
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: school-v350-rc-diagnostic
          path: qa-school-v350-diagnostic.png
          retention-days: 2
