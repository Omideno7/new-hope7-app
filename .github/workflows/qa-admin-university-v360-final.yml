name: QA Admin University v360 Final
on:
  push:
    branches: [agent/admin-university-messaging-360]
    paths-ignore:
      - artifacts/qa-admin-university-v360-final.json
  workflow_dispatch:
permissions:
  contents: write
jobs:
  gate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: JavaScript syntax
        run: |
          node --check js/nh7-admin-university-v360.js
          node --check js/nh7-admin-university-v360-runtime-guard.js
          node --check js/nh7-push-identity-v360.js
          node --check js/nh7-app-presence-v360.js
          node --check js/nh7-school-achievement-badge-v360.js
      - name: Production shell delta guard
        run: |
          git fetch origin main --quiet
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          main=subprocess.check_output(['git','show','origin/main:index.html'],text=True)
          rc=Path('index.html').read_text()
          extras=[
            '  <script src="js/nh7-push-identity-v360.js?v=3.6.0" defer></script>\n',
            '  <script src="js/nh7-app-presence-v360.js?v=3.6.0" defer></script>\n',
            '  <script src="js/nh7-school-achievement-badge-v360.js?v=3.6.0" defer></script>\n',
          ]
          stripped=rc
          for x in extras: stripped=stripped.replace(x,'')
          assert stripped==main, 'RC index changed beyond the three isolated v360 loaders'
          PY
      - name: Feature markers
        run: |
          grep -q 'NH7_ADMIN_RC_V360=true' admin-v239-stable.html
          grep -q 'nh7-admin-university-v360.js' admin-v239-stable.html
          grep -q 'nh7-admin-university-v360-runtime-guard.js' admin-v239-stable.html
          grep -q 'سامانه دانشجویان' js/nh7-admin-university-v360.js
          grep -q 'مرکز پیام و اعلان' js/nh7-admin-university-v360.js
          grep -q 'مرکز رسمی مدارک' js/nh7-admin-university-v360.js
          grep -q 'nh7_admin_student_activity_v360' js/nh7-admin-university-v360-runtime-guard.js
          grep -q 'عضو اپ' js/nh7-admin-university-v360-runtime-guard.js
          grep -q 'external_id' supabase/functions/nh7-admin-messaging-v360/index.ts
          grep -q 'nh7_app_presence_daily_v360' supabase/migrations/20260823190000_admin_university_messaging_v360.sql
          grep -q 'School Completion Achievement' js/nh7-school-achievement-badge-v360.js
      - name: Persist passing gate
        run: |
          mkdir -p artifacts
          cat > artifacts/qa-admin-university-v360-final.json <<'JSON'
          {
            "qa_version": "3.6.0-final",
            "static_gate": "passed",
            "javascript_syntax": "passed",
            "production_shell_delta": "three isolated app loaders only",
            "admin_messaging": "present",
            "student_information_system": "present",
            "user_analytics": "present",
            "certificate_center": "present",
            "achievement_medal": "present",
            "backend_source": "present"
          }
          JSON
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add artifacts/qa-admin-university-v360-final.json
          if ! git diff --cached --quiet; then
            git commit -m 'qa(result): v360 final static gate passed'
            git push origin HEAD:agent/admin-university-messaging-360
          fi
