name: Verify Published School Entry v465
on:
  push:
    branches: [qa/school-entry-v465-20260919]
    paths: [.github/workflows/school-entry-v465-published.yml]
permissions:
  contents: read
jobs:
  verify-publication:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 5e8e822616b22774560796155e4e181c1671bb8e
      - name: Read-only exact-byte check of four public static files
        run: |
          python - <<'PY'
          import hashlib,json,time,urllib.request
          from pathlib import Path
          from datetime import datetime,timezone
          commit='5e8e822616b22774560796155e4e181c1671bb8e'
          paths=['index.html','js/app.js','service-worker.js','sw-release-core-v403.js']
          rows=[]
          for path in paths:
              expected=Path(path).read_bytes();matched=False
              for attempt in range(8):
                  try:
                      req=urllib.request.Request('https://omideno7.github.io/new-hope7-app/'+path+'?verify='+commit,headers={'Cache-Control':'no-cache','User-Agent':'NH7-static-release-check'})
                      with urllib.request.urlopen(req,timeout=15) as response:
                          body=response.read();status=response.status
                      if body==expected:matched=True;break
                  except Exception as e:print('Waiting for published file:',path,type(e).__name__)
                  time.sleep(6)
              assert matched,'Live file differs: '+path
              rows.append({'path':path,'status':status,'matches_commit':True,'sha256':hashlib.sha256(body).hexdigest()})
              print('PASS live exact bytes:',path)
          report={'commit':commit,'verified_at':datetime.now(timezone.utc).isoformat(),'files':rows,'scope':'GET of public static runtime files only; no real user account or Supabase request.'}
          Path('publication-report.json').write_text(json.dumps(report,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: school-entry-v465-published
          path: publication-report.json
          retention-days: 14
