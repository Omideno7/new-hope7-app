name: Apply Wave 2 library catalog patch

on:
  push:
    branches:
      - release/wave2-library-access-23951
    paths:
      - scripts/apply-wave2-library-catalog-v397.py

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/wave2-library-access-23951
          fetch-depth: 0
      - name: Apply patch
        run: python scripts/apply-wave2-library-catalog-v397.py
      - name: Validate patched files
        run: |
          node --check js/app.js
          node --check js/nh7-book-reader-v283.js
          node --check js/nh7-library-collections-v322.js
          grep -q 'nh7_library_catalog_v396' js/app.js
          grep -q 'nh7_library_catalog_v396' js/nh7-book-reader-v283.js
          grep -q 'nh7_library_catalog_v396' js/nh7-library-collections-v322.js
          ! grep -q "prompt(tr('enterAccessCode')" js/app.js
          ! grep -q 'nh7_minister_library_code' js/nh7-book-reader-v283.js
      - name: Commit result
        run: |
          git config user.name 'Omideno7'
          git config user.email 'omideno7church@gmail.com'
          git add js/app.js js/nh7-book-reader-v283.js js/nh7-library-collections-v322.js sw-offline-v329.js
          git commit -m 'fix(library): account-based library catalog v3.9.7'
          git push origin HEAD:release/wave2-library-access-23951
