name: Apply isolated admin scroll and sermon reset 453
on:
  push:
    branches: [fix/admin-scroll-sermon-reset453]
    paths:
      - scripts/apply-admin-scroll-sermon-reset453.py
      - .github/workflows/apply-admin-scroll-sermon-reset453.yml
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Apply source-hash and tested-output guarded patch
        run: python3 scripts/apply-admin-scroll-sermon-reset453.py
      - name: Verify JavaScript and HTML inline script syntax
        run: |
          node --check js/admin-v2.2.5-v230.js
          node --check js/nh7-admin-full-stability-v447.js
          node --check js/nh7-admin-sermon-metadata-v452.js
          node - <<'NODE'
          const fs=require('fs'),vm=require('vm');
          for(const file of ['admin.html','admin-v239-stable.html']) {
            const html=fs.readFileSync(file,'utf8');
            const scripts=[...html.matchAll(/<script\b[^>]*>([\s\S]*?)<\/script>/gi)];
            scripts.forEach((match,i)=>new vm.Script(match[1],{filename:file+':script-'+i}));
            console.log('Parsed',file,scripts.length,'inline scripts');
          }
          NODE
      - name: Verify only the four approved runtime files changed
        run: |
          python3 - <<'PY'
          import subprocess
          expected={'admin.html','admin-v239-stable.html','js/admin-v2.2.5-v230.js','js/nh7-admin-full-stability-v447.js'}
          actual=set(subprocess.check_output(['git','diff','--name-only'],text=True).splitlines())
          assert actual==expected,(actual,expected)
          print('Scope verified:',sorted(actual))
          PY
      - name: Commit tested source to isolated fix branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin.html admin-v239-stable.html js/admin-v2.2.5-v230.js js/nh7-admin-full-stability-v447.js
          git commit -m 'Fix sermon reset after successful save and stop unsolicited admin scrolling'
          git push origin HEAD:${{ github.ref_name }}
