name: QA Player v524 Progress Performance Theme Stability

on:
  push:
    branches:
      - fix/player-v524-progress-performance-theme-stability-20261002
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify v524 scope
        run: |
          set -euo pipefail
          base=9af5cb43f29ce876cb42abada9414067aefd6f79
          git diff --name-only "$base"...HEAD | sort > /tmp/changed
          allowed=(
            '.github/workflows/qa-player-v524-progress-performance.yml'
            'css/nh7-player-volume-v521.css'
            'index.html'
            'js/nh7-icons-v517.js'
            'js/nh7-media-player-v500.js'
            'service-worker.js'
            'sw-offline-v329.js'
            'sw-release-core-v403.js'
          )
          printf '%s\n' "${allowed[@]}" | sort > /tmp/allowed
          diff -u /tmp/allowed /tmp/changed

      - name: JavaScript syntax
        run: |
          set -euo pipefail
          node --check js/nh7-media-player-v500.js
          node --check js/nh7-icons-v517.js
          node --check service-worker.js
          node --check sw-offline-v329.js
          node --check sw-release-core-v403.js

      - name: Verify seek bar start and played color
        run: |
          set -euo pipefail
          grep -q -- "--nh7-seek-pct" css/nh7-player-volume-v521.css
          grep -q "linear-gradient(90deg" css/nh7-player-volume-v521.css
          grep -q "webkit-slider-runnable-track" css/nh7-player-volume-v521.css
          grep -q "webkit-slider-thumb" css/nh7-player-volume-v521.css
          grep -q "seekEl.style.setProperty('--nh7-seek-pct'" js/nh7-media-player-v500.js
          grep -q "event.target.style.setProperty('--nh7-seek-pct'" js/nh7-media-player-v500.js

      - name: Verify compact speed control
        run: |
          set -euo pipefail
          grep -q 'data-speed aria-label=' js/nh7-media-player-v500.js
          ! grep -q 'data-speed><span data-rate>1×</span><small>' js/nh7-media-player-v500.js
          grep -q 'nh7p500-tools \[data-speed\]' css/nh7-player-volume-v521.css
          grep -q 'font-size:9px!important' css/nh7-player-volume-v521.css

      - name: Verify all theme geometries stay locked
        run: |
          set -euo pipefail
          grep -q 'html\[data-nh7-ui-style514\] .nh7p500-tools>button' css/nh7-player-volume-v521.css
          grep -q 'width:64px!important' css/nh7-player-volume-v521.css
          grep -q 'height:48px!important' css/nh7-player-volume-v521.css
          grep -q 'html\[data-nh7-ui-style514\] .nh7p500-main button' css/nh7-player-volume-v521.css
          grep -q 'width:34px!important' css/nh7-player-volume-v521.css
          grep -q 'width:46px!important' css/nh7-player-volume-v521.css
          for style in classic tactile glass minimal material outline pill aurora clay floating neon motion; do
            grep -q "$style:" js/nh7-appearance-personalization-v514.js
          done

      - name: Verify performance fixes
        run: |
          set -euo pipefail
          grep -q "syncDynamicPlay" js/nh7-icons-v517.js
          grep -q "if(record.type==='characterData')" js/nh7-icons-v517.js
          grep -q "if(structural)schedule()" js/nh7-icons-v517.js
          grep -q "syncTimer=setInterval(sync,250)" js/nh7-media-player-v500.js
          grep -q "activeAudio.preload!=='auto'" js/nh7-media-player-v500.js
          python3 - <<'PY'
          from pathlib import Path
          s=Path('js/nh7-media-player-v500.js').read_text()
          a=s.index('function sync(){')
          b=s.index('function start(){',a)
          body=s[a:b]
          assert 'renderQueue();renderRelated();' in body
          assert body.count('renderQueue();renderRelated();') == 1
          key=body.index("if(key!==lastTrackKey)")
          assert body.index('renderQueue();renderRelated();') > key
          print('queue/related rerender only on track change')
          PY

      - name: Verify mute and download behavior preserved
        run: |
          set -euo pipefail
          grep -q "toggleMediaMute" js/nh7-media-player-v500.js
          grep -q "function downloadMirror(item)" js/nh7-media-player-v500.js
          grep -q "data-download-progress" js/nh7-media-player-v500.js
          grep -q "is-downloaded" js/nh7-icons-v517.js

      - name: Verify v524 cache wiring
        run: |
          set -euo pipefail
          grep -q 'js/nh7-media-player-v500.js?v=5.2.4' index.html
          grep -q 'js/nh7-icons-v517.js?v=5.2.4' index.html
          grep -q 'css/nh7-player-volume-v521.css?v=5.2.4' index.html
          grep -q 'service-worker.js?v=4.8.6-player524' index.html
          grep -q "nh7-release-core-v524-player-progress-performance" sw-release-core-v403.js
          grep -q "v2.3.9.60-player524" sw-offline-v329.js
          grep -q "5.2.4-player524" service-worker.js

      - name: Protect unrelated production runtime and data
        run: |
          set -euo pipefail
          base=9af5cb43f29ce876cb42abada9414067aefd6f79
          git diff --exit-code "$base"...HEAD --             js/app.js js/nh7-audio-classic-v484.js js/nh7-audio-library-v500.js             js/nh7-appearance-personalization-v514.js js/nh7-fonts-v454.js js/nh7-theme-studio-v453.js             'js/nh7-school-*' 'js/nh7-admin-*' 'supabase/**' 'data/**'
