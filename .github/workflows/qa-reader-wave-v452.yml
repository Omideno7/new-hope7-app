name: Reader Wave v452 QA
on:
  push:
    branches: [feature/bible-toolbar-notes-wave-20260918]
    paths: ['js/**','css/**','index.html','scripts/reader-wave-v452/**','.github/workflows/qa-reader-wave-v452.yml']
permissions:
  contents: write
concurrency:
  group: reader-wave-v452
  cancel-in-progress: true
jobs:
  qa:
    if: github.ref == 'refs/heads/feature/bible-toolbar-notes-wave-20260918'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      MAIN_BASE: 569f94080131bf91d64cf7a66684c1159c823d62
      PREVIEW_BRANCH: feature/bible-toolbar-notes-wave-20260918
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare and validate reader adapters
        run: |
          set -euo pipefail
          mkdir -p qa-reader452
          git ls-remote origin refs/heads/main > qa-reader452/main-before.txt
          test "$(cut -f1 qa-reader452/main-before.txt)" = "$MAIN_BASE"
          python scripts/reader-wave-v452/prepare.py
          python scripts/reader-wave-v452/finalize.py
          python scripts/reader-wave-v452/build_preview.py
          find js css -type f -print0 | sort -z | xargs -0 sha256sum > qa-reader452/idempotence-before.txt
          sha256sum index.html reader-preview.html >> qa-reader452/idempotence-before.txt
          python scripts/reader-wave-v452/prepare.py
          python scripts/reader-wave-v452/finalize.py
          python scripts/reader-wave-v452/build_preview.py
          find js css -type f -print0 | sort -z | xargs -0 sha256sum > qa-reader452/idempotence-after.txt
          sha256sum index.html reader-preview.html >> qa-reader452/idempotence-after.txt
          diff qa-reader452/idempotence-before.txt qa-reader452/idempotence-after.txt
          for file in js/app.js js/nh7-app-enhancements-v230.js js/nh7-my-notes-v234.js js/nh7-reader-toolbar-v452.js js/nh7-my-notes-categories-v452.js js/nh7-apocrypha-preview-v240.js js/nh7-apocrypha-actions-v393.js js/nh7-reader-ux-v251.js js/nh7-reader-preview-v452.js js/nh7-reader-preview-app-v452.js; do node --check "$file"; done
          python -m py_compile scripts/reader-wave-v452/*.py
          git diff --check
          git diff --exit-code "$MAIN_BASE" -- data/bible data/apocrypha
          python - <<'PY'
          import hashlib,json,pathlib
          files=sorted([*pathlib.Path('data/bible').rglob('*.json'),*pathlib.Path('data/apocrypha').rglob('*.json')])
          hashes={str(p):hashlib.sha256(p.read_bytes()).hexdigest() for p in files}
          data=json.loads(pathlib.Path('data/bible/keywords/bible_keywords_v450.json').read_text())
          assert all(len(data['languages'][lang])==2500 for lang in ['fa','en','hr'])
          assert 'nh7-reader-preview-v452.js' not in pathlib.Path('index.html').read_text()
          pathlib.Path('qa-reader452/corpus-report.json').write_text(json.dumps({'status':'passed','corpusUnchangedFromMain':True,'keywordsPerLanguage':2500,'hashes':hashes},indent=2))
          PY
      - name: Install pinned browser tools
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium webkit
          mkdir -p "$RUNNER_TEMP/reader-agent"
          npm install --prefix "$RUNNER_TEMP/reader-agent" --save-exact agent-browser@0.38.1
          echo "QA_AGENT_BROWSER=$RUNNER_TEMP/reader-agent/node_modules/.bin/agent-browser" >> "$GITHUB_ENV"
      - name: Chromium reader and notes tests
        run: QA_ENGINE=chromium python scripts/reader-wave-v452/browser.py
      - name: WebKit reader and notes tests
        run: QA_ENGINE=webkit python scripts/reader-wave-v452/browser.py
      - name: Isolated Preview verification
        run: python scripts/reader-wave-v452/preview_browser.py
      - name: Commit verified adapters to feature branch only
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/$PREVIEW_BRANCH"
          test "$(git ls-remote origin "refs/heads/$PREVIEW_BRANCH" | cut -f1)" = "$GITHUB_SHA"
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$MAIN_BASE"
          git add index.html js/app.js js/nh7-app-enhancements-v230.js js/nh7-my-notes-v234.js js/nh7-apocrypha-preview-v240.js js/nh7-apocrypha-actions-v393.js js/nh7-reader-ux-v251.js js/nh7-reader-toolbar-v452.js js/nh7-reader-preview-app-v452.js reader-preview.html css/nh7-reader-preview-*.css scripts/reader-wave-v452/browser.py
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix(reader): verified three-language toolbar, safe notes and isolated Preview'
            git push origin "HEAD:refs/heads/$PREVIEW_BRANCH"
          fi
          git rev-parse HEAD > qa-reader452/tested-commit.txt
          git ls-remote origin refs/heads/main > qa-reader452/main-after.txt
          diff qa-reader452/main-before.txt qa-reader452/main-after.txt
      - name: Verify actual immutable public Preview
        run: |
          export QA_PREVIEW_URL="https://rawcdn.githack.com/Omideno7/new-hope7-app/$(cat qa-reader452/tested-commit.txt)/reader-preview.html"
          python scripts/reader-wave-v452/preview_browser.py
      - name: Collect candidate evidence
        if: always()
        run: |
          mkdir -p qa-reader452
          git diff "$MAIN_BASE" -- js css index.html > qa-reader452/reader.patch
          python - <<'PY'
          import pathlib,tarfile
          names=['index.html','js/app.js','js/nh7-app-enhancements-v230.js','js/nh7-my-notes-v234.js','js/nh7-reader-toolbar-v452.js','js/nh7-my-notes-categories-v452.js','js/nh7-apocrypha-preview-v240.js','js/nh7-apocrypha-actions-v393.js','js/nh7-reader-ux-v251.js','css/nh7-reader-toolbar-v452.css','css/nh7-notes-categories-v452.css','js/nh7-reader-preview-app-v452.js','js/nh7-reader-preview-v452.js','reader-preview.html']
          names += [str(p) for p in pathlib.Path('scripts/reader-wave-v452').glob('*.py')]
          names += [str(p) for p in pathlib.Path('css').glob('nh7-reader-preview-*.css')]
          with tarfile.open('qa-reader452/tested-source.tgz','w:gz') as tar:
              for name in names:
                  if pathlib.Path(name).exists():tar.add(name,arcname=name)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reader-v452-${{ github.sha }}
          path: qa-reader452/
          retention-days: 14
