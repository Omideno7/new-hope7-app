name: QA School v350 RC Natural Load
on:
  push:
    branches: [release/school-v350-rc-20260917]
    paths:
      - index.html
      - js/nh7-school-path-v350.js
      - qa/rc-school-v350-natural-load.js
      - .github/workflows/qa-school-v350-rc-natural.yml
permissions:
  contents: read
jobs:
  rc-natural-load:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Static RC assertions
        shell: bash
        run: |
          node --check js/nh7-school-path-v350.js
          node --check qa/rc-school-v350-natural-load.js
          test "$(grep -c 'js/nh7-school-path-v350.js?v=3.5.0' index.html)" -eq 1
          node - <<'NODE'
          const fs=require('fs');
          const h=fs.readFileSync('index.html','utf8');
          const old=h.indexOf('js/nh7-school-exam-v344.js');
          const next=h.indexOf('js/nh7-school-path-v350.js');
          if(old<0||next<0||next<old) throw new Error('v350 must load after v344');
          const js=fs.readFileSync('js/nh7-school-path-v350.js','utf8');
          if(/Local QA controls|Simulate PASS|Simulate FAIL|Reset Preview/i.test(js)) throw new Error('QA-only controls found in production module');
          console.log('RC_STATIC_OK');
          NODE
      - name: Install Chromium
        run: |
          npm install --prefix /tmp/nh7-rc playwright@1.55.0 --ignore-scripts --no-audit --no-fund
          /tmp/nh7-rc/node_modules/.bin/playwright install --with-deps chromium
      - name: Run RC mobile natural-load QA
        shell: bash
        run: |
          python3 -m http.server 4173 --bind 127.0.0.1 >/tmp/nh7-rc-http.log 2>&1 &
          node qa/rc-school-v350-natural-load.js
      - name: Upload RC screenshot
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: school-v350-rc-natural
          path: qa-school-v350-rc-natural.png
          retention-days: 3
