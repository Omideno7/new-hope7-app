name: QA32 hosted smoke test
on:
  push:
    branches:
      - qa/hybrid-final-20260912
    paths:
      - 'index.html'
      - 'qa32-core.js'
      - 'qa32.css'
      - '.github/workflows/qa-host-smoke32.yml'
permissions:
  contents: read
jobs:
  smoke:
    runs-on: ubuntu-latest
    steps:
      - name: Verify immutable raw.githack deployment
        shell: bash
        run: |
          set -euo pipefail
          BASE="https://raw.githack.com/Omideno7/new-hope7-app/${GITHUB_SHA}"
          echo "Testing $BASE/index.html"
          fetch() {
            local path="$1" out="$2"
            for n in 1 2 3 4 5 6; do
              code=$(curl -L --connect-timeout 10 --max-time 30 -sS -o "$out" -w '%{http_code}' "$BASE/$path" || true)
              echo "$path attempt=$n http=$code bytes=$(wc -c < "$out" 2>/dev/null || echo 0)"
              [ "$code" = "200" ] && return 0
              sleep 5
            done
            return 1
          }
          fetch index.html /tmp/index.html
          fetch qa32-core.js /tmp/qa32-core.js
          fetch qa32.css /tmp/qa32.css
          grep -q 'Hybrid Final QA 32' /tmp/index.html
          grep -q 'qa32-core.js?v=32' /tmp/index.html
          grep -q 'qa32.css?v=32' /tmp/index.html
          test "$(wc -c < /tmp/qa32-core.js)" = "90788"
          test "$(sha256sum /tmp/qa32-core.js | awk '{print $1}')" = "2d779c0166b9b2a43707de1dd09385d67a88af565426afd1018cdf8aa220e539"
          test "$(wc -c < /tmp/qa32.css)" = "21907"
          test "$(sha256sum /tmp/qa32.css | awk '{print $1}')" = "6b216b459027226727736a24363a4ccdb2b9e93d7159a0da3f6680bdd396ea39"
          node --check /tmp/qa32-core.js
          echo "QA32_HOST_OK=$BASE/index.html"
