name: Apply fasting practical-note removal

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Remove only the practical-note card from fasting form
        run: |
          python <<'PY'
          from pathlib import Path
          path = Path('js/nh7-spiritual-plans-v240.js')
          text = path.read_text(encoding='utf-8')
          old = '''    <section class="card nh7-fasting-form"><h2>${esc(meta.title || t(ctx, 'fastingJournal'))}</h2><div class="nh7-safety-note"><strong>⚕ ${esc(t(ctx, 'safety'))}</strong><p>${esc(meta.safety || '')}</p></div>
      <form id="nh7FastingJourneyForm">'''
          new = '''    <section class="card nh7-fasting-form"><h2>${esc(meta.title || t(ctx, 'fastingJournal'))}</h2>
      <form id="nh7FastingJourneyForm">'''
          if old in text:
              text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')
          elif 'nh7-safety-note' not in text:
              print('Practical-note card already removed; no change needed.')
          else:
              raise SystemExit('Expected practical-note card block was not found exactly; refusing broad edit.')
          PY

          node --check js/nh7-spiritual-plans-v240.js
          ! grep -q 'nh7-safety-note' js/nh7-spiritual-plans-v240.js
          ! grep -q 'nh7FastingSafety' js/nh7-spiritual-plans-v240.js
          ! grep -q 'safetyAck' js/nh7-spiritual-plans-v240.js

      - name: Commit only the approved UI removal
        run: |
          if git diff --quiet; then exit 0; fi
          changed=$(git diff --name-only)
          test "$changed" = "js/nh7-spiritual-plans-v240.js"
          git config user.name 'Omideno7'
          git config user.email 'omideno7church@gmail.com'
          git add js/nh7-spiritual-plans-v240.js
          git commit -m 'fix(plans): remove fasting practical-note card'
          git push origin HEAD:main
