name: Verify New Hope 7 iOS wrapper

on:
  workflow_dispatch:
  push:
    branches:
      - agent/ios-capacitor-239
    paths:
      - 'ios-wrapper/**'
      - '.github/workflows/verify-ios-wrapper.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'ios-wrapper/**'
      - '.github/workflows/verify-ios-wrapper.yml'

permissions:
  contents: read

jobs:
  simulator-build:
    runs-on: macos-26
    timeout-minutes: 35
    env:
      ONESIGNAL_DISABLE_LOCATION: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Select Xcode 26.6
        run: sudo xcode-select -s /Applications/Xcode_26.6.app/Contents/Developer

      - name: Install dependencies
        working-directory: ios-wrapper
        run: npm install --no-audit --no-fund

      - name: Prepare native web bundle
        working-directory: ios-wrapper
        run: npm run prepare

      - name: Generate iOS project
        working-directory: ios-wrapper
        run: npx cap add ios

      - name: Sync native plugins
        working-directory: ios-wrapper
        run: npx cap sync ios

      - name: Generate New Hope 7 app icon and splash
        working-directory: ios-wrapper
        run: npm run ios:assets

      - name: Configure native iOS capabilities
        working-directory: ios-wrapper
        run: npm run ios:configure

      - name: Verify generated native settings and branding
        working-directory: ios-wrapper
        run: |
          plutil -lint ios/App/App/Info.plist
          plutil -lint ios/App/App/NewHope7.entitlements
          grep -q 'group.com.omideno7.newhope7.onesignal' ios/App/App/NewHope7.entitlements
          grep -q 'remote-notification' ios/App/App/Info.plist
          grep -q '<string>audio</string>' ios/App/App/Info.plist
          grep -q 'CODE_SIGN_ENTITLEMENTS = App/NewHope7.entitlements;' ios/App/App.xcodeproj/project.pbxproj
          grep -q 'MARKETING_VERSION = 2.3.9;' ios/App/App.xcodeproj/project.pbxproj
          plutil -lint ios/App/OneSignalNotificationServiceExtension/Info.plist
          plutil -lint ios/App/OneSignalNotificationServiceExtension/NewHope7OneSignalExtension.entitlements
          grep -q 'OneSignalNotificationServiceExtension' ios/App/App.xcodeproj/project.pbxproj
          grep -q 'com.omideno7.newhope7.OneSignalNotificationServiceExtension' ios/App/App.xcodeproj/project.pbxproj
          grep -q 'group.com.omideno7.newhope7.onesignal' ios/App/OneSignalNotificationServiceExtension/Info.plist
          grep -q 'group.com.omideno7.newhope7.onesignal' ios/App/OneSignalNotificationServiceExtension/NewHope7OneSignalExtension.entitlements
          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path('ios/App/App/Assets.xcassets/Splash.imageset')
          source = Path('assets/splash.png')
          data = json.loads((root / 'Contents.json').read_text(encoding='utf-8'))
          names = sorted({x.get('filename') for x in data.get('images', []) if x.get('filename')})
          assert names, 'No splash image files found'
          digest = lambda p: hashlib.sha256(p.read_bytes()).hexdigest()
          expected = digest(source)
          for name in names:
              assert digest(root / name) == expected, f'Unbranded splash: {name}'
          print('Verified branded splash:', names)
          PY

      - name: Show toolchain
        run: |
          node --version
          npm --version
          xcodebuild -version

      - name: Build unsigned iOS Simulator app
        working-directory: ios-wrapper
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath .build/SimulatorDerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Verify embedded OneSignal extension in Simulator app
        working-directory: ios-wrapper
        run: |
          test -d .build/SimulatorDerivedData/Build/Products/Debug-iphonesimulator/App.app/PlugIns/OneSignalNotificationServiceExtension.appex
          test -f .build/SimulatorDerivedData/Build/Products/Debug-iphonesimulator/App.app/PlugIns/OneSignalNotificationServiceExtension.appex/Info.plist

      - name: Build unsigned Release app for real iOS devices
        working-directory: ios-wrapper
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath .build/DeviceDerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Verify embedded OneSignal extension in Release device app
        working-directory: ios-wrapper
        run: |
          test -d .build/DeviceDerivedData/Build/Products/Release-iphoneos/App.app/PlugIns/OneSignalNotificationServiceExtension.appex
          test -f .build/DeviceDerivedData/Build/Products/Release-iphoneos/App.app/PlugIns/OneSignalNotificationServiceExtension.appex/Info.plist

      - name: Package generated Xcode project
        working-directory: ios-wrapper
        run: ditto -c -k --sequesterRsrc --keepParent ios New-Hope-7-iOS-Xcode.zip

      - name: Upload generated iOS project
        uses: actions/upload-artifact@v4
        with:
          name: New-Hope-7-iOS-Xcode
          path: ios-wrapper/New-Hope-7-iOS-Xcode.zip
          if-no-files-found: error
          retention-days: 14
