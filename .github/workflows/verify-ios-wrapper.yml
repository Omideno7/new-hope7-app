name: Verify New Hope 7 iOS wrapper

on:
  workflow_dispatch:
  push:
    branches:
      - agent/ios-capacitor-239
    paths:
      - 'ios-wrapper/**'
      - '.github/workflows/verify-ios-wrapper.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'ios-wrapper/**'
      - '.github/workflows/verify-ios-wrapper.yml'

concurrency:
  group: nh7-ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  baseline-native-build:
    runs-on: macos-26
    timeout-minutes: 40
    env:
      ONESIGNAL_DISABLE_LOCATION: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Select latest installed Xcode 26
        shell: bash
        run: |
          set -euo pipefail
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          test -n "$XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - name: Install dependencies
        working-directory: ios-wrapper
        run: npm install --no-audit --no-fund

      - name: Prepare native-safe web bundle
        working-directory: ios-wrapper
        run: npm run prepare

      - name: Generate iOS project
        working-directory: ios-wrapper
        run: npx cap add ios

      - name: Sync Capacitor and OneSignal native plugins
        working-directory: ios-wrapper
        run: ONESIGNAL_DISABLE_LOCATION=true npx cap sync ios

      - name: Verify generated identity and web bundle
        working-directory: ios-wrapper
        shell: bash
        run: |
          set -euo pipefail
          test -f ios/App/App/Info.plist
          test -f ios/App/App/public/index.html
          grep -q 'com.omideno7.newhope7' ios/App/App.xcodeproj/project.pbxproj
          grep -q 'nh7-native-bridge.js' ios/App/App/public/index.html
          grep -q 'nh7-native-ios.css' ios/App/App/public/index.html
          if grep -q 'cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer' ios/App/App/public/index.html; then
            echo 'Raw OneSignal Web SDK is still present in native bundle' >&2
            exit 1
          fi

      - name: Build unsigned iOS Simulator app
        working-directory: ios-wrapper
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath .build/SimulatorDerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Verify Simulator packaging
        working-directory: ios-wrapper
        shell: bash
        run: |
          set -euo pipefail
          APP=.build/SimulatorDerivedData/Build/Products/Debug-iphonesimulator/App.app
          test -d "$APP"
          test -f "$APP/public/index.html"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist" | grep -q 'com.omideno7.newhope7'

      - name: Build unsigned Release app for physical iOS devices
        working-directory: ios-wrapper
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath .build/DeviceDerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Package generated Xcode project
        working-directory: ios-wrapper
        run: ditto -c -k --sequesterRsrc --keepParent ios New-Hope-7-iOS-Xcode-baseline.zip

      - name: Upload generated Xcode project
        uses: actions/upload-artifact@v4
        with:
          name: New-Hope-7-iOS-Xcode-Baseline
          path: ios-wrapper/New-Hope-7-iOS-Xcode-baseline.zip
          if-no-files-found: error
          retention-days: 14
