name: Verify New Hope 7 iOS wrapper

on:
  workflow_dispatch:
  push:
    branches:
      - agent/ios-capacitor-239
    paths:
      - 'ios-wrapper/**'
      - '.github/workflows/verify-ios-wrapper.yml'
  pull_request:
    branches:
      - main
    paths:
      - 'ios-wrapper/**'
      - '.github/workflows/verify-ios-wrapper.yml'

concurrency:
  group: nh7-ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  full-native-build:
    runs-on: macos-26
    timeout-minutes: 45
    env:
      ONESIGNAL_DISABLE_LOCATION: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Select latest installed Xcode 26
        shell: bash
        run: |
          set -euo pipefail
          XCODE=$(ls -d /Applications/Xcode_26*.app 2>/dev/null | sort -V | tail -1)
          test -n "$XCODE"
          sudo xcode-select -s "$XCODE/Contents/Developer"
          xcodebuild -version

      - name: Install dependencies
        working-directory: ios-wrapper
        run: npm install --no-audit --no-fund

      - name: Prepare native-safe web bundle
        working-directory: ios-wrapper
        run: npm run prepare

      - name: Generate iOS project
        working-directory: ios-wrapper
        run: npx cap add ios

      - name: Sync Capacitor and OneSignal native plugins
        working-directory: ios-wrapper
        run: ONESIGNAL_DISABLE_LOCATION=true npx cap sync ios

      - name: Generate branded app icon and splash
        working-directory: ios-wrapper
        run: npm run ios:assets

      - name: Configure capabilities privacy and OneSignal extension
        working-directory: ios-wrapper
        run: npm run ios:configure

      - name: Verify native identity capabilities privacy and branding
        working-directory: ios-wrapper
        shell: bash
        run: |
          set -euo pipefail
          plutil -lint ios/App/App/Info.plist
          plutil -lint ios/App/App/NewHope7.entitlements
          grep -q 'group.com.omideno7.newhope7.onesignal' ios/App/App/NewHope7.entitlements
          grep -q 'remote-notification' ios/App/App/Info.plist
          grep -q '<string>audio</string>' ios/App/App/Info.plist
          grep -q 'CODE_SIGN_ENTITLEMENTS = App/NewHope7.entitlements;' ios/App/App.xcodeproj/project.pbxproj
          grep -q 'MARKETING_VERSION = 2.3.9;' ios/App/App.xcodeproj/project.pbxproj
          grep -q 'PRODUCT_BUNDLE_IDENTIFIER = com.omideno7.newhope7;' ios/App/App.xcodeproj/project.pbxproj

          plutil -lint ios/App/App/PrivacyInfo.xcprivacy
          grep -q 'NSPrivacyAccessedAPICategoryFileTimestamp' ios/App/App/PrivacyInfo.xcprivacy
          grep -q '<string>C617.1</string>' ios/App/App/PrivacyInfo.xcprivacy
          grep -q 'NSPrivacyCollectedDataTypeSensitiveInfo' ios/App/App/PrivacyInfo.xcprivacy
          grep -q 'NSPrivacyCollectedDataTypeProductInteraction' ios/App/App/PrivacyInfo.xcprivacy
          grep -q 'PrivacyInfo.xcprivacy in Resources' ios/App/App.xcodeproj/project.pbxproj

          plutil -lint ios/App/OneSignalNotificationServiceExtension/Info.plist
          plutil -lint ios/App/OneSignalNotificationServiceExtension/NewHope7OneSignalExtension.entitlements
          grep -q 'OneSignalNotificationServiceExtension' ios/App/App.xcodeproj/project.pbxproj
          grep -q 'com.omideno7.newhope7.OneSignalNotificationServiceExtension' ios/App/App.xcodeproj/project.pbxproj
          grep -q 'group.com.omideno7.newhope7.onesignal' ios/App/OneSignalNotificationServiceExtension/Info.plist
          grep -q 'group.com.omideno7.newhope7.onesignal' ios/App/OneSignalNotificationServiceExtension/NewHope7OneSignalExtension.entitlements

          python3 - <<'PY'
          import hashlib, json
          from pathlib import Path
          root = Path('ios/App/App/Assets.xcassets/Splash.imageset')
          source = Path('assets/splash.png')
          data = json.loads((root / 'Contents.json').read_text(encoding='utf-8'))
          names = sorted({x.get('filename') for x in data.get('images', []) if x.get('filename')})
          assert names, 'No splash image files found'
          digest = lambda p: hashlib.sha256(p.read_bytes()).hexdigest()
          expected = digest(source)
          for name in names:
              assert digest(root / name) == expected, f'Unbranded splash: {name}'
          print('Verified branded splash:', names)
          PY

      - name: Build unsigned iOS Simulator app
        working-directory: ios-wrapper
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Debug \
            -sdk iphonesimulator \
            -destination 'generic/platform=iOS Simulator' \
            -derivedDataPath .build/SimulatorDerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Verify Simulator app packaging
        working-directory: ios-wrapper
        shell: bash
        run: |
          set -euo pipefail
          APP=.build/SimulatorDerivedData/Build/Products/Debug-iphonesimulator/App.app
          test -d "$APP/PlugIns/OneSignalNotificationServiceExtension.appex"
          test -f "$APP/PlugIns/OneSignalNotificationServiceExtension.appex/Info.plist"
          test -f "$APP/PrivacyInfo.xcprivacy"
          plutil -lint "$APP/PrivacyInfo.xcprivacy"
          /usr/libexec/PlistBuddy -c 'Print :CFBundleIdentifier' "$APP/Info.plist" | grep -q 'com.omideno7.newhope7'

      - name: Build unsigned Release app for physical iOS devices
        working-directory: ios-wrapper
        run: |
          xcodebuild \
            -project ios/App/App.xcodeproj \
            -scheme App \
            -configuration Release \
            -sdk iphoneos \
            -destination 'generic/platform=iOS' \
            -derivedDataPath .build/DeviceDerivedData \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Verify Release device app packaging
        working-directory: ios-wrapper
        shell: bash
        run: |
          set -euo pipefail
          APP=.build/DeviceDerivedData/Build/Products/Release-iphoneos/App.app
          test -d "$APP/PlugIns/OneSignalNotificationServiceExtension.appex"
          test -f "$APP/PlugIns/OneSignalNotificationServiceExtension.appex/Info.plist"
          test -f "$APP/PrivacyInfo.xcprivacy"
          plutil -lint "$APP/PrivacyInfo.xcprivacy"

      - name: Package generated Xcode project
        working-directory: ios-wrapper
        run: ditto -c -k --sequesterRsrc --keepParent ios New-Hope-7-iOS-Xcode-full.zip

      - name: Upload generated iOS project
        uses: actions/upload-artifact@v4
        with:
          name: New-Hope-7-iOS-Xcode-Full
          path: ios-wrapper/New-Hope-7-iOS-Xcode-full.zip
          if-no-files-found: error
          retention-days: 14
