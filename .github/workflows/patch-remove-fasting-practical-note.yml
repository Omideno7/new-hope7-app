name: Remove fasting practical note block

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Remove only the practical-note box and refresh plan cache
        run: |
          python <<'PY'
          from pathlib import Path

          path = Path('js/nh7-spiritual-plans-v240.js')
          text = path.read_text(encoding='utf-8')
          old = '''    <section class="card nh7-fasting-form"><h2>${esc(meta.title || t(ctx, 'fastingJournal'))}</h2><div class="nh7-safety-note"><strong>⚕ ${esc(t(ctx, 'safety'))}</strong><p>${esc(meta.safety || '')}</p></div>
      <form id="nh7FastingJourneyForm">'''
          new = '''    <section class="card nh7-fasting-form"><h2>${esc(meta.title || t(ctx, 'fastingJournal'))}</h2>
      <form id="nh7FastingJourneyForm">'''
          if old in text:
              text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')
          elif '<div class="nh7-safety-note">' in text:
              raise SystemExit('Unexpected fasting practical-note markup shape')

          sw = Path('sw-offline-v329.js')
          sw_text = sw.read_text(encoding='utf-8')
          sw_text = sw_text.replace("const VERSION='v2.3.9.50-wave1b-plans';", "const VERSION='v2.3.9.50-fasting-note-removed';", 1)
          sw.write_text(sw_text, encoding='utf-8')
          PY

          node --check js/nh7-spiritual-plans-v240.js
          ! grep -q '<div class="nh7-safety-note">' js/nh7-spiritual-plans-v240.js
          grep -q "const VERSION='v2.3.9.50-fasting-note-removed'" sw-offline-v329.js

      - name: Commit hotfix if needed
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'Omideno7'
          git config user.email 'omideno7church@gmail.com'
          git add js/nh7-spiritual-plans-v240.js sw-offline-v329.js
          git commit -m 'hotfix(plans): remove fasting practical note box'
          git push origin HEAD:main
