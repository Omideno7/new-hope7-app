name: School Draft Recovery v468 QA
on:
  push:
    branches: [qa/school-draft-v468-20260919]
    paths:
      - scripts/school-draft-v468/**
      - js/nh7-school-drafts-v468.js
      - .github/workflows/school-draft-v468-qa.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: school-draft-v468-qa
  cancel-in-progress: true
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Verify unchanged main and prepare draft-only hooks
        run: |
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = '44dfd189832c4a6031562851765811f941e0efe4'
          python scripts/school-draft-v468/prepare.py
          python -m py_compile scripts/school-draft-v468/qa.py
          mkdir -p qa-drafts-v468
          git diff 44dfd189832c4a6031562851765811f941e0efe4 -- js/app.js js/nh7-school-drafts-v468.js index.html service-worker.js sw-release-core-v403.js > qa-drafts-v468/runtime.patch
      - name: Install pinned browser dependencies
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium webkit
      - name: Cache upgrade preservation
        run: node scripts/school-draft-v468/cache.cjs
      - name: Original UI and draft-interruption browser regressions
        run: python scripts/school-draft-v468/qa.py
      - name: Commit tested runtime on QA branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/app.js js/nh7-school-drafts-v468.js index.html service-worker.js sw-release-core-v403.js
          git diff --cached --name-only
          git commit -m 'fix(school): verified minimal draft recovery with unchanged UI [skip ci]'
          git push origin HEAD:qa/school-draft-v468-20260919
          python - <<'PY'
          from pathlib import Path
          import subprocess,json
          paths=['js/app.js','js/nh7-school-drafts-v468.js','index.html','service-worker.js','sw-release-core-v403.js']
          manifest={'baseline':'44dfd189832c4a6031562851765811f941e0efe4','tested_commit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'runtime':{p:subprocess.check_output(['git','rev-parse','HEAD:'+p],text=True).strip() for p in paths},'redesign_included':False,'database_operations':False}
          Path('qa-drafts-v468/runtime-manifest.json').write_text(json.dumps(manifest,indent=2));print(json.dumps(manifest,indent=2))
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: school-draft-v468-qa
          path: qa-drafts-v468/
          retention-days: 14
