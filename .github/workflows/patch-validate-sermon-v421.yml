name: Patch and Validate Sermon Visibility v4.2.1

on:
  push:
    branches: ['fix/sermon-visibility-admin-startup-v421']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: sermon-v421-${{ github.ref }}
  cancel-in-progress: false

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout isolated fix branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Apply narrow Admin wiring patch
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          p=Path('admin.html')
          text=p.read_text()
          old='<script src="https://cdn.jsdelivr.net/npm/tus-js-client@4.3.1/dist/tus.min.js"></script>'
          new='<script id="nh7TusClient" async fetchpriority="low" src="https://cdn.jsdelivr.net/npm/tus-js-client@4.3.1/dist/tus.min.js"></script>'
          if old in text:
              text=text.replace(old,new,1)
          elif new not in text:
              raise SystemExit('Expected TUS script tag not found')
          tag='  <script id="nh7AdminSermonIntegrityV421" defer src="js/nh7-admin-sermon-integrity-v421.js?v=4.2.1"></script>\n'
          anchor='  <script defer src="js/nh7-admin-push-owner-v400.js?v=4.0.0"></script>\n'
          if tag not in text:
              if anchor not in text:
                  raise SystemExit('Admin script anchor not found')
              text=text.replace(anchor,anchor+tag,1)
          p.write_text(text)
          PY

      - name: Validate syntax and exact scope
        shell: bash
        run: |
          set -euo pipefail
          node --check js/nh7-admin-sermon-integrity-v421.js
          grep -q 'id="nh7TusClient" async fetchpriority="low"' admin.html
          grep -q 'nh7-admin-sermon-integrity-v421.js?v=4.2.1' admin.html
          grep -q "RECENT_DAYS=14" js/nh7-admin-sermon-integrity-v421.js
          grep -q "nh7RepairRecentSermonVisibilityV421" js/nh7-admin-sermon-integrity-v421.js
          grep -q "is_published:true" js/nh7-admin-sermon-integrity-v421.js
          grep -q "Range:'bytes=0-0'" js/nh7-admin-sermon-integrity-v421.js
          node <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('admin.html','utf8');
          [...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)]
            .map(x=>x[1]).filter(x=>!/^[\s\n]*$/.test(x))
            .forEach((code,index)=>new Function(code+`\n//# sourceURL=admin-inline-${index}`));
          const tus=html.indexOf('id="nh7TusClient" async');
          const rbac=html.indexOf('id="nh7AdminRbacRuntime"');
          const integrity=html.indexOf('id="nh7AdminSermonIntegrityV421"');
          if(tus<0||rbac<0||integrity<0||integrity<rbac)throw new Error('Admin startup/sermon wiring order invalid');
          console.log('Admin inline scripts and narrow wiring OK');
          NODE

      - name: Run isolated runtime smoke test
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const source=fs.readFileSync('js/nh7-admin-sermon-integrity-v421.js','utf8');
          const ctx={console,setInterval,clearInterval,setTimeout,clearTimeout,URL,AbortController,Date,Promise,Map,Set,Array,String,Number,Boolean,JSON,Math,encodeURIComponent,
            alert:()=>{},confirm:()=>false,fetch:async()=>({ok:true,status:206,headers:{get:()=> 'audio/mpeg'},body:{cancel:async()=>{}}}),
            lang:'fa',state:{categories:[],sermons:[]},sermonDraft:{is_published:true},sermonAudioFile:null,sermonBulkFiles:[],nh7BulkAudioDraft:{published:true},editingSermonId:'',
            authFetch:async()=>[],saveSermon:async()=>{},uploadBulkSermonAudio:async()=>{},renderSermons:()=>'<section>original</section>',render:()=>{},loadAll:async()=>{},setMessage:()=>{},h:x=>String(x),addEventListener:()=>{}};
          ctx.window=ctx;vm.createContext(ctx);vm.runInContext(source,ctx);
          setTimeout(()=>{
            if(ctx.NH7_ADMIN_SERMON_INTEGRITY_VERSION!=='4.2.1-admin-sermon-integrity')throw new Error('Integrity runtime did not install');
            if(!ctx.renderSermons().includes('nh7SermonIntegrityV421'))throw new Error('Diagnostics card not wired');
            console.log('Sermon integrity runtime smoke test OK');
          },350);
          NODE
          sleep 1

      - name: Commit generated Admin wiring when needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- admin.html; then
            echo 'Admin wiring already applied.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin.html
          git commit -m 'Wire non-blocking Admin startup and sermon integrity guard'
          git push origin HEAD:${GITHUB_REF_NAME}

      - name: Report final tree scope
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          echo 'Files changed from main:'
          git diff --name-status origin/main...HEAD
