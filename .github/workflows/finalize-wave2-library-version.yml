name: Finalize Wave 2 library version 2.3.9.51

on:
  push:
    branches: [release/wave2-library-mainready-23951]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  finalize:
    if: ${{ !contains(github.event.head_commit.message || '', 'finalize Wave 2 library 2.3.9.51') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/wave2-library-mainready-23951
          fetch-depth: 0
      - name: Update release metadata and cache-busting
        run: |
          python <<'PY'
          from pathlib import Path
          import json

          index=Path('index.html')
          text=index.read_text(encoding='utf-8')
          text=text.replace('manifest.json?v=2.3.9.50','manifest.json?v=2.3.9.51')
          text=text.replace("window.NH7_VERSION = '2.3.9.50';","window.NH7_VERSION = '2.3.9.51';")
          text=text.replace('js/app.js?v=2.3.9.50','js/app.js?v=2.3.9.51')
          text=text.replace('js/nh7-library-collections-v322.js?v=2.3.9.33','js/nh7-library-collections-v322.js?v=2.3.9.51')
          index.write_text(text,encoding='utf-8')

          launcher=Path('app-v239.html')
          text=launcher.read_text(encoding='utf-8')
          text=text.replace('manifest.json?v=2.3.9.50','manifest.json?v=2.3.9.51')
          text=text.replace("fetch('./index.html?v=2.3.9.50&t='","fetch('./index.html?v=2.3.9.51&t='")
          launcher.write_text(text,encoding='utf-8')

          version=Path('version.json')
          data=json.loads(version.read_text(encoding='utf-8'))
          data['app']='2.3.9.51'
          data['updated_at']='2026-08-27T17:15:00+00:00'
          version.write_text(json.dumps(data,separators=(',',':')),encoding='utf-8')
          PY
          grep -q "window.NH7_VERSION = '2.3.9.51'" index.html
          grep -q 'js/app.js?v=2.3.9.51' index.html
          grep -q 'nh7-library-collections-v322.js?v=2.3.9.51' index.html
          grep -q 'index.html?v=2.3.9.51' app-v239.html
          grep -q '"app":"2.3.9.51"' version.json
      - name: Commit release metadata
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'Omideno7'
          git config user.email 'omideno7church@gmail.com'
          git add index.html app-v239.html version.json
          git commit -m 'release: finalize Wave 2 library 2.3.9.51'
          git push origin HEAD:release/wave2-library-mainready-23951
