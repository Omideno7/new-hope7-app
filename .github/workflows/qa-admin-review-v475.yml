name: Admin Review Stability v475 QA

on:
  push:
    branches:
      - fix/admin-review-stability-v475-20260920
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Verify scoped diff
        shell: bash
        run: |
          set -euo pipefail
          base=8875ec02437cbde89ca34ba10c257001e44a1039
          git diff --name-only "$base"...HEAD > /tmp/changed
          cat /tmp/changed
          allowed='^(admin\.html|admin-v239-stable\.html|js/nh7-admin-review-refresh-v475\.js|\.github/workflows/qa-admin-review-v475\.yml)$'
          bad=$(grep -Ev "$allowed" /tmp/changed || true)
          test -z "$bad"
          ! grep -Eq '^(supabase/|data/|assets/)' /tmp/changed

      - name: Validate JavaScript and HTML inline scripts
        shell: bash
        run: |
          set -euo pipefail
          node --check js/nh7-admin-review-refresh-v475.js
          node <<'NODE'
          const fs=require('fs');
          for(const file of ['admin.html','admin-v239-stable.html']){
            const html=fs.readFileSync(file,'utf8');
            const blocks=[...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)].map(x=>x[1]).filter(Boolean);
            blocks.forEach((code,index)=>new Function(code+'\n//# sourceURL='+file+'-inline-'+index));
          }
          console.log('Admin inline scripts OK');
          NODE

      - name: Verify zero delayed layout injection
        shell: bash
        run: |
          set -euo pipefail
          file=js/nh7-admin-review-refresh-v475.js
          ! grep -Eq 'MutationObserver|scrollTo\(|restoreScroll|prepend\(|insertAdjacent|setTimeout\(' "$file"
          ! grep -Eq 'querySelector.*top-actions|querySelector.*panel-card' "$file"
          grep -Fq "if(changed&&typeof render==='function')render(false)" "$file"

      - name: Verify controls are rendered synchronously
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'function nh7AdminReviewButtonV475' admin.html
          grep -q 'function nh7AdminReviewStripV475' admin.html
          grep -q 'nh7AdminReviewButtonV475()' admin.html
          grep -q 'const review=nh7AdminReviewStripV475()' admin.html
          grep -q 'data-nh7-review-icon-v475' admin.html
          grep -q 'min-inline-size:170px' admin.html

      - name: Verify targeted refresh and polling behavior
        shell: bash
        run: |
          set -euo pipefail
          file=js/nh7-admin-review-refresh-v475.js
          grep -q 'Promise.allSettled' "$file"
          grep -q 'loadRegistrationFeed' "$file"
          grep -q 'qa_questions?select=' "$file"
          grep -q 'loadSchoolAssignmentsFeed' "$file"
          ! grep -Eq 'notification_inbox|sermon_categories|daily_content|school_progress|school_exam_attempts|school_certificates' "$file"
          ! grep -Eq 'setInterval\(' "$file"

      - name: Verify stable loader uses v475
        shell: bash
        run: |
          set -euo pipefail
          grep -q '2.3.9.48-admin-review-v475' admin-v239-stable.html
          grep -q 'nh7-admin-review-refresh-v475.js' admin-v239-stable.html
          ! grep -q 'nh7-admin-review-refresh-v474.js' admin-v239-stable.html