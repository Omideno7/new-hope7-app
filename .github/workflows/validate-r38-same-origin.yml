name: Validate R3.8 same-origin QA
on:
  push:
    branches: [qa/r38-same-origin-audio]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Validate launcher syntax and contract
        run: |
          node <<'NODE'
          const fs=require('fs'),file='qa/final-r3/app-r38.html',html=fs.readFileSync(file,'utf8');
          const blocks=[...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)].map(x=>x[1]).filter(Boolean);
          blocks.forEach((code,index)=>new Function(code+`\n//# sourceURL=${file}-${index}`));
          for(const required of ['Final QA R3.8','495e91acda3469d8f2d57a77082f3c38edadfcb1','b5d77e0d25454b18788968babf80045af45f76da','nh7-audio-signed-v397.js','same-origin'])if(!html.toLowerCase().includes(required.toLowerCase()))throw Error('launcher missing '+required);
          if(!html.includes("replace(\"if('serviceWorker'in navigator)"))throw Error('production service-worker unregister guard missing');
          NODE
      - name: Verify source assets exist
        run: |
          curl -fsSL --retry 3 'https://raw.githubusercontent.com/Omideno7/new-hope7-app/495e91acda3469d8f2d57a77082f3c38edadfcb1/qa/final-r3/app.html' -o /tmp/r36.html
          grep -q 'nh7-audio-signed-v396.js' /tmp/r36.html
          curl -fsSL --retry 3 'https://raw.githubusercontent.com/Omideno7/new-hope7-app/b5d77e0d25454b18788968babf80045af45f76da/qa/final-r3/nh7-audio-signed-v397.js' -o /tmp/audio397.js
          node --check /tmp/audio397.js
          grep -q "NH7_AUDIO_SIGNED_VERSION='3.9.7'" /tmp/audio397.js
          echo 'R3.8 same-origin QA validation passed.'
