name: One-time Daily Word v4 fallback sync
on:
  push:
    branches: [main]
permissions:
  contents: write
concurrency:
  group: daily-word-v400-sync
  cancel-in-progress: false
jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - name: Download verified Daily Word 365 content
        run: |
          curl --fail --silent --show-error --location \
            -H 'x-nh7-export-token: nh7_dw_export_20260818_M8pR3vK6qT1xC9fL5sW2' \
            'https://gpzcwffxnddhaeaogdyo.supabase.co/functions/v1/nh7-daily-word-export-v400' \
            -o data/daily/daily_word_365.json
          python3 - <<'PY'
          import json
          p='data/daily/daily_word_365.json'
          d=json.load(open(p,encoding='utf-8'))
          assert isinstance(d,list) and len(d)==365
          assert [x['day'] for x in d]==list(range(1,366))
          for x in d:
              assert all(k in x for k in ('day','title','mainVerse','message','prayer','furtherStudy'))
              assert all(lang in x['title'] and lang in x['message'] and lang in x['prayer'] for lang in ('fa','en','hr'))
              assert len(x['furtherStudy'])==2
          PY
      - name: Commit only Daily Word fallback data
        run: |
          if git diff --quiet -- data/daily/daily_word_365.json; then
            echo 'Daily Word fallback already current.'
            exit 0
          fi
          git config user.name 'New Hope 7 CI'
          git config user.email 'actions@github.com'
          git add data/daily/daily_word_365.json
          git commit -m 'Replace Daily Word 365 content from approved manual file'
          git push origin HEAD:main
