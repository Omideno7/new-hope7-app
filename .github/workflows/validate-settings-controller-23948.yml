name: Validate Settings controller 2.3.9.48
on:
  push:
    branches: [hotfix/settings-controller-2.3.9.48]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Validate Settings controller and shell
        run: |
          node --check js/nh7-settings-controller-v399.js
          node --check js/nh7-audio-signed-v397.js
          node <<'NODE'
          const fs=require('fs');
          const v=JSON.parse(fs.readFileSync('version.json','utf8'));
          const h=fs.readFileSync('index.html','utf8');
          const shell=fs.readFileSync('app-v239.html','utf8');
          const sw=fs.readFileSync('service-worker.js','utf8');
          const settings=fs.readFileSync('js/nh7-settings-controller-v399.js','utf8');
          if(v.app!=='2.3.9.48')throw Error('version mismatch');
          if(!h.includes("window.NH7_VERSION = '2.3.9.48'"))throw Error('index version mismatch');
          const audio=h.indexOf('js/nh7-audio-signed-v397.js?v=2.3.9.48');
          const app=h.indexOf('js/app.js?v=2.3.9.48');
          const controller=h.indexOf('js/nh7-settings-controller-v399.js?v=2.3.9.48');
          if(audio<0||app<0||controller<0||audio>app||app>controller)throw Error('load order invalid');
          if(h.includes('nh7-settings-feedback-v398.js'))throw Error('obsolete settings overlay still loaded');
          for(const required of ["NH7_SETTINGS_CONTROLLER_VERSION='3.9.9'",'document.addEventListener(\'click\'','nh7SettingsToast399','clearDownloads','clearIndexedDb','clearCaches','clearNative','clearOfflineMedia'])if(!settings.includes(required))throw Error('missing '+required);
          if(!shell.includes('index.html?v=2.3.9.48'))throw Error('native shell mismatch');
          if(!sw.includes('2.3.9.48')||!sw.includes('settings-controller-v399'))throw Error('service worker mismatch');
          for(const file of ['index.html','app-v239.html']){const html=fs.readFileSync(file,'utf8');[...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)].forEach((m,i)=>new Function(m[1]+`\n//# sourceURL=${file}-${i}`));}
          NODE
      - name: Verify cleanup coverage
        run: |
          grep -q "DB_NAMES=.*nh7-offline-audio-v397" js/nh7-settings-controller-v399.js
          grep -q "LOCAL_PREFIXES=.*nh7_audio_media_v397" js/nh7-settings-controller-v399.js
          grep -q "NATIVE_DIRS=.*offline_audio_v397" js/nh7-settings-controller-v399.js
          grep -q 'indexedDB.deleteDatabase' js/nh7-settings-controller-v399.js
          grep -q 'caches.delete' js/nh7-settings-controller-v399.js
          grep -q "NH7_AUDIO_SIGNED_V397?.clearAll" js/nh7-settings-controller-v399.js
          echo 'Settings controller hotfix validation passed.'
