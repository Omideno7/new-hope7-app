name: Apply verified admin stability patch 4.3.9
on:
  push:
    branches: [fix/admin-stability-v439]
    paths: [scripts/apply-admin-stability-v439.py, .github/workflows/apply-admin-stability-v439.yml]
  workflow_dispatch:
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref_name }}
      - name: Apply version-guarded patch
        run: python3 scripts/apply-admin-stability-v439.py
      - name: Check JavaScript syntax
        run: |
          for file in js/nh7-admin-*-v439.js js/admin-v2.3.9-document-runtime-fix4.js js/admin-v2.3.9-student-clean-v311.js; do node --check "$file"; done
      - name: Commit patched source to this branch only
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin.html admin-refresh.html admin-v239-stable.html version.json js/admin-v2.3.9-document-runtime-fix4.js js/admin-v2.3.9-student-clean-v311.js
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Apply tested admin 2.3.9.43 stability source changes'
          git push origin HEAD:${{ github.ref_name }}
