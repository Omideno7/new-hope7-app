name: Validate Wave 2 library package on current main baseline

on:
  push:
    branches: [release/wave2-library-mainready-23951]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Validate JavaScript and current-main preservation
        run: |
          set -euo pipefail
          node --check js/app.js
          node --check js/nh7-book-reader-v283.js
          node --check js/nh7-admin-library-access-v396.js
          node --check js/nh7-library-collections-v322.js
          node --check sw-offline-v329.js
          node --check js/nh7-spiritual-plans-v240.js
          node --check js/nh7-fasting-practical-note-removal-v413.js
          grep -q 'nh7-book-reader-v283.js?v=2.3.9.51' index.html
          ! grep -q 'nh7-book-reader-v281.js' index.html
          grep -q 'nh7-fasting-practical-note-removal-v413.js?v=4.1.3' index.html
          grep -q 'nh7-admin-library-access-v396.js?v=3.9.6' admin.html
          grep -q "const VERSION='v2.3.9.51-wave2-library-mainready'" sw-offline-v329.js
          grep -q "nh7-book-reader-v283.js" sw-offline-v329.js
          grep -q "nh7-fasting-practical-note-removal-v413.js" sw-offline-v329.js

      - name: Validate nine-book catalog and code-free user flow
        run: |
          set -euo pipefail
          grep -q 'nh7_library_catalog_v396' js/app.js
          grep -q 'nh7_library_catalog_v396' js/nh7-book-reader-v283.js
          grep -q 'nh7_library_catalog_v396' js/nh7-library-collections-v322.js
          grep -q 'nh7_library_reader_access_v250' js/nh7-book-reader-v283.js
          grep -q "content_access_required" js/nh7-book-reader-v283.js
          ! grep -q 'prompt(' js/nh7-book-reader-v283.js
          ! grep -q 'CODE_KEY' js/nh7-book-reader-v283.js
          ! grep -q 'enterAccessCode' js/app.js
          ! grep -q 'کدی را که کلیسا' js/app.js
          ! grep -q 'Enter the code' js/app.js
          grep -q 'data-nh7-book-open' js/nh7-book-reader-v283.js
          grep -q 'data-book-search-page' js/nh7-book-reader-v283.js
          grep -q 'nh7-book-chapter-title' js/nh7-book-reader-v283.js
          grep -q 'reader_available' js/nh7-book-reader-v283.js

      - name: Validate approved-user ministers access manager
        run: |
          set -euo pipefail
          grep -q 'nh7_admin_content_access_dashboard_v395' js/nh7-admin-library-access-v396.js
          grep -q 'nh7_admin_content_access_grant_v251' js/nh7-admin-library-access-v396.js
          grep -q 'nh7_admin_content_access_revoke_v251' js/nh7-admin-library-access-v396.js
          grep -q "scope:'library_all'" js/nh7-admin-library-access-v396.js
          grep -q 'library_collection' js/nh7-admin-library-access-v396.js
          grep -q 'library_item' js/nh7-admin-library-access-v396.js
          grep -q 'refresh_token' js/nh7-admin-library-access-v396.js

      - name: Protect unrelated modules
        run: |
          set -euo pipefail
          BASE=cac23d6166b88a43ae5b0fec370151af043ea303
          git diff --quiet "$BASE" -- data/spiritual-plans js/nh7-spiritual-plans-v240.js js/nh7-fasting-practical-note-removal-v413.js js/nh7-audio-classic-v400.js js/nh7-school-exam-v344.js js/nh7-auth-recovery-v342.js js/nh7-settings-controller-v399.js js/nh7-apocrypha-runtime-patch-v402.js js/nh7-apocrypha-actions-v393.js
          changed=$(git diff --name-only "$BASE" HEAD)
          echo "$changed"
          while IFS= read -r file; do
            [ -z "$file" ] && continue
            case "$file" in
              index.html|admin.html|sw-offline-v329.js|js/app.js|js/nh7-book-reader-v283.js|js/nh7-admin-library-access-v396.js|js/nh7-library-collections-v322.js|.github/workflows/apply-wave2-library-mainready.yml|.github/workflows/validate-wave2-library-mainready.yml) ;;
              *) echo "Unexpected Wave 2 mainready change: $file" >&2; exit 1 ;;
            esac
          done <<< "$changed"
          echo 'Only the intended Wave 2 library package differs from current main.'
