name: Apply final store admin wiring

on:
  push:
    branches: [release/final-store-qa-23950]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wire:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/final-store-qa-23950
          fetch-depth: 0
      - name: Wire approved registration email and admin push
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          p=Path('admin.html')
          s=p.read_text(encoding='utf-8')
          tags='''  <script defer src="js/admin-v2.3.9-registration-approval-email-v344.js?v=3.4.5"></script>\n  <script defer src="js/admin-v2.3.9-registration-email-actions-v346.js?v=3.4.6"></script>\n  <script defer src="js/nh7-admin-push-owner-v400.js?v=4.0.0"></script>\n'''
          if 'nh7-admin-push-owner-v400.js' not in s:
              s=s.replace('</body>',tags+'</body>')
              p.write_text(s,encoding='utf-8')
          PY
          node --check js/admin-v2.3.9-registration-approval-email-v344.js
          node --check js/admin-v2.3.9-registration-email-actions-v346.js
          node --check js/nh7-admin-push-owner-v400.js
          node --check js/nh7-settings-account-v252.js
          grep -q 'admin-v2.3.9-registration-approval-email-v344.js' admin.html
          grep -q 'admin-v2.3.9-registration-email-actions-v346.js' admin.html
          grep -q 'nh7-admin-push-owner-v400.js' admin.html
          grep -q 'nh7-settings-account-v252.js?v=2.5.2' index.html
          grep -q 'nh7-delete-my-account-v252' js/nh7-settings-account-v252.js
          grep -q "role:'admin'" js/nh7-admin-push-owner-v400.js
          grep -q "app:'new_hope_7'" js/nh7-admin-push-owner-v400.js
          grep -q 'sendApproval(after' js/admin-v2.3.9-registration-approval-email-v344.js
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin.html
          git commit -m 'fix(release): activate approval email and admin push alerts'
          git push origin HEAD:release/final-store-qa-23950
