name: Verify Reader v452 Live Main
on:
  push:
    branches: [qa/reader-v452-main-integration-20260919]
    paths: ['.github/workflows/reader-live-verification-v452.yml','scripts/reader-live-verification-v452.py']
permissions:
  contents: read
jobs:
  verify:
    if: github.ref == 'refs/heads/qa/reader-v452-main-integration-20260919'
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      EXPECTED_SHA: 259280fe00a7dbc7359c24f997338724961f0c08
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Confirm intended main release
        run: |
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = "$EXPECTED_SHA"
      - name: Install pinned browser
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Verify production static files and UI with account traffic mocked
        run: python scripts/reader-live-verification-v452.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: reader-v452-live-main-verification
          path: /tmp/reader-v452-live-evidence/
          retention-days: 14
