name: Bible Preview QA v451
on:
  push:
    branches: [feature/bible-keywords-v450-preview-20260918]
    paths:
      - '.github/workflows/preview-bible-v451.yml'
      - 'scripts/bible-preview/**'
      - 'js/nh7-bible-*-v451.js'
      - 'bible-preview.html'
permissions:
  contents: write
concurrency:
  group: bible-preview-v451
  cancel-in-progress: true
jobs:
  audit:
    if: github.ref == 'refs/heads/feature/bible-keywords-v450-preview-20260918'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Prepare isolated candidate
        run: |
          mkdir -p qa-output
          git ls-remote origin refs/heads/main > qa-output/main-before.txt
          python - <<'PY'
          import base64,gzip,hashlib,json,pathlib
          p=pathlib.Path('scripts/bible-preview/candidate.b64')
          if p.exists():
              encoded=p.read_text().strip()
              if len(encoded)==17003:
                  for i,j,old,new in reversed([[2653,2654,'c',''],[2815,2816,'5',''],[13274,13276,'ec','+']]):
                      assert encoded[i:j]==old
                      encoded=encoded[:i]+new+encoded[j:]
              raw=base64.b64decode(encoded)
              assert hashlib.sha256(raw).hexdigest()=='ede27b180ee00dfeb6d4ab265b6e3029d39e5884259ec651568101d827a81fdc'
              files=json.loads(gzip.decompress(raw))
              allowed={'js/nh7-bible-keywords-v451.js','js/nh7-bible-preview-v451.js','css/nh7-bible-keywords-v450.css','scripts/bible-preview/apply.mjs','scripts/bible-preview/audit.mjs','scripts/bible-preview/browser.py'}
              assert set(files)==allowed
              for name,text in files.items():
                  path=pathlib.Path(name);path.parent.mkdir(parents=True,exist_ok=True);path.write_text(text)
          PY
          python scripts/bible-preview/finalize.py
          node scripts/bible-preview/apply.mjs
          sha256sum js/app.js js/nh7-app-enhancements-v230.js data/bible/keywords/bible_keywords_v450.json > qa-output/idempotence-before.txt
          node scripts/bible-preview/apply.mjs
          sha256sum js/app.js js/nh7-app-enhancements-v230.js data/bible/keywords/bible_keywords_v450.json > qa-output/idempotence-after.txt
          diff qa-output/idempotence-before.txt qa-output/idempotence-after.txt
          node --check js/app.js
          node --check js/nh7-app-enhancements-v230.js
          node --check js/nh7-bible-keywords-v451.js
          node --check js/nh7-bible-preview-v451.js
          node scripts/bible-preview/audit.mjs
      - name: Install pinned browser test dependency
        run: |
          python -m pip install playwright==1.57.0
          python -m playwright install --with-deps chromium
      - name: Test Bible UI without production services
        run: python scripts/bible-preview/browser.py
      - name: Commit verified candidate to Preview only
        env:
          PREVIEW_BRANCH: feature/bible-keywords-v450-preview-20260918
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/$PREVIEW_BRANCH"
          test "$(git ls-remote origin "refs/heads/$PREVIEW_BRANCH" | cut -f1)" = "$GITHUB_SHA"
          rm -f scripts/bible-preview/candidate.b64
          git add js/app.js js/nh7-app-enhancements-v230.js js/nh7-bible-keywords-v451.js js/nh7-bible-preview-v451.js css/nh7-bible-keywords-v450.css css/nh7-bible-preview-*.css data/bible/keywords/bible_keywords_v450.json index.html service-worker.js sw-release-core-v403.js bible-preview.html scripts/bible-preview/apply.mjs scripts/bible-preview/audit.mjs scripts/bible-preview/browser.py
          git add -u scripts/bible-preview/candidate.b64 || true
          if ! git diff --cached --quiet; then
            git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m 'fix(bible): verified 2500-word concordance and isolated preview v4.5.1'
            git push origin "HEAD:refs/heads/$PREVIEW_BRANCH"
          fi
          git rev-parse HEAD > qa-output/preview-commit.txt
          git ls-remote origin refs/heads/main > qa-output/main-after.txt
          diff qa-output/main-before.txt qa-output/main-after.txt
      - name: Collect candidate evidence
        if: always()
        run: |
          python - <<'PY'
          import pathlib,tarfile
          with tarfile.open('qa-output/candidate.tgz','w:gz') as tar:
              names=['js/app.js','js/nh7-app-enhancements-v230.js','js/nh7-bible-keywords-v451.js','js/nh7-bible-preview-v451.js','css/nh7-bible-keywords-v450.css','data/bible/keywords/bible_keywords_v450.json','index.html','service-worker.js','sw-release-core-v403.js','bible-preview.html','scripts/bible-preview/apply.mjs','scripts/bible-preview/audit.mjs','scripts/bible-preview/browser.py','scripts/bible-preview/finalize.py']
              names += [str(p) for p in pathlib.Path('css').glob('nh7-bible-preview-*.css')]
              for name in names:
                  if pathlib.Path(name).exists():tar.add(name,arcname=name)
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: bible-preview-qa-${{ github.sha }}
          path: qa-output/
          retention-days: 7
