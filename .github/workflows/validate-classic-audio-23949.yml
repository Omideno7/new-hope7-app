name: Validate classic audio player 2.3.9.49
on:
  push:
    branches: [hotfix/classic-audio-player-2.3.9.49]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Validate classic player module
        run: |
          node --check js/nh7-audio-classic-v400.js
          grep -q "NH7_AUDIO_CLASSIC_VERSION='4.0.0'" js/nh7-audio-classic-v400.js
          grep -q 'nh7-classic-mainrow' js/nh7-audio-classic-v400.js
          grep -q 'data-classic-toggle' js/nh7-audio-classic-v400.js
          grep -q 'data-classic-back' js/nh7-audio-classic-v400.js
          grep -q 'data-classic-forward' js/nh7-audio-classic-v400.js
          grep -q 'data-classic-speed-down' js/nh7-audio-classic-v400.js
          grep -q 'data-classic-speed-up' js/nh7-audio-classic-v400.js
          grep -q 'data-classic-seek' js/nh7-audio-classic-v400.js
          grep -q "kind:'sermon',sermon_id" js/nh7-audio-classic-v400.js
          grep -q "kind:'audio',lesson_code" js/nh7-audio-classic-v400.js
          grep -q 'nh7_school_record_audio_v380' js/nh7-audio-classic-v400.js
          grep -q "DB_NAME='nh7-offline-audio-v397'" js/nh7-audio-classic-v400.js
          grep -q 'indexedDB.open' js/nh7-audio-classic-v400.js
          grep -q 'window.NH7_AUDIO_SIGNED_V397=window.NH7_AUDIO_CLASSIC_V400' js/nh7-audio-classic-v400.js
      - name: Verify exactly one audio UI is loaded
        run: |
          node <<'NODE'
          const fs=require('fs');
          const v=JSON.parse(fs.readFileSync('version.json','utf8'));
          const h=fs.readFileSync('index.html','utf8');
          const shell=fs.readFileSync('app-v239.html','utf8');
          const sw=fs.readFileSync('service-worker.js','utf8');
          if(v.app!=='2.3.9.49')throw Error('version mismatch');
          if(!h.includes("window.NH7_VERSION = '2.3.9.49'"))throw Error('index version mismatch');
          const classic=h.indexOf('js/nh7-audio-classic-v400.js?v=2.3.9.49');
          const app=h.indexOf('js/app.js?v=2.3.9.49');
          const settings=h.indexOf('js/nh7-settings-controller-v399.js?v=2.3.9.49');
          if(classic<0||app<0||settings<0||classic>app||app>settings)throw Error('script order invalid');
          if(h.includes('nh7-audio-signed-v397.js'))throw Error('duplicate new player still loaded');
          if(h.includes('nh7-school-audio-native-v337.js'))throw Error('separate School player still loaded');
          if(!shell.includes('index.html?v=2.3.9.49'))throw Error('native shell mismatch');
          if(!sw.includes('2.3.9.49')||!sw.includes('classic-audio-v400'))throw Error('service worker mismatch');
          for(const file of ['index.html','app-v239.html']){const html=fs.readFileSync(file,'utf8');[...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)].forEach((m,i)=>new Function(m[1]+`\n//# sourceURL=${file}-${i}`));}
          NODE
      - name: Verify unchanged critical production modules
        run: |
          grep -q 'nh7-school-exam-v344.js?v=2.3.9.49' index.html
          grep -q 'nh7-settings-controller-v399.js?v=2.3.9.49' index.html
          grep -q 'nh7-registration-canonical-v353.js' index.html || true
          grep -q 'nh7-protected-audio-gate-v316.js' index.html
          echo 'Classic audio hotfix validation passed.'
