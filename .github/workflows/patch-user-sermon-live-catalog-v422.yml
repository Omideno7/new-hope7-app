name: Patch User Sermon Live Catalogue v4.2.2

on:
  push:
    branches: ['fix/user-sermon-live-catalog-v422']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: user-sermon-live-v422-${{ github.ref }}
  cancel-in-progress: false

jobs:
  patch-and-validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout isolated fix branch
        uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Apply narrow live-catalogue wiring
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          index=Path('index.html')
          text=index.read_text()
          text=text.replace("service-worker.js?v=4.0.3", "service-worker.js?v=4.2.2", 1)
          old='js/nh7-offline-data-v329.js?v=2.3.9.50-offline403'
          new='js/nh7-offline-data-v422.js?v=4.2.2'
          if old in text:
              text=text.replace(old,new,1)
          elif new not in text:
              raise SystemExit('offline data script anchor missing')
          index.write_text(text)

          worker=Path('service-worker.js')
          text=worker.read_text()
          text=text.replace('/* New Hope 7 v2.3.9.50 — unified classic audio + release Settings/Offline v4.0.3 */','/* New Hope 7 v2.3.9.50 — unified classic audio + auth-safe live catalogue v4.2.2 */')
          text=text.replace("importScripts('./sw-release-core-v403.js?v=4.0.3');", "importScripts('./sw-release-core-v403.js?v=4.2.2');")
          worker.write_text(text)

          release=Path('sw-release-core-v403.js')
          text=release.read_text()
          text=text.replace("const NH7_RELEASE_CORE_VERSION='4.0.3';", "const NH7_RELEASE_CORE_VERSION='4.2.2';")
          text=text.replace("const NH7_RELEASE_CORE_CACHE='nh7-release-core-v403';", "const NH7_RELEASE_CORE_CACHE='nh7-release-core-v422';")
          text=text.replace("'./js/nh7-offline-data-v329.js'", "'./js/nh7-offline-data-v422.js'",1)
          release.write_text(text)
          PY

      - name: Validate syntax and release wiring
        shell: bash
        run: |
          set -euo pipefail
          node --check js/nh7-offline-data-v422.js
          node --check service-worker.js
          node --check sw-release-core-v403.js
          grep -q "4.2.2-auth-safe-catalogue" js/nh7-offline-data-v422.js
          grep -q "response.status>=400&&response.status<500" js/nh7-offline-data-v422.js
          grep -q "nh7_remote_catalogue_cache_v422" js/nh7-offline-data-v422.js
          grep -q "service-worker.js?v=4.2.2" index.html
          grep -q "nh7-offline-data-v422.js?v=4.2.2" index.html
          grep -q "nh7-release-core-v422" sw-release-core-v403.js
          grep -q "./js/nh7-offline-data-v422.js" sw-release-core-v403.js
          ! grep -q "nh7-offline-data-v329.js?v=2.3.9.50-offline403" index.html
          node <<'NODE'
          const fs=require('fs');
          const html=fs.readFileSync('index.html','utf8');
          [...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)]
            .map(x=>x[1]).filter(x=>x.trim())
            .forEach((code,index)=>new Function(code+`\n//# sourceURL=index-inline-${index}`));
          const release=fs.readFileSync('sw-release-core-v403.js','utf8');
          const match=release.match(/const NH7_RELEASE_ASSETS=\[([\s\S]*?)\];/);
          if(!match)throw new Error('release asset list missing');
          const paths=[...match[1].matchAll(/'([^']+)'/g)].map(m=>m[1]);
          if(!paths.includes('./js/nh7-offline-data-v422.js'))throw new Error('v422 not in release cache');
          const currentScripts=[...html.matchAll(/<script\s+src="(js\/[^"?]+)(?:\?[^\"]*)?"/g)].map(m=>'./'+m[1]);
          const missing=currentScripts.filter(p=>!paths.includes(p));
          if(missing.length)throw new Error('scripts missing from release cache: '+missing.join(', '));
          console.log('v4.2.2 release wiring passed');
          NODE

      - name: Test auth-safe catalogue behavior
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs'),vm=require('vm');
          const source=fs.readFileSync('js/nh7-offline-data-v422.js','utf8');
          function hash(value){let h=2166136261;for(let i=0;i<String(value).length;i++){h^=String(value).charCodeAt(i);h=Math.imul(h,16777619)}return(h>>>0).toString(16)}
          const url='https://project.supabase.co/rest/v1/sermons?select=*';
          const key='https://app.example/__nh7_api_cache_v329__/'+hash('guest|'+url);
          function cache(initial=[]){const map=new Map(initial);return{map,match:async r=>map.get(r.url)?.clone()||null,put:async(r,v)=>map.set(r.url,v.clone()),keys:async()=>[...map.keys()].map(x=>new Request(x)),delete:async r=>map.delete(r.url)}}
          async function boot(fetchImpl,initial=[]){const c=cache(initial),store=new Map([['nh7_remote_catalogue_cache_v422','1']]);const ctx={console,URL,Request,Response,Headers,setTimeout:()=>0,clearTimeout:()=>{},location:{href:'https://app.example/index.html',origin:'https://app.example'},navigator:{onLine:true},localStorage:{getItem:k=>store.get(k)||null,setItem:(k,v)=>store.set(k,String(v))},caches:{open:async()=>c},fetch:fetchImpl,addEventListener:()=>{}};ctx.window=ctx;vm.createContext(ctx);vm.runInContext(source,ctx);await new Promise(r=>setImmediate(r));return{ctx,c}}
          (async()=>{
            let env=await boot(async()=>new Response('expired',{status:401}),[[key,new Response('[{"old":true}]',{status:200,headers:{'content-type':'application/json'}})]]);
            let res=await env.ctx.fetch(url,{method:'GET'});if(res.status!==401)throw new Error('stale cache masked 401');
            env=await boot(async()=>{throw new Error('offline')},[[key,new Response('[{"old":true}]',{status:200,headers:{'content-type':'application/json'}})]]);
            res=await env.ctx.fetch(url,{method:'GET'});if(!(await res.json())[0].old)throw new Error('offline fallback failed');
            env=await boot(async(_input,init)=>{if(init?.cache!=='no-store')throw new Error('remote network was not no-store');return new Response('[{"fresh":true}]',{status:200,headers:{'content-type':'application/json'}})});
            res=await env.ctx.fetch(url,{method:'GET'});if(!(await res.json())[0].fresh||!env.c.map.has(key))throw new Error('fresh catalogue/store failed');
            console.log('auth-safe live catalogue behavior passed');
          })().catch(error=>{console.error(error);process.exit(1)});
          NODE

      - name: Commit generated wiring when needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- index.html service-worker.js sw-release-core-v403.js; then
            echo 'Live catalogue wiring already applied.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html service-worker.js sw-release-core-v403.js
          git commit -m 'Wire auth-safe live sermon catalogue v4.2.2'
          git push origin HEAD:${GITHUB_REF_NAME}

      - name: Report exact runtime scope
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git diff --name-status origin/main...HEAD
