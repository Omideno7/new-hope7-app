name: Android Emulator Smoke Test

on:
  workflow_dispatch:
  push:
    branches: [release/google-play-api36, fix/android-native-selected-push-v478-20260920]
    paths:
      - '.github/workflows/android-emulator-smoke.yml'
      - 'index.html'
      - 'js/nh7-push-account-bind-v363.js'
      - 'js/nh7-notifications-zagreb-v334.js'

permissions:
  contents: read

jobs:
  smoke:
    runs-on: macos-14
    timeout-minutes: 45
    steps:
      - name: Checkout candidate
        uses: actions/checkout@v4

      - name: Set up Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Set up Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Validate selected-user native push binding
        shell: bash
        run: |
          set -euo pipefail
          node --check js/nh7-push-account-bind-v363.js
          grep -q "O.login(i.userId)" js/nh7-push-account-bind-v363.js
          grep -q "User?.pushSubscription" js/nh7-push-account-bind-v363.js
          grep -q "O.logout" js/nh7-push-account-bind-v363.js
          grep -q 'nh7-push-account-bind-v363.js?v=3.6.3' index.html
          ! grep -q 'nh7-push-account-bind-v361.js' index.html

      - name: Prepare QA Android wrapper
        shell: bash
        run: |
          set -euo pipefail
          rm -rf native-smoke
          mkdir -p native-smoke/www native-smoke/assets
          cp index.html app-v239.html reset-password.html manifest.json version.json native-smoke/www/
          for dir in assets css js data offline push; do cp -R "$dir" native-smoke/www/; done
          cp assets/logo.png native-smoke/assets/logo.png
          python3 <<'PY'
          from pathlib import Path
          p=Path('native-smoke/www/index.html')
          text=p.read_text()
          text=text.replace('<script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>','<!-- Web OneSignal SDK disabled inside Android native wrapper; Cordova SDK owns native push -->')
          p.write_text(text)
          PY
          cat > native-smoke/package.json <<'JSON'
          {
            "name": "new-hope-7-android-smoke",
            "private": true,
            "version": "2.3.9-50",
            "dependencies": {
              "@capacitor/android": "8.5.0",
              "@capacitor/core": "8.5.0",
              "@capacitor/file-transfer": "2.0.5",
              "@capacitor/filesystem": "8.1.3",
              "@capacitor/local-notifications": "8.3.1",
              "onesignal-cordova-plugin": "5.5.3"
            },
            "devDependencies": {
              "@capacitor/assets": "3.0.5",
              "@capacitor/cli": "8.5.0"
            }
          }
          JSON
          cat > native-smoke/capacitor.config.json <<'JSON'
          {
            "appId": "com.omideno7.newhope7",
            "appName": "New Hope 7",
            "webDir": "www",
            "server": {"androidScheme":"https","cleartext":false},
            "android": {"backgroundColor":"#ffffff","webContentsDebuggingEnabled":false}
          }
          JSON
          cd native-smoke
          npm install --no-audit --no-fund
          npx cap add android
          npx cap sync android
          test -f android/app/src/main/assets/public/js/nh7-push-account-bind-v363.js
          grep -q 'nh7-push-account-bind-v363.js?v=3.6.3' android/app/src/main/assets/public/index.html
          grep -q 'O.login(i.userId)' android/app/src/main/assets/public/js/nh7-push-account-bind-v363.js
          grep -q 'User?.pushSubscription' android/app/src/main/assets/public/js/nh7-push-account-bind-v363.js
          if grep -q 'cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js' android/app/src/main/assets/public/index.html; then
            echo 'Web OneSignal SDK must not be active inside the Android native wrapper' >&2
            exit 1
          fi
          python3 <<'PY'
          from pathlib import Path
          import re
          root=Path('android')
          v=root/'variables.gradle'
          t=v.read_text()
          t=re.sub(r'minSdkVersion\s*=\s*\d+', 'minSdkVersion = 24', t)
          t=re.sub(r'compileSdkVersion\s*=\s*\d+', 'compileSdkVersion = 36', t)
          t=re.sub(r'targetSdkVersion\s*=\s*\d+', 'targetSdkVersion = 36', t)
          v.write_text(t)
          g=root/'app/build.gradle'
          t=g.read_text()
          t=re.sub(r'versionCode\s*(?:=\s*)?\d+', 'versionCode 23950', t)
          t=re.sub(r'versionName\s*(?:=\s*)?["\'][^"\']+["\']', 'versionName "2.3.9.50"', t)
          m=re.search(r'buildTypes\s*\{',t)
          if not m: raise SystemExit('buildTypes block missing')
          t=t[:m.end()]+'\n        debug {\n            applicationIdSuffix ".qa"\n            versionNameSuffix "-qa"\n        }\n'+t[m.end():]
          g.write_text(t)
          manifest=root/'app/src/main/AndroidManifest.xml'
          t=manifest.read_text()
          if 'android.permission.POST_NOTIFICATIONS' not in t:
              m=re.search(r'<manifest\b[^>]*>',t,re.S)
              t=t[:m.end()]+'\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />'+t[m.end():]
          if 'usesCleartextTraffic' not in t:
              t=t.replace('<application','<application android:usesCleartextTraffic="false"',1)
          manifest.write_text(t)
          PY
          npx capacitor-assets generate --android --iconBackgroundColor '#ffffff' --iconBackgroundColorDark '#ffffff' --splashBackgroundColor '#ffffff' --splashBackgroundColorDark '#ffffff'
          npx cap sync android
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
          test -f app/build/outputs/apk/debug/app-debug.apk
          cp app/build/outputs/apk/debug/app-debug.apk ../../New_Hope_7_Android_Selected_Push_QA_v478.apk

      - name: Emulator smoke test
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 30
          target: google_apis
          arch: arm64-v8a
          profile: pixel_5
          disable-animations: true
          emulator-options: -no-window -gpu swiftshader_indirect -noaudio -no-boot-anim -camera-back none -camera-front none
          script: |
            set -euo pipefail
            adb install -r native-smoke/android/app/build/outputs/apk/debug/app-debug.apk
            PACKAGE=com.omideno7.newhope7.qa
            adb shell pm list packages | grep "$PACKAGE"
            adb shell am force-stop "$PACKAGE"
            adb shell monkey -p "$PACKAGE" -c android.intent.category.LAUNCHER 1
            sleep 12
            PID=$(adb shell pidof "$PACKAGE" | tr -d '\r')
            test -n "$PID"
            echo "App process alive: $PID"
            adb shell dumpsys activity activities | grep -E "$PACKAGE|MainActivity" | head -n 20 || true
            adb shell uiautomator dump /sdcard/window.xml || true
            adb pull /sdcard/window.xml window.xml || true
            adb exec-out screencap -p > android-smoke.png
            adb logcat -d > android-logcat.txt
            if grep -E "FATAL EXCEPTION|ANR in $PACKAGE|Process: $PACKAGE.*has died" android-logcat.txt; then
              echo 'Fatal Android runtime issue detected'
              exit 1
            fi
            echo 'No fatal Android runtime issue detected'
            adb shell svc wifi disable
            adb shell svc data disable || true
            adb shell am force-stop "$PACKAGE"
            adb shell monkey -p "$PACKAGE" -c android.intent.category.LAUNCHER 1
            sleep 8
            PID2=$(adb shell pidof "$PACKAGE" | tr -d '\r')
            test -n "$PID2"
            echo "Offline relaunch process alive: $PID2"
            adb exec-out screencap -p > android-smoke-offline.png

      - name: Upload smoke evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: android-native-selected-push-v478-qa
          path: |
            New_Hope_7_Android_Selected_Push_QA_v478.apk
            android-smoke.png
            android-smoke-offline.png
            android-logcat.txt
            window.xml
          if-no-files-found: ignore
          retention-days: 14
