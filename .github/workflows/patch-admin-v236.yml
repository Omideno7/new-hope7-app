name: Patch admin v2.3.6

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/patch-admin-v236.yml'

permissions:
  contents: write

jobs:
  patch-admin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Apply v2.3.6 version and cache-busting references
        shell: python
        run: |
          from pathlib import Path

          replacements = {
              Path('admin.html'): [
                  ('admin-manifest.json?v=2.3.5', 'admin-manifest.json?v=2.3.6'),
                  ('css/admin-v2.3.5-analytics.css?v=2.3.5', 'css/admin-v2.3.5-analytics.css?v=2.3.6'),
                  ('js/admin-v2.3.5-analytics.js?v=2.3.5', 'js/admin-v2.3.5-analytics.js?v=2.3.6'),
              ],
              Path('js/admin-v2.3.5-analytics.js'): [
                  ("const VERSION='2.3.5';", "const VERSION='2.3.6';"),
                  ('Admin v2.3.5', 'Admin v2.3.6'),
              ],
          }

          for path, pairs in replacements.items():
              text = path.read_text(encoding='utf-8')
              original = text
              for old, new in pairs:
                  text = text.replace(old, new)
              if text != original:
                  path.write_text(text, encoding='utf-8')

      - name: Commit the one-time patch
        run: |
          if git diff --quiet; then
            echo "No changes needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin.html js/admin-v2.3.5-analytics.js
          git commit -m "Fix admin v2.3.6 version label and cache busting"
          git push
