name: Feature Community v503 Wire and Validate

on:
  push:
    branches:
      - 'feature/community-moderation-prayer-v503'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  wire-and-validate:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout isolated feature branch
        uses: actions/checkout@v4
        with:
          ref: feature/community-moderation-prayer-v503
          fetch-depth: 1

      - name: Wire prayer fix after community runtime
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          text=p.read_text(encoding='utf-8')
          patch='  <script src="js/nh7-community-prayer-fix-v503.js?v=5.0.3" defer></script>'
          if patch not in text:
              needle='  <script src="js/nh7-community-v502.js?v=5.5.5-recorder-pause" defer></script>'
              if text.count(needle)!=1:
                  raise SystemExit('Community runtime script contract changed; refusing unsafe index patch')
              text=text.replace(needle, needle+'\n'+patch, 1)
              p.write_text(text,encoding='utf-8')
          PY

      - name: Static validation
        shell: bash
        run: |
          set -euo pipefail
          node --check js/nh7-admin-testimony-v565.js
          node --check js/nh7-admin-community-fixes-v503.js
          node --check js/nh7-community-prayer-fix-v503.js
          test -f js/nh7-admin-testimony-core-v565.js
          grep -q 'nh7-community-prayer-fix-v503.js?v=5.0.3' index.html
          grep -q 'nh7_owner_testimony_delete_rejected_v503' supabase/migrations/20261006094500_community_moderation_prayer_v503.sql
          grep -q 'community.testimony.review' supabase/migrations/20261006094500_community_moderation_prayer_v503.sql
          grep -q 'status <> '\''rejected'\''' supabase/migrations/20261006094500_community_moderation_prayer_v503.sql
          git diff --check

      - name: Commit isolated wiring if needed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- index.html; then
            echo 'Feature wiring already current.'
            exit 0
          fi
          git config user.name 'Omideno7'
          git config user.email 'omideno7church@gmail.com'
          git add index.html
          git commit -m 'Wire prayer request reliability patch on isolated feature branch'
          git push origin HEAD:feature/community-moderation-prayer-v503
