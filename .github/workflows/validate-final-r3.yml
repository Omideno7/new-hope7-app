name: Validate Final QA R3.5 3.9.5
on:
  push:
    branches: [qa/final-integration-20260825-r3]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 1
      - name: Hydrate approved RC 2.5.1 assets
        run: |
          git fetch --depth=1 origin a6b0f6465e2d7f3e335b528a116d962cbe8f5b20
          git checkout a6b0f6465e2d7f3e335b528a116d962cbe8f5b20 -- data/apocrypha data/spiritual-plans js/nh7-apocrypha-fresh-filter-v243.js js/nh7-apocrypha-translation-overlay-v245.js js/nh7-apocrypha-preview-v240.js js/nh7-apocrypha-reader-flow-v244.js js/nh7-reader-ux-v251.js
      - name: Build verification copy of Apocrypha runtime
        run: node scripts/build-apocrypha-merged-v392.mjs /tmp/apocrypha-19-merged-v392.json
      - name: Validate JavaScript and HTML
        run: |
          node --check qa/final-r3/nh7-qa-bridge-v392.js
          node --check qa/final-r3/nh7-content-offline-v394.js
          node --check qa/final-r3/nh7-audio-offline-v395.js
          node --check qa/final-r3/nh7-qa-sw-v395.js
          node --check qa/final-r3/nh7-apocrypha-saved-nav-v394.js
          node --check qa/final-r3/nh7-apocrypha-inline-v392.js
          node --check qa/final-r3/nh7-apocrypha-actions-v393.js
          node --check qa/final-r3/nh7-sermon-archive-guard-v392.js
          node --check qa/final-r3/nh7-video-portal-v392.js
          node --check qa/final-r3/nh7-ui-settings-v394.js
          node --check qa/final-r3/nh7-account-delete-v393.js
          node --check qa/final-r2/nh7-school-rules-v381.js
          node --check qa/final-r2/nh7-registration-ux-v381.js
          node <<'NODE'
          const fs=require('fs');
          for(const file of ['qa/final-r3/app.html','qa/final-r3/admin-tools-v395.html']){
            const h=fs.readFileSync(file,'utf8');
            [...h.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)].forEach((m,i)=>new Function(m[1]+`\n//# sourceURL=${file}-${i}`));
          }
          NODE
      - name: Verify Apocrypha and plans
        run: |
          node scripts/verify-apocrypha-overlays-v390.mjs
          node <<'NODE'
          const fs=require('fs'),x=JSON.parse(fs.readFileSync('/tmp/apocrypha-19-merged-v392.json','utf8'));
          if(x?.totals?.books!==19)throw Error('Expected 19 Apocrypha books');
          const c=JSON.parse(fs.readFileSync('data/spiritual-plans/catalog.json','utf8'));
          const ids=['prayer-30','grace-14','fasting-7','obedience-10','salvation-10','mind-renewal-14'];
          for(const id of ids)if(!c.plans.find(x=>x.id===id))throw Error('Missing plan '+id);
          NODE
          grep -q "NH7_APOCRYPHA_SAVED_NAV_VERSION='3.9.4'" qa/final-r3/nh7-apocrypha-saved-nav-v394.js
          grep -q "NH7_APOCRYPHA_ACTIONS_VERSION='3.9.3'" qa/final-r3/nh7-apocrypha-actions-v393.js
      - name: Verify signed audio architecture
        run: |
          grep -q "NH7_AUDIO_OFFLINE_VERSION='3.9.5'" qa/final-r3/nh7-audio-offline-v395.js
          grep -q "kind:'sermon',sermon_id" qa/final-r3/nh7-audio-offline-v395.js
          grep -q "kind:'audio',lesson_code" qa/final-r3/nh7-audio-offline-v395.js
          grep -q 'nh7-school-media-access' qa/final-r3/nh7-audio-offline-v395.js
          grep -q 'nh7_school_record_audio_v380' qa/final-r3/nh7-audio-offline-v395.js
          grep -q 'در حال دانلود ${p}%' qa/final-r3/nh7-audio-offline-v395.js
          grep -q 'is-downloaded395' qa/final-r3/nh7-audio-offline-v395.js
          grep -q "kind === 'sermon'" supabase/functions/nh7-school-media-access/index.ts || grep -q "kind==='sermon'" supabase/functions/nh7-school-media-access/index.ts
          grep -q 'createSignedUrl' supabase/functions/nh7-school-media-access/index.ts
          grep -q "'https://raw.githack.com'" supabase/functions/nh7-school-media-access/index.ts
      - name: Verify offline safeguards
        run: |
          grep -q "VERSION='3.9.5'" qa/final-r3/nh7-qa-sw-v395.js
          grep -q "MEDIA='nh7-media-v395'" qa/final-r3/nh7-qa-sw-v395.js
          grep -q "/auth/v1/" qa/final-r3/nh7-qa-sw-v395.js
          grep -q "/functions/v1/" qa/final-r3/nh7-qa-sw-v395.js
          grep -q '__nh7_media_v395__' qa/final-r3/nh7-qa-sw-v395.js
          grep -q "caches.open('nh7-core-v395')" qa/final-r3/app.html
          grep -q 'nh7-qa-sw-v395.js' qa/final-r3/app.html
      - name: Verify Admin RBAC lists
        run: |
          test -f supabase/migrations/20260826073500_admin_directory_rbac_v395.sql
          grep -q 'nh7_admin_has_permission_v395' supabase/migrations/20260826073500_admin_directory_rbac_v395.sql
          grep -q 'nh7_admin_content_access_dashboard_v395' supabase/migrations/20260826073500_admin_directory_rbac_v395.sql
          grep -q 'nh7_admin_account_directory_v395' supabase/migrations/20260826073500_admin_directory_rbac_v395.sql
          grep -q 'nh7_admin_content_access_dashboard_v395' qa/final-r3/admin-tools-v395.html
          grep -q 'nh7_admin_account_directory_v395' qa/final-r3/admin-tools-v395.html
          grep -q 'nh7_admin_my_access_v350' qa/final-r3/admin-tools-v395.html
      - name: Verify menu Settings and existing secure modules
        run: |
          grep -q "NH7_UI_SETTINGS_VERSION='3.9.4'" qa/final-r3/nh7-ui-settings-v394.js
          grep -q "NH7_VIDEO_PORTAL_VERSION='3.9.2'" qa/final-r3/nh7-video-portal-v392.js
          grep -q "NH7_ACCOUNT_DELETE_VERSION='3.9.3'" qa/final-r3/nh7-account-delete-v393.js
          grep -q 'nh7_school_exam_session_v381' qa/final-r3/nh7-qa-bridge-v392.js
      - name: Validate launcher and ensure legacy audio conflicts are removed
        run: |
          node <<'NODE'
          const fs=require('fs'),h=fs.readFileSync('qa/final-r3/app.html','utf8');
          for(const s of ['3.9.5-FINAL-QA-R3','nh7-audio-offline-v395.js','nh7-qa-sw-v395.js','92edf1681e940fa69927a8f61957219f09615864'])if(!h.includes(s))throw Error('Launcher missing '+s);
          for(const old of ['nh7-audio-route-stability-v330.js','nh7-offline-playback-bridge-v332.js','nh7-protected-audio-gate-v316.js','nh7-school-audio-native-v337.js'])if(!h.includes(old.replace('.js','\\.js'))){} // patterns exist only in removal regexes
          NODE
      - name: Verify current main remains untouched
        run: |
          grep -q '"app":"2.3.9.44"' version.json
          grep -q 'nh7-school-exam-v344.js?v=2.3.9.44' index.html
          echo 'R3.5 validation passed; no deployment job exists.'
