name: Validate audio hotfix 2.3.9.46
on:
  push:
    branches: [hotfix/audio-custom-offline-2.3.9.46]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Validate custom player and download module
        run: |
          node --check js/nh7-audio-signed-v397.js
          grep -q "NH7_AUDIO_SIGNED_VERSION='3.9.7'" js/nh7-audio-signed-v397.js
          grep -q 'data-v397-toggle' js/nh7-audio-signed-v397.js
          grep -q 'data-v397-stop' js/nh7-audio-signed-v397.js
          grep -q 'data-v397-speed-down' js/nh7-audio-signed-v397.js
          grep -q 'data-v397-speed-up' js/nh7-audio-signed-v397.js
          grep -q 'data-v397-seek' js/nh7-audio-signed-v397.js
          grep -q "kind:'sermon',sermon_id" js/nh7-audio-signed-v397.js
          grep -q "kind:'audio',lesson_code" js/nh7-audio-signed-v397.js
          grep -q "removeAttribute('data-offline-download')" js/nh7-audio-signed-v397.js
          grep -q "window.addEventListener('click',intercept,true)" js/nh7-audio-signed-v397.js
      - name: Validate persistent web and native offline storage
        run: |
          grep -q "DB_NAME='nh7-offline-audio-v397'" js/nh7-audio-signed-v397.js
          grep -q 'indexedDB.open' js/nh7-audio-signed-v397.js
          grep -q 'idbPut' js/nh7-audio-signed-v397.js
          grep -q 'URL.createObjectURL' js/nh7-audio-signed-v397.js
          grep -q "NATIVE_DIR='offline_audio_v397'" js/nh7-audio-signed-v397.js
          grep -q 'در حال دانلود ${percent}%' js/nh7-audio-signed-v397.js
          grep -q 'is-downloaded-v397' js/nh7-audio-signed-v397.js
      - name: Validate shell version and load order
        run: |
          node <<'NODE'
          const fs=require('fs'),v=JSON.parse(fs.readFileSync('version.json','utf8')),h=fs.readFileSync('index.html','utf8'),shell=fs.readFileSync('app-v239.html','utf8'),sw=fs.readFileSync('service-worker.js','utf8');
          if(v.app!=='2.3.9.46')throw Error('version mismatch');
          if(!h.includes("window.NH7_VERSION = '2.3.9.46'"))throw Error('index version mismatch');
          const owner=h.indexOf('js/nh7-audio-signed-v397.js?v=2.3.9.46'),app=h.indexOf('js/app.js?v=2.3.9.46');
          if(owner<0||app<0||owner>app)throw Error('audio owner load order invalid');
          if(h.includes('nh7-audio-signed-v396.js'))throw Error('old v396 still loaded');
          if(!shell.includes('index.html?v=2.3.9.46'))throw Error('native shell mismatch');
          if(!sw.includes('2.3.9.46')||!sw.includes('audio-custom-v397'))throw Error('service worker mismatch');
          for(const file of ['index.html','app-v239.html']){
            const html=fs.readFileSync(file,'utf8');
            [...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)].forEach((m,i)=>new Function(m[1]+`\n//# sourceURL=${file}-${i}`));
          }
          NODE
      - name: Verify Edge preflight and auth boundary
        run: |
          set -euo pipefail
          curl -sS -D /tmp/options.headers -o /tmp/options.body -X OPTIONS \
            -H 'Origin: https://omideno7.github.io' \
            -H 'Access-Control-Request-Method: POST' \
            -H 'Access-Control-Request-Headers: authorization,apikey,content-type,x-client-info' \
            'https://gpzcwffxnddhaeaogdyo.supabase.co/functions/v1/nh7-school-media-access'
          grep -qi '^access-control-allow-origin: https://omideno7.github.io' /tmp/options.headers
          code=$(curl -sS -o /tmp/noauth.body -w '%{http_code}' -X POST -H 'Origin: https://omideno7.github.io' -H 'Content-Type: application/json' --data '{"kind":"sermon","sermon_id":"2307950e-7b9e-4dfe-abbf-0dab5b93b8af"}' 'https://gpzcwffxnddhaeaogdyo.supabase.co/functions/v1/nh7-school-media-access')
          test "$code" = "401"
          grep -q 'login_required' /tmp/noauth.body
          echo 'Audio hotfix 2.3.9.46 validation passed.'
