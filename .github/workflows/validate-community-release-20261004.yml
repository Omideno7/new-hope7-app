name: Validate Community Release Candidate

on:
  push:
    branches: [feature/community-modules-release-20261004]

permissions:
  contents: read

jobs:
  static-validation:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - name: JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          node --check js/app.js
          node --check js/nh7-community-v502.js
          node --check js/nh7-admin-community-v502.js
      - name: Community release invariants
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validate_next_native_optimization_guard.py
          python3 - <<'PY'
          from pathlib import Path
          idx=Path('index.html').read_text()
          app=Path('js/app.js').read_text()
          admin=Path('admin.html').read_text()
          community=Path('js/nh7-community-v502.js').read_text()
          cadm=Path('js/nh7-admin-community-v502.js').read_text()
          sql=Path('supabase/migrations/20260930_community_modules_v502_owner_audio_candidate.sql').read_text()

          assert 'nh7-community-v502.js?v=5.0.3-release' in idx
          assert 'nh7-deep-links-v501.js' not in idx
          for route in ("testimonies","prayerRequest","profile"):
              assert f"route==='{route}'" in app
          assert 'nh7-admin-community-v502.js?v=5.0.3-release' in admin
          assert 'setInterval(' not in community
          assert 'setInterval(' not in cadm
          assert 'PUBLIC_FEED_TTL_MS=10*60*1000' in community
          assert "p_limit:30" in community
          assert "p_limit:200" in cadm
          assert "p_limit:100" in cadm
          assert "slice(0,20)" in cadm
          assert 'TESTIMONY_MAX_BYTES=60*1024*1024' in community
          assert 'PROFILE_MAX_BYTES=5*1024*1024' in community
          assert sql.count('$$') % 2 == 0
          assert "nh7_testimonies_v502_user_created_idx" in sql
          assert "nh7_testimonies_v502_public_language_idx" in sql
          assert "nh7_prayer_requests_v502_user_created_idx" in sql
          assert "62914560" in sql
          assert "localStorage.clear()" not in app
          for forbidden in ("drop table public.nh7_account_notes","truncate table public.nh7_account_notes",
                            "drop table public.school_progress","truncate table public.school_progress"):
              assert forbidden not in sql.lower()
          print("Community candidate static validation: PASS")
          PY
