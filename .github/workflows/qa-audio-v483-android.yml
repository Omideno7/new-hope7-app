name: Audio v483 Android Native QA

on:
  push:
    branches: ['fix/audio-autonext-media-controls-v483-20260920']
    paths:
      - '.github/workflows/qa-audio-v483-android.yml'
      - 'index.html'
      - 'js/app.js'
      - 'js/nh7-audio-classic-v483.js'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-android:
    runs-on: macos-14
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
      - name: Build Android audio QA APK
        shell: bash
        run: |
          set -euo pipefail
          rm -rf android-audio-qa
          mkdir -p android-audio-qa/www
          cp index.html app-v239.html reset-password.html manifest.json version.json android-audio-qa/www/
          for dir in assets css js data offline push; do cp -R "$dir" android-audio-qa/www/; done
          cat > android-audio-qa/package.json <<'JSON'
          {
            "name":"nh7-audio-v483-android-qa",
            "private":true,
            "dependencies":{
              "@capacitor/android":"8.5.0",
              "@capacitor/core":"8.5.0",
              "@capacitor/file-transfer":"2.0.5",
              "@capacitor/filesystem":"8.1.3",
              "@capacitor/local-notifications":"8.3.1",
              "onesignal-cordova-plugin":"5.5.3"
            },
            "devDependencies":{"@capacitor/cli":"8.5.0"}
          }
          JSON
          cat > android-audio-qa/capacitor.config.json <<'JSON'
          {"appId":"com.omideno7.newhope7.audioqa","appName":"NH7 Audio QA","webDir":"www","server":{"androidScheme":"https","cleartext":false}}
          JSON
          cd android-audio-qa
          npm install --no-audit --no-fund
          npx cap add android
          npx cap sync android
          test -f android/app/src/main/assets/public/js/nh7-audio-classic-v483.js
          grep -q 'navigator.mediaSession.metadata=new MediaMetadata' android/app/src/main/assets/public/js/nh7-audio-classic-v483.js
          grep -q 'nh7-now-playing-v483' android/app/src/main/assets/public/js/nh7-audio-classic-v483.js
          python3 <<'PY'
          from pathlib import Path
          import re
          v=Path('android/variables.gradle')
          s=v.read_text()
          s=re.sub(r'minSdkVersion\s*=\s*\d+','minSdkVersion = 24',s)
          s=re.sub(r'compileSdkVersion\s*=\s*\d+','compileSdkVersion = 36',s)
          s=re.sub(r'targetSdkVersion\s*=\s*\d+','targetSdkVersion = 36',s)
          v.write_text(s)
          PY
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --stacktrace
          test -f app/build/outputs/apk/debug/app-debug.apk
