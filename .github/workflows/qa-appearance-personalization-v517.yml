name: QA Appearance Personalization v517 Preview

on:
  push:
    branches:
      - fix/appearance-personalization-v517-preview-20261002
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Scope
        run: |
          set -e
          base=968eb672cdd45f3af537cd1ed835fef4edf940e0
          git diff --name-only "$base"...HEAD | sort > /tmp/changed
          allowed=(
            '.github/workflows/qa-appearance-personalization-v514.yml'
            '.github/workflows/qa-appearance-personalization-v515.yml'
            '.github/workflows/qa-appearance-personalization-v516.yml'
            '.github/workflows/qa-appearance-personalization-v517.yml'
            'css/nh7-appearance-personalization-v514.css'
            'css/nh7-icons-v517.css'
            'index.html'
            'js/nh7-appearance-personalization-v514.js'
            'js/nh7-fonts-v454.js'
            'js/nh7-icons-v517.js'
            'js/nh7-theme-studio-v453.js'
            'service-worker.js'
            'sw-offline-v329.js'
            'sw-release-core-v403.js'
          )
          printf '%s\n' "${allowed[@]}" | sort > /tmp/allowed
          diff -u /tmp/allowed /tmp/changed

      - name: Syntax
        run: |
          node --check js/nh7-appearance-personalization-v514.js
          node --check js/nh7-fonts-v454.js
          node --check js/nh7-icons-v517.js
          node --check js/nh7-theme-studio-v453.js
          node --check service-worker.js
          node --check sw-offline-v329.js
          node --check sw-release-core-v403.js

      - name: Device font and approved font checks
        run: |
          grep -q "system:\['فونت خود دستگاه','Device font','Font uređaja'\]" js/nh7-appearance-personalization-v514.js
          grep -q "FA_FONT_IDS=\['system','vazirmatn'" js/nh7-appearance-personalization-v514.js
          grep -q "LATIN_FONT_IDS=\['system','inter'" js/nh7-appearance-personalization-v514.js
          grep -q "web:true" js/nh7-fonts-v454.js
          grep -q "Noto Kufi Arabic" js/nh7-fonts-v454.js
          grep -q "Lalezar" js/nh7-fonts-v454.js
          grep -q "Playfair Display" js/nh7-fonts-v454.js

      - name: Modern icon adapter checks
        run: |
          grep -q "NH7IconsV517" js/nh7-icons-v517.js
          grep -q "decoratePlayer" js/nh7-icons-v517.js
          grep -q "decorateBible" js/nh7-icons-v517.js
          grep -q "decorateSchool" js/nh7-icons-v517.js
          grep -q "data-favorite" js/nh7-icons-v517.js
          grep -q "data-bookmark" js/nh7-icons-v517.js
          grep -q "submitSchoolExam" js/nh7-icons-v517.js
          grep -q "nh7-icon517-dynamic-play" css/nh7-icons-v517.css
          grep -q "nh7-icon517-favorite" css/nh7-icons-v517.css
          grep -q "nh7p500-tools" css/nh7-icons-v517.css

      - name: Reader switch remains fixed
        run: |
          grep -q "direction:ltr" css/nh7-appearance-personalization-v514.css
          grep -q "left:23px" css/nh7-appearance-personalization-v514.css

      - name: Wiring and cache
        run: |
          grep -q 'css/nh7-icons-v517.css?v=5.1.7' index.html
          grep -q 'js/nh7-icons-v517.js?v=5.1.7' index.html
          grep -q 'nh7-appearance-personalization-v514.js?v=5.1.7' index.html
          grep -q "nh7-release-core-v517-appearance-icons" sw-release-core-v403.js
          grep -q "nh7-icons-v517.css" sw-release-core-v403.js
          grep -q "nh7-icons-v517.js" sw-release-core-v403.js
          grep -q "v2.3.9.55-appearance517" sw-offline-v329.js
          grep -q "5.1.7-appearance517" service-worker.js

      - name: Unrelated runtime unchanged
        run: |
          set -e
          base=968eb672cdd45f3af537cd1ed835fef4edf940e0
          git diff --exit-code "$base"...HEAD --             js/app.js js/nh7-media-player-v500.js js/nh7-audio-classic-v484.js             'js/nh7-school-*' 'js/nh7-admin-*' 'supabase/**' 'data/**'
