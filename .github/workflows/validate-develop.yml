name: Validate Develop

on:
  push:
    branches: [develop]
  pull_request:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: new-hope7-develop-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0

      - name: Use Node 24 for current JavaScript and review-only TypeScript fixtures
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Validate active JavaScript syntax
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/run-ci-check.py node --check js/nh7-notification-contract-wave4.js
          python3 scripts/run-ci-check.py node --check js/nh7-notification-intents-wave4.js
          python3 scripts/run-ci-check.py node --check js/nh7-push-account-bind-v364.js
          python3 scripts/run-ci-check.py node --check js/nh7-notifications-zagreb-v334.js
          python3 scripts/run-ci-check.py node --check js/nh7-admin-push-owner-v400.js
          python3 scripts/run-ci-check.py node --check js/nh7-inbox-badge-sync-v418.js
          python3 scripts/run-ci-check.py node --check js/nh7-spiritual-plans-v412.js
          for source in scripts/*wave4*.cjs; do python3 scripts/run-ci-check.py node --check "$source"; done
          python3 scripts/run-ci-check.py node scripts/verify-wave4-review-syntax.cjs
          python3 scripts/run-ci-check.py node --check js/nh7-celebrations-v464.js
          python3 scripts/run-ci-check.py node --check js/nh7-admin-rbac-v350.js
          python3 scripts/run-ci-check.py node --check js/nh7-admin-session-keepalive-v451.js
          python3 scripts/run-ci-check.py node --check js/nh7-admin-ai-v491.js
          python3 scripts/run-ci-check.py node --check js/nh7-admin-community-fixes-v503.js
          python3 scripts/run-ci-check.py node --check js/nh7-admin-testimony-core-v565.js
          python3 scripts/run-ci-check.py node --check js/nh7-admin-message-center-v416.js
          python3 scripts/run-ci-check.py node --check js/nh7-admin-workspace-wave3.js
          python3 scripts/run-ci-check.py node --check js/app.js
          python3 scripts/run-ci-check.py node --check js/nh7-finalqa-v558.js
          python3 scripts/run-ci-check.py node --check js/nh7-settings-controller-v403.js
          if [ -f js/nh7-adaptive-layout-v570.js ]; then
            python3 scripts/run-ci-check.py node --check js/nh7-adaptive-layout-v570.js
          fi

      - name: Validate responsive foundation when present
        shell: bash
        run: |
          set -euo pipefail
          if [ -f scripts/verify-responsive-v570.mjs ]; then
            node scripts/verify-responsive-v570.mjs
          fi

      - name: Validate theme propagation when present
        shell: bash
        run: |
          set -euo pipefail
          if [ -f scripts/verify-theme-propagation-v571.mjs ]; then
            node scripts/verify-theme-propagation-v571.mjs
          fi

      - name: Validate offline reconciliation when present
        shell: bash
        run: |
          set -euo pipefail
          if [ -f scripts/verify-offline-reconciliation-v572.mjs ]; then
            node scripts/verify-offline-reconciliation-v572.mjs
          fi

      - name: Validate Supabase migration checkpoint parity
        shell: bash
        run: |
          set -euo pipefail
          if [ -f scripts/verify-supabase-migration-parity.py ]; then
            python3 scripts/verify-supabase-migration-parity.py
          fi

      - name: Validate Student Identity Core migration when present
        shell: bash
        run: |
          set -euo pipefail
          if [ -f scripts/verify-school-identity-core-v127.py ]; then
            python3 scripts/verify-school-identity-core-v127.py
          fi

      - name: Validate School exam read identity when present
        shell: bash
        run: |
          set -euo pipefail
          if [ -f scripts/verify-school-exam-read-identity-v351.mjs ]; then
            node scripts/verify-school-exam-read-identity-v351.mjs
          fi

      - name: Validate School exam scoring identity when present
        shell: bash
        run: |
          set -euo pipefail
          if [ -f scripts/verify-school-exam-scoring-identity-v128.mjs ]; then
            node scripts/verify-school-exam-scoring-identity-v128.mjs
          fi
          if [ -f scripts/verify-school-exam-submit-identity-v128.mjs ]; then
            node scripts/verify-school-exam-submit-identity-v128.mjs
          fi
          if [ -f scripts/verify-school-assignment-submit-identity-v128.mjs ]; then
            node scripts/verify-school-assignment-submit-identity-v128.mjs
          fi
          if [ -f scripts/verify-school-certificate-identity-v127.mjs ]; then
            node scripts/verify-school-certificate-identity-v127.mjs
          fi
          if [ -f scripts/verify-public-certificate-verifier-v127.mjs ]; then
            node scripts/verify-public-certificate-verifier-v127.mjs
          fi
          if [ -f scripts/verify-public-certificate-verification-page-v127.mjs ]; then
            node scripts/verify-public-certificate-verification-page-v127.mjs
          fi
          if [ -f scripts/verify-school-course-code-bridge-v200.mjs ]; then
            node scripts/verify-school-course-code-bridge-v200.mjs
          fi
          if [ -f scripts/verify-school-course-public-metadata-v200.mjs ]; then
            node scripts/verify-school-course-public-metadata-v200.mjs
          fi
          if [ -f scripts/verify-school-stage-model-v210.mjs ]; then
            node scripts/verify-school-stage-model-v210.mjs
          fi

      - name: Validate optimization invariants
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/validate_next_native_optimization_guard.py

      - name: Install isolated canonical gate tools
        run: |
          python3 -m pip install PyYAML==6.0.2
          if ! command -v pdfinfo >/dev/null; then sudo apt-get update && sudo apt-get install -y poppler-utils; fi
          npm install --prefix "$RUNNER_TEMP/canonical-tools" --no-audit --no-fund playwright@1.62.1 @electric-sql/pglite@0.3.14 jsqr@1.4.0 pngjs@7.0.0
          "$RUNNER_TEMP/canonical-tools/node_modules/.bin/playwright" install --with-deps chromium

      - name: Validate Wave 7 platform and safe Watch source contracts
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/run-ci-check.py node --check js/nh7-platform-wave7.js
          python3 scripts/run-ci-check.py node --check sw-release-core-v403.js
          python3 scripts/run-ci-check.py node --check scripts/verify-wave7-platform-browser.cjs
          python3 scripts/run-ci-check.py node --check scripts/measure-wave7.cjs
          python3 scripts/run-ci-check.py python3 scripts/verify-wave7-safety.py
          python3 scripts/run-ci-check.py python3 scripts/verify-wave7-watch.py

      - name: Verify Wave 6.5 source-only security and synthetic backend contracts
        run: |
          export NODE_PATH="$RUNNER_TEMP/canonical-tools/node_modules"
          python3 scripts/run-ci-check.py node scripts/verify-wave65-syntax.cjs
          python3 scripts/run-ci-check.py python3 scripts/verify-wave65-safety.py
          python3 scripts/run-ci-check.py python3 scripts/build-wave65-inventory.py
          python3 scripts/run-ci-check.py python3 scripts/verify-wave65-advisor.py
          python3 scripts/run-ci-check.py python3 scripts/verify-wave65-secrets.py
          python3 scripts/run-ci-check.py node scripts/verify-wave65-validation.cjs
          python3 scripts/run-ci-check.py node scripts/verify-wave65-postgres.cjs
          python3 scripts/run-ci-check.py python3 scripts/verify-wave66-evidence.py
          python3 scripts/run-ci-check.py python3 scripts/verify-wave66-safety.py
          python3 scripts/run-ci-check.py node --check scripts/verify-wave66-postgres.cjs
          python3 scripts/run-ci-check.py node --check scripts/measure-wave66.cjs
          python3 scripts/run-ci-check.py node scripts/verify-wave66-postgres.cjs
          python3 scripts/run-ci-check.py node scripts/verify-wave65-delete.mjs

      - name: Verify Wave 6 syntax and explicit UI/data-safety boundaries
        run: |
          python3 scripts/run-ci-check.py node scripts/verify-wave6-syntax.cjs
          python3 scripts/run-ci-check.py python3 scripts/verify-wave6-safety.py

      - name: Verify Wave 5 syntax and exact changed-file boundaries
        run: |
          python3 scripts/run-ci-check.py node scripts/verify-wave5-syntax.cjs
          python3 scripts/run-ci-check.py python3 scripts/verify-wave5-safety.py

      - name: Run current release and develop safeguards without deployment
        run: |
          python3 scripts/run-ci-check.py python3 scripts/validate-canonical-develop.py
          python3 scripts/run-ci-check.py python3 scripts/verify-consolidation-safety.py
          python3 scripts/run-ci-check.py python3 scripts/verify-main-develop-sync.py
          python3 scripts/run-ci-check.py python3 scripts/verify-wave3-safety.py
          python3 scripts/run-ci-check.py node scripts/verify-wave4-notifications.cjs
          python3 scripts/run-ci-check.py node scripts/verify-performance-wave1.cjs
          python3 scripts/run-ci-check.py node scripts/verify-local-first-wave2.cjs
          python3 scripts/run-ci-check.py node scripts/measure-local-first-wave2.cjs

      - name: Verify build provenance against actual exported bytes
        run: python3 scripts/run-ci-check.py python3 scripts/verify-build-metadata.py

      - name: Verify current Profile / Search / Inbox in browser
        run: |
          export NODE_PATH="$RUNNER_TEMP/canonical-tools/node_modules"
          export CHROMIUM_PATH="$(node -e "console.log(require('playwright').chromium.executablePath())")"
          python3 -m http.server 8878 --bind 127.0.0.1 > "$RUNNER_TEMP/canonical-server.log" 2>&1 &
          python3 scripts/run-ci-check.py node scripts/verify-profile-search-inbox-qa.cjs http://127.0.0.1:8878
          python3 scripts/run-ci-check.py node scripts/verify-wave7-platform-browser.cjs http://127.0.0.1:8878
          python3 scripts/run-ci-check.py node scripts/verify-wave65-browser.cjs http://127.0.0.1:8878
          python3 scripts/run-ci-check.py node scripts/verify-wave65-signup.cjs http://127.0.0.1:8878
          python3 scripts/run-ci-check.py node scripts/verify-sermon-note-direction.cjs http://127.0.0.1:8878
          python3 scripts/run-ci-check.py node scripts/verify-user-writing-direction.cjs http://127.0.0.1:8878
          python3 scripts/run-ci-check.py node scripts/verify-performance-wave1-browser.cjs http://127.0.0.1:8878
          python3 scripts/run-ci-check.py node scripts/verify-local-first-wave2-browser.cjs http://127.0.0.1:8878
          python3 scripts/run-ci-check.py node scripts/verify-wave3-birthday.cjs http://127.0.0.1:8878
          python3 scripts/run-ci-check.py node scripts/verify-wave3-admin-fencing.cjs http://127.0.0.1:8878
          python3 scripts/run-ci-check.py node scripts/verify-wave3-admin-browser.cjs http://127.0.0.1:8878
          python3 scripts/run-ci-check.py node scripts/verify-wave4-notifications-browser.cjs http://127.0.0.1:8878
          python3 scripts/run-ci-check.py node scripts/verify-wave6-read-contracts.cjs
          python3 scripts/run-ci-check.py node scripts/verify-wave6-user-security.cjs http://127.0.0.1:8878
          python3 scripts/run-ci-check.py node scripts/verify-wave6-navigation-search.cjs http://127.0.0.1:8878
          python3 scripts/run-ci-check.py node scripts/verify-wave6-ui-browser.cjs http://127.0.0.1:8878
          python3 scripts/run-ci-check.py node scripts/verify-wave5-documents.cjs
          python3 scripts/run-ci-check.py node scripts/verify-wave5-boundaries.cjs
          python3 scripts/run-ci-check.py node scripts/verify-wave5-documents-browser.cjs http://127.0.0.1:8878
          python3 scripts/run-ci-check.py node scripts/verify-wave5-documents-safety-browser.cjs http://127.0.0.1:8878
          python3 scripts/run-ci-check.py node scripts/verify-wave5-races.cjs http://127.0.0.1:8878

      - name: Preserve current School reports, PDF, Print and Community document paths
        run: |
          export NODE_PATH="$RUNNER_TEMP/canonical-tools/node_modules"
          export CHROMIUM_PATH="$(node -e "console.log(require('playwright').chromium.executablePath())")"
          python3 scripts/run-ci-check.py python3 scripts/verify-web-community-parity-v250.py
          python3 scripts/run-ci-check.py python3 scripts/verify-notes-account-merge-v544.py
          python3 scripts/run-ci-check.py python3 scripts/verify-audio-playback-safety-v486.py
          python3 scripts/run-ci-check.py node scripts/verify-school-reports-v116.mjs
          python3 scripts/run-ci-check.py node scripts/verify-school-reports-browser-v116.cjs http://127.0.0.1:8878
          python3 scripts/run-ci-check.py node scripts/verify-report-pdf-v119.mjs
          python3 scripts/run-ci-check.py node scripts/verify-report-pdf-v119.cjs http://127.0.0.1:8878
          NH7_TEST_PRINT121=1 python3 scripts/run-ci-check.py node scripts/verify-report-pdf-v119.cjs http://127.0.0.1:8878
          python3 scripts/run-ci-check.py node scripts/verify-print-v121.mjs
          python3 scripts/run-ci-check.py node scripts/verify-community-certificate-admin-v505.cjs

      - name: Measure Wave 6.5 real idle windows and synthetic operations
        run: |
          export NODE_PATH="$RUNNER_TEMP/canonical-tools/node_modules"
          export CHROMIUM_PATH="$(node -e "console.log(require('playwright').chromium.executablePath())")"
          mkdir -p "$RUNNER_TEMP/wave65-baseline"
          git archive fd7191653d45fc53791b867feb54181e2b90bf77 | tar -x -C "$RUNNER_TEMP/wave65-baseline"
          python3 -m http.server 8887 --bind 127.0.0.1 --directory "$RUNNER_TEMP/wave65-baseline" > "$RUNNER_TEMP/wave65-baseline.log" 2>&1 &
          python3 scripts/run-ci-check.py node scripts/measure-wave65.cjs http://127.0.0.1:8878 http://127.0.0.1:8887 "$RUNNER_TEMP/wave65-measurements.json"

      - name: Retain synthetic Wave 6.5 measurements for this exact head
        uses: actions/upload-artifact@v4
        with:
          name: wave65-measurements-${{ github.sha }}
          path: ${{ runner.temp }}/wave65-measurements.json
          retention-days: 14

      - name: Measure frozen Wave 6.6 startup and idle cost against metadata head
        shell: bash
        run: |
          set -euo pipefail
          export NODE_PATH="$RUNNER_TEMP/canonical-tools/node_modules"
          export CHROMIUM_PATH="$(node -e "console.log(require('playwright').chromium.executablePath())")"
          mkdir -p "$RUNNER_TEMP/wave66-baseline"
          git archive 4f6c702c3f9e996256a5f9410bfd6096b5f3f018 | tar -x -C "$RUNNER_TEMP/wave66-baseline"
          python3 -m http.server 8888 --bind 127.0.0.1 --directory "$RUNNER_TEMP/wave66-baseline" > "$RUNNER_TEMP/wave66-baseline.log" 2>&1 &
          python3 scripts/run-ci-check.py node scripts/measure-wave66.cjs http://127.0.0.1:8878 http://127.0.0.1:8888 "$RUNNER_TEMP/wave66-measurements.json"

      - name: Upload exact-head Wave 6.6 measurements
        uses: actions/upload-artifact@v4
        with:
          name: wave66-measurements-${{ github.sha }}
          path: ${{ runner.temp }}/wave66-measurements.json
          retention-days: 14

      - name: Measure Wave 7 platform idle, listeners and transitions against exact baseline
        shell: bash
        run: |
          set -euo pipefail
          export NODE_PATH="$RUNNER_TEMP/canonical-tools/node_modules"
          export CHROMIUM_PATH="$(node -e "console.log(require('playwright').chromium.executablePath())")"
          mkdir -p "$RUNNER_TEMP/wave7-baseline"
          git archive 8bdb9a0cad807440b36bdca7c5a6f53562cc9e70 | tar -x -C "$RUNNER_TEMP/wave7-baseline"
          python3 -m http.server 8890 --bind 127.0.0.1 --directory "$RUNNER_TEMP/wave7-baseline" > "$RUNNER_TEMP/wave7-baseline.log" 2>&1 &
          python3 scripts/run-ci-check.py node scripts/measure-wave7.cjs http://127.0.0.1:8878 http://127.0.0.1:8890 "$RUNNER_TEMP/wave7-measurements.json"

      - name: Upload exact-head Wave 7 measurements
        uses: actions/upload-artifact@v4
        with:
          name: wave7-measurements-${{ github.sha }}
          path: ${{ runner.temp }}/wave7-measurements.json
          retention-days: 14
