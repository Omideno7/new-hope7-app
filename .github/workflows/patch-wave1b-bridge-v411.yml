name: Apply Wave 1B navigation isolation patch

on:
  push:
    branches: [release/wave1b-spiritual-plans-23949]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message || '', 'navigation isolation v4.1.1') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/wave1b-spiritual-plans-23949
          fetch-depth: 0
      - name: Apply and validate patch
        run: |
          python <<'PY'
          from pathlib import Path
          path=Path('js/nh7-spiritual-plans-bridge-v410.js')
          text=path.read_text(encoding='utf-8')
          if 'const leavingTarget = active' in text:
              print('Navigation isolation already applied.')
              raise SystemExit(0)
          old="""document.addEventListener('click', event => {
            const verse = active && event.target.closest?.('[data-reveal-ref]');
            if(verse){ event.preventDefault(); event.stopPropagation(); revealVerse(verse); return; }
            if(event.target.closest?.('#backBtn') && handleBack(event)) return;
            const target = plansTarget(event.target);
            if(!target || suspendedClick) return;
          """
          new="""document.addEventListener('click', event => {
            const verse = active && event.target.closest?.('[data-reveal-ref]');
            if(verse){ event.preventDefault(); event.stopPropagation(); revealVerse(verse); return; }
            if(event.target.closest?.('#backBtn') && handleBack(event)) return;
            const leavingTarget = active && event.target.closest?.('[data-route],[data-go],#inboxBtn');
            if(leavingTarget && !plansTarget(leavingTarget)){
              active=false; currentParams={tab:'spiritual'};
              return;
            }
            const target = plansTarget(event.target);
            if(!target || suspendedClick) return;
          """
          if old not in text:
              raise SystemExit('Expected bridge block was not found')
          path.write_text(text.replace(old,new),encoding='utf-8')
          PY
          node --check js/nh7-spiritual-plans-bridge-v410.js
      - name: Commit patch when changed
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name 'Omideno7'
          git config user.email 'omideno7church@gmail.com'
          git add js/nh7-spiritual-plans-bridge-v410.js
          git commit -m 'fix(plans): navigation isolation v4.1.1'
          git push origin HEAD:release/wave1b-spiritual-plans-23949
