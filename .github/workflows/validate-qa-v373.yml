name: Validate New Hope 7 Complete QA 3.7.3

on:
  push:
    branches:
      - qa/final-integration-v372-20260825
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: nh7-complete-qa-v373
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact QA commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}

      - name: Syntax — Apocrypha source pin
        run: node --check js/nh7-apocrypha-source-pin-v373.js
      - name: Syntax — fresh Apocrypha reader
        run: node --check js/nh7-apocrypha-fresh-v372.js
      - name: Syntax — saved Apocrypha opener
        run: node --check js/nh7-saved-apocrypha-open-v372.js
      - name: Syntax — library access
        run: node --check js/nh7-library-v372.js
      - name: Syntax — registration and recovery
        run: node --check js/nh7-registration-recovery-v372.js

      - name: Capture School syntax diagnostic
        shell: bash
        run: |
          set +e
          node --check js/nh7-school-guide-gate-v373.js > school-syntax.txt 2>&1
          status=$?
          echo "exit_status=$status" >> school-syntax.txt
          cat school-syntax.txt
          exit 0

      - name: Upload School syntax diagnostic
        uses: actions/upload-artifact@v4
        with:
          name: school-syntax-v373
          path: school-syntax.txt
          if-no-files-found: error
          retention-days: 1

      - name: Syntax — School guide and gate
        run: node --check js/nh7-school-guide-gate-v373.js

      - name: Validate HTML inline scripts
        run: |
          node <<'NODE'
          const fs=require('fs');
          for(const file of ['qa/final-v373/index.html','qa/final-v373/app.html','qa/final-v373/admin-tools.html']){
            const html=fs.readFileSync(file,'utf8');
            const scripts=[...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)].map(x=>x[1]).filter(Boolean);
            scripts.forEach((code,index)=>new Function(code+`\n//# sourceURL=${file}-inline-${index}`));
            console.log(file,scripts.length,'inline scripts parsed');
          }
          NODE

      - name: Validate approved source pins and QA wiring
        run: |
          set -euo pipefail
          grep -q "a8521f7b87ee68b7bdbbfd081ed63e679e9bad5a" js/nh7-apocrypha-source-pin-v373.js
          grep -q "a8521f7b87ee68b7bdbbfd081ed63e679e9bad5a" qa/final-v373/app.html
          grep -q "nh7-school-guide-gate-v373.js" qa/final-v373/app.html
          grep -q "nh7-registration-recovery-v372.js" qa/final-v373/app.html
          grep -q "nh7-library-v372.js" qa/final-v373/app.html
          grep -q "nh7-saved-apocrypha-open-v372.js" qa/final-v373/app.html
          grep -q "nh7_admin_content_access_grant_v251" qa/final-v373/admin-tools.html
          grep -q "nh7_admin_delete_account_full_v372" qa/final-v373/admin-tools.html
          grep -q "nh7_admin_registration_delete_v350" qa/final-v373/admin-tools.html
          test -f supabase/migrations/20260825193000_school_audio_assignment_exam_gate_v373.sql
          grep -q "nh7_school_exam_session_v373" supabase/migrations/20260825193000_school_audio_assignment_exam_gate_v373.sql
          grep -q "nh7_submit_school_assignment_v373" supabase/migrations/20260825193000_school_audio_assignment_exam_gate_v373.sql
          grep -q "nh7_submit_school_exam_v373" supabase/migrations/20260825193000_school_audio_assignment_exam_gate_v373.sql

      - name: Confirm QA validation only
        run: |
          ! grep -q "actions/deploy-pages" .github/workflows/validate-qa-v373.yml
          echo "QA validation only — no deployment configured"
