name: Validate classic audio hotfix branch
on:
  push:
    branches: [hotfix/classic-audio-player-2.3.9.49]
permissions:
  contents: read
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.sha }}
      - name: Validate unified classic audio player
        run: |
          set -euo pipefail
          node --check js/nh7-audio-classic-v400.js
          node --check js/nh7-settings-controller-v399.js
          node <<'NODE'
          const fs=require('fs');
          const v=JSON.parse(fs.readFileSync('version.json','utf8'));
          const h=fs.readFileSync('index.html','utf8');
          const shell=fs.readFileSync('app-v239.html','utf8');
          const sw=fs.readFileSync('service-worker.js','utf8');
          const audio=fs.readFileSync('js/nh7-audio-classic-v400.js','utf8');
          if(v.app!=='2.3.9.49')throw Error('version mismatch');
          if(!h.includes("window.NH7_VERSION = '2.3.9.49'"))throw Error('index version mismatch');
          const classic=h.indexOf('js/nh7-audio-classic-v400.js?v=2.3.9.49');
          const app=h.indexOf('js/app.js?v=2.3.9.49');
          const settings=h.indexOf('js/nh7-settings-controller-v399.js?v=2.3.9.49');
          if(classic<0||app<0||settings<0||classic>app||app>settings)throw Error('load order invalid');
          if(h.includes('nh7-audio-signed-v397.js'))throw Error('duplicate v397 player loaded');
          if(h.includes('nh7-school-audio-native-v337.js'))throw Error('separate School player loaded');
          for(const required of ["NH7_AUDIO_CLASSIC_VERSION='4.0.0'","kind:'sermon',sermon_id","kind:'audio',lesson_code",'data-classic-toggle','data-classic-back','data-classic-forward','data-classic-speed-up','data-classic-speed-down','data-classic-seek','nh7_school_record_audio_v380',"DB_NAME='nh7-offline-audio-v397'",'indexedDB.open','window.NH7_AUDIO_SIGNED_V397=window.NH7_AUDIO_CLASSIC_V400'])if(!audio.includes(required))throw Error('classic player missing '+required);
          if(!shell.includes('index.html?v=2.3.9.49'))throw Error('native shell mismatch');
          if(!sw.includes('2.3.9.49')||!sw.includes('classic-audio-v400'))throw Error('service worker mismatch');
          for(const file of ['index.html','app-v239.html']){const html=fs.readFileSync(file,'utf8');[...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)].forEach((m,i)=>new Function(m[1]+`\n//# sourceURL=${file}-${i}`));}
          NODE
      - name: Verify protected systems remain wired
        run: |
          grep -q 'nh7-school-exam-v344.js?v=2.3.9.49' index.html
          grep -q 'nh7-settings-controller-v399.js?v=2.3.9.49' index.html
          grep -q 'nh7-auth-recovery-v342.js?v=2.3.9.49' index.html
          grep -q 'nh7-protected-audio-gate-v316.js' index.html
          echo 'Classic audio branch validation passed.'
