name: Store Review v469 Preview QA
on:
  push:
    branches: [feature/store-review-v469-preview-20260919]
    paths:
      - js/nh7-store-review-v469.js
      - css/nh7-store-review-v469.css
      - scripts/store-review-v469/**
      - .github/workflows/store-review-v469-preview-qa.yml
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: store-review-v469-preview
  cancel-in-progress: false
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      PYTHONUNBUFFERED: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Prepare preview against unchanged production
        run: |
          test "$(git ls-remote origin refs/heads/main | cut -f1)" = '2bde658268eeaed0e7873c83aa7fb54c1d37fc8f'
          python scripts/store-review-v469/prepare.py
          mkdir -p qa-store-review-v469
          git diff 2bde658268eeaed0e7873c83aa7fb54c1d37fc8f -- js/app.js index.html service-worker.js sw-release-core-v403.js js/nh7-store-review-v469.js css/nh7-store-review-v469.css > qa-store-review-v469/runtime.patch
      - name: Install pinned browser tests
        run: |
          python -m pip install playwright==1.55.0
          python -m playwright install --with-deps chromium webkit
      - name: Protected-cache upgrade regression
        run: node scripts/store-review-v469/cache.cjs
      - name: Chromium and WebKit review and Settings regressions
        run: timeout --signal=TERM --kill-after=10s 180s python scripts/store-review-v469/qa.py
      - name: Commit tested candidate and isolated preview only to feature branch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/app.js index.html service-worker.js sw-release-core-v403.js js/nh7-store-review-v469.js css/nh7-store-review-v469.css store-review-preview.html js/nh7-store-review-preview-v469.js
          git commit -m 'test(review): verified store-review candidate and phone preview [skip ci]'
          git push origin HEAD:feature/store-review-v469-preview-20260919
          python - <<'PY'
          from pathlib import Path
          import subprocess,json
          paths=['js/app.js','index.html','service-worker.js','sw-release-core-v403.js','js/nh7-store-review-v469.js','css/nh7-store-review-v469.css']
          commit=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          data={'baseline':'2bde658268eeaed0e7873c83aa7fb54c1d37fc8f','tested_commit':commit,'runtime':{p:subprocess.check_output(['git','rev-parse','HEAD:'+p],text=True).strip() for p in paths},'preview_path':'store-review-preview.html','production_changed':False,'native_build_changed':False,'phone_approval_required':True}
          Path('qa-store-review-v469/runtime-manifest.json').write_text(json.dumps(data,indent=2));print(json.dumps(data,indent=2))
          PY
      - name: Verify immutable phone preview delivery
        run: |
          python - <<'PY'
          from pathlib import Path
          import subprocess,json,time,urllib.request
          commit=subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip()
          base='https://rawcdn.githack.com/Omideno7/new-hope7-app/'+commit+'/'
          files=['store-review-preview.html','js/nh7-store-review-preview-v469.js','js/nh7-store-review-v469.js','css/nh7-store-review-v469.css']
          rows=[]
          for p in files:
              for i in range(3):
                  try:
                      with urllib.request.urlopen(urllib.request.Request(base+p,headers={'User-Agent':'NH7-preview-check'}),timeout=25) as r:
                          content=r.read();status=r.status;mime=r.headers.get('content-type','')
                      assert content==Path(p).read_bytes(),p+' content mismatch'
                      rows.append({'path':p,'status':status,'mime':mime,'exact_bytes':True});break
                  except Exception:
                      if i==2:raise
                      time.sleep(4)
          Path('qa-store-review-v469/phone-preview-report.json').write_text(json.dumps({'url':base+'store-review-preview.html','files':rows},indent=2))
          print('PASS public preview',base+'store-review-preview.html')
          PY
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: store-review-v469-preview-qa
          path: qa-store-review-v469/
          retention-days: 14
