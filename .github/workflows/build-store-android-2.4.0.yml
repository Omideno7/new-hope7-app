name: Build New Hope 7 Android 2.4.0

on:
  push:
    branches: [release/store-2.4.0-20260920]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      APP_ID: com.omideno7.newhope7
      APP_NAME: New Hope 7
      VERSION_NAME: 2.4.0
      VERSION_CODE: '24001'
    steps:
      - uses: actions/checkout@v4
        name: Checkout release candidate

      - uses: actions/setup-node@v4
        name: Set up Node 22
        with:
          node-version: '22'

      - uses: actions/setup-java@v4
        name: Set up Java 21
        with:
          distribution: temurin
          java-version: '21'

      - name: Use preinstalled Android SDK
        shell: bash
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          test -d "$SDK_ROOT"
          echo "ANDROID_HOME=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          echo "$SDK_ROOT/cmdline-tools/latest/bin" >> "$GITHUB_PATH"
          echo "$SDK_ROOT/platform-tools" >> "$GITHUB_PATH"
          "$SDK_ROOT/cmdline-tools/latest/bin/sdkmanager" --version

      - name: Install Android 16 / API 36
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager 'platforms;android-36' 'build-tools;36.0.0' 'platform-tools'

      - name: Create Capacitor wrapper from current web main
        shell: bash
        run: |
          set -euo pipefail
          rm -rf native-release
          mkdir -p native-release/www native-release/assets
          cp index.html app-v239.html reset-password.html manifest.json version.json native-release/www/
          for dir in assets css js data offline push; do cp -R "$dir" native-release/www/; done
          cp assets/logo.png native-release/assets/logo.png

          # Native bundle isolation + store release version inside the packaged web bundle only.
          python3 <<'PY'
          from pathlib import Path
          import json, re
          p=Path('native-release/www/index.html')
          text=p.read_text()
          text=text.replace("window.NH7_VERSION = '2.3.9.50';","window.NH7_VERSION = '2.4.0.0';")
          text=text.replace(
              "if ('serviceWorker' in navigator) {",
              "if (!window.Capacitor?.isNativePlatform?.() && 'serviceWorker' in navigator) {"
          )
          text=text.replace(
              '<script src="https://cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js" defer></script>',
              '<!-- Web OneSignal SDK disabled inside Android native wrapper; native OneSignal owns push -->'
          )
          p.write_text(text)
          v=Path('native-release/www/version.json')
          obj=json.loads(v.read_text())
          obj['app']='2.4.0.0'
          obj['updated_at']='2026-09-20T21:30:00+00:00'
          v.write_text(json.dumps(obj,ensure_ascii=False,separators=(',',':'))+'\n')
          PY
          cat > native-release/package.json <<'JSON'
          {
            "name": "new-hope-7-android-release",
            "private": true,
            "version": "2.4.0",
            "dependencies": {
              "@capacitor/android": "8.5.0",
              "@capacitor/core": "8.5.0",
              "@capacitor/file-transfer": "2.0.5",
              "@capacitor/filesystem": "8.1.3",
              "@capacitor/local-notifications": "8.3.1",
              "onesignal-cordova-plugin": "5.5.3"
            },
            "devDependencies": {
              "@capacitor/assets": "3.0.5",
              "@capacitor/cli": "8.5.0"
            }
          }
          JSON
          cat > native-release/capacitor.config.json <<'JSON'
          {
            "appId": "com.omideno7.newhope7",
            "appName": "New Hope 7",
            "webDir": "www",
            "server": {"androidScheme":"https","cleartext":false},
            "android": {"backgroundColor":"#ffffff","webContentsDebuggingEnabled":false},
            "plugins": {"LocalNotifications":{"iconColor":"#0f766e"}}
          }
          JSON
          cd native-release
          npm install --no-audit --no-fund
          npx cap add android
          npx cap sync android

      - name: Configure release identity, SDK and optimization
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re
          root=Path('native-release/android')
          variables=root/'variables.gradle'
          text=variables.read_text()
          text=re.sub(r'minSdkVersion\s*=\s*\d+', 'minSdkVersion = 24', text)
          text=re.sub(r'compileSdkVersion\s*=\s*\d+', 'compileSdkVersion = 36', text)
          text=re.sub(r'targetSdkVersion\s*=\s*\d+', 'targetSdkVersion = 36', text)
          variables.write_text(text)

          gradle=root/'app/build.gradle'
          text=gradle.read_text()
          text=re.sub(r'versionCode\s*(?:=\s*)?\d+', 'versionCode 24001', text)
          text=re.sub(r'versionName\s*(?:=\s*)?["\'][^"\']+["\']', 'versionName "2.4.0"', text)
          text=re.sub(r'minifyEnabled\s*(?:=\s*)?false', 'minifyEnabled true', text)
          if re.search(r'shrinkResources\s*(?:=\s*)?false', text):
              text=re.sub(r'shrinkResources\s*(?:=\s*)?false', 'shrinkResources true', text)
          elif 'minifyEnabled true' in text and 'shrinkResources' not in text:
              text=text.replace('minifyEnabled true', 'minifyEnabled true\n            shrinkResources true', 1)
          gradle.write_text(text)

          manifest=root/'app/src/main/AndroidManifest.xml'
          text=manifest.read_text()
          if 'android.permission.POST_NOTIFICATIONS' not in text:
              m=re.search(r'<manifest\b[^>]*>',text,re.S)
              if not m: raise SystemExit('AndroidManifest root missing')
              text=text[:m.end()]+'\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS" />'+text[m.end():]
          if 'usesCleartextTraffic' not in text:
              text=text.replace('<application','<application android:usesCleartextTraffic="false"',1)
          manifest.write_text(text)
          PY

      - name: Generate branded Android assets
        run: |
          cd native-release
          npx capacitor-assets generate --android --iconBackgroundColor '#ffffff' --iconBackgroundColorDark '#ffffff' --splashBackgroundColor '#ffffff' --splashBackgroundColorDark '#ffffff'
          npx cap sync android

      - name: Validate native candidate
        shell: bash
        run: |
          set -euo pipefail
          cd native-release
          grep -R "applicationId.*com.omideno7.newhope7" android/app/build.gradle
          grep -R "versionCode.*24001" android/app/build.gradle
          grep -R 'versionName.*2.4.0' android/app/build.gradle
          grep -R 'compileSdkVersion = 36' android/variables.gradle
          grep -R 'targetSdkVersion = 36' android/variables.gradle
          grep -R 'minSdkVersion = 24' android/variables.gradle
          grep -R 'POST_NOTIFICATIONS' android/app/src/main/AndroidManifest.xml
          grep -R 'usesCleartextTraffic="false"' android/app/src/main/AndroidManifest.xml
          python3 - <<'PY'
          import xml.etree.ElementTree as ET
          ET.parse('android/app/src/main/AndroidManifest.xml')
          print('AndroidManifest XML OK')
          PY
          test -f android/app/src/main/assets/public/index.html
          test -f android/app/src/main/assets/public/js/nh7-settings-controller-v403.js
          test -f android/app/src/main/assets/public/js/nh7-delete-account-v253.js
          test -f android/app/src/main/assets/public/js/nh7-push-account-bind-v364.js
          test -f android/app/src/main/assets/public/js/nh7-audio-classic-v484.js
          test -f android/app/src/main/assets/public/js/nh7-audio-miniplayer-v487.js
          grep -q 'nh7-push-account-bind-v364.js?v=3.6.4' android/app/src/main/assets/public/index.html
          grep -q "window.NH7_VERSION = '2.4.0.0';" android/app/src/main/assets/public/index.html
          grep -q '"app":"2.4.0.0"' android/app/src/main/assets/public/version.json
          grep -q 'nativePushSubscription' android/app/src/main/assets/public/js/nh7-push-account-bind-v364.js
          grep -q 'navigator.mediaSession' android/app/src/main/assets/public/js/nh7-audio-classic-v484.js
          grep -q "!window.Capacitor?.isNativePlatform?.()" android/app/src/main/assets/public/index.html
          if grep -q 'cdn.onesignal.com/sdks/web/v16/OneSignalSDK.page.js' android/app/src/main/assets/public/index.html; then
            echo 'Web OneSignal SDK must not be active inside the Android native wrapper' >&2
            exit 1
          fi
          npm ls onesignal-cordova-plugin --depth=0
          grep -R -i -q 'onesignal' android/capacitor-cordova-android-plugins android/app android/capacitor.settings.gradle
          echo 'OneSignal native bridge detected'

      - name: Build optimized unsigned release AAB
        shell: bash
        run: |
          set -euo pipefail
          cd native-release/android
          chmod +x gradlew
          ./gradlew bundleRelease --stacktrace
          test -f app/build/outputs/bundle/release/app-release.aab
          cp app/build/outputs/bundle/release/app-release.aab ../../New_Hope_7_2.4.0_24001_API36_UNSIGNED.aab

      - name: Sign Play Store AAB when upload-key secrets are configured
        id: android_sign
        shell: bash
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ] || [ -z "${ANDROID_KEYSTORE_PASSWORD:-}" ] || [ -z "${ANDROID_KEY_ALIAS:-}" ] || [ -z "${ANDROID_KEY_PASSWORD:-}" ]; then
            echo "signed=false" >> "$GITHUB_OUTPUT"
            echo "Android signing secrets are not configured; keeping unsigned AAB plus full project."
            exit 0
          fi
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > upload-key.jks
          cp New_Hope_7_2.4.0_24001_API36_UNSIGNED.aab New_Hope_7_2.4.0_24001_API36_SIGNED.aab
          jarsigner -verbose -sigalg SHA256withRSA -digestalg SHA-256             -keystore upload-key.jks             -storepass "$ANDROID_KEYSTORE_PASSWORD"             -keypass "$ANDROID_KEY_PASSWORD"             New_Hope_7_2.4.0_24001_API36_SIGNED.aab "$ANDROID_KEY_ALIAS"
          jarsigner -verify -verbose -certs New_Hope_7_2.4.0_24001_API36_SIGNED.aab
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Build side-load QA APK with separate package
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          import re
          gradle=Path('native-release/android/app/build.gradle')
          text=gradle.read_text()
          if 'applicationIdSuffix ".qa"' not in text:
              m=re.search(r'buildTypes\s*\{',text)
              if not m: raise SystemExit('buildTypes block missing')
              debug='\n        debug {\n            applicationIdSuffix ".qa"\n            versionNameSuffix "-qa"\n        }\n'
              text=text[:m.end()]+debug+text[m.end():]
          gradle.write_text(text)
          strings=Path('native-release/android/app/src/main/res/values/strings.xml')
          s=strings.read_text()
          s=s.replace('>New Hope 7<','>New Hope 7 QA<')
          strings.write_text(s)
          PY
          cd native-release/android
          ./gradlew assembleDebug --stacktrace
          test -f app/build/outputs/apk/debug/app-debug.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging app/build/outputs/apk/debug/app-debug.apk | grep "package: name='com.omideno7.newhope7.qa'"
          cp app/build/outputs/apk/debug/app-debug.apk ../../New_Hope_7_2.4.0_24001_API36_QA_SEPARATE.apk

      - name: Produce release audit and project archive
        shell: bash
        run: |
          set -euo pipefail
          cd native-release
          {
            echo 'New Hope 7 Android Store Candidate 2.4.0'
            echo "Commit: $GITHUB_SHA"
            echo "Release package: $APP_ID"
            echo 'QA package: com.omideno7.newhope7.qa'
            echo "Version name: $VERSION_NAME"
            echo "Version code: $VERSION_CODE"
            echo 'Capacitor: 8.5.0'
            echo 'OneSignal Native: onesignal-cordova-plugin 5.5.3'
            echo 'compileSdk: 36'
            echo 'targetSdk: 36'
            echo 'minSdk: 24'
            echo 'Java: 21'
            echo 'R8/resource shrinking: enabled'
            echo 'Signing: unsigned base artifact; signed upload artifact is produced automatically when Android signing secrets are configured'
            echo
            npm ls --depth=0 || true
            echo
            ls -lh ../New_Hope_7_2.4.0_24001_API36_UNSIGNED.aab ../New_Hope_7_2.4.0_24001_API36_QA_SEPARATE.apk
            [ ! -f ../New_Hope_7_2.4.0_24001_API36_SIGNED.aab ] || ls -lh ../New_Hope_7_2.4.0_24001_API36_SIGNED.aab
            echo
            sha256sum ../New_Hope_7_2.4.0_24001_API36_UNSIGNED.aab ../New_Hope_7_2.4.0_24001_API36_QA_SEPARATE.apk
            [ ! -f ../New_Hope_7_2.4.0_24001_API36_SIGNED.aab ] || sha256sum ../New_Hope_7_2.4.0_24001_API36_SIGNED.aab
          } > ANDROID_RELEASE_AUDIT.txt
          rm -rf android/.gradle android/app/build android/build node_modules
          zip -qr ../New_Hope_7_Android_API36_Project.zip . -x '*.DS_Store'

      - uses: actions/upload-artifact@v4
        name: Upload AAB candidate
        with:
          name: New_Hope_7_2.4.0_UNSIGNED_AAB
          path: New_Hope_7_2.4.0_24001_API36_UNSIGNED.aab
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@v4
        name: Upload QA APK
        with:
          name: New_Hope_7_2.4.0_QA_SEPARATE_APK
          path: New_Hope_7_2.4.0_24001_API36_QA_SEPARATE.apk
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@v4
        if: steps.android_sign.outputs.signed == 'true'
        name: Upload signed Play Store AAB
        with:
          name: New_Hope_7_2.4.0_SIGNED_PLAY_AAB
          path: New_Hope_7_2.4.0_24001_API36_SIGNED.aab
          if-no-files-found: error
          retention-days: 14

      - uses: actions/upload-artifact@v4
        name: Upload Android project and audit
        with:
          name: New_Hope_7_2.4.0_Android_Project
          path: |
            New_Hope_7_Android_API36_Project.zip
            native-release/ANDROID_RELEASE_AUDIT.txt
          if-no-files-found: error
          retention-days: 14
