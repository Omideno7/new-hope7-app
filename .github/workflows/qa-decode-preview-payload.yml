name: QA decode preview payload
on:
  push:
    branches:
      - qa/hybrid-final-20260912
    paths:
      - '.github/workflows/qa-decode-preview-payload.yml'
      - 'qa-payload/pre.txt'
permissions:
  contents: write
jobs:
  decode:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: qa/hybrid-final-20260912
      - name: Decode QA payload
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          import base64, gzip, hashlib, re
          src=Path('qa-payload/pre.txt').read_text(encoding='utf-8').strip()
          src=re.sub(r'\s+','',src)
          src += '=' * (-len(src) % 4)
          raw=base64.b64decode(src)
          out=gzip.decompress(raw)
          Path('qa-payload/pre.decoded').write_bytes(out)
          Path('qa-payload/pre-decoded-info.txt').write_text(
              f'encoded_chars={len(src)}\ncompressed_bytes={len(raw)}\nbytes={len(out)}\nsha256={hashlib.sha256(out).hexdigest()}\nprefix={out[:120]!r}\n',
              encoding='utf-8'
          )
          print('decoded bytes',len(out))
          print(out[:200])
          PY
      - name: Commit decoded QA payload
        shell: bash
        run: |
          git config user.name 'nh7-qa-bot'
          git config user.email 'actions@users.noreply.github.com'
          git add qa-payload/pre.decoded qa-payload/pre-decoded-info.txt
          git commit -m 'QA: decode stored preview payload' || exit 0
          git push origin HEAD:qa/hybrid-final-20260912
