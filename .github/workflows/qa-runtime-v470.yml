name: Runtime Speed Theme v470 QA

on:
  push:
    branches:
      - feature/runtime-speed-theme-v470-20260919
  workflow_dispatch:

permissions:
  contents: read

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout exact feature commit
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Validate scoped runtime diff
        shell: bash
        run: |
          set -euo pipefail
          git diff --name-only 0152649b3d557664c23e7b0c4251db19d455a40b...HEAD > /tmp/changed
          cat /tmp/changed
          allowed='^(js/app\.js|css/nh7-theme-gallery-v457\.css|index\.html|service-worker\.js|sw-release-core-v403\.js|\.github/workflows/qa-runtime-v470\.yml)$'
          bad=$(grep -Ev "$allowed" /tmp/changed || true)
          test -z "$bad"
          ! grep -Eq '(^|/)(theme-preview|preview|test-data|fixtures)(/|\.|$)' /tmp/changed

      - name: Validate JavaScript and cache wiring
        shell: bash
        run: |
          set -euo pipefail
          node --check --input-type=module < js/app.js
          node --check service-worker.js
          node --check sw-release-core-v403.js
          grep -q "NH7_FAST_CLOUD_TIMEOUT_V470=5000" js/app.js
          grep -q "NH7_AUDIO_CATALOG_PERSIST_V470" js/app.js
          grep -q "NH7_QNA_PUBLIC_CACHE_V470" js/app.js
          grep -q "const fetchFresh=()=>Promise.all" js/app.js
          grep -q "Promise.allSettled" js/app.js
          grep -q "nh7TimedCloudFetchV470" js/app.js
          grep -q "service-worker.js?v=4.7.0" index.html
          grep -q "js/app.js?v=4.7.0" index.html
          grep -q "css/nh7-theme-gallery-v457.css?v=4.7.0" index.html
          grep -q "sw-release-core-v403.js?v=4.7.0" service-worker.js
          grep -q "nh7-release-core-v470-runtime-speed-theme" sw-release-core-v403.js
          grep -q "'./js/app.js'" sw-release-core-v403.js
          grep -q "'./css/nh7-theme-gallery-v457.css'" sw-release-core-v403.js

      - name: Validate theme surfaces and all 14 contrast pairs
        shell: bash
        run: |
          set -euo pipefail
          node <<'NODE'
          const fs=require('fs');
          const theme=fs.readFileSync('js/nh7-theme-studio-v453.js','utf8');
          const css=fs.readFileSync('css/nh7-theme-gallery-v457.css','utf8');
          const presets={};
          let m;
          const a=/\b([a-z]+):\{bg:'(#[0-9a-f]{6})',card:'(#[0-9a-f]{6})',text:'(#[0-9a-f]{6})',muted:'(#[0-9a-f]{6})',verse:'(#[0-9a-f]{6})',accent:'(#[0-9a-f]{6})'\}/gi;
          while((m=a.exec(theme)))presets[m[1]]={bg:m[2],card:m[3],text:m[4],accent:m[7]};
          const b=/"([a-z]+)":\{"bg":"(#[0-9a-f]{6})","card":"(#[0-9a-f]{6})","text":"(#[0-9a-f]{6})","muted":"(#[0-9a-f]{6})","verse":"(#[0-9a-f]{6})","accent":"(#[0-9a-f]{6})"\}/gi;
          while((m=b.exec(theme)))presets[m[1]]={bg:m[2],card:m[3],text:m[4],accent:m[7]};
          if(Object.keys(presets).length!==14)throw new Error('Expected 14 themes');
          const rgb=h=>[1,3,5].map(i=>parseInt(h.slice(i,i+2),16));
          const lum=h=>rgb(h).map(v=>v/255).map(x=>x<=.04045?x/12.92:((x+.055)/1.055)**2.4).reduce((s,v,i)=>s+v*[.2126,.7152,.0722][i],0);
          const contrast=(x,y)=>{const a=lum(x),b=lum(y);return (Math.max(a,b)+.05)/(Math.min(a,b)+.05)};
          const ink=bg=>contrast('#ffffff',bg)>contrast('#000000',bg)?'#ffffff':'#000000';
          const mix=(a,b,p)=>{const A=rgb(a),B=rgb(b),C=A.map((v,i)=>Math.round(v*p+B[i]*(1-p)));return '#'+C.map(v=>v.toString(16).padStart(2,'0')).join('')};
          let mins={normal:99,active:99,open:99};
          for(const [id,p] of Object.entries(presets)){
            const normal=contrast(p.text,p.card);
            const active=contrast(ink(p.accent),p.accent);
            const open=contrast(p.text,mix(p.accent,p.card,.10));
            mins.normal=Math.min(mins.normal,normal);mins.active=Math.min(mins.active,active);mins.open=Math.min(mins.open,open);
            if(normal<4.5||active<4.5||open<4.5)throw new Error(id+' contrast failed');
          }
          for(const required of [
            'html[data-nh7-studio] #view .tab{',
            'html[data-nh7-studio] #view .tab.active{',
            '.nh7-audio-row-copy-v445 strong',
            '#view .sermon-placeholder',
            '#view .sermon-card'
          ]) if(!css.includes(required))throw new Error('Missing themed surface '+required);
          console.log('14-theme contrast OK',mins);
          NODE

      - name: Validate protected storage and backend scope untouched
        shell: bash
        run: |
          set -euo pipefail
          diff=$(git diff 0152649b3d557664c23e7b0c4251db19d455a40b...HEAD -- js/app.js)
          ! printf '%s\n' "$diff" | grep '^+' | grep -Eq 'service_role|SUPABASE_CONFIG\.(url|key)[[:space:]]*=|localStorage\.clear\(|sessionStorage\.clear\('
          ! git diff --name-only 0152649b3d557664c23e7b0c4251db19d455a40b...HEAD | grep -Eq '^(supabase/|data/|assets/|admin)'
          echo "Protected-data scope OK"
