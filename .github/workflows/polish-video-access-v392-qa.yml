name: Polish Video Access v392 QA

on:
  push:
    branches: [release/final-qa-video-access-v392]

permissions:
  contents: write

jobs:
  polish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: release/final-qa-video-access-v392
      - shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path
          p=Path('js/admin-v2.3.9-video-access-v392.js')
          s=p.read_text(encoding='utf-8')
          old="const row=rows[index];if(!row)return;card.querySelector('.nh7-v392-meta')?.remove();"
          new="const row=rows[index];if(!row)return;const legacyMeta=card.querySelector('.req-meta');if(legacyMeta)legacyMeta.textContent=row.bound_user_email||row.target_email||L('هنوز استفاده نشده','Unused','Nije korišteno');card.querySelector('.nh7-v392-meta')?.remove();"
          if old not in s and new not in s: raise SystemExit('admin code-card marker missing')
          s=s.replace(old,new,1)
          p.write_text(s,encoding='utf-8')

          p=Path('js/nh7-secure-media-v270.js')
          s=p.read_text(encoding='utf-8')
          old="['invalid_code','expired','grant_revoked','device_bound_elsewhere','portal_login_required'].includes(String(error.code||''))"
          new="['invalid_code','expired','grant_revoked','device_bound_elsewhere','portal_login_required','code_not_for_account'].includes(String(error.code||''))"
          if old in s: s=s.replace(old,new,1)
          elif new not in s: raise SystemExit('client playback guard marker missing')
          p.write_text(s,encoding='utf-8')
          PY
          node --check js/admin-v2.3.9-video-access-v392.js
          node --check js/nh7-secure-media-v270.js
          grep -q "bound_user_email||row.target_email" js/admin-v2.3.9-video-access-v392.js
          grep -q "portal_login_required','code_not_for_account" js/nh7-secure-media-v270.js
          if git diff --quiet; then exit 0; fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add js/admin-v2.3.9-video-access-v392.js js/nh7-secure-media-v270.js
          git commit -m 'fix(qa): polish video account and device status'
          git push origin HEAD:release/final-qa-video-access-v392
