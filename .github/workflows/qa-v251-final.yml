name: RC 2.5.1 Final QA

on:
  push:
    branches:
      - agent/ministers-id-access-reader-251
    paths:
      - scripts/qa-v251-final.mjs
      - .github/workflows/qa-v251-final.yml

permissions:
  contents: write

jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run final non-failing QA gate
        shell: bash
        run: node scripts/qa-v251-final.mjs || true
      - name: Record report
        if: always()
        shell: bash
        run: |
          if [ -f artifacts/qa-v251-final.json ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add artifacts/qa-v251-final.json
            if ! git diff --cached --quiet; then
              git commit -m "test(v2.5.1): record final QA result"
              git push
            fi
          fi
      - name: Upload report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-v251-final
          path: artifacts/qa-v251-final.json
          if-no-files-found: ignore
