<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>New Hope 7 — Stage 1 Direct Test</title>
  <style>
    html,body{margin:0;min-height:100%;background:#eef8f7;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif}
    .loading{min-height:100dvh;display:grid;place-items:center;padding:24px;text-align:center;color:#0f766e;font-weight:900}
  </style>
</head>
<body>
  <div class="loading">در حال بارگذاری نسخه آزمایشی مستقیم مرحله ۱…</div>
  <script>
    (async()=>{
      try{
        const response=await fetch('admin.html?stage1-direct=2.3.4',{cache:'no-store'});
        if(!response.ok)throw new Error('HTTP '+response.status);
        let html=await response.text();
        const injected=`
          <style>
            .nh7-stage1-badge-v234{position:fixed;left:8px;bottom:8px;z-index:2147483647;background:#0f766e;color:#fff;border:2px solid #fff;border-radius:999px;padding:6px 10px;font:800 11px system-ui;box-shadow:0 6px 18px rgba(0,0,0,.2);pointer-events:none}
          </style>
          <div class="nh7-stage1-badge-v234">Stage 1 · v2.3.4</div>
          <script src="js/admin-stage1-student-scroll.js?v=2.3.4-bounded"><\/script>`;
        html=html.replace(/<\/body>\s*<\/html>\s*$/i,injected+'\n</body>\n</html>');
        document.open();
        document.write(html);
        document.close();
      }catch(error){
        document.body.innerHTML='<div class="loading">خطا در بارگذاری نسخه آزمایشی: '+String(error.message||error)+'</div>';
      }
    })();
  </script>
</body>
</html>
