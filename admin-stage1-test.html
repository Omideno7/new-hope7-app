<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <title>New Hope 7 — Stage 1 Test</title>
  <style>
    html,body{margin:0;height:100%;overflow:hidden;background:#0f766e;font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Tahoma,Arial,sans-serif}
    .bar{height:44px;display:flex;align-items:center;justify-content:center;padding-top:env(safe-area-inset-top);background:#0f766e;color:#fff;font-size:13px;font-weight:800;box-sizing:content-box}
    iframe{display:block;width:100%;height:calc(100% - 44px - env(safe-area-inset-top));border:0;background:#fff}
  </style>
</head>
<body>
  <div class="bar">نسخه آزمایشی مرحله ۱ — فقط اصلاح اسکرول پروفایل دانشجو</div>
  <iframe id="adminFrame" src="admin.html?stage1-test=2.3.1"></iframe>
  <script>
    const frame=document.getElementById('adminFrame');
    frame.addEventListener('load',()=>{
      try{
        const d=frame.contentDocument;
        if(!d||d.getElementById('nh7-stage1-test-script'))return;
        const s=d.createElement('script');
        s.id='nh7-stage1-test-script';
        s.src='js/admin-stage1-student-scroll.js?v=2.3.1-stage1';
        d.body.appendChild(s);
      }catch(e){console.error('Stage 1 patch injection failed',e);}
    });
  </script>
</body>
</html>
