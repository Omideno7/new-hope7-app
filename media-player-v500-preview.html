<body>
<header class="preview-top"><button class="round" aria-label="Back">‹</button><strong>پیام‌های صوتی</strong><button class="round" id="themeBtn" aria-label="Theme">◐</button></header>

<main class="wrap">
  <section class="hero" id="hero">
    <img class="hero-logo" src="./assets/new-hope7-logo-512.png" alt="New Hope 7">
    <div class="hero-copy">
      <span class="eyebrow">NEW HOPE 7 AUDIO</span>
      <h1 id="heroTitle">همهٔ پیام‌ها</h1>
      <p>موعظه‌ها، مجموعه‌های آموزشی و پیام‌های صوتی کلیسا در یک کتابخانهٔ سریع و ساده.</p>
      <div class="hero-actions"><button class="play" id="playVisible">▶ پخش</button><button class="shuffle" id="shuffleVisible">⤨ تصادفی</button></div>
    </div>
  </section>

  <label class="search">⌕ <input id="searchInput" placeholder="جستجو در موعظه‌ها و پیام‌های صوتی"></label>
  <div class="chips" id="chips"></div>

    <div class="section-head"><strong>ادامهٔ شنیدن</strong><small>از همان‌جایی که مانده بودی</small></div>

  <section class="section" id="favoritesSection">

    <div class="shelf" id="favoritesShelf"></div>
  </section>

  <section class="section" id="recentSection">
    <div class="section-head"><strong>اخیراً پخش‌شده</strong><small>دسترسی سریع</small></div>
    <div class="shelf" id="recentShelf"></div>
  </section>

  <section class="section">
    <div class="section-head"><strong>پیام‌ها</strong><small id="itemCount"></small></div>
    <div class="sermon-list" id="sermonList"></div>
  </section>
</main>

<nav class="bottom-nav"><span><b>⌂</b>خانه</span><span><b>☀</b>روزانه</span><span><b>📖</b>کتاب مقدس</span><span><b>✓</b>برنامه‌ها</span><span><b>🎓</b>مدرسه</span><span class="active"><b>☰</b>بیشتر</span></nav>

<script>
localStorage.setItem('nh7_lang','fa');document.documentElement.lang='fa';document.documentElement.dir='rtl';

  return 'data:image/svg+xml;charset=UTF-8,'+encodeURIComponent(svg);
}
var items=[
{id:'11111111-1111-4111-8111-111111111111',category_id:'prayer',title_fa:'قدرت دعا و مشارکت کلیسا',title_en:'The Power of Prayer',speaker:'یوحنای رسول',duration_seconds:3120,cover_url:art('#0d5961','#071e2b','PRAYER')},
{id:'22222222-2222-4222-8222-222222222222',category_id:'spirit',title_fa:'راه‌حل نهایی: روح‌القدس',title_en:'The Final Solution: Holy Spirit',speaker:'یوحنای رسول',duration_seconds:2860,cover_url:art('#6a2b91','#151937','SPIRIT')},
{id:'33333333-3333-4333-8333-333333333333',category_id:'faith',title_fa:'ایمان به خدا در عمل آشکار می‌شود',title_en:'Faith Revealed in Action',speaker:'یوحنای رسول',duration_seconds:3540,cover_url:art('#be5a1f','#391c1d','FAITH')},
{id:'44444444-4444-4444-8444-444444444444',category_id:'grace',title_fa:'آثار فیض',title_en:'The Effects of Grace',speaker:'یوحنای رسول',duration_seconds:2760,cover_url:art('#1761a7','#09253b','GRACE')},
{id:'55555555-5555-4555-8555-555555555555',category_id:'kingdom',title_fa:'اقتدار ایماندار در پادشاهی',title_en:'The Believer Authority',speaker:'یوحنای رسول',duration_seconds:3260,cover_url:art('#8b314d','#2c1320','AUTHORITY')},
{id:'66666666-6666-4666-8666-666666666666',category_id:'faith',title_fa:'ایمان، امید و محبت',title_en:'Faith, Hope and Love',speaker:'یوحنای رسول',duration_seconds:2440,cover_url:art('#297b6c','#102a2a','LOVE')},
{id:'77777777-7777-4777-8777-777777777777',category_id:'spirit',title_fa:'مسح و جلال خدا',title_en:'Anointing and the Glory of God',speaker:'یوحنای رسول',duration_seconds:2980,cover_url:art('#9b7120','#362810','GLORY')},
{id:'88888888-8888-4888-8888-888888888888',category_id:'prayer',title_fa:'دعای غالب',title_en:'Prevailing Prayer',speaker:'یوحنای رسول',duration_seconds:3380,cover_url:art('#3152a6','#111b3a','PRAYER')}
];
var categories=[['all','همه'],['prayer','دعا'],['spirit','روح‌القدس'],['faith','ایمان'],['grace','فیض'],['kingdom','پادشاهی']];
var currentCategory='all',favorites=new Set([items[1].id,items[3].id]),recent=[items[2].id,items[0].id],progress={},liked=new Set([items[0].id,items[2].id]),likeCounts={};likeCounts[items[0].id]=24;likeCounts[items[1].id]=11;likeCounts[items[2].id]=37;likeCounts[items[3].id]=18;
progress[items[0].id]={time:842,duration:items[0].duration_seconds};
progress[items[2].id]={time:1430,duration:items[2].duration_seconds};
window.__sermonMap=Object.fromEntries(items.map(function(x){return [x.id,x]}));
var queue=items.slice(),queueIndex=0;
var audio={src:'preview:'+items[0].id,currentTime:842,duration:items[0].duration_seconds,paused:true,playbackRate:1,volume:.82,muted:false,play:function(){this.paused=false;return Promise.resolve()},pause:function(){this.paused=true}};
var current=items[0];

function playItem(item){if(!item)return;current=item;queueIndex=Math.max(0,queue.findIndex(function(x){return x.id===item.id}));audio.src='preview:'+item.id;audio.currentTime=(progress[item.id]||{}).time||0;audio.duration=item.duration_seconds;audio.paused=false;recent=[item.id].concat(recent.filter(function(x){return x!==item.id})).slice(0,6);renderShelves();window.NH7_MEDIA_PLAYER_V500&&window.NH7_MEDIA_PLAYER_V500.sync()}
window.NH7_AUDIO_CLASSIC_V400={
 getState:function(){return {current:current,audio:audio,playQueue:queue,queueIndex:queueIndex,volumeControlSupported:true}},
 playItem:function(item){playItem(item)},
 playNextTrack:function(){if(queue[queueIndex+1])playItem(queue[queueIndex+1])},
 playPreviousTrack:function(){if(audio.currentTime>5){audio.currentTime=0}else if(queue[queueIndex-1])playItem(queue[queueIndex-1])},
 setPlaybackSpeed:function(v){audio.playbackRate=Number(v)||1},
 setMediaVolume:function(v){audio.volume=Number(v);audio.muted=false},

};
window.NH7_AUDIO_MINIPLAYER_V487={close:function(){audio.pause();audio.src='';window.NH7_MEDIA_PLAYER_V500&&window.NH7_MEDIA_PLAYER_V500.sync()}};
window.NH7_SERMON_SOCIAL_REFRESH_CARD=function(){};

 var cont=items.filter(function(x){return progress[x.id]&&progress[x.id].time>5});

function render(){renderChips();renderList();renderShelves();document.getElementById('heroTitle').textContent=(categories.find(function(c){return c[0]===currentCategory})||categories[0])[1]+' — پیام‌های صوتی'}
function showToast(t){var n=document.getElementById('toast');n.textContent=t;n.classList.add('show');clearTimeout(window.__toastT);window.__toastT=setTimeout(function(){n.classList.remove('show')},1400)}
function showModal(title,text,note){document.getElementById('modalTitle').textContent=title;document.getElementById('modalText').textContent=text||'';document.getElementById('modalNote').hidden=!note;document.getElementById('simpleModal').hidden=false}
document.addEventListener('click',function(e){
 var socialLike=e.target.closest('[data-nh7-social-v440] [data-like]');if(socialLike){var card=socialLike.closest('[data-sermon-card]'),id=card&&card.dataset.sermonCard;if(id){var was=liked.has(id);was?liked.delete(id):liked.add(id);likeCounts[id]=Math.max(0,Number(likeCounts[id]||0)+(was?-1:1));socialLike.classList.toggle('on',!was);socialLike.innerHTML=(!was?'♥':'♡')+' <span>'+likeCounts[id]+'</span>';window.NH7_MEDIA_PLAYER_V500&&window.NH7_MEDIA_PLAYER_V500.sync()}return}
 var socialBless=e.target.closest('[data-nh7-social-v440] [data-bless]');if(socialBless){var compose=socialBless.closest('[data-nh7-social-v440]').querySelector('[data-compose]');compose&&compose.classList.toggle('open');return}
 var c=e.target.closest('[data-cat]');if(c){currentCategory=c.dataset.cat;render();return}
 var p=e.target.closest('[data-play]');if(p){playItem(window.__sermonMap[p.dataset.play]);return}
 var f=e.target.closest('[data-fav]');if(f){favorites.has(f.dataset.fav)?favorites.delete(f.dataset.fav):favorites.add(f.dataset.fav);render();return}
 var m=e.target.closest('[data-more]');if(m){e.target.closest('.sermon-card').classList.toggle('open');return}
 var n=e.target.closest('[data-note]');if(n){showModal('یادداشت موعظه',window.__sermonMap[n.dataset.note].title_fa,true);return}
 var d=e.target.closest('[data-download]');if(d){showToast('برای استفادهٔ آفلاین ذخیره شد');return}
 var s=e.target.closest('[data-share]');if(s){showToast('لینک اشتراک آماده شد');return}
});
document.getElementById('searchInput').addEventListener('input',renderList);
document.getElementById('playVisible').onclick=function(){var v=visibleItems();if(v[0])playItem(v[0])};
document.getElementById('shuffleVisible').onclick=function(){var v=visibleItems();if(v.length)playItem(v[Math.floor(Math.random()*v.length)])};
document.getElementById('modalClose').onclick=function(){document.getElementById('simpleModal').hidden=true};
var demoThemes=[['','NH7 Ocean'],['titanium','Natural Titanium'],['ice','Ice Blue'],['mint','Mint']];
var demoThemeIndex=0;document.getElementById('themeBtn').onclick=function(){demoThemeIndex=(demoThemeIndex+1)%demoThemes.length;var t=demoThemes[demoThemeIndex];if(t[0])document.documentElement.dataset.demoTheme=t[0];else delete document.documentElement.dataset.demoTheme;showToast('تم: '+t[1]);window.NH7_MEDIA_PLAYER_V500&&window.NH7_MEDIA_PLAYER_V500.sync()};
render();
setInterval(function(){if(!audio.paused&&audio.src){audio.currentTime=Math.min(audio.duration,audio.currentTime+1);progress[current.id]={time:audio.currentTime,duration:audio.duration};window.NH7_MEDIA_PLAYER_V500&&window.NH7_MEDIA_PLAYER_V500.sync()}},1000);
</script>

<script src="./js/nh7-media-player-v500.js"></script>

<script>
function decorateFullPlayer(){
 var r=document.querySelector('.nh7p500');if(!r){setTimeout(decorateFullPlayer,80);return}
 if(r.dataset.previewDecorated==='1')return;r.dataset.previewDecorated='1';
 var tools=r.querySelector('.nh7p500-tools');
 if(tools){tools.insertAdjacentHTML('beforeend','<button class="preview-extra-tool" data-xfav><span>☆</span><small>علاقه‌مندی</small></button><button class="preview-extra-tool" data-xnote><span>📝</span><small>یادداشت</small></button><button class="preview-extra-tool" data-xdownload><span>⇩</span><small>دانلود</small></button><button class="preview-extra-tool" data-xshare><span>↗</span><small>اشتراک</small></button><button class="preview-extra-tool" data-xqueue><span>☷</span><small>صف پخش</small></button>');tools.insertAdjacentHTML('afterend','<div class="preview-queue" data-xqueue-panel hidden><strong>بعدی‌ها</strong><div class="preview-queue-list" data-xqueue-list></div></div><section class="preview-related"><h3>مرتبط و پیشنهادی</h3><div class="preview-related-strip" data-xrelated></div></section>')}
 function syncExtras(){
  var fav=r.querySelector('[data-xfav] span');if(fav)fav.textContent=favorites.has(current.id)?'★':'☆';
  var q=r.querySelector('[data-xqueue-list]');if(q)q.innerHTML=queue.slice(queueIndex,queueIndex+5).map(function(x){return '<button class="preview-queue-item" data-play="'+x.id+'"><img src="'+x.cover_url+'"><b>'+x.title_fa+'</b></button>'}).join('');
  var rel=r.querySelector('[data-xrelated]');if(rel){var a=items.filter(function(x){return x.id!==current.id&&(x.category_id===current.category_id)});if(!a.length)a=items.filter(function(x){return x.id!==current.id});rel.innerHTML=a.slice(0,5).map(function(x){return '<button class="preview-related-card" data-play="'+x.id+'"><img src="'+x.cover_url+'"><b>'+x.title_fa+'</b></button>'}).join('')}
 }
 r.addEventListener('click',function(e){
  if(e.target.closest('[data-xfav]')){favorites.has(current.id)?favorites.delete(current.id):favorites.add(current.id);render();syncExtras();return}
  if(e.target.closest('[data-xnote]')){showModal('یادداشت موعظه',current.title_fa,true);return}
  if(e.target.closest('[data-xdownload]')){showToast('برای استفادهٔ آفلاین ذخیره شد');return}
  if(e.target.closest('[data-xshare]')){showToast('لینک اشتراک آماده شد');return}
  if(e.target.closest('[data-xqueue]')){var p=r.querySelector('[data-xqueue-panel]');p.hidden=!p.hidden;return}
 });
 setInterval(syncExtras,650);syncExtras();
}
document.readyState==='loading'?document.addEventListener('DOMContentLoaded',function(){setTimeout(decorateFullPlayer,20)}):setTimeout(decorateFullPlayer,20);
</script>
