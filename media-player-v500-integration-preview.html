  <script>
    // Branch-only SAFE INTEGRATION TEST.
    // Read/playback requests are allowed; known Production writes are intercepted.
    window.NH7_PLAYER_TEST_MODE = true;
    window.NH7_CANONICAL_SETTINGS = true;
    window.NH7_VERSION = '2.3.9.50-player-v500-safe-test';
    window.NH7_BASE_PATH = new URL('.', window.location.href).pathname;

    (function(){
      var nativeFetch = window.fetch.bind(window);
      var blocked = [
        '/rest/v1/rpc/nh7_sermon_toggle_like_v440',
        '/rest/v1/rpc/nh7_sermon_add_blessing_v440',
        '/rest/v1/rpc/nh7_sermon_delete_blessing_v440',
        '/rest/v1/rpc/nh7_track_app_section_v222',
        '/rest/v1/rpc/nh7_track_app_section_v221',
        '/rest/v1/rpc/nh7_school_record_audio_v380'
      ];
      function fake(url,init){
        var body='{}';
        if(String(url).includes('nh7_sermon_toggle_like_v440')){
          var sid='';try{sid=String(JSON.parse((init&&init.body)||'{}').p_sermon_id||'')}catch(_){}
          var card=sid?document.querySelector('[data-sermon-card="'+sid.replace(/"/g,'\\\"')+'"]'):null;
          var btn=card&&card.querySelector('[data-nh7-social-v440] [data-like]');
          var oldCount=Number(btn&&btn.querySelector('span')&&btn.querySelector('span').textContent||0);
          var oldLiked=!!(btn&&btn.classList.contains('on'));
          var nextLiked=!oldLiked,nextCount=Math.max(0,oldCount+(nextLiked?1:-1));
          body=JSON.stringify({liked:nextLiked,like_count:nextCount});
        }
        return new Response(body,{status:200,headers:{'Content-Type':'application/json','X-NH7-Test-Mode':'blocked-write'}});
      }
      window.fetch=function(input,init){
        var url=typeof input==='string'?input:(input&&input.url)||'';
        var method=String((init&&init.method)||(input&&input.method)||'GET').toUpperCase();
        if(method!=='GET' && blocked.some(function(x){return String(url).includes(x)})){
          console.info('[NH7 SAFE TEST] blocked Production write:',method,url);
          return Promise.resolve(fake(url,init));
        }
        return nativeFetch(input,init);
      };
      document.addEventListener('click',function(e){
        var submit=e.target&&e.target.closest&&e.target.closest('[data-nh7-social-v440] [data-submit]');
        if(!submit)return;
        e.preventDefault();e.stopImmediatePropagation();
        var status=submit.closest('[data-nh7-social-v440]')?.querySelector('[data-status]');
        if(status)status.textContent='SAFE TEST: Blessing submission is disabled here; Production data is unchanged.';
      },true);
    }());
  </script>
