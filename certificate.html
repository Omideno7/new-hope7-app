<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

  <link rel="icon" href="assets/logo.png">
  <link rel="stylesheet" href="css/styles.css">

  <link rel="stylesheet" href="css/v2.2.2.css?v=2.2.2">
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js" defer></script>
  <style>
    body{margin:0;background:#edf4f7;color:#10233e}.public-doc-shell{max-width:1280px;margin:18px auto;padding:12px}.public-doc-actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:14px}.public-doc-actions button{border:0;border-radius:14px;padding:12px 18px;background:#0b5faa;color:#fff;font:inherit;font-weight:800}.public-doc-message{max-width:720px;margin:48px auto;padding:24px;text-align:center;background:#fff;border-radius:24px;box-shadow:0 14px 40px rgba(16,35,62,.1)}.public-doc-status{text-align:center;margin:8px}.document-status{display:inline-flex;padding:8px 15px;border-radius:999px;font-weight:800}.document-status.valid{background:#dcfce7;color:#166534}.document-status.revoked{background:#fee2e2;color:#991b1b}.public-integrity{max-width:850px;margin:12px auto;background:#fff;border:1px solid #d7e4ec;border-radius:18px;padding:12px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;font-size:.82rem}.public-integrity div{padding:8px;background:#f7fafc;border-radius:12px;word-break:break-word}.revoked-watermark{position:absolute;inset:42% 0 auto;transform:rotate(-18deg);font-size:clamp(42px,8vw,100px);font-weight:900;color:rgba(180,20,20,.18);z-index:5;pointer-events:none}@media(max-width:700px){.public-integrity{grid-template-columns:1fr}}@media print{.public-doc-shell{max-width:none;margin:0;padding:0}.public-doc-actions,.public-doc-status,.public-integrity{display:none!important}}
  </style>

</head>
<body><button class="nh7-certificate-back" onclick="if(history.length>1){history.back()}else{location.href='admin.html'}">‹ Back / برگشت</button>
<main id="app" class="public-doc-message">در حال دریافت مدرک…</main>
<script>
(()=>{'use strict';
const S='https://gpzcwffxnddhaeaogdyo.supabase.co',K='sb_publishable_v3xXEaJ5Fml7-te1mI4-0g_7R86oM37',token=new URL(location.href).searchParams.get('token')||'',app=document.getElementById('app');
const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const label=(fa,en,hr,l)=>l==='fa'?fa:l==='hr'?hr:en;
const n=v=>Number(v||0);
async function rpc(){const r=await fetch(`${S}/rest/v1/rpc/nh7_public_document_lookup_v222`,{method:'POST',headers:{apikey:K,Authorization:`Bearer ${K}`,'Content-Type':'application/json'},body:JSON.stringify({p_token:token})}),t=await r.text();if(!r.ok)throw new Error(t);return JSON.parse(t)}
function textStyle(s,def){s=Object.assign({},def||{},s||{});return `font-family:${esc(s.font||'inherit')};font-size:${n(s.size)||16}px;font-weight:${s.bold?700:400};font-style:${s.italic?'italic':'normal'};text-decoration:${s.underline?'underline':'none'};text-align:${esc(s.align||'center')}`}
function canvas(d){
  const l=d.language||'fa',rtl=l==='fa',design=d.design||{},styles=Object.assign({title:{font:'Cinzel',size:38,bold:true,align:'center'},designation:{font:'Cormorant Garamond',size:19,italic:true,align:'center'},name:{font:'EB Garamond',size:36,bold:true,align:'center'},body:{font:'Libre Baskerville',size:16,align:'center'},fields:{font:'Vazirmatn',size:12,align:'start'},meta:{font:'Vazirmatn',size:9,align:'center'}},design.styles||{}),church=Object.assign({name:'NEW HOPE 7 CHURCH',address:'',email:'',phone:'',website:''},d.church_info||{},design.church||{}),photo=Object.assign({x:50,y:50,zoom:1},design.photo||{},d.photo_position||{}),logo=d.logo_url||design.logoUrl||'assets/logo.png',photoUrl=d.photo_url||design.photoUrl||'',signature=d.signature_url||design.signatureUrl||'',theme=d.theme_code||design.theme||'ornate_baptism',layout=d.layout||design.layout||'landscape';
  const title=d['title_'+l]||d.title_en||d.title_fa||'',designation=d['designation_'+l]||'',body=d['body_'+l]||d.body_en||d.body_fa||'',contact=[church.address,church.email,church.phone,church.website].filter(Boolean).join(' · '),fields=[];
  if(d.issue_date)fields.push(`${label('تاریخ صدور','Issue date','Datum izdavanja',l)}: ${d.issue_date}`);if(d.place)fields.push(`${label('محل','Place','Mjesto',l)}: ${d.place}`);if(d.minister)fields.push(`${label('خادم','Minister','Služitelj',l)}: ${d.minister}`);if(d.witness)fields.push(`${label('شاهد','Witness','Svjedok',l)}: ${d.witness}`);(d.custom_fields||[]).forEach(f=>fields.push(`${f['label_'+l]||f.label_en||f.label_fa||''}: ${f.value||''}`));
  return `<div class="document-sheet v222 layout-${esc(layout)} theme-${esc(theme)}" dir="${rtl?'rtl':'ltr'}" style="--doc-photo-x:${n(photo.x)||50}%;--doc-photo-y:${n(photo.y)||50}%;--doc-photo-zoom:${n(photo.zoom)||1};--doc-watermark-opacity:${Number(design.watermarkOpacity??.045)}">${d.status==='revoked'?`<div class="revoked-watermark">${esc(label('باطل‌شده','REVOKED','PONIŠTENO',l))}</div>`:''}<div class="doc-watermark" style="background-image:url('${esc(logo)}')"></div><div class="doc-ornament-top"></div><div class="doc-ornament-bottom"></div><header class="doc-v222-header">${photoUrl?`<div class="doc-v222-photo-wrap"><img class="doc-v222-photo" crossorigin="anonymous" src="${esc(photoUrl)}" alt="photo"></div>`:'<div></div>'}<div class="doc-v222-church"><img class="doc-v222-logo" crossorigin="anonymous" src="${esc(logo)}" alt="logo"><strong>${esc(church.name||'NEW HOPE 7 CHURCH')}</strong>${contact?`<small>${esc(contact)}</small>`:''}</div><div></div></header><main class="doc-v222-main"><h1 class="doc-v222-title" style="${textStyle(styles.title)}">${esc(title)}</h1>${designation?`<div class="doc-v222-subtitle" style="${textStyle(styles.designation)}">${esc(designation)}</div>`:''}<div class="doc-v222-recipient" style="${textStyle(styles.name)}">${esc(d.user_name||'')}</div><div class="doc-v222-body" style="${textStyle(styles.body)}">${esc(body)}</div>${fields.length?`<div class="doc-v222-fields" style="${textStyle(styles.fields)}">${fields.map(x=>`<div class="doc-v222-field">${esc(x)}</div>`).join('')}</div>`:''}</main><footer class="doc-v222-footer"><div class="doc-v222-signature">${signature?`<img crossorigin="anonymous" src="${esc(signature)}" alt="signature">`:''}<div class="doc-v222-signature-line">${esc(d.approved_by||d.minister||'')}<br><small>${esc(label('امضای مسئول کلیسا','Authorized church signature','Ovlašteni potpis',l))}</small></div></div><div class="doc-v222-seal">NEW HOPE 7<br>${esc(label('رسمی','OFFICIAL','SLUŽBENO',l))}</div><div class="doc-v222-verify"><canvas id="certificateQr" class="nh7-v222-qr"></canvas><small>${esc(d.certificate_number||'')}<br>${esc(label('کد اعتبار','Verification code','Kod provjere',l))}: ${esc(d.verification_code||'')}</small></div></footer><div class="doc-v222-meta" style="${textStyle(styles.meta)}"><span>${esc(d.certificate_number||'')}</span><span>${esc(label('این QR مخصوص همین سند است','This QR belongs only to this document','Ovaj QR pripada samo ovom dokumentu',l))}</span></div></div>`;
}
function render(d){const l=d.language||'fa';document.documentElement.lang=l;document.documentElement.dir=l==='fa'?'rtl':'ltr';app.className='public-doc-shell';const valid=d.status==='approved';app.innerHTML=`<div class="public-doc-status"><span class="document-status ${valid?'valid':'revoked'}">${esc(valid?label('این سند رسمی و معتبر است','This is an official valid document','Ovo je službeni valjani dokument',l):label('این سند لغو شده است','This document has been revoked','Dokument je poništen',l))}</span></div><div class="public-integrity"><div><strong>${esc(label('شماره سند','Document number','Broj dokumenta',l))}</strong><br>${esc(d.certificate_number||'-')}</div><div><strong>${esc(label('کد اعتبار یکتا','Unique verification code','Jedinstveni kod',l))}</strong><br>${esc(d.verification_code||'-')}</div><div><strong>${esc(label('اثر دیجیتال','Digital integrity','Digitalni integritet',l))}</strong><br>${esc(String(d.content_hash||'').slice(0,20)||'-')}…</div></div>${canvas(d)}<div class="public-doc-actions"><button onclick="if(history.length>1){history.back()}else{location.href='admin.html'}">‹ ${esc(label('بازگشت','Back','Natrag',l))}</button><button onclick="window.print()">🖨 ${esc(label('چاپ / ذخیره PDF','Print / Save PDF','Ispis / PDF',l))}</button></div>`;const draw=()=>{const c=document.getElementById('certificateQr');if(!c||!window.QRCode)return setTimeout(draw,80);QRCode.toCanvas(c,location.href,{width:150,margin:1,errorCorrectionLevel:'M'},()=>{})};draw()}
(async()=>{if(!/^[0-9a-f-]{36}$/i.test(token)){app.innerHTML='<h2>لینک سند معتبر نیست</h2><p>Invalid document link.</p>';return}try{const d=await rpc();if(!d||!d.found)throw new Error('Not found');render(d)}catch(e){console.error(e);app.innerHTML='<h2>سند پیدا نشد</h2><p>این لینک نامعتبر است یا سند در دسترس نیست.</p><p>Document not found.</p>'}})()})();
</script>
</body>
</html>
