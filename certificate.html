<!doctype html>
<html lang="fa" dir="rtl">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#0b5faa">
  <title>New Hope 7 Document Verification</title>
  <link rel="icon" href="assets/logo.png">
  <link rel="stylesheet" href="css/styles.css">
  <link rel="stylesheet" href="css/v2.2.0-platform.css?v=2.2.0">
  <link rel="stylesheet" href="css/v2.2.1.css?v=2.2.1">
  <script src="https://cdn.jsdelivr.net/npm/qrcode@1.5.1/build/qrcode.min.js" defer></script>
  <style>
    body{margin:0;background:#edf4f7;color:#10233e}.public-doc-shell{max-width:1280px;margin:18px auto;padding:12px}.public-doc-actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:14px}.public-doc-actions button{border:0;border-radius:14px;padding:12px 18px;background:#0b5faa;color:#fff;font:inherit;font-weight:800}.public-doc-message{max-width:720px;margin:48px auto;padding:24px;text-align:center;background:#fff;border-radius:24px;box-shadow:0 14px 40px rgba(16,35,62,.1)}.public-doc-status{text-align:center;margin:8px}.document-status{display:inline-flex;padding:8px 15px;border-radius:999px;font-weight:800}.document-status.valid{background:#dcfce7;color:#166534}.document-status.revoked{background:#fee2e2;color:#991b1b}.revoked-watermark{position:absolute;inset:42% 0 auto;transform:rotate(-18deg);font-size:clamp(42px,8vw,100px);font-weight:900;color:rgba(180,20,20,.18);z-index:3;pointer-events:none}@media print{.public-doc-shell{max-width:none;margin:0;padding:0}.public-doc-actions,.public-doc-status{display:none!important}}
  </style>
</head>
<body>
<main id="app" class="public-doc-message">در حال دریافت مدرک…</main>
<script>
(()=>{'use strict';
const S='https://gpzcwffxnddhaeaogdyo.supabase.co',K='sb_publishable_v3xXEaJ5Fml7-te1mI4-0g_7R86oM37',token=new URL(location.href).searchParams.get('token')||'',app=document.getElementById('app');
const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const label=(fa,en,hr,l)=>l==='fa'?fa:l==='hr'?hr:en;
async function rpc(){const r=await fetch(`${S}/rest/v1/rpc/nh7_public_document_lookup_v220`,{method:'POST',headers:{apikey:K,Authorization:`Bearer ${K}`,'Content-Type':'application/json'},body:JSON.stringify({p_token:token})}),t=await r.text();if(!r.ok)throw new Error(t);return JSON.parse(t)}
function canvas(d){
  const l=d.language||'fa',rtl=l==='fa';
  const design=Object.assign({frame:'letterhead',background:'#fffdf8',border:'#12315f',accent:'#b68a2d',font_fa:'Vazirmatn',font_latin:'Merriweather'},d.design||{});
  const church=Object.assign({name:'NEW HOPE 7 CHURCH',address:'',email:'',phone:'',website:''},d.church_info||{});
  const title=d['title_'+l]||d.title_en||d.title_fa||'',designation=d['designation_'+l]||'',body=d['body_'+l]||d.body_en||d.body_fa||'';
  const fields=(d.custom_fields||[]).map(f=>`<div class="doc-field"><strong>${esc(f['label_'+l]||f.label_en||f.label_fa||'')}</strong><span>${esc(f.value||'')}</span></div>`).join('');
  const contact=[church.address,church.email,church.phone,church.website].filter(Boolean).map(esc).join(' · ');
  return `<div class="document-sheet layout-${esc(d.layout||'portrait')} frame-${esc(design.frame||'letterhead')} theme-${esc(d.theme_code||'official_letterhead')}" dir="${rtl?'rtl':'ltr'}" style="--doc-bg:${esc(design.background)};--doc-border:${esc(design.border)};--doc-accent:${esc(design.accent)};--doc-fa:'${esc(design.font_fa)}';--doc-latin:'${esc(design.font_latin)}'">${d.status==='revoked'?`<div class="revoked-watermark">${esc(label('باطل‌شده','REVOKED','PONIŠTENO',l))}</div>`:''}<header class="doc-letterhead">${d.logo_url?`<img class="doc-logo" crossorigin="anonymous" src="${esc(d.logo_url)}" alt="logo">`:''}<div class="doc-church-block"><div class="doc-church">${esc(church.name||'NEW HOPE 7 CHURCH')}</div>${contact?`<div class="doc-church-contact">${contact}</div>`:''}</div>${d.photo_url?`<img class="doc-photo" crossorigin="anonymous" src="${esc(d.photo_url)}" alt="photo">`:''}</header><main class="doc-main"><h1>${esc(title)}</h1>${designation?`<h2>${esc(designation)}</h2>`:''}<div class="doc-recipient">${esc(d.user_name||'')}</div><p class="doc-body">${esc(body)}</p><div class="doc-fields">${d.issue_date?`<div class="doc-field"><strong>${esc(label('تاریخ صدور','Issue date','Datum izdavanja',l))}</strong><span>${esc(d.issue_date)}</span></div>`:''}${d.place?`<div class="doc-field"><strong>${esc(label('محل','Place','Mjesto',l))}</strong><span>${esc(d.place)}</span></div>`:''}${d.minister?`<div class="doc-field"><strong>${esc(label('خادم','Minister','Služitelj',l))}</strong><span>${esc(d.minister)}</span></div>`:''}${d.witness?`<div class="doc-field"><strong>${esc(label('شاهد','Witness','Svjedok',l))}</strong><span>${esc(d.witness)}</span></div>`:''}${fields}</div></main><footer class="doc-footer"><div class="doc-sign"><span>${esc(d.approved_by||d.minister||'')}</span><small>${esc(label('امضای مسئول کلیسا','Church representative','Predstavnik crkve',l))}</small></div><div class="doc-verify"><canvas id="certificateQr" class="nh7-doc-qr"></canvas><small>${esc(d.certificate_number||'')}</small></div></footer></div>`
}
function render(d){const l=d.language||'fa';document.documentElement.lang=l;document.documentElement.dir=l==='fa'?'rtl':'ltr';app.className='public-doc-shell';app.innerHTML=`<div class="public-doc-status"><span class="document-status ${d.status==='approved'?'valid':'revoked'}">${esc(d.status==='approved'?label('این مدرک معتبر است','This document is valid','Dokument je valjan',l):label('این مدرک لغو شده است','This document has been revoked','Dokument je poništen',l))}</span></div>${canvas(d)}<div class="public-doc-actions"><button onclick="window.print()">🖨 ${esc(label('چاپ / ذخیره PDF','Print / Save PDF','Ispis / PDF',l))}</button></div>`;const draw=()=>{const c=document.getElementById('certificateQr');if(!c||!window.QRCode)return setTimeout(draw,80);QRCode.toCanvas(c,location.href,{width:140,margin:1,errorCorrectionLevel:'M'},()=>{})};draw()}
(async()=>{if(!/^[0-9a-f-]{36}$/i.test(token)){app.innerHTML='<h2>لینک مدرک معتبر نیست</h2><p>Invalid document link.</p>';return}try{const d=await rpc();if(!d||!d.found)throw new Error('Not found');render(d)}catch(e){console.error(e);app.innerHTML='<h2>مدرک پیدا نشد</h2><p>این لینک نامعتبر است یا مدرک در دسترس نیست.</p><p>Document not found.</p>'}})()})();
</script>
</body>
</html>
