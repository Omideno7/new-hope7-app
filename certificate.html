    body{margin:0;background:#edf4f7;color:#10233e}.public-doc-shell{max-width:1280px;margin:18px auto;padding:12px}.public-doc-actions{display:flex;justify-content:center;gap:10px;flex-wrap:wrap;margin:14px}.public-doc-actions button{border:0;border-radius:14px;padding:12px 18px;background:#0b5faa;color:#fff;font:inherit;font-weight:800}.public-doc-message{max-width:720px;margin:48px auto;padding:24px;text-align:center;background:#fff;border-radius:24px;box-shadow:0 14px 40px rgba(16,35,62,.1)}.public-doc-status{text-align:center;margin:8px}.document-status{display:inline-flex;padding:8px 15px;border-radius:999px;font-weight:800}.document-status.valid{background:#dcfce7;color:#166534}.document-status.revoked{background:#fee2e2;color:#991b1b}.public-integrity{max-width:850px;margin:12px auto;background:#fff;border:1px solid #d7e4ec;border-radius:18px;padding:12px;display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:9px;font-size:.82rem}.public-integrity div{padding:8px;background:#f7fafc;border-radius:12px;word-break:break-word}.revoked-watermark{position:absolute;inset:42% 0 auto;transform:rotate(-18deg);font-size:clamp(42px,8vw,100px);font-weight:900;color:rgba(180,20,20,.18);z-index:5;pointer-events:none}@media(max-width:700px){.public-integrity{grid-template-columns:1fr}}@media print{.public-doc-shell{max-width:none;margin:0;padding:0}.public-doc-actions,.public-doc-status,.public-integrity{display:none!important}}

<body><button class="nh7-certificate-back" onclick="location.href='https://omideno7church.com/'">🌐 Church Website / وب‌سایت کلیسا</button>
<main id="app" class="public-doc-message">در حال دریافت مدرک…</main>
<script>
(()=>{'use strict';
const S='https://gpzcwffxnddhaeaogdyo.supabase.co',K='sb_publishable_v3xXEaJ5Fml7-te1mI4-0g_7R86oM37',token=new URL(location.href).searchParams.get('token')||'',app=document.getElementById('app');
const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
const label=(fa,en,hr,l)=>l==='fa'?fa:l==='hr'?hr:en;
const n=v=>Number(v||0);
async function rpc(){const r=await fetch(`${S}/rest/v1/rpc/nh7_public_document_lookup_v222`,{method:'POST',headers:{apikey:K,Authorization:`Bearer ${K}`,'Content-Type':'application/json'},body:JSON.stringify({p_token:token})}),t=await r.text();if(!r.ok)throw new Error(t);return JSON.parse(t)}
function canvas(d){return window.NH7DocumentRendererV521.render(Object.assign({},d,{public_token:token}))}

function render(d){const l=d.language||'fa';document.documentElement.lang=l;document.documentElement.dir=l==='fa'?'rtl':'ltr';app.className='public-doc-shell';const valid=d.status==='approved';app.innerHTML=`<div class="public-doc-status"><span class="document-status ${valid?'valid':'revoked'}">${esc(valid?label('این سند رسمی و معتبر است','This is an official valid document','Ovo je službeni valjani dokument',l):label('این سند لغو شده است','This document has been revoked','Dokument je poništen',l))}</span></div><div class="public-integrity"><div><strong>${esc(label('شماره سند','Document number','Broj dokumenta',l))}</strong><br>${esc(d.certificate_number||'-')}</div><div><strong>${esc(label('کد اعتبار یکتا','Unique verification code','Jedinstveni kod',l))}</strong><br>${esc(d.verification_code||'-')}</div><div><strong>${esc(label('اثر دیجیتال','Digital integrity','Digitalni integritet',l))}</strong><br>${esc(String(d.content_hash||'').slice(0,20)||'-')}…</div></div>${canvas(d)}<div class="public-doc-actions"><button onclick="location.href='https://omideno7church.com/'">🌐 ${esc(label('وب‌سایت کلیسای امیدنو۷','New Hope 7 Church Website','Web-stranica crkve New Hope 7',l))}</button><button onclick="NH7DocumentUXV520.printPublic()">🖨 ${esc(label('چاپ','Print','Ispis',l))}</button><button onclick="NH7DocumentUXV520.downloadPublicPdf()">⬇ ${esc(label('دانلود PDF ثابت','Download locked PDF','Preuzmi zaključani PDF',l))}</button></div>`;const draw=()=>{const c=document.getElementById('certificateQr');if(!c||!window.QRCode)return setTimeout(draw,80);QRCode.toCanvas(c,new URL('verify-certificate-v508.html?token='+encodeURIComponent(token)+'&v=508',location.href).href,{width:150,margin:1,errorCorrectionLevel:'M'},()=>{})};draw()}
(async()=>{if(!/^[0-9a-f-]{36}$/i.test(token)){app.innerHTML='<h2>لینک سند معتبر نیست</h2><p>Invalid document link.</p>';return}try{const d=await rpc();if(!d||!d.found)throw new Error('Not found');render(d)}catch(e){console.error(e);app.innerHTML='<h2>سند پیدا نشد</h2><p>این لینک نامعتبر است یا سند در دسترس نیست.</p><p>Document not found.</p>'}})()})();
</script>
<script src="js/nh7-document-ux-v520.js?v=5.2.1"></script>
<script>if(new URL(location.href).searchParams.get('download')==='1')setTimeout(()=>window.NH7DocumentUXV520?.downloadPublicPdf?.(),900);</script>
