<!doctype html>
<html lang="fa" dir="rtl">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>New Hope 7 Certificate</title>
<style>
:root{--blue:#0b5faa;--green:#16a765;--gold:#d6aa44;--ink:#102033}*{box-sizing:border-box}body{margin:0;background:linear-gradient(145deg,#eef8f7,#f5f8ff);font-family:system-ui,-apple-system,"Segoe UI",Tahoma,Arial,sans-serif;color:var(--ink)}.wrap{max-width:1180px;margin:auto;padding:20px}.toolbar{display:flex;gap:10px;justify-content:center;margin-bottom:15px}.btn{border:0;border-radius:14px;padding:12px 18px;font-weight:800;cursor:pointer;background:linear-gradient(135deg,var(--blue),var(--green));color:#fff}.secondary{background:#fff;color:#0f766e;border:1px solid #cfe4e2}.certificate{position:relative;aspect-ratio:1.414/1;width:100%;overflow:hidden;background:linear-gradient(135deg,#fff 0%,#fbfffe 48%,#f4fbff 100%);border:14px solid var(--blue);outline:5px solid var(--green);outline-offset:-24px;border-radius:8px;box-shadow:0 22px 60px rgba(11,95,170,.2);padding:6.5%;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}.certificate:before,.certificate:after{content:"";position:absolute;width:230px;height:230px;border-radius:50%;opacity:.11}.certificate:before{background:var(--green);top:-120px;left:-90px}.certificate:after{background:var(--blue);bottom:-130px;right:-90px}.logo{width:92px;height:92px;object-fit:contain}.org{letter-spacing:.16em;text-transform:uppercase;color:#0f766e;font-size:.82rem;font-weight:900}.title{font-family:Georgia,"Times New Roman",serif;font-size:clamp(1.8rem,4vw,3.6rem);color:var(--blue);margin:10px}.name{font-family:Georgia,"Times New Roman",serif;font-size:clamp(1.8rem,4.2vw,3.8rem);font-weight:800;border-bottom:2px solid var(--gold);padding:4px 34px}.designation{font-size:clamp(.9rem,1.8vw,1.25rem);font-weight:800;color:#344054;margin-top:7px}.body{max-width:82%;font-size:clamp(.78rem,1.7vw,1.14rem);line-height:1.85;margin-top:12px}.score{font-weight:900;color:#0f766e;margin-top:10px}.footer{display:grid;grid-template-columns:1fr 1fr 1fr;gap:24px;width:88%;margin-top:25px;align-items:end}.sign{border-top:1px solid #667085;padding-top:6px;font-size:.8rem}.seal{width:82px;height:82px;border:5px double var(--gold);border-radius:50%;display:flex;align-items:center;justify-content:center;font-weight:900;color:var(--blue);margin:auto;transform:rotate(-8deg);font-size:.72rem}.meta{font-size:.76rem;color:#667085;margin-top:13px}.status{padding:20px;text-align:center;border-radius:18px;background:#fff;border:1px solid #d8ecea}.bad{color:#b42318;background:#fef3f2}@media(max-width:720px){.wrap{padding:8px}.certificate{aspect-ratio:auto;min-height:610px;padding:55px 22px}.footer{width:100%;gap:8px}.body{max-width:96%}}@media print{body{background:#fff}.toolbar,.status{display:none!important}.wrap{max-width:none;padding:0}.certificate{width:100vw;height:100vh;aspect-ratio:auto;border-radius:0;box-shadow:none}}
</style>
</head>
<body><div class="wrap"><div class="toolbar"><button class="btn" onclick="window.print()">Print / Save PDF</button><button class="btn secondary" onclick="navigator.share&&navigator.share({title:document.title,url:location.href})">Share</button></div><div id="status" class="status">Loading certificate…</div><div id="certificate" hidden></div></div>
<script>
const SUPABASE_URL='https://gpzcwffxnddhaeaogdyo.supabase.co';
const SUPABASE_KEY='sb_publishable_v3xXEaJ5Fml7-te1mI4-0g_7R86oM37';
const h=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[c]));
const text=(r,f,l,fb='')=>r?.[f+'_'+l]||r?.[f+'_en']||r?.[f+'_fa']||fb;
function labels(l){if(l==='en')return{org:'NEW HOPE 7 CHURCH',school:'Certificate of Completion',body:'for successfully completing the course',score:'Final score',date:'Date of Issue',number:'Certificate No.',sign:'Authorized Signature'};if(l==='hr')return{org:'CRKVA NEW HOPE 7',school:'Potvrda o završenom programu',body:'za uspješno završen program',score:'Završna ocjena',date:'Datum izdavanja',number:'Broj potvrde',sign:'Ovlašteni potpis'};return{org:'کلیسای امیدنو۷',school:'گواهینامه پایان دوره',body:'به پاس تکمیل موفقیت‌آمیز دوره',score:'نمره نهایی',date:'تاریخ صدور',number:'شماره مدرک',sign:'امضای صادرکننده'}}
async function load(){const token=new URLSearchParams(location.search).get('token');if(!token)throw new Error('Certificate token is missing.');const r=await fetch(SUPABASE_URL+'/rest/v1/rpc/nh7_public_certificate_lookup',{method:'POST',headers:{apikey:SUPABASE_KEY,Authorization:'Bearer '+SUPABASE_KEY,'Content-Type':'application/json'},body:JSON.stringify({p_token:token})});if(!r.ok)throw new Error(await r.text());const row=await r.json();if(!row||!row.certificate_number)throw new Error('Certificate not found or revoked.');const l=row.language||'fa',z=labels(l),school=(row.certificate_type||'school')==='school',title=text(row,'title',l,school?z.school:''),designation=text(row,'designation',l,''),body=text(row,'body',l,school?`${z.body} ${row.course_title||row.course_code||''}`:''),date=new Date(row.approved_at||row.created_at||Date.now()).toLocaleDateString(l==='fa'?'fa-IR':l==='hr'?'hr-HR':'en-US');document.documentElement.lang=l;document.body.dir=l==='fa'?'rtl':'ltr';document.title=title+' — '+row.user_name;document.getElementById('status').hidden=true;const el=document.getElementById('certificate');el.hidden=false;el.innerHTML=`<div class="certificate"><img class="logo" src="assets/logo.png" alt="New Hope 7"><div class="org">${h(school?(l==='fa'?'مدرسه بنیادی مسیحی امیدنو۷':l==='hr'?'NEW HOPE 7 — ŠKOLA KRŠĆANSKIH TEMELJA':'NEW HOPE 7 CHRISTIAN FOUNDATION SCHOOL'):z.org)}</div><div class="title">${h(title)}</div><div class="name">${h(row.user_name)}</div>${designation?`<div class="designation">${h(designation)}</div>`:''}<div class="body">${h(body)}</div>${row.final_score_percent!=null?`<div class="score">${h(z.score)}: ${h(row.final_score_percent)}%</div>`:''}<div class="footer"><div class="sign">${h(z.date)}<br><strong>${h(date)}</strong></div><div class="seal">NEW<br>HOPE 7<br>OFFICIAL</div><div class="sign">${h(z.sign)}<br><strong>${h(row.approved_by||'Apostle Yuhana')}</strong></div></div><div class="meta">${h(z.number)}: ${h(row.certificate_number)}</div></div>`}
load().catch(e=>{const s=document.getElementById('status');s.classList.add('bad');s.textContent=e.message||String(e)})
</script></body></html>
