<script>
(()=>{'use strict';
const S='https://gpzcwffxnddhaeaogdyo.supabase.co',K='sb_publishable_v3xXEaJ5Fml7-te1mI4-0g_7R86oM37',token=new URL(location.href).searchParams.get('token')||'',app=document.getElementById('app');

function textStyle(s,def){s=Object.assign({},def||{},s||{});return `font-family:${esc(s.font||'inherit')};font-size:${n(s.size)||16}px;color:${esc(s.color||'inherit')};font-weight:${s.bold?700:400};font-style:${s.italic?'italic':'normal'};text-decoration:${s.underline?'underline':'none'};text-align:${esc(s.align||'center')};line-height:${Number(s.lineHeight||1.45)};letter-spacing:${Number(s.letterSpacing||0)}px;transform:translateY(${Number(s.offsetY||0)}px)`}

  const l=d.language||'fa',rtl=l==='fa',baseDesign=d.design||{},base=baseDesign,studio=baseDesign.studio_v239&&typeof baseDesign.studio_v239==='object'?baseDesign.studio_v239:{},design=Object.assign({},baseDesign,studio),styles=studio.styles||base.styles||{},church=Object.assign({name:'NEW HOPE 7 CHURCH',address:'',email:'',phone:'',website:''},d.church_info||{},base.church||{},studio.church||{});

div class="doc-fields" style="${textStyle(styles.date||styles.fields)}">${fields.map(([a,b])=>`<div class="doc-field"><strong>${esc(a)}</strong><span>${esc(b)}</span></div>`).join('')}</div></main><footer class="doc-footer"><div class="doc-sign"><span>${esc(d.approved_by||d.minister||'')}</span><small>${esc(label('امضای مسئول کلیسا','Church representative','Predstavnik crkve',l))}</small></div><div class="doc-footer-church-v510">${contact?esc(contact):''}</div><div class="doc-verify"><canvas id="certificateQr" class="nh7-doc-qr"></canvas><small>${esc(d.certificate_number||'')}<br>${esc(label('کد اعتبار','Verification code','Kod provjere',l))}: ${esc(d.verification_code||'')}</small></div></footer></div>`;
}
function render(d){const l=d.language||'fa';document.documentElement.lang=l;document.documentElement.dir=l==='fa'?'rtl':'ltr';app.className='public-doc-shell';const valid=d.status==='approved';app.innerHTML=`<div class="public-doc-status"><span class="document-status ${valid?'valid':'revoked'}">${esc(valid?label('این سند رسمی و معتبر است','This is an official valid document','Ovo je službeni valjani dokument',l):label('این سند لغو شده است','This document has been revoked','Dokument je poništen',l))}</span></div><div class="public-integrity"><div><strong>${esc(label('شماره سند','Document number','Broj dokumenta',l))}</strong><br>${esc(d.certificate_number||'-')}</div><div><strong>${esc(label('کد اعتبار یکتا','Unique verification code','Jedinstveni kod',l))}</strong><br>${esc(d.verification_code||'-')}</div><div><strong>${esc(label('اثر دیجیتال','Digital integrity','Digitalni integritet',l))}</strong><br>${esc(String(d.content_hash||'').slice(0,20)||'-')}…</div></div>${canvas(d)}<div class="public-doc-actions"><button onclick="location.href='https://omideno7church.com/'">🌐 ${esc(label('وب‌سایت کلیسای امیدنو۷','New Hope 7 Church Website','Web-stranica crkve New Hope 7',l))}</button><button onclick="NH7DocumentUXV510.printPublic()">🖨 ${esc(label('چاپ','Print','Ispis',l))}</button><button onclick="NH7DocumentUXV510.downloadPublicPdf()">⬇ ${esc(label('دانلود PDF ثابت','Download locked PDF','Preuzmi zaključani PDF',l))}</button></div>`;const draw=()=>{const c=document.getElementById('certificateQr');if(!c||!window.QRCode)return setTimeout(draw,80);QRCode.toCanvas(c,new URL('verify-certificate-v508.html?token='+encodeURIComponent(token)+'&v=508',location.href).href,{width:150,margin:1,errorCorrectionLevel:'M'},()=>{})};draw()}
